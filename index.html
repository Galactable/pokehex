<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HexDex</title>
  
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#07090a">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HexDex">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  /* Three roles, one place. --font-display is the chunky wordmark/heading face,
     --font-body is everything you read - deliberately the same mono as
     --font-mono, because the monospace texture in body copy is wanted here,
     and its tabular figures keep HEX values and x-counts in columns. */
  --font-display:'Exo 2',system-ui,sans-serif;
  --font-body:var(--font-mono);
  --font-mono:'JetBrains Mono',monospace;

  --bg:#07090a;
  --surface:#0e130f;
  --surface2:#141b16;
  --line:#243026;
  --text:#c8f5cc;
  --muted:#5d7a63;
  --foil1:#39ff14;
  --foil2:#9d4edd;
  --gold:#c77dff;
  --common:#5d7a63;
  --uncommon:#39ff14;
  --rare:#9d4edd;
  --ultra:#6bff5c;
  --secret:#f0d9ff;

  /* ---- pack wrapper geometry (see pack-shape-preview) ---- */
  --pack-w:152px;   /* pack width  */
  --pack-h:268px;   /* pack height */
  --tooth:6px;      /* width of one crimp tooth */
  --crimp:4px;      /* how deep the teeth bite in */
  --band:8px;       /* extra height of the pressed-foil crimp band */
  --seam:1px;       /* thickness of the purple tear guide */
  --dash:7px;       /* dash length on the tear guide */
  --gap:5px;        /* gap between dashes */
  --rag:10px;       /* depth of the ragged torn edge */
  --lift:7px;       /* gap between stacked cards - MUST scale with the pack */
  --edge:var(--line); /* theme line colour, overridden per pack theme */
  --tear-top:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%2020%22%20preserveAspectRatio%3D%22none%22%3E%3Cpath%20d%3D%22M0%200%20H200%20V3.0%20L198%203.0%20L194%203.0%20L186%201.6%20L180%203.0%20L176%201.7%20L171%203.2%20L163%203.0%20L158%202.8%20L155%203.9%20L150%2017.0%20L142%2017.2%20L134%2016.9%20L128%202.1%20L124%202.0%20L118%2018.1%20L113%203.5%20L107%205.4%20L104%207.4%20L98%2013.6%20L92%2018.0%20L89%2017.0%20L86%2017.5%20L81%2013.6%20L77%2016.9%20L71%2017.0%20L67%2017.0%20L59%2018.4%20L55%203.0%20L51%203.0%20L48%205.8%20L40%2011.0%20L36%2017.0%20L32%2015.7%20L29%2017.0%20L23%2018.2%20L20%208.3%20L16%202.7%20L8%2016.9%20L0%2010.0%20Z%22%20fill%3D%22%23000%22%2F%3E%3C%2Fsvg%3E");
  --tear-bot:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%2020%22%20preserveAspectRatio%3D%22none%22%3E%3Cpath%20d%3D%22M0%2020%20H200%20V3.0%20L198%203.0%20L194%203.0%20L186%201.6%20L180%203.0%20L176%201.7%20L171%203.2%20L163%203.0%20L158%202.8%20L155%203.9%20L150%2017.0%20L142%2017.2%20L134%2016.9%20L128%202.1%20L124%202.0%20L118%2018.1%20L113%203.5%20L107%205.4%20L104%207.4%20L98%2013.6%20L92%2018.0%20L89%2017.0%20L86%2017.5%20L81%2013.6%20L77%2016.9%20L71%2017.0%20L67%2017.0%20L59%2018.4%20L55%203.0%20L51%203.0%20L48%205.8%20L40%2011.0%20L36%2017.0%20L32%2015.7%20L29%2017.0%20L23%2018.2%20L20%208.3%20L16%202.7%20L8%2016.9%20L0%2010.0%20Z%22%20fill%3D%22%23000%22%2F%3E%3C%2Fsvg%3E");
}
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
}
#app{
  background:
    repeating-linear-gradient(to bottom, rgba(57,255,20,0.025) 0px, rgba(57,255,20,0.025) 1px, transparent 1px, transparent 3px),
    radial-gradient(circle at 50% -10%, #101a12 0%, var(--bg) 55%);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  padding:20px 16px 60px;
  box-sizing:border-box;
  overflow-x:hidden;
  position:relative;
}
*{box-sizing:border-box;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.disp{font-family:var(--font-display);font-weight:800;letter-spacing:0.04em;text-transform:uppercase;color:var(--foil1);text-shadow:0 0 8px rgba(57,255,20,0.45);}

/* ---------- currency cube icon ---------- */
.hex-icon {
  display: inline-block;
  width: 14px;
  height: 16px;
  background: transparent;
  position: relative;
  vertical-align: middle;
  margin-right: 3px;
}
.hex-icon::before {
  content: '';
  position: absolute;
  top: 0;
  left: 3px;
  width: 8px;
  height: 6px;
  background: var(--foil1);
  clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
  z-index: 2;
}
.hex-icon::after {
  content: '';
  position: absolute;
  inset: 0;
  background: 
    linear-gradient(135deg, var(--foil1), var(--foil2)),
    #000000;
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
}

/* ---------- header ---------- */
.topbar{
  display:grid;
  grid-template-columns: 1fr auto 1fr;
  align-items:center;
  max-width:920px;
  margin:0 auto 22px;
  gap:10px;
}
.brand{display:flex;align-items:center;gap:10px; justify-self:center; grid-column: 2; position:relative;}
.brand-hexmark{
  width:44px;height:50px;
  position:relative;
  justify-self:start;
  grid-column: 1;
  filter: drop-shadow(0 0 10px rgba(57,255,20,0.4));
}
.brand-hexmark::before{
  content:'';
  position:absolute;
  top:0; left:9px;
  width:26px; height:20px;
  background:var(--foil1);
  clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
  z-index:2;
}
.brand-hexmark::after{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(135deg, var(--foil1), var(--foil2)),
    #000000;
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
}

/* The hexmark sitting INSIDE the wordmark as the letter O. Everything is in em
   so it scales with the h1's clamp() instead of needing its own breakpoints.
   It is sized to Exo 2's cap height so it reads as a letter rather than a logo
   that wandered into the word. aria-hidden on the element plus an sr-only "O"
   keeps the word readable to screen readers and to search. */
.brand h1 .hexo, .authcard h1 .hexo{
  display:inline-block;
  /* 1em is the FONT size, not the letter height - a 1em box towers over the
     caps beside it. Exo 2's cap height is ~0.72em, so that is the target, and
     inline-block sits its bottom edge on the baseline, where a cap sits. */
  /* font-size:inherit is load-bearing: the sibling rule .brand span sets 11px
     on every span in the header, and all of these sizes are in em. */
  font-size:inherit;
  width:0.63em;
  height:0.72em;
  position:relative;
  vertical-align:baseline;
  /* the joint between HEX and DEX, not a stand-in letter, so it gets more
     room than letter spacing would give it */
  margin:0 0.09em;
  filter: drop-shadow(0 0 0.18em rgba(57,255,20,0.45));
}
.brand h1 .hexo::before, .authcard h1 .hexo::before, .card-back .back-hex::before{
  content:'';
  position:absolute;
  /* percentages, so the inner diamond tracks any change to the box above */
  top:0; left:23%;
  width:59%; height:40%;
  background:var(--foil1);
  clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
  z-index:2;
}
.brand h1 .hexo::after, .authcard h1 .hexo::after, .card-back .back-hex::after{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(135deg, var(--foil1), var(--foil2)),
    #000000;
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.brand div:not(.brand-hexmark) { text-align: center; }

/* Slime Title with Sparkles & Floating Dust Particles */
.brand h1,
.authcard h1 {
  /* fluid so a 360px phone and a 430px phone both get a wordmark that fits -
     no breakpoint snap. Exo 2 runs much larger than the old pixel font did at
     same px, hence 28 where this used to be 42. */
  font-size: clamp(26px, 8.4vw, 36px);
  margin: 0;
  font-family:var(--font-display);
  font-weight: 800;
  letter-spacing: 0.01em;
  /* the hexagon is an inline-block, which is a legal line-break opportunity -
     without this the wordmark splits as HEX / hex / DEX */
  white-space: nowrap;
  color: var(--foil1);
  text-shadow: 0 0 12px rgba(57, 255, 20, 0.7), 0 0 25px rgba(57, 255, 20, 0.4);
  text-transform: uppercase;
  position: relative;
  display: inline-block;
}

.brand h1::before,
.brand h1::after,
.authcard h1::before,
.authcard h1::after {
  content: '';
  position: absolute;
  pointer-events: none;
  border-radius: 50%;
}

.brand h1::before,
.authcard h1::before {
  inset: -8px -12px;
  background: 
    radial-gradient(circle 3px at 15% 20%, var(--foil1) 0%, transparent 70%),
    radial-gradient(circle 2.5px at 85% 70%, var(--gold) 0%, transparent 70%),
    radial-gradient(circle 2px at 45% 85%, var(--foil1) 0%, transparent 70%),
    radial-gradient(circle 3.5px at 90% 15%, var(--gold) 0%, transparent 70%),
    radial-gradient(circle 2px at 10% 80%, var(--foil1) 0%, transparent 70%);
  animation: slimeSparkle 2.2s ease-in-out infinite alternate;
  z-index: 2;
}

.brand h1::after,
.authcard h1::after {
  inset: -14px -18px;
  background: 
    radial-gradient(circle 1.5px at 30% 30%, rgba(57, 255, 20, 0.9) 0%, transparent 100%),
    radial-gradient(circle 1px at 70% 40%, rgba(199, 125, 255, 0.8) 0%, transparent 100%),
    radial-gradient(circle 1.2px at 50% 10%, rgba(57, 255, 20, 0.9) 0%, transparent 100%),
    radial-gradient(circle 1.5px at 20% 60%, rgba(199, 125, 255, 0.8) 0%, transparent 100%),
    radial-gradient(circle 1px at 80% 80%, rgba(57, 255, 20, 0.9) 0%, transparent 100%);
  animation: floatDust 3.5s linear infinite;
  z-index: 2;
}

@keyframes slimeSparkle {
  0% { opacity: 0.5; filter: drop-shadow(0 0 2px var(--foil1)); transform: scale(0.98); }
  100% { opacity: 1; filter: drop-shadow(0 0 8px var(--gold)); transform: scale(1.02); }
}

@keyframes floatDust {
  0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
  50% { transform: translateY(-5px) translateX(3px); opacity: 0.9; }
  100% { transform: translateY(-10px) translateX(-2px); opacity: 0.3; }
}

.brand span{color:var(--muted);font-size:11px;display:block;letter-spacing:0.12em;text-transform:uppercase;margin-top:2px;}

.balance{
  background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:8px 16px;display:flex;align-items:center;gap:10px;
  justify-self:end;
  grid-column: 3;
  white-space:nowrap;
  flex-wrap:nowrap;
}
.balance .tick{color:var(--muted);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;}
.balance .val{
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;color:var(--gold);
}
/* .hex-icon is reused all over the game at a fixed 14x16 - scoped here so
   only the balance tile's copy grows. Base box and the ::before highlight's
   offset/size scale together (::after uses inset:0, so it already tracks
   the base box with no px of its own to convert) - same technique as the
   card face's .cf-value .hex-icon override. */
.balance .hex-icon{ width:18px; height:20px; margin-right:4px; }
.balance .hex-icon::before{ left:4px; width:10px; height:7px; }
.mailbtn{
  position:relative;background:none;border:none;padding:0;
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:var(--foil1);filter:drop-shadow(0 0 6px rgba(57,255,20,0.5));
}
.mailbtn:hover{filter:drop-shadow(0 0 9px rgba(57,255,20,0.75));}
.mailbadge{
  position:absolute;top:-6px;right:-6px;background:#ff4444;color:#fff;
  border-radius:999px;min-width:16px;height:16px;padding:0 4px;
  font-size:10px;line-height:16px;text-align:center;font-weight:800;
  box-shadow:0 0 6px rgba(255,68,68,0.6);
}
.cta-account-row{
  display:flex;justify-content:center;max-width:920px;margin:0 auto 24px;
}
.account-blocked{
  max-width:920px;margin:0 auto 18px;padding:10px 14px;border-radius:10px;text-align:center;
  border:1px solid #ff4444;background:rgba(255,68,68,0.08);color:#ff8a8a;
  font-family:'JetBrains Mono',monospace;font-size:12.5px;
}
.cta-account-link{
  background:transparent;
  border:none;
  color:var(--foil2);
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:12px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  text-decoration:none;
  cursor:pointer;
  padding:4px;
}
.cta-account-link:hover{text-shadow:0 0 8px rgba(157,78,221,0.6);}

.navrow{display:flex;justify-content:center;gap:8px;max-width:920px;margin:0 auto 24px;flex-wrap:wrap;}
.navbtn{
  background:transparent;border:1px solid var(--line);color:var(--muted);
  padding:8px 16px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:600;
  transition:all .15s;
}
.navbtn.active{background:var(--surface2);color:var(--text);border-color:var(--foil1);}
.navbtn:hover{color:var(--text);}

.wrap{max-width:920px;margin:0 auto;}

/* ---------- store ---------- */
.section-label{font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px;}
.packgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;}
.packcard{
  background:linear-gradient(160deg,var(--surface),var(--surface2));
  border:1px solid var(--line);border-radius:16px;padding:20px;
  position:relative;overflow:hidden;cursor:pointer;transition:transform .18s,border-color .18s;
}
.packcard:hover{transform:translateY(-3px);border-color:var(--foil1);}
.packcard::after{
  content:'';position:absolute;inset:0;opacity:0.08;pointer-events:none;
  background:var(--pack-glow,linear-gradient(135deg,var(--foil1),var(--foil2)));
}
/* Only the shop tiles get the two-column layout - .packcard is also the vault's
   card tile, so the class itself must keep its original block behaviour. */
/* stretch, not center: centering made every tile start its heading at a
   different height, because the descriptions wrap to different line counts.
   Stretch pins the headings to the top and lets margin-top:auto below push
   the odds/price block to the bottom, so all three tiles line up regardless
   of how much text they carry or how narrow the screen is. */
.packcard.shop{display:flex;align-items:stretch;gap:16px;}
.packcard.shop .pack-info{flex:1;min-width:0;display:flex;flex-direction:column;}
/* The pack and its Open button share the right column, so the button reads as
   belonging to the pack rather than floating beside the price. */
.pack-mini{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:12px;}
/* auto margins above and below the art centre it in whatever space is left,
   while the button is pinned to the bottom edge - level with the price. */
.pack-mini .pack-visual{margin-top:auto;margin-bottom:auto;}
.pack-mini .buybtn{width:100%;margin-top:auto;}
/* The mini wrapper reuses .pack-visual wholesale, so themes, crimp and symbol
   colours follow automatically. Only the geometry changes - and because the
   420px rule scales var(--pack-w), the mini shrinks on phones for free. */
.pack-visual.mini{
  --pack-w:60px;--pack-h:106px;--lift:2.8px;
  cursor:inherit;filter:drop-shadow(0 6px 14px rgba(0,0,0,0.6));
}
.pack-visual.mini .pack-top{height:calc(var(--crimp) + 11px);}
.pack-visual.mini .pack-top::before,.pack-visual.mini .pack-body::before{
  height:calc(var(--crimp) + 4px);
}
.pack-visual.mini .sym{padding:6% 0;}
.pack-visual.mini .sym svg{
  width:74%;stroke-width:3.2;
  filter:drop-shadow(0 0 3px currentColor) drop-shadow(0 0 7px currentColor);
}
/* The dashed guide says "rip here", which is meaningless on a shop tile - you
   tap Open, you do not tear this one. It only appears on the opening overlay. */
.pack-visual.mini .tear{display:none;}

.pack-name{font-family:var(--font-display);font-weight:800;font-size:13px;margin:0 0 4px;}
.pack-desc{color:var(--muted);font-size:12.5px;margin:0 0 14px;line-height:1.4;}
.pack-odds{font-size:11px;color:var(--muted);margin-top:auto;margin-bottom:14px;line-height:1.6;}
.pack-odds b{color:var(--text);}
.pack-price{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;flex-wrap:wrap;
}
.price-tag{
  font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--gold);font-size:16px;
}
.buybtn{
  background:var(--foil2);color:#fff;border:none;border-radius:8px;
  padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer;
  box-shadow:0 0 10px rgba(157,78,221,0.4);
}
.buybtn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;box-shadow:none;}
.sellbtn{
  background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:8px;
  padding:8px 12px;font-weight:700;font-size:12px;cursor:pointer;
}
.sellbtn:hover{background:rgba(199,125,255,0.1);}

/* ---------- pack theme variants ---------- */
:root{
  --luxe-gold:#d4af37;
  --luxe-gold2:#f5cf6b;
}

/* Basic Pack - black / slime green */
.packcard.theme-basic{background:linear-gradient(160deg,#050605,#0b0f0a);border-color:var(--foil1);}
.packcard.theme-basic:hover{border-color:var(--foil1);box-shadow:0 0 16px rgba(57,255,20,0.25);}
.packcard.theme-basic .pack-name{color:var(--foil1);text-shadow:0 0 6px rgba(57,255,20,0.5);}
.packcard.theme-basic::after{background:linear-gradient(135deg,var(--foil1),#0a0a0a);opacity:0.12;}

.pack-visual.theme-basic{--edge:var(--foil1);}
.pack-visual.theme-basic .pack-top,.pack-visual.theme-basic .pack-body{background:linear-gradient(160deg,#050605,#0b0f0a);}
.pack-visual.theme-basic .sym{color:var(--foil1);}
.pack-visual.theme-basic .mark{color:var(--foil1);text-shadow:0 0 8px rgba(57,255,20,0.6);}

.card-back.theme-basic{background:repeating-linear-gradient(45deg,#050505,#050505 8px,#150a24 8px,#150a24 16px);}
.card-back.theme-basic span{color:var(--foil1);}

/* Whale Vault - gold luxury */
.packcard.theme-whale{background:linear-gradient(160deg,#1a1408,#0d0a04);border-color:var(--luxe-gold);}
.packcard.theme-whale:hover{border-color:var(--luxe-gold2);box-shadow:0 0 18px rgba(212,175,55,0.35);}
.packcard.theme-whale .pack-name{color:var(--luxe-gold2);text-shadow:0 0 8px rgba(212,175,55,0.6);}
.packcard.theme-whale::after{background:linear-gradient(135deg,var(--luxe-gold),var(--luxe-gold2));opacity:0.14;}

.pack-visual.theme-whale{--edge:var(--luxe-gold);}
.pack-visual.theme-whale .pack-top,.pack-visual.theme-whale .pack-body{background:linear-gradient(160deg,#1a1408,#0d0a04);}
.pack-visual.theme-whale .sym{color:var(--luxe-gold2);}
.pack-visual.theme-whale .mark{color:var(--luxe-gold2);text-shadow:0 0 10px rgba(212,175,55,0.7);}

.card-back.theme-whale{background:repeating-linear-gradient(45deg,#1a1408,#1a1408 8px,#0d0a04 8px,#0d0a04 16px);}
.card-back.theme-whale span{color:var(--luxe-gold2);text-shadow:0 0 6px rgba(212,175,55,0.6);}

/* Diamond Pack - white/light-grey. Given the same treatment as basic and whale:
   tinted body, coloured name, ::after sheen and a glowing mark. It previously
   had only the hover border, which is why it looked flat next to the others. */
.packcard.theme-diamond{background:linear-gradient(160deg,#12161a,#080a0c);border-color:#c9d1d9;}
.packcard.theme-diamond:hover{border-color:#e6e6e6;box-shadow:0 0 16px rgba(230,230,230,0.25);}
.packcard.theme-diamond .pack-name{color:#e6e6e6;text-shadow:0 0 8px rgba(230,230,230,0.6);}
.packcard.theme-diamond::after{background:linear-gradient(135deg,#e6e6e6,#8b949e);opacity:0.12;}

.pack-visual.theme-diamond{--edge:#e6e6e6;}
.pack-visual.theme-diamond .pack-top,.pack-visual.theme-diamond .pack-body{background:linear-gradient(160deg,#12161a,#080a0c);}
.pack-visual.theme-diamond .sym{color:#e6e6e6;}
.pack-visual.theme-diamond .mark{color:#e6e6e6;text-shadow:0 0 10px rgba(230,230,230,0.7);}


/* ---------- dex ---------- */
.dexhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:12px;}
.dexhead-left{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;}
.dexhead-left h2{font-family:var(--font-display);font-weight:800;font-size:20px;margin:0;letter-spacing:0.03em;text-transform:uppercase;}
.editbinder-pencil{transform:scaleX(-1);}
.dexcount{color:var(--muted);font-size:13px;}

/* Rarity Key Legend */
.rarity-key{
  display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:6px 12px;
}
.key-item{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);font-weight:500;}
.key-dot{width:8px;height:8px;border-radius:50%;background:var(--dot-color, var(--muted));}

.dexfbtn{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:5px 10px;border-radius:6px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--muted);}
.dexfbtn.on{border-color:var(--foil1);background:rgba(57,255,20,0.12);color:var(--foil1);}
.dexfsel{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:5px 8px;border-radius:6px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--text);}
/* iOS Safari zooms the page when a field under 16px gets focus, and never
   zooms back out - on the binder page the pockets are touch-action:none (for
   press-hold drag), so the player can't pinch their way out either. Every
   field is 16px on touchscreens. !important because most set font-size
   inline. Desktop keeps the smaller sizes. */
@media (pointer:coarse){
  input[type="text"], input[type="email"], input[type="password"],
  select, textarea{ font-size:16px !important; }
  /* the text has to stay 16px, so slim the box instead to sit closer to
     the 10.5px filter buttons beside it */
  .dexfsel{padding:1px 4px;line-height:1.2;}
}
.dexfbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:7px 10px;border:1px solid var(--foil1);border-radius:6px;background:rgba(57,255,20,0.07);color:var(--foil1);}

.dexgrid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;
}
.dexslot{
  container-type:inline-size;
  aspect-ratio:3/4;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10px;color:var(--muted);position:relative;padding:4px;text-align:center;
}
/* The stats page reuses renderCardFace() with flipped=true, which would show
   the ALREADY OWNED badge. Suppressed here by scope rather than by threading a
   flag through renderCardFace, which is shared with the reveal path.
   display:none rather than visibility:hidden so it reclaims the reserved space. */
.stats-card-display{
  display:flex;flex-wrap:wrap;gap:28px;
  justify-content:center;align-items:flex-start;margin:20px 0 4px;
}
.stats-card-col{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  flex:0 1 auto;min-width:0;
}
/* placeholder sized to the card so an empty slot doesn't collapse the row and
   drag the filled card off-centre */
.stats-card-empty{
  width:130px;min-height:180px;display:flex;align-items:center;justify-content:center;
  text-align:center;color:var(--muted);font-size:11px;line-height:1.4;padding:0 8px;
  border:1px dashed var(--line);border-radius:12px;
}
.stats-card-display .already-owned-badge,
.detail-card-display .already-owned-badge{display:none;}
/* The pulsing outer glow on ultra/secret is a pack-opening moment. On the stats
   page and in the market detail modal the card sits static, so the aura is
   suppressed by scope rather than by conditioning renderCardFace, which the
   reveal path shares. The inner .shine sheen is a separate effect, left alone. */
.stats-card-display .flame-aura,
.detail-card-display .flame-aura{animation:none;box-shadow:none;}
.detail-card-display{display:flex;justify-content:center;}

.fav-toggle{
  align-self:center;display:flex;align-items:center;gap:6px;cursor:pointer;
  background:var(--surface2);border:1px solid var(--line);color:var(--muted);
  border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;
  letter-spacing:0.04em;text-transform:uppercase;
  transition:color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}
.fav-toggle .fav-star{font-size:15px;line-height:1;}
.fav-toggle:hover{color:gold;border-color:gold;}
.fav-toggle.on{color:gold;border-color:gold;box-shadow:0 0 8px rgba(255,215,0,0.35);}
.fav-toggle.on .fav-star{text-shadow:0 0 5px gold;}
/* Market detail modal: Favorite and Binder side by side. Binder reuses the
   .fav-toggle shape, lit in foil green instead of gold when the card is filed. */
.detail-toggle-row{align-self:center;display:flex;gap:8px;}
.binder-toggle .binder-icon{width:15px;height:15px;}
.binder-toggle:hover{color:var(--foil1);border-color:var(--foil1);}
.binder-toggle.on{color:var(--foil1);border-color:var(--foil1);box-shadow:0 0 8px rgba(57,255,20,0.35);}

/* Search hit highlight. Pulses in foil green rather than flashing once, so a
   card found behind a long scroll is still obviously marked when you reach it.
   Cleared by clearing the search. */
.packcard.search-hit{
  border-color:var(--foil1) !important;
  animation: searchPulse 1.4s ease-in-out infinite;
}
@keyframes searchPulse{
  0%,100%{ box-shadow:0 0 6px 1px rgba(57,255,20,0.35); }
  50%    { box-shadow:0 0 16px 5px rgba(57,255,20,0.75); }
}

/* P&L footer figures. Explicitly 2 or 4 columns - never 3. auto-fit with a
   minmax() was landing on 3 columns at phone widths, which orphans the 4th
   item exactly the way flex-wrap did. */
.pnl-stats{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:6px 14px;
  margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
  font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--muted);
}
@media (min-width: 721px){
  .pnl-stats{ grid-template-columns:repeat(4, minmax(0, 1fr)); }
}
.pnl-stats > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.backtotop-row{display:flex;justify-content:center;margin:24px 0 8px;}
.backtotop{
  display:flex;align-items:center;justify-content:center;
  width:40px;height:40px;padding:0;border-radius:10px;cursor:pointer;
  background:var(--surface2);border:1px solid var(--foil1);color:var(--foil1);
  box-shadow:0 0 8px rgba(57,255,20,0.35);
  transition:box-shadow 0.15s ease, transform 0.15s ease;
}
.backtotop:hover{box-shadow:0 0 14px rgba(57,255,20,0.6);transform:translateY(-2px);}
.stat-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px;
}
.stat-row:last-child{border-bottom:none;}
.dexslot.owned{border-color:var(--slot-color,var(--rare));background:var(--surface2);color:var(--text);}
.dexslot .num{position:absolute;top:4px;left:6px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);}
.dexslot .glyph{
  width:70cqw;height:70cqw;border-radius:0;margin-bottom:3px;
  background:transparent;display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.dexslot .glyph img{
  width:100%;height:100%;object-fit:contain;image-rendering:pixelated;
}
/* Fitted art box (dex tiles, binder sleeves). The sprites are 96x96 with a lot
   of empty padding, and shrinking the whole frame with pixelated drops pixel
   rows, which crushed them. Instead spriteFitStyle() passes where the creature
   sits in its frame (--kw/--kh = 96 / creature size, --cx/--cy = creature
   center as a fraction), and the sprite is scaled so the creature fills the
   box, never past 1x, then centered on the creature. The box is sized from the
   tile so the name and count stay clear, and it sits at the bottom so the free
   space goes above it, under the #number. */
.dexslot .glyph.art{
  --aw:94cqw; --ah:calc(133cqw - 35px);
  position:relative;display:block;flex:none;
  width:var(--aw);height:var(--ah);margin:auto 0 3px;
  overflow:visible;min-width:0;min-height:0;
}
.dexslot .glyph.art img,
.sprite-fit img{
  --kw:1;--kh:1;--cx:0.5;--cy:0.5; /* no bounds: fit the full frame */
  --sz:min(calc(var(--aw) * var(--kw)), calc(var(--ah) * var(--kh)), 96px);
  position:absolute;max-width:none;
  width:var(--sz);height:var(--sz);
  left:calc(50% - var(--sz) * var(--cx));
  top:calc(50% - var(--sz) * var(--cy));
  image-rendering:pixelated;
}
/* The same fitting in a fixed-size slot (thumbnails, leaderboard): spriteFit()
   sets --aw/--ah to the slot's px size. The img's transparent padding can reach
   well past a small slot (a 26px leaderboard sprite into the next row), so it
   must not take clicks meant for whatever it overlaps. */
.sprite-fit{position:relative;display:inline-block;vertical-align:middle;flex:none;width:var(--aw);height:var(--ah);}
.sprite-fit img{pointer-events:none;}
/* On 1x screens a sprite below 1x must be smoothed, or pixelated drops rows.
   At exactly 1x smoothing is a no-op, so the crisp sprites stay pixel-exact.
   On high-DPI screens even 0.5x is an upscale in device pixels, so pixelated
   stays. */
@media (max-resolution: 1dppx){
  .dexslot .glyph.art img,
  .sprite-fit img{image-rendering:auto;}
}
.dexslot .nm{
  font-weight:600;line-height:1.15;
  /* The global rule further down sets overflow-wrap:anywhere on .nm, for uids
     and long HEX values. On a dex tile that splits a species name mid-word -
     "Charmande" / "r". break-word only breaks a word that cannot fit at all. */
  overflow-wrap:break-word;
  hyphens:auto;
  /* Fallback for browsers without container queries. */
  font-size:9px;
  /* Scale with the TILE, not the viewport. A fixed px size is fragile here:
     the same 72px tile renders names wider on some devices (text scaling, or
     the webfont failing to load and falling back to a wider system mono), so
     10-char names like Charmander wrapped on one phone and fitted on another
     at identical column counts. 11cqw keeps the longest name on one line at
     every tile width, and the clamp stops it becoming illegible or oversized. */
  font-size:clamp(6.5px, 12.5cqw, 10px);
}
.dexslot .cnt{font-size:9px;margin-top:2px;color:var(--muted);}
/* Badge progress bar. Sits inside the tile rather than under it so the grid
   keeps a uniform aspect-ratio. Height is fixed px, not cqw: at 2px a
   container-relative height rounds to 0 on narrow tiles and the bar vanishes. */
.badgeslot .badgebar{
  width:78%;height:3px;margin-top:4px;border-radius:2px;
  background:var(--line);overflow:hidden;
}
.badgeslot .badgebar i{display:block;height:100%;border-radius:2px;}
/* Difficulty stars mirror .num in the opposite corner. Same 9px/absolute
   treatment so the two corner labels read as a pair. letter-spacing is
   negative because three stars at default tracking overrun a narrow tile. */
.badgeslot .diff{
  position:absolute;top:4px;right:6px;
  font-size:9px;line-height:1;color:var(--muted);letter-spacing:-0.5px;
}
.badgeslot.owned .diff{color:var(--slot-color);}
/* ELECTRIC (8 chars) is a Champion badge, so it carries three stars: at a fixed
   9px that pair needs 62.4px inside a 60px tile on mobile and the two corner
   labels overlap. Scale with the tile the way .nm does. */
.badgeslot .num{font-size:clamp(6.5px, 10cqw, 9px);}

/* ---------- opening overlay ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(6,6,14,0.94);backdrop-filter:blur(6px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:50;padding:20px;
}
.pack-stage{display:flex;flex-direction:column;align-items:center;gap:22px;}
/* sheenmove is still used by the LCD glass sheen further down; the pack's own
   sheen was dropped but this keyframe must stay. */
@keyframes sheenmove{0%{background-position:0% 0%;}100%{background-position:100% 100%;}}

/* The pack is a crimped foil wrapper in two pieces, so the top can tear away.
   .pack-visual is a FRAME only - no background, no border, no overflow:hidden.
   The outer shadow is a drop-shadow filter so it follows the toothed
   silhouette instead of a rectangle. Themes paint .pack-top/.pack-body. */
.pack-visual{
  container-type:inline-size;
  width:var(--pack-w);height:var(--pack-h);position:relative;cursor:pointer;
  display:flex;flex-direction:column;
  filter:drop-shadow(0 18px 34px rgba(0,0,0,0.75));
}
.pack-top,.pack-body{
  position:relative;overflow:hidden;
  background:linear-gradient(160deg,#1a1a36,#0d0d1e);
  /* An inset ring cannot follow a masked edge - the mask cuts it away and the
     teeth end up unlined. The crimp instead reads as a PRESSED FOIL BAND that
     the teeth are cut out of; the theme line survives on the left and right,
     which the mask never touches. */
  border-left:1px solid var(--edge);
  border-right:1px solid var(--edge);
}
.pack-top::before,.pack-body::before{
  z-index:1;content:'';position:absolute;left:0;right:0;
  height:calc(var(--crimp) + var(--band));
  background:
    /* pressed ridges running across the crimp, one per tooth so the ribs line
       up with the zigzag instead of drifting against it */
    repeating-linear-gradient(90deg,
      rgba(255,255,255,0.085) 0 0.5px,
      transparent 0.5px calc(var(--tooth)/3),
      rgba(0,0,0,0.22) calc(var(--tooth)/3) calc(var(--tooth)/3 + 0.5px),
      transparent calc(var(--tooth)/3 + 0.5px) calc(var(--tooth)/1.5)),
    color-mix(in srgb,var(--edge) 26%,transparent);
  pointer-events:none;
}
.pack-top::before{top:0;box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--edge) 55%,transparent);}
.pack-body::before{bottom:0;box-shadow:inset 0 1px 0 color-mix(in srgb,var(--edge) 55%,transparent);}

/* teeth cut into the top edge of the top piece. A conic-gradient mask keeps the
   teeth a fixed pixel size, so the crimp does not shrink at the mobile size the
   way a percentage clip-path would. */
.pack-top{
  height:calc(var(--crimp) + 30px);
  -webkit-mask:
    repeating-conic-gradient(from -45deg at bottom,#0000 0deg 90deg,#000 90deg 180deg)
      top left/var(--tooth) var(--crimp) repeat-x,
    linear-gradient(#000,#000) bottom left/100% calc(100% - var(--crimp)) no-repeat;
  mask:
    repeating-conic-gradient(from -45deg at bottom,#0000 0deg 90deg,#000 90deg 180deg)
      top left/var(--tooth) var(--crimp) repeat-x,
    linear-gradient(#000,#000) bottom left/100% calc(100% - var(--crimp)) no-repeat;
}
.pack-body{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  -webkit-mask:
    repeating-conic-gradient(from 135deg at top,#0000 0deg 90deg,#000 90deg 180deg)
      bottom left/var(--tooth) var(--crimp) repeat-x,
    linear-gradient(#000,#000) top left/100% calc(100% - var(--crimp)) no-repeat;
  mask:
    repeating-conic-gradient(from 135deg at top,#0000 0deg 90deg,#000 90deg 180deg)
      bottom left/var(--tooth) var(--crimp) repeat-x,
    linear-gradient(#000,#000) top left/100% calc(100% - var(--crimp)) no-repeat;
}

/* A dashed "tear here" guide in the buy-button purple. The glow is a filter,
   not a box-shadow, so it follows each dash instead of haloing the whole strip
   into one solid bar and filling the gaps back in. */
.pack-visual .tear{
  height:var(--seam);position:relative;z-index:3;background:transparent;
  background-image:repeating-linear-gradient(90deg,
    var(--foil2) 0 var(--dash), transparent var(--dash) calc(var(--dash) + var(--gap)));
  animation:tearpulse 1.9s ease-in-out infinite;
}
@keyframes tearpulse{
  0%,100%{filter:drop-shadow(0 0 3px rgba(157,78,221,0.7));opacity:0.72;}
  50%    {filter:drop-shadow(0 0 9px rgba(157,78,221,1)) drop-shadow(0 0 3px rgba(157,78,221,0.9));opacity:1;}
}

/* The pack should read as STUFFED. All of this is percentage-based so it holds
   at the overlay size, the 82% mobile size and the 60px shop mini alike:
   .bulge paints the shadow gutters where the foil wraps around the stack and
   the creases above and below it; .bulge::before is the card block itself,
   pressing a soft shadow into the foil around it with a highlight along its
   top edge. */
.pack-visual .bulge{
  position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(118% 66% at 50% 45%, rgba(255,255,255,0.085) 0%, rgba(255,255,255,0.035) 46%, transparent 72%),
    linear-gradient(90deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 14%, rgba(0,0,0,0) 86%, rgba(0,0,0,0.5) 100%),
    linear-gradient(180deg, rgba(0,0,0,var(--creaseA,0.42)) 0%, rgba(0,0,0,0) 13%, rgba(0,0,0,0) 85%, rgba(0,0,0,0.48) 100%);
}
.pack-visual .bulge::before{
  content:'';position:absolute;left:8%;right:8%;top:17%;bottom:6%;
  /* uneven corners - foil pulled over a stack does not wrap to a clean radius */
  border-radius:7px 5px 8px 6px;
  /* A tight shadow rather than a soft one: the foil is STRAINED over the stack,
     so it pinches hard at the block edge instead of fading smoothly into it. */
  /* FIVE cards. The front card is this block and sits LOWEST; the four behind
     it are negative-Y copies rising above it, each a dark edge with a lit lip.
     Zero blur is what makes them read as discrete cards, not a gradient. */
  /* Every offset is a multiple of --lift. Hardcoded pixels made the stack look
     right at 152px and far too loose on the 60px shop mini - the block is sized
     in percentages, so the gaps between cards have to scale with it too. */
  box-shadow:
    0 calc(var(--lift)*-1) 0 rgba(0,0,0,0.55),    0 calc(var(--lift)*-0.47) 0 rgba(255,255,255,0.14),
    0 calc(var(--lift)*-2) 0 rgba(0,0,0,0.55),    0 calc(var(--lift)*-1.47) 0 rgba(255,255,255,0.13),
    0 calc(var(--lift)*-3) 0 rgba(0,0,0,0.55),    0 calc(var(--lift)*-2.47) 0 rgba(255,255,255,0.12),
    0 calc(var(--lift)*-4) 0 rgba(0,0,0,0.55),    0 calc(var(--lift)*-3.47) 0 rgba(255,255,255,0.11),
    0 calc(var(--lift)*-1.3) calc(var(--lift)*2.7) 1px rgba(0,0,0,0.55),
    0 calc(var(--lift)*-0.7) calc(var(--lift)*5.3) calc(var(--lift)*2) rgba(0,0,0,0.32),
    inset 0 1px 0 rgba(255,255,255,0.1),
    inset 0 -2px 3px rgba(0,0,0,0.4);
  background:radial-gradient(90% 60% at 50% 40%, rgba(255,255,255,0.055), transparent 70%);
}
/* Vacuum strain. Creases in shrink-wrap radiate OUT from the object, so these
   are spokes from the stack's centre rather than parallel wrinkles. The mask
   holds them off the stack itself - the foil is tight there and only creases
   in the slack around it. */
.pack-visual .bulge::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-conic-gradient(from 4deg at 50% 42%,
    transparent 0 3.4deg,
    rgba(255,255,255,0.055) 3.4deg 4deg,
    transparent 4deg 6.8deg,
    rgba(0,0,0,0.16) 6.8deg 7.3deg,
    transparent 7.3deg 11deg);
  /* The creases are SHORT - they only pull in the tight band of foil right
     around the stack, then die out. A mask band, not a fade to the pack edge. */
  -webkit-mask:radial-gradient(66% 52% at 50% 42%,
    transparent 0 64%, #000 74%, #000 84%, transparent 96%);
  mask:radial-gradient(66% 52% at 50% 42%,
    transparent 0 64%, #000 74%, #000 84%, transparent 96%);
  mix-blend-mode:overlay;opacity:0.95;
}

/* Pack symbols are inline SVG in the markup rather than data-URI backgrounds,
   because the stroke has to follow the theme colour - currentColor stops at the
   edge of a data-URI, which would mean three hardcoded copies of the palette. */
.pack-visual .sym{
  flex:1;display:flex;align-items:center;justify-content:center;
  width:100%;min-height:0;padding:8% 0 2%;z-index:2;position:relative;
}
.pack-visual .sym svg{
  width:68%;height:auto;overflow:visible;
  fill:none;stroke:currentColor;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 5px currentColor) drop-shadow(0 0 12px currentColor);
  opacity:0.92;
}

/* Sized in cqw against the pack's own width, so the name fits on one line at
   any pack size or viewport; a fixed px size wraps "Diamond Pack" the moment
   the pack narrows. Side padding is a percentage so the clear margin scales
   with the pack instead of collapsing, and leaves room for the glow. */
.pack-visual .mark{
  font-family:var(--font-display);
  font-weight:800;
  font-size:9.5cqw;
  line-height:1;
  white-space:nowrap;
  color:var(--text);
  letter-spacing:0.04em;
  z-index:2;
  position:relative;
  text-align:center;
  padding:0 10% calc(var(--crimp) + var(--band) + 7px);
}

.pack-visual.scrub{touch-action:none;user-select:none;-webkit-user-select:none;}
/* The black line was a real gap, not a shadow. .tear is a 1px element sitting
   IN FLOW between the two pieces, so the moment the top lifts you see straight
   through that 1px to the page behind. In scrub mode the guide is lifted out of
   flow and painted over the seam instead, so the pieces sit flush and there is
   nothing to see through. The -3px lift is gone for the same reason. */
.pack-visual.scrub .tear{
  position:absolute; left:0; right:0; height:var(--seam); z-index:4;
  top:calc(var(--crimp) + 30px);
}
/* The body slides 4px UP under the top piece rather than 1px. Every version of
   this line has lived at the exact row where the two pieces meet, so instead of
   working out which layer is showing through a 1px join, there is no longer a
   1px join to show through - the pieces overlap by a margin no rounding can
   close. */
.pack-visual.scrub .pack-body{margin-top:calc(var(--seam) * -1 - 3px);}
/* Whatever the edges do, lifting the top piece exposes the space behind it -
   and with nothing back there, that space is the page, which reads as a black
   line. This is the INSIDE of the pack: a lit strip sitting behind both pieces
   at the seam, so anything the tear exposes shows pack interior rather than a
   hole. Sized in --rag so it tracks the tear depth. */
.pack-visual.scrub::before{
  content:'';position:absolute;z-index:0;pointer-events:none;
  /* Backs the WHOLE pack, not just a band at the seam. A mask edge is
     anti-aliased, so the torn boundary is a row of PARTIALLY transparent
     pixels - a hairline that no amount of repositioning removes, because it is
     the edge itself. Backing every interior pixel means those half-transparent
     pixels blend onto foil instead of onto the page. It stops at the crimp top
     and bottom so the teeth keep their silhouette. */
  /* Starts just BELOW the seam. Spanning the whole pack meant this layer's own
     top edge sat at the join between the two pieces, and a 1px sliver of it
     showed there even at rest - the thin line, which is this layer, not a hole.
     Everything the tear exposes is below the seam anyway, so nothing above it
     needs backing. */
  left:1px; right:1px;
  top:calc(var(--crimp) + 30px + 2px);
  height:calc(100% - var(--crimp) * 2 - 30px);
  /* OPAQUE, and present from the very start. Fading this in with --p left the
     torn region genuinely see-through for most of the tear - which is why the
     dark band changed with the page's scroll position: it was the page behind
     the overlay showing through the pack. An interior you can see through is
     not an interior. The tint brightens as the tear opens; the opacity never
     moves. */
  /* A PLAIN opaque colour first, so this layer is never transparent even if
     the tint below is not understood. The tint used calc() inside color-mix,
     which several browsers reject - and a rejected background declaration
     leaves the element with no background at all, i.e. a see-through strip.
     That is why the line tracked the page's scroll position. */
  background-color:#060606;
  background-image:
    linear-gradient(180deg,
      color-mix(in srgb, var(--edge) 20%, #070707) 0%,
      color-mix(in srgb, var(--edge) 9%, #060606) 55%,
      #050505 100%);
}

/* The gesture zone: as wide as the pack plus half a pack either side, and only
   the top ~39% vertically - you tear across the top, not the belly.
   Binding this to the pack itself meant the drag had to BEGIN inside a 152px
   target, which is backwards; you start a tear beside the pack, not on it. */
.packwrap{position:relative;}
.tearzone{
  position:absolute; left:-50%; width:200%; top:0; height:39%;
  z-index:10; touch-action:none; user-select:none; -webkit-user-select:none;
}

/* --p is tear progress 0..1, driven by the drag. The torn edge exists only in
   the swept region; the rest of the seam is still intact, which is what makes
   this a scrub rather than a play/not-play animation. */
.pack-visual.scrub .pack-top{
  --swept:calc(var(--p) * 100%);
  --left:calc((1 - var(--p)) * 100% + 2px);
  -webkit-mask:
    repeating-conic-gradient(from -45deg at bottom,#0000 0deg 90deg,#000 90deg 180deg)
      top left/var(--tooth) var(--crimp) repeat-x,
    linear-gradient(#000,#000) left 0 top var(--crimp)/100% calc(100% - var(--crimp) - var(--rag)) no-repeat,
    var(--tear-top) bottom left/var(--swept) var(--rag) no-repeat,
    linear-gradient(#000,#000) bottom right/var(--left) var(--rag) no-repeat;
  mask:
    repeating-conic-gradient(from -45deg at bottom,#0000 0deg 90deg,#000 90deg 180deg)
      top left/var(--tooth) var(--crimp) repeat-x,
    linear-gradient(#000,#000) left 0 top var(--crimp)/100% calc(100% - var(--crimp) - var(--rag)) no-repeat,
    var(--tear-top) bottom left/var(--swept) var(--rag) no-repeat,
    linear-gradient(#000,#000) bottom right/var(--left) var(--rag) no-repeat;
  transform-origin:100% 100%;
  transform:rotate(calc(var(--p) * -13deg));
  /* Fades over the last stretch of the tear. Even held back, the flare blooms
     while the piece is still lying across the body, and near-black foil over a
     lit body is the silhouette that reads as a black band. Letting the piece
     go translucent as it finishes means there is nothing left to silhouette. */
  opacity:calc(1 - max(0, var(--p) - 0.80) * 4.4);
  animation:none;
}
.pack-visual.scrub.rtl .pack-top{
  -webkit-mask:
    repeating-conic-gradient(from -45deg at bottom,#0000 0deg 90deg,#000 90deg 180deg)
      top left/var(--tooth) var(--crimp) repeat-x,
    linear-gradient(#000,#000) left 0 top var(--crimp)/100% calc(100% - var(--crimp) - var(--rag)) no-repeat,
    var(--tear-top) bottom right/var(--swept) var(--rag) no-repeat,
    linear-gradient(#000,#000) bottom left/var(--left) var(--rag) no-repeat;
  mask:
    repeating-conic-gradient(from -45deg at bottom,#0000 0deg 90deg,#000 90deg 180deg)
      top left/var(--tooth) var(--crimp) repeat-x,
    linear-gradient(#000,#000) left 0 top var(--crimp)/100% calc(100% - var(--crimp) - var(--rag)) no-repeat,
    var(--tear-top) bottom right/var(--swept) var(--rag) no-repeat,
    linear-gradient(#000,#000) bottom left/var(--left) var(--rag) no-repeat;
  transform-origin:0 100%;
  transform:rotate(calc(var(--p) * 13deg));
}
/* Both pieces tear against the SAME polyline from opposite sides, so the edges
   are complementary and interlock with nothing between them. And like the top
   piece, the body is only torn in the SWEPT region - tearing it full width
   meant its notches were exposed even on an intact pack, which is the line
   that was showing at rest. */
.pack-visual.scrub .pack-body{
  --swept:calc(var(--p) * 100%);
  --left:calc((1 - var(--p)) * 100% + 2px);
  -webkit-mask:
    var(--tear-bot) top left/var(--swept) var(--rag) no-repeat,
    linear-gradient(#000,#000) top right/var(--left) var(--rag) no-repeat,
    linear-gradient(#000,#000) left 0 top var(--rag)/100% calc(100% - var(--rag) - var(--crimp)) no-repeat,
    repeating-conic-gradient(from 135deg at top,#0000 0deg 90deg,#000 90deg 180deg)
      bottom left/var(--tooth) var(--crimp) repeat-x;
  mask:
    var(--tear-bot) top left/var(--swept) var(--rag) no-repeat,
    linear-gradient(#000,#000) top right/var(--left) var(--rag) no-repeat,
    linear-gradient(#000,#000) left 0 top var(--rag)/100% calc(100% - var(--rag) - var(--crimp)) no-repeat,
    repeating-conic-gradient(from 135deg at top,#0000 0deg 90deg,#000 90deg 180deg)
      bottom left/var(--tooth) var(--crimp) repeat-x;
  animation:none;
}
/* mirrored when the tear runs right-to-left */
.pack-visual.scrub.rtl .pack-body{
  -webkit-mask:
    var(--tear-bot) top right/var(--swept) var(--rag) no-repeat,
    linear-gradient(#000,#000) top left/var(--left) var(--rag) no-repeat,
    linear-gradient(#000,#000) left 0 top var(--rag)/100% calc(100% - var(--rag) - var(--crimp)) no-repeat,
    repeating-conic-gradient(from 135deg at top,#0000 0deg 90deg,#000 90deg 180deg)
      bottom left/var(--tooth) var(--crimp) repeat-x;
  mask:
    var(--tear-bot) top right/var(--swept) var(--rag) no-repeat,
    linear-gradient(#000,#000) top left/var(--left) var(--rag) no-repeat,
    linear-gradient(#000,#000) left 0 top var(--rag)/100% calc(100% - var(--rag) - var(--crimp)) no-repeat,
    repeating-conic-gradient(from 135deg at top,#0000 0deg 90deg,#000 90deg 180deg)
      bottom left/var(--tooth) var(--crimp) repeat-x;
}
/* The top crease of the stuffing is a hard dark edge meant to sit BEHIND the
   top piece - the foil creasing over the stack. Once the top flies off it is
   exposed, so it goes when the pack opens. */
.pack-visual.scrub.gone .bulge{--creaseA:0;}
/* spring back when released short of the threshold */
.pack-visual.scrub.settling .pack-top,
.pack-visual.scrub.settling .pack-body{transition:transform .28s cubic-bezier(.2,.9,.3,1);}
.pack-visual.scrub.settling{transition:none;}
.pack-visual.scrub.gone .pack-top{
  transition:transform .34s cubic-bezier(.3,.05,.25,1), opacity .34s ease;
  transform:translate(calc(var(--dir) * 46px), -140px) rotate(calc(var(--dir) * -36deg));
  opacity:0;
}
/* Light bursting out of the torn mouth. This is the flare's base appearance -
   its size, shape and colour. The scrub rule below only drives WHEN it shows. */
.pack-visual .flare{
  position:absolute;left:50%;top:0;transform:translate(-50%,-40%) scale(0.2);
  width:130%;aspect-ratio:1;border-radius:50%;opacity:0;z-index:1;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,0.95) 0%,var(--edge) 32%,transparent 68%);
}

/* The flare is a BURST at the end, not a light that rises through the whole
   tear. Ramping it with --p lit the body brightly while the top piece - which
   is near-black foil - was still lying across it, and that contrast is the
   "black line": not a gap, the piece itself silhouetted against a glow. It now
   stays dark until the tear is nearly through. */
.pack-visual.scrub .flare{
  opacity:calc(max(0, var(--p) - 0.86) * 7);
  transform:translate(-50%,-40%) scale(calc(0.3 + var(--p)*0.8));
  animation:none;
}
.pack-visual.scrub .tear{opacity:calc(1 - var(--p));}

@media (prefers-reduced-motion:reduce){
  .pack-visual .tear{animation:none;opacity:0.9;}
}
.pack-hint{color:var(--muted);font-size:13px;letter-spacing:0.04em;text-align:center;}

/* Wrapper is rendered for every card from the moment the pack opens, and the
   selling ring uses outline rather than border+padding. Both matter: a wrapper
   that appears only once all cards are flipped, or a border that adds 10px of
   width, reflows the whole row at the exact moment the cards should hold still.
   Outlines are painted outside the box and never affect layout. */
.sell-mark{
  display:flex;flex-direction:column;align-items:center;
  border-radius:14px;
  transition:opacity 0.15s ease, filter 0.15s ease;
}
.sell-mark.selling{
  opacity:0.55;filter:grayscale(0.6);
  outline:2px solid #ff4444;outline-offset:2px;
}
.sell-tag{
  font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;
  letter-spacing:0.05em;text-transform:uppercase;text-align:center;
  margin-top:3px;height:12px;
}

.reveal-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:900px;}
.card-slot-wrapper{display:flex;flex-direction:column;align-items:center;gap:4px;}
.already-owned-badge{
  font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:var(--gold);
  background:rgba(199,125,255,0.15);border:1px solid var(--gold);padding:2px 6px;border-radius:4px;
  letter-spacing:0.05em;text-transform:uppercase;height:18px;display:flex;align-items:center;
}
.card-slot{position:relative;perspective:900px;width:130px;height:180px;container-type:inline-size;}
/* Sits in .cf-top's left slot, the dex number's usual spot - the number
   itself moves down next to the rarity label when a card is filed, since
   there's no fixed-width home in that corner that works for every type
   pill's width (GRASS vs PSYCHIC). */
.cardface-filed-badge{width:30px;height:30px;display:block;}
.card-inner{
  position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.3,.9,.4,1);cursor:pointer;
}
.card-slot.flipped .card-inner{transform:rotateY(180deg);}
.card-face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;
  display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);
}
.card-back{
  background:repeating-linear-gradient(45deg,#161630,#161630 8px,#1c1c38 8px,#1c1c38 16px);
  display:flex;align-items:center;justify-content:center;
}
.card-back span{font-family:var(--font-display);font-weight:800;color:var(--foil1);font-size:9px;letter-spacing:0.1em;opacity:0.8;}
/* Inside a real card, scale the wordmark with the card's width (.card-slot
   is the size container). 6.9cqw = 9px at the 130px reveal size, so only
   larger cards like the inspect view change. Shop/profile swatches sit
   outside any .card-slot and keep the flat 9px above. */
.card-slot .card-back span{font-size:max(9px, 6.9cqw);}
/* The hexagon mark in the middle of a plain back, in place of a wordmark.
   Sized from the card's width, so it scales from the 46px profile swatch up
   to the inspect view with no breakpoints; the aspect ratio is the header
   hexagon's (0.63em x 0.72em). Its ::before/::after layers are shared with
   .hexo above. */
.card-back .back-hex{
  display:block;position:relative;width:32%;aspect-ratio:0.63/0.72;
  filter:drop-shadow(0 0 4px rgba(57,255,20,0.45));
}

/* ---------- card back shelf (shop) ---------- */
/* Tiles are full card size so the swatch IS the preview - no separate
   preview mode to get out of sync with the real reveal. */
.cbshelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,max-content));gap:16px;justify-content:center;margin-bottom:26px;}
.cbtile{display:flex;flex-direction:column;align-items:center;gap:6px;width:130px;}
.cb-swatch{
  width:130px;height:180px;border-radius:12px;border:1px solid var(--line);
  overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;
}
/* Locked backs render at full strength: the price, the button label and the
   absence of the equipped outline already carry the state, and dimming the
   expensive art defeats the point of a full-size preview. */
.cbtile.equipped .cb-swatch{outline:2px solid var(--foil1);outline-offset:2px;}
/* Avatar with cosmetics: the Cosmetic Forge's 39x48-cell stage. avatarStage()
   sets the pixel sizes (2px per cell on profiles, 3 on shop tiles); the card
   sits at cell (8,8) and the 8-cell margin is room for a hat's overhang,
   arms, shoes. */
.avatar-stage{position:relative;flex:0 0 auto;}
.avatar-stage > .cb-swatch{position:absolute;}
.avatar-layers{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
/* Collectibles shop: tabs (card backs, cosmetics, unlockables) on the left,
   your avatar as it looks right now in a panel on the right. Under 720px the
   panel moves above the tabs. */
.coll-shop{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:20px;align-items:start;margin-bottom:26px;}
.coll-panel{position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:16px 14px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.coll-panel-title{font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);}
.coll-outfit{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:11.5px;margin:0;}
.coll-outfit dt{color:var(--muted);}
.coll-outfit dd{margin:0;color:var(--text);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.coll-outfit dd.none{color:var(--muted);}
.coll-tabs{margin-bottom:14px;}
.coll-shop .cbshelf{justify-content:start;}
@media (max-width:720px){
  .coll-shop{grid-template-columns:minmax(0,1fr);}
  .coll-panel{position:static;order:-1;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:14px;}
  .coll-panel-title{grid-column:1 / -1;justify-self:center;}
  .coll-shop .cbshelf{justify-content:center;}
}
.shop-note{color:var(--muted);font-size:11.5px;margin:6px 0 12px;font-style:italic;}
.cos-preview{width:130px;height:180px;display:flex;align-items:center;justify-content:center;}
.cos-name{font-size:12px;color:var(--text);text-align:center;}
/* seasonal items (cosmetics and card backs): the season's name above, time left under the price */
.coll-season{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);text-align:center;margin-bottom:-4px;}
.coll-left{font-size:10.5px;color:var(--gold);font-family:'JetBrains Mono',monospace;}
.coll-tile > .cb-btn{margin-top:auto;}  /* buttons line up across a row, seasonal or not */
.cbtile > .coll-season{margin-bottom:0;}  /* card backs have no name line under it */
/* Shop tiles draw each cosmetic on a plain neutral card so its colors read
   clearly, and skip the equipped outline (it ran into the art); the
   Equipped button carries that state. */
.cb-swatch.cos-blank{background:#1b1b1e;border-color:#2e2e33;}
.cbtile.equipped .cos-preview .cb-swatch{outline:none;}
.cb-price{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);}
.cb-btn{
  font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:5px 10px;border-radius:6px;
  border:1px solid var(--line);background:var(--surface2);color:var(--text);cursor:pointer;
  min-height:30px;width:100%;
}
.cb-btn:disabled{opacity:0.45;cursor:not-allowed;}
.cb-btn.buy{border-color:var(--gold);color:var(--gold);}
.cb-btn.equip{border-color:var(--foil1);color:var(--foil1);}
.cb-btn.on{background:var(--foil1);color:#05100a;border-color:var(--foil1);}

/* --- individual backs. back-* only, never theme-* --- */
/* All art is layered on ::before/::after inside the face. Sizes are in % so a
   back reads the same at 130x180 (shop tile), at card size, and at 46x64
   (profile swatch). Ladder is expressed as MOTION AND DEPTH, not density:
   cheap = static and flat, expensive = alive. */
/* No `position` here: .card-face is already absolute in the reveal, and the
   shop swatch relies on .cb-swatch's position:relative winning at equal
   specificity. An attribute selector (0,2,0) would outrank it and collapse
   every tile. Both contexts are already positioned, so ::before/::after
   anchor correctly either way. */
.card-back[class*="back-"]{overflow:hidden;isolation:isolate;}
.card-back[class*="back-"]::before,
.card-back[class*="back-"]::after{content:'';position:absolute;inset:0;pointer-events:none;}

/* --- 60k Obsidian: static. Volcanic glass. Depth from layering only. --- */
.card-back.back-obsidian{
  background:
    radial-gradient(120% 80% at 30% 12%, #2c2740 0%, transparent 55%),
    linear-gradient(160deg,#14121d 0%,#07060b 60%,#100e18 100%);
}
.card-back.back-obsidian::before{
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 1px,transparent 1px 9px);
  opacity:.7;
}
.card-back.back-obsidian::after{
  background:radial-gradient(90% 60% at 50% 118%, rgba(150,130,255,.22), transparent 60%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
}

/* ---- PIXEL TECHNIQUE ----
   Hard-stop gradients only (no soft blends), px-quantised background-size, and
   steps() timing so motion advances frame-by-frame like a sprite sheet rather
   than sliding. image-rendering:pixelated keeps edges hard when the card is
   scaled down to the 46x64 profile swatch. */
.card-back[class*="back-"]{image-rendering:pixelated;}

/* --- 250k: matrix rain. Glyph columns, since gradients cannot draw
   characters. Each column is its own SVG strip with the head glyph at the
   bottom fading upward into the tail; tile height = glyphs x size so it
   loops seamlessly. Columns are split across two layers running at
   different durations and step counts so they never fall in unison. --- */
.card-back.back-tidal{background:linear-gradient(#020604,#000);}
.card-back.back-tidal::before{

.card-back.back-singular::after{
  background:linear-gradient(110deg,transparent 42%,rgba(255,248,220,.9) 50%,transparent 58%) no-repeat;
  background-size:300% 100%;
  -webkit-mask-image:var(--regalia-gold);
          mask-image:var(--regalia-gold);
  -webkit-mask-size:100% 100%; mask-size:100% 100%;
  mix-blend-mode:screen;
  animation:cb-regalia-glint 7s ease-in-out infinite;
}
/* 100% -> 0% carries the band from off the left edge to off the right; the
   hold from 45% keeps it parked off-card. With reduced motion the animation is
   off and the default position (0%) leaves the band off-card too. */
@keyframes cb-regalia-glint{ 0%{background-position:100% 0;} 45%,100%{background-position:0% 0;} }

/* --- 100k: BRICK. Static pixel brickwork, offset courses. --- */
.card-back.back-bloom{
  background:#0e0a16;                                  /* mortar */
  background-image:repeating-linear-gradient(to bottom,#3b1f5c 0 14px,#0e0a16 14px 16px);
}
/* vertical mortar on even courses only, via a stepped mask */
.card-back.back-bloom::before{
  background-image:repeating-linear-gradient(to right,#0e0a16 0 2px,transparent 2px 32px);
  -webkit-mask-image:repeating-linear-gradient(to bottom,#000 0 16px,transparent 16px 32px);
          mask-image:repeating-linear-gradient(to bottom,#000 0 16px,transparent 16px 32px);
}
/* odd courses, offset half a brick */
.card-back.back-bloom::after{
  background-image:repeating-linear-gradient(to right,#0e0a16 0 2px,transparent 2px 32px);
  background-position:16px 0;
  -webkit-mask-image:repeating-linear-gradient(to bottom,transparent 0 16px,#000 16px 32px);
          mask-image:repeating-linear-gradient(to bottom,transparent 0 16px,#000 16px 32px);
  box-shadow:inset 0 0 0 1px rgba(57,255,20,.10), inset 0 34px 30px -30px rgba(157,78,221,.55);
}

/* --- 160k: FRAME. Gilt pixel frame around a moonlit landscape. Static. --- */
.card-back.back-circuit{
  background:#07090a;
  /* bevelled gold: light top-left, deep shadow bottom-right, hard steps */
  box-shadow:
    inset 0 0 0 2px  #6b4a12,
    inset 0 0 0 5px  #d9a441,
    inset 0 0 0 8px  #f3d98a,
    inset 0 0 0 11px #b8862b,
    inset 0 0 0 14px #6b4a12,
    inset 0 0 0 16px #f3d98a;
}
/* the picture: sky, moon, two ridgelines, ground */
.card-back.back-circuit::before{
  inset:18px;
  background-image:url("data:image/svg+xml,%3Csvg xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22 viewBox%3D%220 0 100 130%22 shape-rendering%3D%22crispEdges%22%3E%3Crect width%3D%22100%22 height%3D%22130%22 fill%3D%22%231b0f2e%22%2F%3E%3Crect y%3D%2255%22 width%3D%22100%22 height%3D%2275%22 fill%3D%22%232a1547%22%2F%3E%3Ccircle cx%3D%2272%22 cy%3D%2226%22 r%3D%2211%22 fill%3D%22%23f0d9ff%22%2F%3E%3Ccircle cx%3D%2266%22 cy%3D%2222%22 r%3D%2210%22 fill%3D%22%231b0f2e%22%2F%3E%3Cpolygon points%3D%220%2C92 26%2C44 52%2C92%22 fill%3D%22%2324123a%22%2F%3E%3Cpolygon points%3D%2234%2C92 62%2C38 90%2C92%22 fill%3D%22%231b3a23%22%2F%3E%3Cpolygon points%3D%2226%2C44 32%2C54 20%2C54%22 fill%3D%22%233d6b48%22%2F%3E%3Cpolygon points%3D%2262%2C38 69%2C50 55%2C50%22 fill%3D%22%234f8a5b%22%2F%3E%3Cpolygon points%3D%2270%2C92 100%2C58 100%2C92%22 fill%3D%22%2316301c%22%2F%3E%3Crect y%3D%2292%22 width%3D%22100%22 height%3D%2238%22 fill%3D%22%230a1a0e%22%2F%3E%3Crect y%3D%2292%22 width%3D%22100%22 height%3D%223%22 fill%3D%22%2316301c%22%2F%3E%3C%2Fsvg%3E");
  background-size:100% 100%;
  background-repeat:no-repeat;
  box-shadow:inset 0 0 0 2px #6b4a12;
}
/* gilt corner ornaments */
.card-back.back-circuit::after{
  inset:16px;
  background-image:
    linear-gradient(#f3d98a 0 0), linear-gradient(#f3d98a 0 0),
    linear-gradient(#f3d98a 0 0), linear-gradient(#f3d98a 0 0),
    linear-gradient(#f3d98a 0 0), linear-gradient(#f3d98a 0 0),
    linear-gradient(#f3d98a 0 0), linear-gradient(#f3d98a 0 0);
  background-size:10px 3px, 3px 10px, 10px 3px, 3px 10px,
                  10px 3px, 3px 10px, 10px 3px, 3px 10px;
  background-position:0 0, 0 0, 100% 0, 100% 0,
                      0 100%, 0 100%, 100% 100%, 100% 100%;
  background-repeat:no-repeat;
}
