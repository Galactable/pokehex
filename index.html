<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains-Mono:wght@400;500;700&display=swap');

:root{
  --bg:#07090a;
  --surface:#0e130f;
  --surface2:#141b16;
  --line:#243026;
  --text:#c8f5cc;
  --muted:#5d7a63;
  --foil1:#39ff14;
  --foil2:#9d4edd;
  --gold:#c77dff;
  --common:#5d7a63;
  --uncommon:#39ff14;
  --rare:#9d4edd;
  --ultra:#6bff5c;
  --secret:#f0d9ff;

  /* ---- pack wrapper geometry (see pack-shape-preview) ---- */
  --pack-w:152px;   /* pack width  */
  --pack-h:268px;   /* pack height */
  --tooth:6px;      /* width of one crimp tooth */
  --crimp:4px;      /* how deep the teeth bite in */
  --band:8px;       /* extra height of the pressed-foil crimp band */
  --seam:1px;       /* thickness of the purple tear guide */
  --dash:7px;       /* dash length on the tear guide */
  --gap:5px;        /* gap between dashes */
  --rag:6px;        /* depth of the ragged torn edge */
  --lift:7px;       /* gap between stacked cards - MUST scale with the pack */
  --edge:var(--line); /* theme line colour, overridden per pack theme */
  --tear-top:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%2020%22%20preserveAspectRatio%3D%22none%22%3E%3Cpath%20d%3D%22M0%200%20H200%20V13.0%20L198%2013.0%20L191%2014.1%20L187%2012.1%20L182%2013.0%20L174%2013.6%20L167%2012.3%20L163%2011.5%20L157%2010.5%20L151%2010.6%20L146%2010.8%20L136%2011.8%20L132%2012.0%20L127%2013.0%20L121%2013.0%20L113%2013.0%20L106%2013.0%20L102%2014.4%20L97%2013.8%20L87%209.0%20L80%208.8%20L72%207.6%20L65%208.4%20L55%207.0%20L51%207.9%20L44%207.0%20L40%205.9%20L34%2013.0%20L28%2014.1%20L22%207.0%20L14%207.0%20L10%206.3%20L0%2010.0%20Z%22%20fill%3D%22%23000%22%2F%3E%3C%2Fsvg%3E");

  --tear-bot2:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%2020%22%20preserveAspectRatio%3D%22none%22%3E%3Cpath%20d%3D%22M0%2020%20H200%20V3.0%20L198%203.0%20L194%203.0%20L186%201.6%20L180%203.0%20L176%201.7%20L171%203.2%20L163%203.0%20L158%202.8%20L155%203.9%20L150%2017.0%20L142%2017.2%20L134%2016.9%20L128%202.1%20L124%202.0%20L118%2018.1%20L113%203.5%20L107%205.4%20L104%207.4%20L98%2013.6%20L92%2018.0%20L89%2017.0%20L86%2017.5%20L81%2013.6%20L77%2016.9%20L71%2017.0%20L67%2017.0%20L59%2018.4%20L55%203.0%20L51%203.0%20L48%205.8%20L40%2011.0%20L36%2017.0%20L32%2015.7%20L29%2017.0%20L23%2018.2%20L20%208.3%20L16%202.7%20L8%2016.9%20L0%2010.0%20Z%22%20fill%3D%22%23000%22%2F%3E%3C%2Fsvg%3E");
  --tear-line2:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%2020%22%20preserveAspectRatio%3D%22none%22%3E%3Cpath%20d%3D%22M0%2010.0%20L8%2016.9%20L16%202.7%20L20%208.3%20L23%2018.2%20L29%2017.0%20L32%2015.7%20L36%2017.0%20L40%2011.0%20L48%205.8%20L51%203.0%20L55%203.0%20L59%2018.4%20L67%2017.0%20L71%2017.0%20L77%2016.9%20L81%2013.6%20L86%2017.5%20L89%2017.0%20L92%2018.0%20L98%2013.6%20L104%207.4%20L107%205.4%20L113%203.5%20L118%2018.1%20L124%202.0%20L128%202.1%20L134%2016.9%20L142%2017.2%20L150%2017.0%20L155%203.9%20L158%202.8%20L163%203.0%20L171%203.2%20L176%201.7%20L180%203.0%20L186%201.6%20L194%203.0%20L198%203.0%20L200%203.0%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222%22%20vector-effect%3D%22non-scaling-stroke%22%2F%3E%3C%2Fsvg%3E");
  --tear-line:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%2020%22%20preserveAspectRatio%3D%22none%22%3E%3Cpath%20d%3D%22M0.0%2010.0%20L10.0%206.3%20L14.0%207.0%20L22.0%207.0%20L28.0%2014.1%20L34.0%2013.0%20L40.0%205.9%20L44.0%207.0%20L51.0%207.9%20L55.0%207.0%20L65.0%208.4%20L72.0%207.6%20L80.0%208.8%20L87.0%209.0%20L97.0%2013.8%20L102.0%2014.4%20L106.0%2013.0%20L113.0%2013.0%20L121.0%2013.0%20L127.0%2013.0%20L132.0%2012.0%20L136.0%2011.8%20L146.0%2010.8%20L151.0%2010.6%20L157.0%2010.5%20L163.0%2011.5%20L167.0%2012.3%20L174.0%2013.6%20L182.0%2013.0%20L187.0%2012.1%20L191.0%2014.1%20L198.0%2013.0%20L200.0%2013.0%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%221.5%22%20vector-effect%3D%22non-scaling-stroke%22%2F%3E%3C%2Fsvg%3E");

body {
  margin: 0;
  padding: 0;
  background: var(--bg);
}
#app{
  background:
    repeating-linear-gradient(to bottom, rgba(57,255,20,0.025) 0px, rgba(57,255,20,0.025) 1px, transparent 1px, transparent 3px),
    radial-gradient(circle at 50% -10%, #101a12 0%, var(--bg) 55%);
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  min-height:100vh;
  padding:20px 16px 60px;
  box-sizing:border-box;
  overflow-x:hidden;
  position:relative;
}
*{box-sizing:border-box;}
.mono{font-family:'JetBrains Mono',monospace;}
.disp{font-family:'VT323',monospace;font-weight:400;letter-spacing:0.04em;text-transform:uppercase;color:var(--foil1);text-shadow:0 0 8px rgba(57,255,20,0.45);}

/* ---------- currency cube icon ---------- */
.hex-icon {
  display: inline-block;
  width: 14px;
  height: 16px;
  background: transparent;
  position: relative;
  vertical-align: middle;
  margin-right: 3px;
}
.hex-icon::before {
  content: '';
  position: absolute;
  top: 0;
  left: 3px;
  width: 8px;
  height: 6px;
  background: var(--foil1);
  clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
  z-index: 2;
}
.hex-icon::after {
  content: '';
  position: absolute;
  inset: 0;
  background: 
    linear-gradient(135deg, var(--foil1), var(--foil2)),
    #000000;
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
}

/* ---------- header ---------- */
.topbar{
  display:grid;
  grid-template-columns: 1fr auto 1fr;
  align-items:center;
  max-width:920px;
  margin:0 auto 22px;
  gap:10px;
}
.brand{display:flex;align-items:center;gap:10px; justify-self:center; grid-column: 2; position:relative;}
.brand-hexmark{
  width:44px;height:50px;
  position:relative;
  justify-self:start;
  grid-column: 1;
  filter: drop-shadow(0 0 10px rgba(57,255,20,0.4));
}
.brand-hexmark::before{
  content:'';
  position:absolute;
  top:0; left:9px;
  width:26px; height:20px;
  background:var(--foil1);
  clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
  z-index:2;
}
.brand-hexmark::after{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(135deg, var(--foil1), var(--foil2)),
    #000000;
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
}
.brand div:not(.brand-hexmark) { text-align: center; }

/* Slime Title with Sparkles & Floating Dust Particles */
.brand h1,
.authcard h1 {
  font-size: 42px;
  margin: 0;
  font-family: 'VT323', monospace;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--foil1);
  text-shadow: 0 0 12px rgba(57, 255, 20, 0.7), 0 0 25px rgba(57, 255, 20, 0.4);
  text-transform: uppercase;
  position: relative;
  display: inline-block;
}

.brand h1::before,
.brand h1::after,
.authcard h1::before,
.authcard h1::after {
  content: '';
  position: absolute;
  pointer-events: none;
  border-radius: 50%;
}

.brand h1::before,
.authcard h1::before {
  inset: -8px -12px;
  background: 
    radial-gradient(circle 3px at 15% 20%, var(--foil1) 0%, transparent 70%),
    radial-gradient(circle 2.5px at 85% 70%, var(--gold) 0%, transparent 70%),
    radial-gradient(circle 2px at 45% 85%, var(--foil1) 0%, transparent 70%),
    radial-gradient(circle 3.5px at 90% 15%, var(--gold) 0%, transparent 70%),
    radial-gradient(circle 2px at 10% 80%, var(--foil1) 0%, transparent 70%);
  animation: slimeSparkle 2.2s ease-in-out infinite alternate;
  z-index: 2;
}

.brand h1::after,
.authcard h1::after {
  inset: -14px -18px;
  background: 
    radial-gradient(circle 1.5px at 30% 30%, rgba(57, 255, 20, 0.9) 0%, transparent 100%),
    radial-gradient(circle 1px at 70% 40%, rgba(199, 125, 255, 0.8) 0%, transparent 100%),
    radial-gradient(circle 1.2px at 50% 10%, rgba(57, 255, 20, 0.9) 0%, transparent 100%),
    radial-gradient(circle 1.5px at 20% 60%, rgba(199, 125, 255, 0.8) 0%, transparent 100%),
    radial-gradient(circle 1px at 80% 80%, rgba(57, 255, 20, 0.9) 0%, transparent 100%);
  animation: floatDust 3.5s linear infinite;
  z-index: 2;
}

@keyframes slimeSparkle {
  0% { opacity: 0.5; filter: drop-shadow(0 0 2px var(--foil1)); transform: scale(0.98); }
  100% { opacity: 1; filter: drop-shadow(0 0 8px var(--gold)); transform: scale(1.02); }
}

@keyframes floatDust {
  0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
  50% { transform: translateY(-5px) translateX(3px); opacity: 0.9; }
  100% { transform: translateY(-10px) translateX(-2px); opacity: 0.3; }
}

.brand span{color:var(--muted);font-size:11px;display:block;letter-spacing:0.12em;text-transform:uppercase;margin-top:2px;}

.balance{
  background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:8px 16px;display:flex;align-items:center;gap:10px;
  justify-self:end;
  grid-column: 3;
  white-space:nowrap;
  flex-wrap:nowrap;
}
.balance .tick{color:var(--muted);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;}
.balance .val{
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;color:var(--gold);
}
.cta-account-row{
  display:flex;justify-content:center;max-width:920px;margin:0 auto 24px;
}
.cta-account-link{
  background:transparent;
  border:none;
  color:var(--foil2);
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:12px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  text-decoration:none;
  cursor:pointer;
  padding:4px;
}
.cta-account-link:hover{text-shadow:0 0 8px rgba(157,78,221,0.6);}

.navrow{display:flex;justify-content:center;gap:8px;max-width:920px;margin:0 auto 24px;flex-wrap:wrap;}
.navbtn{
  background:transparent;border:1px solid var(--line);color:var(--muted);
  padding:8px 16px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:600;
  transition:all .15s;
}
.navbtn.active{background:var(--surface2);color:var(--text);border-color:var(--foil1);}
.navbtn:hover{color:var(--text);}

.wrap{max-width:920px;margin:0 auto;}

/* ---------- store ---------- */
.section-label{font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px;}
.packgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;}
.packcard{
  background:linear-gradient(160deg,var(--surface),var(--surface2));
  border:1px solid var(--line);border-radius:16px;padding:20px;
  position:relative;overflow:hidden;cursor:pointer;transition:transform .18s,border-color .18s;
}
.packcard:hover{transform:translateY(-3px);border-color:var(--foil1);}
.packcard::after{
  content:'';position:absolute;inset:0;opacity:0.08;pointer-events:none;
  background:var(--pack-glow,linear-gradient(135deg,var(--foil1),var(--foil2)));
}
/* Only the shop tiles get the two-column layout - .packcard is also the vault's
   card tile, so the class itself must keep its original block behaviour. */
.packcard.shop{display:flex;align-items:center;gap:16px;}
.packcard.shop .pack-info{flex:1;min-width:0;}
/* The pack and its Open button share the right column, so the button reads as
   belonging to the pack rather than floating beside the price. */
.pack-mini{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:12px;}
.pack-mini .buybtn{width:100%;}
/* The mini wrapper reuses .pack-visual wholesale, so themes, crimp and symbol
   colours follow automatically. Only the geometry changes - and because the
   420px rule scales var(--pack-w), the mini shrinks on phones for free. */
.pack-visual.mini{
  --pack-w:60px;--pack-h:106px;--lift:2.8px;
  cursor:inherit;filter:drop-shadow(0 6px 14px rgba(0,0,0,0.6));
}
.pack-visual.mini .pack-top{height:calc(var(--crimp) + 11px);}
.pack-visual.mini .pack-top::before,.pack-visual.mini .pack-body::before{
  height:calc(var(--crimp) + 4px);
}
.pack-visual.mini .sym{padding:6% 0;}
.pack-visual.mini .sym svg{
  width:74%;stroke-width:3.2;
  filter:drop-shadow(0 0 3px currentColor) drop-shadow(0 0 7px currentColor);
}
/* The dashed guide says "rip here", which is meaningless on a shop tile - you
   tap Open, you do not tear this one. It only appears on the opening overlay. */
.pack-visual.mini .tear{display:none;}

.pack-name{font-family:'VT323',monospace;font-weight:400;font-size:19px;margin:0 0 4px;}
.pack-desc{color:var(--muted);font-size:12.5px;margin:0 0 14px;line-height:1.4;min-height:34px;}
.pack-odds{font-size:11px;color:var(--muted);margin-bottom:14px;line-height:1.6;}
.pack-odds b{color:var(--text);}
.pack-price{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;flex-wrap:wrap;
}
.price-tag{
  font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--gold);font-size:16px;
}
.buybtn{
  background:var(--foil2);color:#fff;border:none;border-radius:8px;
  padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer;
  box-shadow:0 0 10px rgba(157,78,221,0.4);
}
.buybtn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;box-shadow:none;}
.sellbtn{
  background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:8px;
  padding:8px 12px;font-weight:700;font-size:12px;cursor:pointer;
}
.sellbtn:hover{background:rgba(199,125,255,0.1);}

/* ---------- pack theme variants ---------- */
:root{
  --luxe-gold:#d4af37;
  --luxe-gold2:#f5cf6b;
}

/* Basic Pack - black / slime green */
.packcard.theme-basic{background:linear-gradient(160deg,#050605,#0b0f0a);border-color:var(--foil1);}
.packcard.theme-basic:hover{border-color:var(--foil1);box-shadow:0 0 16px rgba(57,255,20,0.25);}
.packcard.theme-basic .pack-name{color:var(--foil1);text-shadow:0 0 6px rgba(57,255,20,0.5);}
.packcard.theme-basic::after{background:linear-gradient(135deg,var(--foil1),#0a0a0a);opacity:0.12;}

.pack-visual.theme-basic{--edge:var(--foil1);}
.pack-visual.theme-basic .pack-top,.pack-visual.theme-basic .pack-body{background:linear-gradient(160deg,#050605,#0b0f0a);}
.pack-visual.theme-basic .sym{color:var(--foil1);}
.pack-visual.theme-basic .mark{color:var(--foil1);text-shadow:0 0 8px rgba(57,255,20,0.6);}

.card-back.theme-basic{background:repeating-linear-gradient(45deg,#050505,#050505 8px,#150a24 8px,#150a24 16px);}
.card-back.theme-basic span{color:var(--foil1);}

/* Whale Vault - gold luxury */
.packcard.theme-whale{background:linear-gradient(160deg,#1a1408,#0d0a04);border-color:var(--luxe-gold);}
.packcard.theme-whale:hover{border-color:var(--luxe-gold2);box-shadow:0 0 18px rgba(212,175,55,0.35);}
.packcard.theme-whale .pack-name{color:var(--luxe-gold2);text-shadow:0 0 8px rgba(212,175,55,0.6);}
.packcard.theme-whale::after{background:linear-gradient(135deg,var(--luxe-gold),var(--luxe-gold2));opacity:0.14;}

.pack-visual.theme-whale{--edge:var(--luxe-gold);}
.pack-visual.theme-whale .pack-top,.pack-visual.theme-whale .pack-body{background:linear-gradient(160deg,#1a1408,#0d0a04);}
.pack-visual.theme-whale .sym{color:var(--luxe-gold2);}
.pack-visual.theme-whale .mark{color:var(--luxe-gold2);text-shadow:0 0 10px rgba(212,175,55,0.7);}

.card-back.theme-whale{background:repeating-linear-gradient(45deg,#1a1408,#1a1408 8px,#0d0a04 8px,#0d0a04 16px);}
.card-back.theme-whale span{color:var(--luxe-gold2);text-shadow:0 0 6px rgba(212,175,55,0.6);}

/* Diamond Pack - white/light-grey border instead of the default green */
.packcard.theme-diamond:hover{border-color:#e6e6e6;box-shadow:0 0 16px rgba(230,230,230,0.25);}
.pack-visual.theme-diamond{--edge:#e6e6e6;}
.pack-visual.theme-diamond .sym{color:#e6e6e6;}

/* ---------- dex ---------- */
.dexhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:12px;}
.dexhead-left{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;}
.dexhead-left h2{font-family:'VT323',monospace;font-size:26px;margin:0;letter-spacing:0.03em;text-transform:uppercase;}
.dexcount{color:var(--muted);font-size:13px;}

/* Rarity Key Legend */
.rarity-key{
  display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:6px 12px;
}
.key-item{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);font-weight:500;}
.key-dot{width:8px;height:8px;border-radius:50%;background:var(--dot-color, var(--muted));}

.dexgrid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;
}
.dexslot{
  container-type:inline-size;
  aspect-ratio:3/4;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10px;color:var(--muted);position:relative;padding:4px;text-align:center;
}
/* The stats page reuses renderCardFace() with flipped=true, which would show
   the ALREADY OWNED badge. Suppressed here by scope rather than by threading a
   flag through renderCardFace, which is shared with the reveal path.
   display:none rather than visibility:hidden so it reclaims the reserved space. */
.stats-card-display{
  display:flex;flex-wrap:wrap;gap:28px;
  justify-content:center;align-items:flex-start;margin:20px 0 4px;
}
.stats-card-col{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  flex:0 1 auto;min-width:0;
}
/* placeholder sized to the card so an empty slot doesn't collapse the row and
   drag the filled card off-centre */
.stats-card-empty{
  width:130px;min-height:180px;display:flex;align-items:center;justify-content:center;
  text-align:center;color:var(--muted);font-size:11px;line-height:1.4;padding:0 8px;
  border:1px dashed var(--line);border-radius:12px;
}
.stats-card-display .already-owned-badge,
.detail-card-display .already-owned-badge{display:none;}
/* The pulsing outer glow on ultra/secret is a pack-opening moment. On the stats
   page and in the market detail modal the card sits static, so the aura is
   suppressed by scope rather than by conditioning renderCardFace, which the
   reveal path shares. The inner .shine sheen is a separate effect, left alone. */
.stats-card-display .flame-aura,
.detail-card-display .flame-aura{animation:none;box-shadow:none;}
.detail-card-display{display:flex;justify-content:center;}

.fav-toggle{
  align-self:center;display:flex;align-items:center;gap:6px;cursor:pointer;
  background:var(--surface2);border:1px solid var(--line);color:var(--muted);
  border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;
  letter-spacing:0.04em;text-transform:uppercase;
  transition:color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}
.fav-toggle .fav-star{font-size:15px;line-height:1;}
.fav-toggle:hover{color:gold;border-color:gold;}
.fav-toggle.on{color:gold;border-color:gold;box-shadow:0 0 8px rgba(255,215,0,0.35);}
.fav-toggle.on .fav-star{text-shadow:0 0 5px gold;}

/* favorite marker on the vault tile itself. sits left of the shiny star so a
   shiny favorite shows both without overlapping. */
.fav-tile-mark{
  position:absolute;top:6px;left:6px;color:gold;font-size:13px;
  text-shadow:0 0 5px gold;z-index:2;
}

/* Search hit highlight. Pulses in foil green rather than flashing once, so a
   card found behind a long scroll is still obviously marked when you reach it.
   Cleared by clearing the search. */
.packcard.search-hit{
  border-color:var(--foil1) !important;
  animation: searchPulse 1.4s ease-in-out infinite;
}
@keyframes searchPulse{
  0%,100%{ box-shadow:0 0 6px 1px rgba(57,255,20,0.35); }
  50%    { box-shadow:0 0 16px 5px rgba(57,255,20,0.75); }
}

/* P&L footer figures. Explicitly 2 or 4 columns - never 3. auto-fit with a
   minmax() was landing on 3 columns at phone widths, which orphans the 4th
   item exactly the way flex-wrap did. */
.pnl-stats{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:6px 14px;
  margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
  font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--muted);
}
@media (min-width: 721px){
  .pnl-stats{ grid-template-columns:repeat(4, minmax(0, 1fr)); }
}
.pnl-stats > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.backtotop-row{display:flex;justify-content:center;margin:24px 0 8px;}
.backtotop{
  display:flex;align-items:center;justify-content:center;
  width:40px;height:40px;padding:0;border-radius:10px;cursor:pointer;
  background:var(--surface2);border:1px solid var(--foil1);color:var(--foil1);
  box-shadow:0 0 8px rgba(57,255,20,0.35);
  transition:box-shadow 0.15s ease, transform 0.15s ease;
}
.backtotop:hover{box-shadow:0 0 14px rgba(57,255,20,0.6);transform:translateY(-2px);}
.stat-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px;
}
.stat-row:last-child{border-bottom:none;}
.dexslot.owned{border-color:var(--slot-color,var(--rare));background:var(--surface2);color:var(--text);}
.dexslot .num{position:absolute;top:4px;left:6px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);}
.dexslot .glyph{
  width:70cqw;height:70cqw;border-radius:0;margin-bottom:3px;
  background:transparent;display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.dexslot .glyph img{
  width:100%;height:100%;object-fit:contain;image-rendering:pixelated;
}
.dexslot .nm{
  font-weight:600;line-height:1.15;
  /* The global rule further down sets overflow-wrap:anywhere on .nm, for uids
     and long HEX values. On a dex tile that splits a species name mid-word -
     "Charmande" / "r". break-word only breaks a word that cannot fit at all. */
  overflow-wrap:break-word;
  hyphens:auto;
  /* Fallback for browsers without container queries. */
  font-size:9px;
  /* Scale with the TILE, not the viewport. A fixed px size is fragile here:
     the same 72px tile renders names wider on some devices (text scaling, or
     the webfont failing to load and falling back to a wider system mono), so
     10-char names like Charmander wrapped on one phone and fitted on another
     at identical column counts. 11cqw keeps the longest name on one line at
     every tile width, and the clamp stops it becoming illegible or oversized. */
  font-size:clamp(6.5px, 12.5cqw, 10px);
}
.dexslot .cnt{font-size:9px;margin-top:2px;color:var(--muted);}
/* Badge progress bar. Sits inside the tile rather than under it so the grid
   keeps a uniform aspect-ratio. Height is fixed px, not cqw: at 2px a
   container-relative height rounds to 0 on narrow tiles and the bar vanishes. */
.badgeslot .badgebar{
  width:78%;height:3px;margin-top:4px;border-radius:2px;
  background:var(--line);overflow:hidden;
}
.badgeslot .badgebar i{display:block;height:100%;border-radius:2px;}
/* Difficulty stars mirror .num in the opposite corner. Same 9px/absolute
   treatment so the two corner labels read as a pair. letter-spacing is
   negative because three stars at default tracking overrun a narrow tile. */
.badgeslot .diff{
  position:absolute;top:4px;right:6px;
  font-size:9px;line-height:1;color:var(--muted);letter-spacing:-0.5px;
}
.badgeslot.owned .diff{color:var(--slot-color);}
/* ELECTRIC (8 chars) is a Champion badge, so it carries three stars: at a fixed
   9px that pair needs 62.4px inside a 60px tile on mobile and the two corner
   labels overlap. Scale with the tile the way .nm does. */
.badgeslot .num{font-size:clamp(6.5px, 10cqw, 9px);}

/* ---------- opening overlay ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(6,6,14,0.94);backdrop-filter:blur(6px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:50;padding:20px;
}
.pack-stage{display:flex;flex-direction:column;align-items:center;gap:22px;}
/* sheenmove is still used by the LCD glass sheen further down; the pack's own
   sheen was dropped but this keyframe must stay. */
@keyframes sheenmove{0%{background-position:0% 0%;}100%{background-position:100% 100%;}}

/* The pack is a crimped foil wrapper in two pieces, so the top can tear away.
   .pack-visual is a FRAME only - no background, no border, no overflow:hidden.
   The outer shadow is a drop-shadow filter so it follows the toothed
   silhouette instead of a rectangle. Themes paint .pack-top/.pack-body. */
.pack-visual{
  container-type:inline-size;
  width:var(--pack-w);height:var(--pack-h);position:relative;cursor:pointer;
  display:flex;flex-direction:column;
  filter:drop-shadow(0 18px 34px rgba(0,0,0,0.75));
}
.pack-top,.pack-body{
  position:relative;overflow:hidden;
  background:linear-gradient(160deg,#1a1a36,#0d0d1e);
  /* An inset ring cannot follow a masked edge - the mask cuts it away and the
     teeth end up unlined. The crimp instead reads as a PRESSED FOIL BAND that
     the teeth are cut out of; the theme line survives on the left and right,
     which the mask never touches. */
  border-left:1px solid var(--edge);
  border-right:1px solid var(--edge);
}
.pack-top::before,.pack-body::before{
  z-index:1;content:'';position:absolute;left:0;right:0;
  height:calc(var(--crimp) + var(--band));
  background:
    /* pressed ridges running across the crimp, one per tooth so the ribs line
       up with the zigzag instead of drifting against it */
    repeating-linear-gradient(90deg,
      rgba(255,255,255,0.085) 0 0.5px,
      transparent 0.5px calc(var(--tooth)/3),
      rgba(0,0,0,0.22) calc(var(--tooth)/3) calc(var(--tooth)/3 + 0.5px),
      transparent calc(var(--tooth)/3 + 0.5px) calc(var(--tooth)/1.5)),
    color-mix(in srgb,var(--edge) 26%,transparent);
  pointer-events:none;
}
.pack-top::before{top:0;box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--edge) 55%,transparent);}
.pack-body::before{bottom:0;box-shadow:inset 0 1px 0 color-mix(in srgb,var(--edge) 55%,transparent);}

/* teeth cut into the top edge of the top piece. A conic-gradient mask keeps the
   teeth a fixed pixel size, so the crimp does not shrink at the mobile size the
   way a percentage clip-path would. */
.pack-top{
  height:calc(var(--crimp) + 30px);
  -webkit-mask:
    repeating-conic-gradient(from -45deg at bottom,#0000 0deg 90deg,#000 90deg 180deg)
      top left/var(--tooth) var(--crimp) repeat-x,
    linear-gradient(#000,#000) bottom left/100% calc(100% - var(--crimp)) no-repeat;
  mask:
    repeating-conic-gradient(from -45deg at bottom,#0000 0deg 90deg,#000 90deg 180deg)
      top left/var(--tooth) var(--crimp) repeat-x,
    linear-gradient(#000,#000) bottom left/100% calc(100% - var(--crimp)) no-repeat;
}
.pack-body{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  -webkit-mask:
    repeating-conic-gradient(from 135deg at top,#0000 0deg 90deg,#000 90deg 180deg)
      bottom left/var(--tooth) var(--crimp) repeat-x,
    linear-gradient(#000,#000) top left/100% calc(100% - var(--crimp)) no-repeat;
  mask:
    repeating-conic-gradient(from 135deg at top,#0000 0deg 90deg,#000 90deg 180deg)
      bottom left/var(--tooth) var(--crimp) repeat-x,
    linear-gradient(#000,#000) top left/100% calc(100% - var(--crimp)) no-repeat;
}

/* A dashed "tear here" guide in the buy-button purple. The glow is a filter,
   not a box-shadow, so it follows each dash instead of haloing the whole strip
   into one solid bar and filling the gaps back in. */
.pack-visual .tear{
  height:var(--seam);position:relative;z-index:3;background:transparent;
  background-image:repeating-linear-gradient(90deg,
    var(--foil2) 0 var(--dash), transparent var(--dash) calc(var(--dash) + var(--gap)));
  animation:tearpulse 1.9s ease-in-out infinite;
}
@keyframes tearpulse{
  0%,100%{filter:drop-shadow(0 0 3px rgba(157,78,221,0.7));opacity:0.72;}
  50%    {filter:drop-shadow(0 0 9px rgba(157,78,221,1)) drop-shadow(0 0 3px rgba(157,78,221,0.9));opacity:1;}
}

/* The pack should read as STUFFED. All of this is percentage-based so it holds
   at the overlay size, the 82% mobile size and the 60px shop mini alike:
   .bulge paints the shadow gutters where the foil wraps around the stack and
   the creases above and below it; .bulge::before is the card block itself,
   pressing a soft shadow into the foil around it with a highlight along its
   top edge. It is a separate element rather than a ::after on .pack-body,
   because .pack-body::after is taken by the torn-fibre line during the rip. */
.pack-visual .bulge{
  position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(118% 66% at 50% 45%, rgba(255,255,255,0.085) 0%, rgba(255,255,255,0.035) 46%, transparent 72%),
    linear-gradient(90deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 14%, rgba(0,0,0,0) 86%, rgba(0,0,0,0.5) 100%),
    linear-gradient(180deg, rgba(0,0,0,var(--creaseA,0.42)) 0%, rgba(0,0,0,0) 13%, rgba(0,0,0,0) 85%, rgba(0,0,0,0.48) 100%);
}
.pack-visual .bulge::before{
  content:'';position:absolute;left:8%;right:8%;top:17%;bottom:6%;
  /* uneven corners - foil pulled over a stack does not wrap to a clean radius */
  border-radius:7px 5px 8px 6px;
  /* A tight shadow rather than a soft one: the foil is STRAINED over the stack,
     so it pinches hard at the block edge instead of fading smoothly into it. */
  /* FIVE cards. The front card is this block and sits LOWEST; the four behind
     it are negative-Y copies rising above it, each a dark edge with a lit lip.
     Zero blur is what makes them read as discrete cards, not a gradient. */
  /* Every offset is a multiple of --lift. Hardcoded pixels made the stack look
     right at 152px and far too loose on the 60px shop mini - the block is sized
     in percentages, so the gaps between cards have to scale with it too. */
  box-shadow:
    0 calc(var(--lift)*-1) 0 rgba(0,0,0,0.55),    0 calc(var(--lift)*-0.47) 0 rgba(255,255,255,0.14),
    0 calc(var(--lift)*-2) 0 rgba(0,0,0,0.55),    0 calc(var(--lift)*-1.47) 0 rgba(255,255,255,0.13),
    0 calc(var(--lift)*-3) 0 rgba(0,0,0,0.55),    0 calc(var(--lift)*-2.47) 0 rgba(255,255,255,0.12),
    0 calc(var(--lift)*-4) 0 rgba(0,0,0,0.55),    0 calc(var(--lift)*-3.47) 0 rgba(255,255,255,0.11),
    0 calc(var(--lift)*-1.3) calc(var(--lift)*2.7) 1px rgba(0,0,0,0.55),
    0 calc(var(--lift)*-0.7) calc(var(--lift)*5.3) calc(var(--lift)*2) rgba(0,0,0,0.32),
    inset 0 1px 0 rgba(255,255,255,0.1),
    inset 0 -2px 3px rgba(0,0,0,0.4);
  background:radial-gradient(90% 60% at 50% 40%, rgba(255,255,255,0.055), transparent 70%);
}
/* Vacuum strain. Creases in shrink-wrap radiate OUT from the object, so these
   are spokes from the stack's centre rather than parallel wrinkles. The mask
   holds them off the stack itself - the foil is tight there and only creases
   in the slack around it. */
.pack-visual .bulge::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-conic-gradient(from 4deg at 50% 42%,
    transparent 0 3.4deg,
    rgba(255,255,255,0.055) 3.4deg 4deg,
    transparent 4deg 6.8deg,
    rgba(0,0,0,0.16) 6.8deg 7.3deg,
    transparent 7.3deg 11deg);
  /* The creases are SHORT - they only pull in the tight band of foil right
     around the stack, then die out. A mask band, not a fade to the pack edge. */
  -webkit-mask:radial-gradient(66% 52% at 50% 42%,
    transparent 0 64%, #000 74%, #000 84%, transparent 96%);
  mask:radial-gradient(66% 52% at 50% 42%,
    transparent 0 64%, #000 74%, #000 84%, transparent 96%);
  mix-blend-mode:overlay;opacity:0.95;
}

/* Pack symbols are inline SVG in the markup rather than data-URI backgrounds,
   because the stroke has to follow the theme colour - currentColor stops at the
   edge of a data-URI, which would mean three hardcoded copies of the palette. */
.pack-visual .sym{
  flex:1;display:flex;align-items:center;justify-content:center;
  width:100%;min-height:0;padding:8% 0 2%;z-index:2;position:relative;
}
.pack-visual .sym svg{
  width:68%;height:auto;overflow:visible;
  fill:none;stroke:currentColor;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 5px currentColor) drop-shadow(0 0 12px currentColor);
  opacity:0.92;
}

/* Sized in cqw against the pack's own width, so the name fits on one line at
   any pack size or viewport; a fixed px size wraps "Diamond Pack" the moment
   the pack narrows. Side padding is a percentage so the clear margin scales
   with the pack instead of collapsing, and leaves room for the glow. */
.pack-visual .mark{
  font-family:'VT323',monospace;
  font-weight:400;
  font-size:9.5cqw;
  line-height:1;
  white-space:nowrap;
  color:var(--text);
  letter-spacing:0.04em;
  z-index:2;
  position:relative;
  text-align:center;
  padding:0 10% calc(var(--crimp) + var(--band) + 7px);
}

/* ---- the rip ----
   A repeating zigzag reads as a machine cut, not a tear - it has a period. The
   torn edge is ONE hand-irregular polyline drawn as an SVG mask: a shallow,
   mostly-clean tear with occasional deeper pulls and notches, no period. Both
   pieces mask against the SAME polyline from opposite sides, so they would
   still fit back together, and a pale line traces the exposed fibres. */
.pack-visual.ripping .pack-top{
  -webkit-mask:
    repeating-conic-gradient(from -45deg at bottom,#0000 0deg 90deg,#000 90deg 180deg)
      top left/var(--tooth) var(--crimp) repeat-x,
    linear-gradient(#000,#000) left 0 top var(--crimp)/100% calc(100% - var(--crimp) - var(--rag)) no-repeat,
    var(--tear-top) bottom left/100% var(--rag) no-repeat;
  mask:
    repeating-conic-gradient(from -45deg at bottom,#0000 0deg 90deg,#000 90deg 180deg)
      top left/var(--tooth) var(--crimp) repeat-x,
    linear-gradient(#000,#000) left 0 top var(--crimp)/100% calc(100% - var(--crimp) - var(--rag)) no-repeat,
    var(--tear-top) bottom left/100% var(--rag) no-repeat;
  animation:ripaway .62s cubic-bezier(.32,.06,.24,1) forwards;
  transform-origin:90% 100%;
}
.pack-visual.ripping .pack-body{
  -webkit-mask:
    var(--tear-bot) top left/100% var(--rag) no-repeat,
    linear-gradient(#000,#000) left 0 top var(--rag)/100% calc(100% - var(--rag) - var(--crimp)) no-repeat,
    repeating-conic-gradient(from 135deg at top,#0000 0deg 90deg,#000 90deg 180deg)
      bottom left/var(--tooth) var(--crimp) repeat-x;
  mask:
    var(--tear-bot) top left/100% var(--rag) no-repeat,
    linear-gradient(#000,#000) left 0 top var(--rag)/100% calc(100% - var(--rag) - var(--crimp)) no-repeat,
    repeating-conic-gradient(from 135deg at top,#0000 0deg 90deg,#000 90deg 180deg)
      bottom left/var(--tooth) var(--crimp) repeat-x;
  animation:ripjolt .62s ease-out;
}
.pack-visual.ripping .pack-top::after,.pack-visual.ripping .pack-body::after{
  content:'';position:absolute;left:0;right:0;height:var(--rag);z-index:5;pointer-events:none;
  background:var(--tear-line) center/100% 100% no-repeat;
  opacity:0.5;mix-blend-mode:screen;
}
.pack-visual.ripping .pack-top::after{bottom:0;}
.pack-visual.ripping .pack-body::after{top:0;}
@keyframes ripaway{
  0%   {transform:translate(0,0) rotate(0deg);opacity:1;}
  12%  {transform:translate(0,4px) rotate(0deg);opacity:1;}
  34%  {transform:translate(-4px,-6px) rotate(-5deg);opacity:1;}
  100% {transform:translate(-54px,-150px) rotate(-38deg);opacity:0;}
}
@keyframes ripjolt{
  0%{transform:translateY(0);}
  16%{transform:translateY(3px);}
  34%{transform:translateY(-4px) rotate(0.6deg);}
  55%{transform:translateY(2px) rotate(-0.3deg);}
  100%{transform:translateY(0);}
}
.pack-visual .flare{
  position:absolute;left:50%;top:0;transform:translate(-50%,-40%) scale(0.2);
  width:130%;aspect-ratio:1;border-radius:50%;opacity:0;z-index:1;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,0.95) 0%,var(--edge) 32%,transparent 68%);
}
.pack-visual.ripping .flare{animation:ripflare .62s ease-out forwards;}
@keyframes ripflare{
  0%  {opacity:0;transform:translate(-50%,-40%) scale(0.15);}
  30% {opacity:0.95;transform:translate(-50%,-40%) scale(0.75);}
  100%{opacity:0;transform:translate(-50%,-40%) scale(1.5);}
}
.pack-visual.ripping .tear{animation:tearsnap .3s ease-out forwards;}
@keyframes tearsnap{
  0%{opacity:1;filter:drop-shadow(0 0 16px rgba(157,78,221,1));}
  100%{opacity:0;filter:drop-shadow(0 0 0 rgba(157,78,221,0));}
}
.pack-visual.scrub{touch-action:none;user-select:none;-webkit-user-select:none;}
/* The black line was a real gap, not a shadow. .tear is a 1px element sitting
   IN FLOW between the two pieces, so the moment the top lifts you see straight
   through that 1px to the page behind. In scrub mode the guide is lifted out of
   flow and painted over the seam instead, so the pieces sit flush and there is
   nothing to see through. The -3px lift is gone for the same reason. */
.pack-visual.scrub .tear{
  position:absolute; left:0; right:0; height:var(--seam); z-index:4;
  top:calc(var(--crimp) + 30px);
}
.pack-visual.scrub .pack-body{margin-top:calc(var(--seam) * -1);}
/* The gesture zone: as wide as the pack plus half a pack either side, and only
   the top ~39% vertically - you tear across the top, not the belly.
   Binding this to the pack itself meant the drag had to BEGIN inside a 152px
   target, which is backwards; you start a tear beside the pack, not on it. */
.packwrap{position:relative;}
.tearzone{
  position:absolute; left:-50%; width:200%; top:0; height:39%;
  z-index:10; touch-action:none; user-select:none; -webkit-user-select:none;
}

/* --p is tear progress 0..1, driven by the drag. The torn edge exists only in
   the swept region; the rest of the seam is still intact, which is what makes
   this a scrub rather than a play/not-play animation. */
.pack-visual.scrub .pack-top{
  --swept:calc(var(--p) * 100%);
  --left:calc((1 - var(--p)) * 100%);
  -webkit-mask:
    repeating-conic-gradient(from -45deg at bottom,#0000 0deg 90deg,#000 90deg 180deg)
      top left/var(--tooth) var(--crimp) repeat-x,
    linear-gradient(#000,#000) left 0 top var(--crimp)/100% calc(100% - var(--crimp) - var(--rag)) no-repeat,
    var(--tear-top) bottom left/var(--swept) var(--rag) no-repeat,
    linear-gradient(#000,#000) bottom right/var(--left) var(--rag) no-repeat;
  mask:
    repeating-conic-gradient(from -45deg at bottom,#0000 0deg 90deg,#000 90deg 180deg)
      top left/var(--tooth) var(--crimp) repeat-x,
    linear-gradient(#000,#000) left 0 top var(--crimp)/100% calc(100% - var(--crimp) - var(--rag)) no-repeat,
    var(--tear-top) bottom left/var(--swept) var(--rag) no-repeat,
    linear-gradient(#000,#000) bottom right/var(--left) var(--rag) no-repeat;
  transform-origin:100% 100%;
  transform:rotate(calc(var(--p) * -13deg));
  animation:none;
}
.pack-visual.scrub.rtl .pack-top{
  -webkit-mask:
    repeating-conic-gradient(from -45deg at bottom,#0000 0deg 90deg,#000 90deg 180deg)
      top left/var(--tooth) var(--crimp) repeat-x,
    linear-gradient(#000,#000) left 0 top var(--crimp)/100% calc(100% - var(--crimp) - var(--rag)) no-repeat,
    var(--tear-top) bottom right/var(--swept) var(--rag) no-repeat,
    linear-gradient(#000,#000) bottom left/var(--left) var(--rag) no-repeat;
  mask:
    repeating-conic-gradient(from -45deg at bottom,#0000 0deg 90deg,#000 90deg 180deg)
      top left/var(--tooth) var(--crimp) repeat-x,
    linear-gradient(#000,#000) left 0 top var(--crimp)/100% calc(100% - var(--crimp) - var(--rag)) no-repeat,
    var(--tear-top) bottom right/var(--swept) var(--rag) no-repeat,
    linear-gradient(#000,#000) bottom left/var(--left) var(--rag) no-repeat;
  transform-origin:0 100%;
  transform:rotate(calc(var(--p) * 13deg));
}
/* While tearing, the BODY keeps a straight, solid top edge. Cutting its torn
   edge in at the same time opened a wedge of nothing between the two pieces -
   physically right, but on screen that void is just the page showing through,
   which is the black line. The body only gets its ragged edge once the top has
   actually FLOWN - not when it starts to. On a tap the tear jumps to 100% while
   the piece is still in place, so switching the body at the same moment left
   both edges ragged with nothing between them: the same black line, visible
   only on tap because a drag has already rotated the piece clear. */
.pack-visual.scrub .pack-body{
  -webkit-mask:
    linear-gradient(#000,#000) top left/100% calc(100% - var(--crimp)) no-repeat,
    repeating-conic-gradient(from 135deg at top,#0000 0deg 90deg,#000 90deg 180deg)
      bottom left/var(--tooth) var(--crimp) repeat-x;
  mask:
    linear-gradient(#000,#000) top left/100% calc(100% - var(--crimp)) no-repeat,
    repeating-conic-gradient(from 135deg at top,#0000 0deg 90deg,#000 90deg 180deg)
      bottom left/var(--tooth) var(--crimp) repeat-x;
  animation:none;
}
/* The top crease of the stuffing is a hard dark edge meant to sit BEHIND the
   top piece - the foil creasing over the stack. Once the top flies off it is
   exposed, so it goes when the pack opens. */
.pack-visual.scrub.gone .bulge{--creaseA:0;}
.pack-visual.scrub.torn .pack-body::after{
  content:'';position:absolute;left:0;right:0;top:0;height:10px;z-index:6;
  pointer-events:none;
  background:var(--tear-line2) center/100% 100% no-repeat;
  opacity:0.7;mix-blend-mode:screen;
}
/* The body's ragged edge. At 3px against the shallow main polyline the teeth
   were under a pixel deep - a clean line, which is what you saw. This uses a
   MUCH more jagged polyline of its own (deep pulls and notches, not gentle
   wander) at 8px, with the fibres traced over it so the notches read as torn
   material rather than as holes punched in the page. */
.pack-visual.scrub.torn .pack-body{
  --rag:10px;
  --tear-bot:var(--tear-bot2);
  -webkit-mask:
    var(--tear-bot) top left/100% var(--rag) no-repeat,
    linear-gradient(#000,#000) left 0 top var(--rag)/100% calc(100% - var(--rag) - var(--crimp)) no-repeat,
    repeating-conic-gradient(from 135deg at top,#0000 0deg 90deg,#000 90deg 180deg)
      bottom left/var(--tooth) var(--crimp) repeat-x;
  mask:
    var(--tear-bot) top left/100% var(--rag) no-repeat,
    linear-gradient(#000,#000) left 0 top var(--rag)/100% calc(100% - var(--rag) - var(--crimp)) no-repeat,
    repeating-conic-gradient(from 135deg at top,#0000 0deg 90deg,#000 90deg 180deg)
      bottom left/var(--tooth) var(--crimp) repeat-x;
}

/* spring back when released short of the threshold */
.pack-visual.scrub.settling .pack-top,
.pack-visual.scrub.settling .pack-body{transition:transform .28s cubic-bezier(.2,.9,.3,1);}
.pack-visual.scrub.settling{transition:none;}
.pack-visual.scrub.gone .pack-top{
  transition:transform .34s cubic-bezier(.3,.05,.25,1), opacity .34s ease;
  transform:translate(calc(var(--dir) * 46px), -140px) rotate(calc(var(--dir) * -36deg));
  opacity:0;
}
.pack-visual.scrub .flare{opacity:calc(var(--p) * 0.9);transform:translate(-50%,-40%) scale(calc(0.3 + var(--p)*0.8));animation:none;}
.pack-visual.scrub .tear{opacity:calc(1 - var(--p));}

@media (prefers-reduced-motion:reduce){
  .pack-visual .tear{animation:none;opacity:0.9;}
  .pack-visual.ripping .pack-top{animation-duration:.01s;}
  .pack-visual.ripping .pack-body,.pack-visual.ripping .flare{animation:none;}
}
.pack-hint{color:var(--muted);font-size:13px;letter-spacing:0.04em;text-align:center;}

/* Wrapper is rendered for every card from the moment the pack opens, and the
   selling ring uses outline rather than border+padding. Both matter: a wrapper
   that appears only once all cards are flipped, or a border that adds 10px of
   width, reflows the whole row at the exact moment the cards should hold still.
   Outlines are painted outside the box and never affect layout. */
.sell-mark{
  display:flex;flex-direction:column;align-items:center;
  border-radius:14px;
  transition:opacity 0.15s ease, filter 0.15s ease;
}
.sell-mark.selling{
  opacity:0.55;filter:grayscale(0.6);
  outline:2px solid #ff4444;outline-offset:2px;
}
.sell-tag{
  font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;
  letter-spacing:0.05em;text-transform:uppercase;text-align:center;
  margin-top:3px;height:12px;
}

.reveal-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:900px;}
.card-slot-wrapper{display:flex;flex-direction:column;align-items:center;gap:4px;}
.already-owned-badge{
  font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:var(--gold);
  background:rgba(199,125,255,0.15);border:1px solid var(--gold);padding:2px 6px;border-radius:4px;
  letter-spacing:0.05em;text-transform:uppercase;height:18px;display:flex;align-items:center;
}
.card-slot{perspective:900px;width:130px;height:180px;container-type:inline-size;}
.card-inner{
  position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.3,.9,.4,1);cursor:pointer;
}
.card-slot.flipped .card-inner{transform:rotateY(180deg);}
.card-face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;
  display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);
}
.card-back{
  background:repeating-linear-gradient(45deg,#161630,#161630 8px,#1c1c38 8px,#1c1c38 16px);
  display:flex;align-items:center;justify-content:center;
}
.card-back span{font-family:'VT323',monospace;font-weight:400;color:var(--foil1);font-size:13px;letter-spacing:0.1em;opacity:0.8;}

/* ---------- card back shelf (shop) ---------- */
/* Tiles are full card size so the swatch IS the preview - no separate
   preview mode to get out of sync with the real reveal. */
.cbshelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,max-content));gap:16px;justify-content:center;margin-bottom:26px;}
.cbtile{display:flex;flex-direction:column;align-items:center;gap:6px;width:130px;}
.cb-swatch{
  width:130px;height:180px;border-radius:12px;border:1px solid var(--line);
  overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;
}
/* Locked backs render at full strength: the price, the button label and the
   absence of the equipped outline already carry the state, and dimming the
   expensive art defeats the point of a full-size preview. */
.cbtile.equipped .cb-swatch{outline:2px solid var(--foil1);outline-offset:2px;}
.cb-price{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);}
.cb-btn{
  font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:5px 10px;border-radius:6px;
  border:1px solid var(--line);background:var(--surface2);color:var(--text);cursor:pointer;
  min-height:30px;width:100%;
}
.cb-btn:disabled{opacity:0.45;cursor:not-allowed;}
.cb-btn.buy{border-color:var(--gold);color:var(--gold);}
.cb-btn.equip{border-color:var(--foil1);color:var(--foil1);}
.cb-btn.on{background:var(--foil1);color:#05100a;border-color:var(--foil1);}

/* --- individual backs. back-* only, never theme-* --- */
/* All art is layered on ::before/::after inside the face. Sizes are in % so a
   back reads the same at 130x180 (shop tile), at card size, and at 46x64
   (profile swatch). Ladder is expressed as MOTION AND DEPTH, not density:
   cheap = static and flat, expensive = alive. */
/* No `position` here: .card-face is already absolute in the reveal, and the
   shop swatch relies on .cb-swatch's position:relative winning at equal
   specificity. An attribute selector (0,2,0) would outrank it and collapse
   every tile. Both contexts are already positioned, so ::before/::after
   anchor correctly either way. */
.card-back[class*="back-"]{overflow:hidden;isolation:isolate;}
.card-back[class*="back-"]::before,
.card-back[class*="back-"]::after{content:'';position:absolute;inset:0;pointer-events:none;}

/* --- 60k Obsidian: static. Volcanic glass. Depth from layering only. --- */
.card-back.back-obsidian{
  background:
    radial-gradient(120% 80% at 30% 12%, #2c2740 0%, transparent 55%),
    linear-gradient(160deg,#14121d 0%,#07060b 60%,#100e18 100%);
}
.card-back.back-obsidian::before{
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 1px,transparent 1px 9px);
  opacity:.7;
}
.card-back.back-obsidian::after{
  background:radial-gradient(90% 60% at 50% 118%, rgba(150,130,255,.22), transparent 60%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
}

/* ---- PIXEL TECHNIQUE ----
   Hard-stop gradients only (no soft blends), px-quantised background-size, and
   steps() timing so motion advances frame-by-frame like a sprite sheet rather
   than sliding. image-rendering:pixelated keeps edges hard when the card is
   scaled down to the 46x64 profile swatch. */
.card-back[class*="back-"]{image-rendering:pixelated;}

/* --- 250k: matrix rain. Glyph columns, since gradients cannot draw
   characters. Each column is its own SVG strip with the head glyph at the
   bottom fading upward into the tail; tile height = glyphs x size so it
   loops seamlessly. Columns are split across two layers running at
   different durations and step counts so they never fall in unison. --- */

/* --- 100k: BRICK. Static pixel brickwork, offset courses. --- */
.card-back.back-bloom{
  background:#0e0a16;                                  /* mortar */
  background-image:repeating-linear-gradient(to bottom,#3b1f5c 0 14px,#0e0a16 14px 16px);
}
/* vertical mortar on even courses only, via a stepped mask */
.card-back.back-bloom::before{
  background-image:repeating-linear-gradient(to right,#0e0a16 0 2px,transparent 2px 32px);
  -webkit-mask-image:repeating-linear-gradient(to bottom,#000 0 16px,transparent 16px 32px);
          mask-image:repeating-linear-gradient(to bottom,#000 0 16px,transparent 16px 32px);
}
/* odd courses, offset half a brick */
.card-back.back-bloom::after{
  background-image:repeating-linear-gradient(to right,#0e0a16 0 2px,transparent 2px 32px);
  background-position:16px 0;
  -webkit-mask-image:repeating-linear-gradient(to bottom,transparent 0 16px,#000 16px 32px);
          mask-image:repeating-linear-gradient(to bottom,transparent 0 16px,#000 16px 32px);
  box-shadow:inset 0 0 0 1px rgba(57,255,20,.10), inset 0 34px 30px -30px rgba(157,78,221,.55);
}

/* --- 160k: FRAME. Gilt pixel frame around a moonlit landscape. Static. --- */
.card-back.back-circuit{
  background:#07090a;
  /* bevelled gold: light top-left, deep shadow bottom-right, hard steps */
  box-shadow:
    inset 0 0 0 2px  #6b4a12,
    inset 0 0 0 5px  #d9a441,
    inset 0 0 0 8px  #f3d98a,
    inset 0 0 0 11px #b8862b,
    inset 0 0 0 14px #6b4a12,
    inset 0 0 0 16px #f3d98a;
}
/* the picture: sky, moon, two ridgelines, ground */
.card-back.back-circuit::before{
  inset:18px;
  background-image:url("data:image/svg+xml,%3Csvg xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22 viewBox%3D%220 0 100 130%22 shape-rendering%3D%22crispEdges%22%3E%3Crect width%3D%22100%22 height%3D%22130%22 fill%3D%22%231b0f2e%22%2F%3E%3Crect y%3D%2255%22 width%3D%22100%22 height%3D%2275%22 fill%3D%22%232a1547%22%2F%3E%3Ccircle cx%3D%2272%22 cy%3D%2226%22 r%3D%2211%22 fill%3D%22%23f0d9ff%22%2F%3E%3Ccircle cx%3D%2266%22 cy%3D%2222%22 r%3D%2210%22 fill%3D%22%231b0f2e%22%2F%3E%3Cpolygon points%3D%220%2C92 26%2C44 52%2C92%22 fill%3D%22%2324123a%22%2F%3E%3Cpolygon points%3D%2234%2C92 62%2C38 90%2C92%22 fill%3D%22%231b3a23%22%2F%3E%3Cpolygon points%3D%2226%2C44 32%2C54 20%2C54%22 fill%3D%22%233d6b48%22%2F%3E%3Cpolygon points%3D%2262%2C38 69%2C50 55%2C50%22 fill%3D%22%234f8a5b%22%2F%3E%3Cpolygon points%3D%2270%2C92 100%2C58 100%2C92%22 fill%3D%22%2316301c%22%2F%3E%3Crect y%3D%2292%22 width%3D%22100%22 height%3D%2238%22 fill%3D%22%230a1a0e%22%2F%3E%3Crect y%3D%2292%22 width%3D%22100%22 height%3D%223%22 fill%3D%22%2316301c%22%2F%3E%3C%2Fsvg%3E");

2 transform%3D%22rotate(-22 109 165)%22%2F%3E%3Crect x%3D%22114%22 y%3D%22158%22 width%3D%223%22 height%3D%2214%22 fill%3D%22%238a8a76%22 transform%3D%22rotate(-22 115 165)%22%2F%3E%3Crect x%3D%22120%22 y%3D%22158%22 width%3D%223%22 height%3D%2214%22 fill%3D%22%238a8a76%22 transform%3D%22rotate(-22 121 165)%22%2F%3E%3C%2Fsvg%3E");

/* LCD content: blocky sprites ticking across the screen well */
.card-back.back-eclipse::before{
  inset:0;
  background-image:
    linear-gradient(#3d6b1f 0 0), linear-gradient(#2f4a1e 0 0), linear-gradient(#3d6b1f 0 0);
  background-size:5% 4%, 4% 3%, 3% 3%;
  background-position:31.6% 22.9%, 54.2% 30.9%, 68.0% 39.2%;
  background-repeat:no-repeat;
  animation:cb-lcd 1.2s steps(4) infinite;
}
/* LCD scanlines + glass sheen */
.card-back.back-eclipse::after{
  background-image:repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
  -webkit-mask-image:linear-gradient(#000 0 0);
          mask-image:linear-gradient(#000 0 0);
  /* LCD is x=24 y=26 w=82 h=58 in a 130x180 viewBox. Size is that rect as a
     % of the card; position solved with p = 100*d/(100-i). */
  -webkit-mask-size:63.08% 32.22%; mask-size:63.08% 32.22%;
  -webkit-mask-position:50.0% 21.3%; mask-position:50.0% 21.3%;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
}
@keyframes cb-lcd{ to{ background-position:40.0% 22.9%, 47.9% 30.9%, 61.9% 39.2%; } }

/* Five cards flip at once on a pack open. Honour the OS setting and freeze
   every back to its first frame - the art still reads, it just stops moving. */
@media (prefers-reduced-motion: reduce){
  .card-back[class*="back-"]::before,
  .card-back[class*="back-"]::after{animation:none !important;}
}
.card-front{
  transform:rotateY(180deg);
  background:linear-gradient(165deg,var(--surface2),var(--surface));
  border-width:2px;border-style:solid;border-color:var(--card-color,var(--common));
  padding:8px;justify-content:space-between;
}
.card-front.shine::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,0.35) 45%,rgba(57,255,20,0.4) 50%,rgba(157,78,221,0.35) 55%,transparent 70%);
  background-size:220% 220%;animation:sheenmove 2.4s linear infinite;
  mix-blend-mode:screen;
}

/* ---------- shiny palette swap ---------- */
/* Static hue rotation on the sprite itself - deliberately NOT animated, so it
   reads differently from .shine / .flame-aura used for high-value rarity tiers.
   Applies to pack-reveal card faces (.cf-glyph) and dex tiles (.glyph). */
.shiny-card .cf-glyph img,
.shiny-card .glyph img{
  filter: hue-rotate(var(--shiny-hue, 150deg)) saturate(1.25);
}

/* ---------- white sparkle overlay for shiny (1-in-4096) card variants ---------- */
/* Distinct from .shine (rarity-tier glow) so a shiny ultra/secret shows both */
.shiny-sparkle-overlay{
  position:absolute;inset:0;pointer-events:none;z-index:2;
  background-image:
    radial-gradient(circle, #fff 1px, transparent 1.5px),
    radial-gradient(circle, #fff 1px, transparent 1.5px),
    radial-gradient(circle, #fff 1.5px, transparent 2px),
    radial-gradient(circle, #fff 1px, transparent 1.5px);
  background-size: 40px 40px, 60px 60px, 80px 80px, 50px 50px;
  background-position: 10px 15px, 40px 60px, 70px 20px, 20px 80px;
  animation: shinytwinkle 1.8s ease-in-out infinite;
  mix-blend-mode:screen;
}
@keyframes shinytwinkle{
  0%,100%{ opacity:0.35; }
  50%{ opacity:0.95; }
}
/* Sparkle overlay scaled down for dex tiles (~84x112) so the sparkles land on
   the tile instead of mostly falling outside it. Same class, same animation,
   same 4-layer pattern at 0.7x. border-radius matches .dexslot because the
   tile has no overflow:hidden the way .card-face does. */
.dexslot .shiny-sparkle-overlay{
  border-radius:10px;
  background-size: 28px 28px, 42px 42px, 56px 56px, 35px 35px;
  background-position: 6px 10px, 28px 42px, 49px 14px, 14px 56px;
}

/* ---------- purple flame aura for ultra/secret tier cards ---------- */
.flame-aura{
  animation: flamePulse 1.6s ease-in-out infinite alternate;
}
@keyframes flamePulse{
  0%{ box-shadow: 0 0 8px 2px rgba(157,78,221,0.5), 0 0 20px 6px rgba(157,78,221,0.28); }
  100%{ box-shadow: 0 0 16px 5px rgba(199,125,255,0.85), 0 0 34px 12px rgba(157,78,221,0.55); }
}
.cf-top{display:flex;justify-content:space-between;align-items:center;font-size:9px;z-index:1;}
.cf-num{font-family:'JetBrains Mono',monospace;color:var(--muted);}
.cf-type{
  padding:2px 6px;border-radius:6px;font-weight:700;font-size:8px;text-transform:uppercase;
  color:#0b0b14;background:var(--type-color,#999);
}
.cf-glyph{
  width:68cqw;height:68cqw;border-radius:0;margin:0 auto;
  background:transparent;align-self:center;
  box-shadow:none;
  display:flex;align-items:center;justify-content:center;
  z-index:1;overflow:hidden;
}
.cf-glyph img{
  width:100%;height:100%;object-fit:contain;image-rendering:pixelated;
}
.cf-bottom{z-index:1;text-align:center;}
.cf-name{font-family:'VT323',monospace;font-weight:400;font-size:13px;}
.cf-rarity{font-size:8.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--card-color,var(--common));font-weight:700;}
.cf-value{
  font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--gold);margin-top:2px;
}

.summary-panel{
  margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:18px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:520px;
}
.summary-total{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--muted);}
.summary-total b{
  color:var(--gold);
}
.summary-actions{display:flex;gap:10px;}
.sbtn{border:none;border-radius:8px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;}
.sbtn.keep{background:var(--foil2);color:#fff;box-shadow:0 0 10px rgba(157,78,221,0.4);}
.sbtn.sell{background:var(--surface2);color:var(--gold);border:1px solid var(--gold);}
.closex{position:absolute;top:18px;right:22px;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  padding:10px 18px;font-size:13px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;
  color: var(--foil2);
}
.toast.show{opacity:1;}

.confetti{position:fixed;top:-10px;width:8px;height:8px;z-index:60;pointer-events:none;border-radius:2px;}

.footer-actions{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:34px;}
.reset-link{color:var(--muted);font-size:11px;background:none;border:none;cursor:pointer;text-decoration:underline;}

/* Maker's mark, sits between the reset link and the signature.
   No height set - renders at the PNG's native 34px. */
.sigil{
  align-self:center;
  opacity:0.85;
  filter:drop-shadow(0 0 4px rgba(57,255,20,0.55));
}

/* ---------- how to play ---------- */
.howto{max-width:680px;margin:0 auto;}
.howto p{color:var(--text);font-size:14px;line-height:1.65;margin:0 0 14px;}
.howto p.lead{color:var(--muted);}
.howto h3{
  font-family:'VT323',monospace;font-weight:400;font-size:22px;
  letter-spacing:0.06em;text-transform:uppercase;color:var(--foil1);
  text-shadow:0 0 8px rgba(57,255,20,0.45);
  margin:34px 0 4px;
}
.howto hr{border:none;border-top:1px solid var(--line);margin:30px 0;}
.howto strong{color:var(--foil2);font-weight:400;}
.howto em{color:var(--muted);font-style:italic;}
.howto-payout{
  border-left:2px solid var(--foil1);
  background:var(--surface2);
  padding:12px 16px;margin:0 0 14px;
  color:var(--text);font-size:14px;line-height:1.5;
}
.howto-tip{display:flex;gap:12px;margin:0 0 14px;align-items:baseline;}
.howto-tip .n{
  font-family:'VT323',monospace;font-size:20px;color:var(--foil1);
  flex:0 0 auto;min-width:18px;
}
.howto-sign{
  display:flex;justify-content:center;align-items:center;gap:14px;
  margin-top:38px;padding-top:22px;border-top:1px solid var(--line);
  color:var(--muted);font-size:12px;
}

/* ---------- vertical terminal wheel ---------- */
.wheel-overlay-stage{display:flex;flex-direction:column;align-items:center;gap:18px;}
.term-slot-frame{
  position:relative;width:280px;height:140px;background:var(--surface);
  border:2px solid var(--foil1);border-radius:12px;overflow:hidden;
  box-shadow:0 0 24px rgba(57,255,20,0.25), inset 0 0 16px rgba(0,0,0,0.8);
}
.term-slot-frame::before{
  content:'';position:absolute;top:0;left:0;right:0;height:45px;
  background:linear-gradient(to bottom, rgba(7,9,10,0.9), transparent);
  pointer-events:none;z-index:3;
}
.term-slot-frame::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:45px;
  background:linear-gradient(to top, rgba(7,9,10,0.9), transparent);
  pointer-events:none;z-index:3;
}
.term-pointer-line{
  position:absolute;top:50%;left:0;right:0;height:2px;margin-top:-1px;
  background:var(--foil1);box-shadow:0 0 8px var(--foil1);z-index:4;pointer-events:none;
}
.term-strip{
  position:absolute;top:0;left:0;width:100%;
  display:flex;flex-direction:column;align-items:center;
  will-change:transform;
}
.term-item{
  height:46px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--gold);
  letter-spacing:0.05em;border-bottom:1px dashed var(--line);
}
.spin-btn{
  background:var(--foil2);color:#fff;border:none;border-radius:8px;
  padding:12px 26px;font-weight:700;font-size:13px;cursor:pointer;font-family:'JetBrains Mono',monospace;
  box-shadow:0 0 12px rgba(157,78,221,0.4);
}
.spin-btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;box-shadow:none;}
.wheel-result{
  font-family:'JetBrains Mono',monospace;font-size:28px;color:var(--gold);
}

/* Slippage Warning Container and Items */
.slippage-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.slippage-notice {
  background: rgba(255, 170, 0, 0.08);
  border: 1px dashed #ffaa00;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 11.5px;
  color: #ffca66;
  display: flex;
  align-items: center;
  gap: 10px;
}
.slippage-notice div {
  flex: 1;
  line-height: 1.4;
  white-space: normal;
  word-wrap: break-word;
}

/* ---------- auth screen ---------- */
.authwrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:
    repeating-linear-gradient(to bottom, rgba(57,255,20,0.025) 0px, rgba(57,255,20,0.025) 1px, transparent 1px, transparent 3px),
    radial-gradient(circle at 50% -10%, #101a12 0%, var(--bg) 55%);
  color:var(--text);font-family:'JetBrains Mono',monospace;padding:20px;box-sizing:border-box;
}
.authcard{
  width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:28px 24px;text-align:center;
}
.authcard h1{font-size:36px;margin:0 auto 4px;text-align:center;}
.auth-hexmark{margin:0 auto 14px;}
.authcard p.sub{color:var(--muted);font-size:12px;text-align:center;margin:0 0 20px;}
.authfield{margin-bottom:12px;text-align:left;}
.authfield label{display:block;font-size:11px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px;}
.authfield input{
  width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:10px 12px;font-family:'JetBrains Mono',monospace;font-size:14px;
}
.authfield input:focus{outline:none;border-color:var(--foil1);}
.authbtn{
  width:100%;background:var(--foil2);color:#fff;border:none;border-radius:8px;
  padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;margin-top:6px;
  box-shadow:0 0 10px rgba(157,78,221,0.4);
}
.authbtn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;box-shadow:none;}
.authtoggle{
  background:transparent;border:none;color:var(--muted);font-size:12px;cursor:pointer;
  width:100%;text-align:center;margin-top:14px;text-decoration:underline;
}
.authmsg{font-size:12px;text-align:center;margin-top:12px;line-height:1.4;}
.authmsg.err{color:#ff6b6b;}
.authmsg.ok{color:var(--foil1);}
.signoutbtn-row{
  max-width:920px;
  margin:24px auto 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
/* The row renders even when signed out so the sound toggle is always reachable;
   space-between then puts it hard left with SIGN OUT on the right. */
.mutebtn{
  background:transparent;border:none;cursor:pointer;padding:4px 2px;
  color:var(--foil1);line-height:0;opacity:0.75;
}
.mutebtn:hover{opacity:1;filter:drop-shadow(0 0 6px rgba(57,255,20,0.6));}
.mutebtn svg{width:19px;height:19px;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.mutebtn.is-muted{color:var(--muted);}
.signoutbtn{
  display:inline-block;
  width:auto;

const SUPABASE_URL = 'https://tiqtsxlavdxswpqponsv.supabase.co';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- auth state & UI ----------
let authUser = null;      // current logged-in Supabase user, or null
let authMode = 'signin';  // 'signin' | 'signup'
let authBusy = false;
let authMsg = null;       // {type:'err'|'ok', text}
let needsUsername = false;
let pendingUsername = ''; // carried over from the signup form to prefill the gate
let usernameMsg = null;
let usernameCheckTimer = null;

// null = unknown, true = available, false = taken by someone else
async function isUsernameAvailable(username, forUserId){
  // case-insensitive, matching the lower(username) unique index server-side.
  // ilike treats '_' as a single-character wildcard in SQL, and usernames
  // are allowed to contain underscores - escape it so "dungeon_master"
  // only matches that exact string, not "dungeonXmaster" for any X
  const escaped = username.replace(/_/g, '\\_');
  const { data, error } = await sb.from('profiles').select('user_id').ilike('username', escaped).maybeSingle();
  if(error) return null;
  if(!data) return true;
  return data.user_id === forUserId;
}

async function saveUsername(username){
  const { error } = await sb.from('profiles').upsert({ user_id: authUser.id, username });
  return { ok: !error, error };
}

// The single place a profile row ever gets created or changed - used both
// for brand-new signups and for existing accounts that don't have a
// username yet. One code path means no risk of two competing inserts.
function renderUsernameGate(){
  const el = document.getElementById('app');
  el.innerHTML = `
    <div class="authwrap">
      <div class="authcard">
        <div class="brand-hexmark auth-hexmark"></div>
        <h1>Choose a username</h1>
        <p class="sub">This is how you'll appear on leaderboards. 3-20 characters: letters, numbers, underscores.</p>
        <form id="usernameform">
          <div class="authfield">
            <label>Username</label>
            <input type="text" id="usernameInput" autocomplete="off" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+" value="${esc(pendingUsername)}" />
          </div>
          <div id="usernameStatus" style="font-size:12px;min-height:16px;"></div>
          <button type="submit" class="authbtn" id="usernameSubmitBtn">Save username</button>
        </form>
        ${usernameMsg ? `<div class="authmsg ${usernameMsg.type}">${usernameMsg.text}</div>` : ''}
      </div>
    </div>
  `;
  const input = document.getElementById('usernameInput');
  const status = document.getElementById('usernameStatus');
  const checkNow = ()=>{
    clearTimeout(usernameCheckTimer);
    const val = input.value.trim();
    if(val.length < 3){ status.textContent=''; return; }
    if(!/^[a-zA-Z0-9_]{3,20}$/.test(val)){ status.textContent='Letters, numbers, underscores only.'; status.style.color='#ff4444'; return; }
    status.textContent = 'Checking…'; status.style.color='var(--muted)';
    usernameCheckTimer = setTimeout(async ()=>{
      const available = await isUsernameAvailable(val, authUser ? authUser.id : null);
      if(input.value.trim() !== val) return; // stale response, input changed since
      if(available === true){ status.textContent='Available'; status.style.color='#39ff14'; }
      else if(available === false){ status.textContent='Already taken'; status.style.color='#ff4444'; }
      else { status.textContent=''; }
    }, 400);
  };
  input.oninput = checkNow;
  if(pendingUsername) checkNow();

  document.getElementById('usernameform').onsubmit = async (e)=>{
    e.preventDefault();
    const val = input.value.trim();
    if(!/^[a-zA-Z0-9_]{3,20}$/.test(val)){
      usernameMsg = { type:'err', text:'3-20 characters: letters, numbers, underscores only.' };
      renderUsernameGate();
      return;
    }
    const btn = document.getElementById('usernameSubmitBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    const { ok, error } = await saveUsername(val);
    if(!ok){
      usernameMsg = { type:'err', text: (error && error.message && error.message.includes('duplicate'))
        ? 'That username was just taken - try another.'
        : 'Could not save username - try again.' };
      renderUsernameGate();
      return;
    }
    needsUsername = false;
    pendingUsername = '';
    usernameMsg = null;
    loadState(); // proceed into the actual game now that a profile exists
  };
}

function renderAuth(){
  const el = document.getElementById('app');
  el.innerHTML = `
    <div class="authwrap">
      <div class="authcard">
        <div class="brand-hexmark auth-hexmark"></div>
        <h1>PokéHex</h1>
        <p class="sub">${authMode==='signin' ? 'Sign in to load your vault' : 'Create an account to save your progress'}</p>
        <form id="authform">
          <div class="authfield">
            <label>Email</label>
            <input type="email" id="authEmail" autocomplete="email" required />
          </div>
          <div class="authfield">
            <label>Password</label>
            <input type="password" id="authPassword" autocomplete="${authMode==='signin'?'current-password':'new-password'}" minlength="6" required />
          </div>
          ${authMode==='signup' ? `
          <div class="authfield">
            <label>Username</label>
            <input type="text" id="authUsername" autocomplete="off" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+" />
            <div id="authUsernameStatus" style="font-size:12px;min-height:16px;margin-top:2px;"></div>
          </div>` : ''}
          <button type="submit" class="authbtn" ${authBusy?'disabled':''}>
            ${authBusy ? 'Please wait…' : (authMode==='signin' ? 'Sign in' : 'Create account')}
          </button>
        </form>
        <button class="authtoggle" id="authToggleBtn">
          ${authMode==='signin' ? "No account yet? Create one" : "Already have an account? Sign in"}
        </button>
        ${authMsg ? `<div class="authmsg ${authMsg.type}">${authMsg.text}</div>` : ''}
        ${!authUser ? `<button class="authtoggle" id="authBackBtn" style="margin-top:4px;">&larr; Back to browsing</button>` : ''}
      </div>
    </div>
  `;
  document.getElementById('authToggleBtn').onclick = ()=>{
    authMode = authMode==='signin' ? 'signup' : 'signin';
    authMsg = null;
    renderAuth();
  };
  const backBtn = document.getElementById('authBackBtn');
  if(backBtn) backBtn.onclick = ()=>{ authMsg = null; render(); };

  const authUsernameInput = document.getElementById('authUsername');
  if(authUsernameInput){
    const status = document.getElementById('authUsernameStatus');
    authUsernameInput.oninput = ()=>{
      clearTimeout(usernameCheckTimer);
      const val = authUsernameInput.value.trim();
      if(val.length < 3){ status.textContent=''; return; }
      if(!/^[a-zA-Z0-9_]{3,20}$/.test(val)){ status.textContent='Letters, numbers, underscores only.'; status.style.color='#ff4444'; return; }
      status.textContent = 'Checking…'; status.style.color='var(--muted)';
      usernameCheckTimer = setTimeout(async ()=>{
        const available = await isUsernameAvailable(val, null);
        if(authUsernameInput.value.trim() !== val) return;
        if(available === true){ status.textContent='Available'; status.style.color='#39ff14'; }
        else if(available === false){ status.textContent='Already taken'; status.style.color='#ff4444'; }
        else { status.textContent=''; }
      }, 400);
    };
  }

  document.getElementById('authform').onsubmit = async (e)=>{
    e.preventDefault();
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const username = authMode==='signup' ? document.getElementById('authUsername').value.trim() : null;
    if(authMode==='signup' && !/^[a-zA-Z0-9_]{3,20}$/.test(username)){
      authMsg = { type:'err', text:'Username must be 3-20 characters: letters, numbers, underscores only.' };
      renderAuth();
      return;
    }
    authBusy = true; authMsg = null; renderAuth();
    try{
      if(authMode==='signin'){
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
        // onAuthStateChange will pick up the session and boot the game
      } else {
        const { data, error } = await sb.auth.signUp({ email, password });
        if(error) throw error;
        if(!data.session){
          authBusy = false;
          authMsg = { type:'ok', text:'Check your email to confirm your account, then sign in.' };
          authMode = 'signin';
          renderAuth();
          return;
        }
        // don't insert the profile here - the username gate (triggered by
        // onAuthStateChange below) is the single place that ever writes a
        // profile row, so there's no chance of two competing inserts
        pendingUsername = username;
      }
    }catch(err){
      authBusy = false;
      authMsg = { type:'err', text: err.message || 'Something went wrong.' };
      renderAuth();
    }
  };
}

async function signOut(){
  await sb.auth.signOut();
  // onAuthStateChange handles returning to the guest browsing view
}

// Gate for any action that changes state - guests get sent to the signup screen instead.
function requireAuth(){
  if(!authUser){
    authMode = 'signup';
    authMsg = null;
    renderAuth();
    return false;
  }
  return true;
}

sb.auth.onAuthStateChange(async (event, session)=>{
  const user = session ? session.user : null;
  const wasLoggedIn = !!authUser;
  authUser = user;
  if(user && !wasLoggedIn){
    authBusy = false; authMsg = null;
    const { data: profile } = await sb.from('profiles').select('username').eq('user_id', user.id).maybeSingle();
    if(!profile){
      needsUsername = true;
      renderUsernameGate();
    } else {
      loadState(); // boots the real, saved game state now that we have a user
    }
  } else if(!user && wasLoggedIn){
    // user just signed out - drop back to guest browsing of the Packs page, not the login screen
    authBusy = false;
    state = { hex:0, dex:{}, instances:[], collectibles:{}, lastSpinAt:null, valueHistory:[], longHistory:[] };
    profileStats = null; profileUsername = null; profileLoading = false;
    view = 'open';
    render();
  }
  // if !user && !wasLoggedIn (e.g. no session on initial load), leave whatever's already on screen alone
});

// Ownership is derived from state.dex at render time, so a badge is lost
// if the last copy of a species is sold. Progress is computed client-side

// need counts are derived from POKEMON, never hardcoded, so expanding the
// card pool cannot leave a badge permanently uncompletable.
const BADGE_POOLS = BADGES.reduce((acc,b)=>{
  acc[b.id] = POKEMON.filter(p=>p.type===b.type).map(p=>p.id);
  return acc;
}, {});

// Returns {have, need, owned} for one badge, from current dex ownership.
function badgeProgress(badgeId, dex){
  const pool = BADGE_POOLS[badgeId] || [];
  const d = dex || {};
  let have = 0;
  for (const id of pool) if (d[id]) have++;
  return { have, need: pool.length, owned: pool.length > 0 && have === pool.length };
}

// Count of fully earned badges. Display only -- anything that grants
// something must recompute server-side.
function earnedBadgeCount(dex){
  return BADGES.reduce((n,b)=>n + (badgeProgress(b.id, dex).owned ? 1 : 0), 0);
}

// Badge grid. Lives on the Stats page. Locked badges stay visible but unlit --
// a hidden goal is not a goal.

// Difficulty is rendered on the tile face, not only in the title tooltip:
// tooltips do not exist on touch, and difficulty is the one thing that stops
// a player misreading the bar. 10/15 on Marsh looks closer than 8/11 on Earth
// and is hundreds of packs further away, because four of the missing Psychics
// are secrets. Stars are ordinal so they survive at 8px where words would not.
const BADGE_STARS = {'Gym Leader':1, 'Elite Four':2, 'Champion':3};

function renderBadgeGrid(dex){

      const stars = BADGE_STARS[item.difficulty] || 0;

const MARKET_EPOCH = Date.parse('2024-01-01T00:00:00Z');
const MARKET_WAVES = [
  { periodMs: 5    * 60*60*1000, amp: 0.35, phase: 1.1 }, // long supercycle (~5h)
  { periodMs: 41  * 60*1000,    amp: 0.15, phase: 2.7 }, // medium swing (~41m)
  { periodMs: 9    * 60*1000,    amp: 0.07, phase: 4.2 }, // short jitter (~9m)
];
const MARKET_HELD_BONUS_CAP = 0.30;      // max +30%
const MARKET_HELD_BONUS_RATE = 0.01;     // per hour held
// Display/UX only. The real cap is the game_states_v2_favorite_uids_max3 check
// constraint plus set_favorite_slot(); changing this number alone will NOT let
// a player set a 4th - the database will reject it. Change both together.
const FAVORITE_SLOTS = 3;
const MARKET_MULT_FLOOR = 0.15;          // guard against near-zero/negative payouts

function marketIndexAt(t){
  let idx = 1;
  MARKET_WAVES.forEach(w=>{
    idx += w.amp * Math.sin((2*Math.PI*(t-MARKET_EPOCH))/w.periodMs + w.phase);
  });
  return idx;
}
function marketPhaseFor(idx){
  if(idx >= 1.15) return {label:'BULL MARKET', color:'var(--foil1)'};
  if(idx <= 0.85) return {label:'BEAR MARKET', color:'#ff4444'};
  return {label:'NEUTRAL', color:'var(--muted)'};
}
function heldBonusFor(hoursHeld){
  return Math.min(MARKET_HELD_BONUS_CAP, Math.max(0,hoursHeld) * MARKET_HELD_BONUS_RATE);
}
function cardMultiplier(hoursHeld, tNow){
  return Math.max(MARKET_MULT_FLOOR, marketIndexAt(tNow) + heldBonusFor(hoursHeld));
}

        valueHistory: data.value_history || [],

        favoriteUids: Array.isArray(data.favorite_uids) ? data.favorite_uids : [],
        equippedBack: data.equipped_back || null
      };

  if(state.collectibles===undefined) state.collectibles = {};
  if(state.instances===undefined) state.instances = [];
  if(state.valueHistory===undefined) state.valueHistory = [];

}
let saveTimer = null;
async function saveState(){
  // hex/dex/instances/collectibles are already persisted server-side by
  // whichever RPC just ran - this only needs to persist the chart history,
  // debounced so rapid-fire actions collapse into one write
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 250);
}
async function doSave(){
  if(!authUser) return;
  try{
    const { error } = await sb.rpc('save_vault_history', {
      p_value_history: state.valueHistory,
      p_long_history: state.longHistory
    });

  }catch(e){
