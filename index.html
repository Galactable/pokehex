/* LCD content: blocky sprites ticking across the screen well */
.card-back.back-eclipse::before{
  inset:0;
  background-image:
    linear-gradient(#3d6b1f 0 0), linear-gradient(#2f4a1e 0 0), linear-gradient(#3d6b1f 0 0);
  background-size:5% 4%, 4% 3%, 3% 3%;
  background-position:31.6% 22.9%, 54.2% 30.9%, 68.0% 39.2%;
  background-repeat:no-repeat;
  animation:cb-lcd 1.2s steps(4) infinite;
}
/* LCD scanlines + glass sheen */
.card-back.back-eclipse::after{
  background-image:repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
  -webkit-mask-image:linear-gradient(#000 0 0);
          mask-image:linear-gradient(#000 0 0);
  /* LCD is x=24 y=26 w=82 h=58 in a 130x180 viewBox. Size is that rect as a
     % of the card; position solved with p = 100*d/(100-i). */
  -webkit-mask-size:63.08% 32.22%; mask-size:63.08% 32.22%;
  -webkit-mask-position:50.0% 21.3%; mask-position:50.0% 21.3%;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
}
@keyframes cb-lcd{ to{ background-position:40.0% 22.9%, 47.9% 30.9%, 61.9% 39.2%; } }

/* Five cards flip at once on a pack open. Honour the OS setting and freeze
   every back to its first frame - the art still reads, it just stops moving. */
@media (prefers-reduced-motion: reduce){
  .card-back[class*="back-"]::before,
  .card-back[class*="back-"]::after{animation:none !important;}
}
.card-front{
  transform:rotateY(180deg);
  background:linear-gradient(165deg,var(--surface2),var(--surface));
  border-width:2px;border-style:solid;border-color:var(--card-color,var(--common));
  padding:max(8px, 6.2cqw);justify-content:space-between;
}
.card-front.shine::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,0.35) 45%,rgba(57,255,20,0.4) 50%,rgba(157,78,221,0.35) 55%,transparent 70%);
  background-size:220% 220%;animation:sheenmove 2.4s linear infinite;
  mix-blend-mode:screen;
}

/* ---------- shiny palette swap ---------- */
/* Static hue rotation on the sprite itself - deliberately NOT animated, so it
   reads differently from .shine / .flame-aura used for high-value rarity tiers.
   Applies to pack-reveal card faces (.cf-glyph) and dex tiles (.glyph). */
.shiny-card .cf-glyph img,
.shiny-card .glyph img{
  filter: hue-rotate(var(--shiny-hue, 150deg)) saturate(1.25);
}

/* ---------- white sparkle overlay for shiny (1-in-4096) card variants ---------- */
/* Distinct from .shine (rarity-tier glow) so a shiny ultra/secret shows both */
.shiny-sparkle-overlay{
  position:absolute;inset:0;pointer-events:none;z-index:2;
  background-image:
    radial-gradient(circle, #fff 1px, transparent 1.5px),
    radial-gradient(circle, #fff 1px, transparent 1.5px),
    radial-gradient(circle, #fff 1.5px, transparent 2px),
    radial-gradient(circle, #fff 1px, transparent 1.5px);
  background-size: 40px 40px, 60px 60px, 80px 80px, 50px 50px;
  background-position: 10px 15px, 40px 60px, 70px 20px, 20px 80px;
  animation: shinytwinkle 1.8s ease-in-out infinite;
  mix-blend-mode:screen;
}
@keyframes shinytwinkle{
  0%,100%{ opacity:0.35; }
  50%{ opacity:0.95; }
}
/* Sparkle overlay scaled down for dex tiles (~84x112) so the sparkles land on
   the tile instead of mostly falling outside it. Same class, same animation,
   same 4-layer pattern at 0.7x. border-radius matches .dexslot because the
   tile has no overflow:hidden the way .card-face does. */
.dexslot .shiny-sparkle-overlay{
  border-radius:10px;
  background-size: 28px 28px, 42px 42px, 56px 56px, 35px 35px;
  background-position: 6px 10px, 28px 42px, 49px 14px, 14px 56px;
}
.dexslot .holo-hex-overlay,
.dexslot .holo-gloss-overlay,
.dexslot .holo-sparkle-overlay{
  border-radius:10px;
}

/* ---------- holo overlay (3x value tier) ----------
   No hue shift on the sprite - unlike shiny, this is deliberately just a
   surface effect. Same hex/cube facet geometry as a real foil card - the
   thin-line wireframe version read as a flat printed grid with no life to
   it. What actually reads as "holographic" is a single facet pattern whose
   color slowly cycles through the spectrum (an iridescent sheen), not the
   line pattern itself moving or pulsing - so ONE hue, animated via
   hue-rotate only (no opacity flicker), low enough alpha that even the
   compounded overlaps where facets meet stay a gentle tint rather than an
   opaque cube grid. Fixed px tile size so the same facet density shows at
   any card size. */
.holo-hex-overlay{
  position:absolute;inset:0;pointer-events:none;z-index:2;
  background-image:
    linear-gradient(30deg,  rgba(140,200,255,.11) 12%, transparent 12.5%, transparent 87%, rgba(140,200,255,.11) 87.5%, rgba(140,200,255,.11)),
    linear-gradient(150deg, rgba(140,200,255,.11) 12%, transparent 12.5%, transparent 87%, rgba(140,200,255,.11) 87.5%, rgba(140,200,255,.11)),
    linear-gradient(30deg,  rgba(140,200,255,.11) 12%, transparent 12.5%, transparent 87%, rgba(140,200,255,.11) 87.5%, rgba(140,200,255,.11)),
    linear-gradient(150deg, rgba(140,200,255,.11) 12%, transparent 12.5%, transparent 87%, rgba(140,200,255,.11) 87.5%, rgba(140,200,255,.11)),
    linear-gradient(60deg,  rgba(140,200,255,.08) 25%, transparent 25.5%, transparent 75%, rgba(140,200,255,.08) 75%, rgba(140,200,255,.08)),
    linear-gradient(60deg,  rgba(140,200,255,.08) 25%, transparent 25.5%, transparent 75%, rgba(140,200,255,.08) 75%, rgba(140,200,255,.08));
  background-position: 0 0, 0 0, 11px 19px, 11px 19px, 0 0, 11px 19px;
  background-size: 22px 38px;
  mix-blend-mode:screen;
  animation: holoHueShift 7s linear infinite;
}
@keyframes holoHueShift{
  from{ filter:hue-rotate(0deg); }
  to{ filter:hue-rotate(360deg); }
}
.holo-gloss-overlay{
  position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(100deg,
    transparent 38%,
    rgba(255,170,210,.14) 46%,
    rgba(255,255,255,.2) 49%,
    rgba(160,220,255,.14) 52%,
    transparent 60%);
  background-size:260% 260%;
  mix-blend-mode:screen;
  animation: holoGlossMove 4.2s ease-in-out infinite;
}
@keyframes holoGlossMove{
  0%, 70%{ background-position:-30% -30%; }
  90%{ background-position:100% 100%; }
  100%{ background-position:-30% -30%; }
}
/* Much smaller AND sparser than .shiny-sparkle-overlay - fewer layers (3
   vs shiny's 4) and wider relative spacing, not just smaller dots.
   background-size here is in %, not px: card contexts range from ~84px
   dex tiles to ~260px inspect view, and fixed-px spacing showed maybe 1
   repeat on the small end vs 5+ on the large end - way sparser exactly
   where it should look the same. Percent sizing keeps the repeat COUNT
   (density) consistent across every size; the dot itself stays pixel-thin
   regardless, since the radial-gradient's own 0.5px/1.1px stops are real
   absolute lengths, not relative to the scaled tile box. */
.holo-sparkle-overlay{
  position:absolute;inset:0;pointer-events:none;z-index:2;
  background-image:
    radial-gradient(circle, #fff 0.5px, transparent 1.1px),
    radial-gradient(circle, #fff 0.5px, transparent 1.1px),
    radial-gradient(circle, #fff 0.5px, transparent 1.1px);
  background-size: 18% 18%, 25% 25%, 32% 32%;
  background-position: 2% 4%, 11% 16%, 6% 23%;
  mix-blend-mode:screen;
  opacity:.55;
}

/* ---------- shiny + holo badge ----------
   A card that is both gets its own mark rather than a star and a ❖ stacked
   in the same spot: those are font glyphs, so their overlap shifted with
   each platform's fallback font. This is clip-path geometry, no text, so it
   renders identically everywhere. Glow lives on the outer span because
   clip-path would clip a drop-shadow on the same element. */
/* Corner badge on dex/binder tiles. Inline SVG, not font glyphs: glyph
   size varies with each platform's fallback font, so tuned font-sizes
   matched on desktop and not on mobile. Same 16px box and position as
   .shinyholo-badge, so all three are pixel-identical in size everywhere. */
.corner-badge{
  position:absolute;top:5px;right:5px;width:16px;height:16px;z-index:3;pointer-events:none;
}
.corner-badge svg{display:block;width:100%;height:100%;fill:currentColor;}
.corner-badge.shiny{color:gold;filter:drop-shadow(0 0 3px gold);}
.corner-badge.holo{color:#8ad0ff;filter:drop-shadow(0 0 3px #8ad0ff);}
.shinyholo-badge{
  position:absolute;top:5px;right:5px;width:16px;height:16px;z-index:3;pointer-events:none;
  filter:drop-shadow(0 0 1px rgba(0,0,0,.9)) drop-shadow(0 0 3px rgba(255,190,0,.7));
}
.shinyholo-badge i{
  display:block;width:100%;height:100%;
  clip-path:polygon(50% 0%,58% 31%,85% 15%,69% 42%,100% 50%,69% 58%,85% 85%,58% 69%,50% 100%,42% 69%,15% 85%,31% 58%,0% 50%,31% 42%,15% 15%,42% 31%);
  background:linear-gradient(135deg,gold 0%,#ff9fd0 50%,#8ad0ff 100%);
}
/* Inline variant for the card-face name line, shared by all three badges.
   Sized in em so it scales with .cf-name's cqw font size across pack
   reveal, detail and stats cards. */
.shinyholo-badge.inline,
.corner-badge.inline{
  position:relative;top:auto;right:auto;display:inline-block;
  width:1.05em;height:1.05em;vertical-align:-0.15em;
}

/* ---------- purple flame aura for ultra/secret tier cards ---------- */
.flame-aura{
  animation: flamePulse 1.6s ease-in-out infinite alternate;
}
@keyframes flamePulse{
  0%{ box-shadow: 0 0 8px 2px rgba(157,78,221,0.5), 0 0 20px 6px rgba(157,78,221,0.28); }
  100%{ box-shadow: 0 0 16px 5px rgba(199,125,255,0.85), 0 0 34px 12px rgba(157,78,221,0.55); }
}
.cf-top{display:flex;justify-content:space-between;align-items:center;font-size:max(9px, 6.9cqw);z-index:1;}
.cf-num{font-family:'JetBrains Mono',monospace;color:var(--muted);}
/* Also reused standalone in the tier-list species row (outside any
   .card-slot container), so the base rule must stay plain px - cqw with
   no container-query ancestor falls back to the VIEWPORT size, not the
   card, which is what made this pill balloon there. The responsive sizing
   is scoped to .card-face .cf-type below instead. */
.cf-type{
  padding:2px 6px;border-radius:6px;font-weight:700;font-size:8px;text-transform:uppercase;
  color:#0b0b14;background:var(--type-color,#999);
}
.card-face .cf-type{
  padding:max(2px, 1.5cqw) max(6px, 4.6cqw);border-radius:max(6px, 4.6cqw);font-size:max(8px, 6.2cqw);
}
.cf-glyph{
  width:76cqw;height:76cqw;border-radius:0;margin:0 auto;
  background:transparent;align-self:center;
  box-shadow:none;
  display:flex;align-items:center;justify-content:center;
  z-index:1;overflow:hidden;
}
.cf-glyph img{
  width:100%;height:100%;object-fit:contain;image-rendering:pixelated;
}
.cf-bottom{z-index:1;text-align:center;}
.cf-name{font-family:var(--font-display);font-weight:800;font-size:max(10px, 7.7cqw);line-height:1.15;}
.cf-rarity{font-size:max(8.5px, 6.5cqw);letter-spacing:0.08em;text-transform:uppercase;color:var(--card-color,var(--common));font-weight:700;}
.cf-value{
  font-family:'JetBrains Mono',monospace;font-size:max(10.5px, 8.1cqw);color:var(--gold);margin-top:2px;
}
/* .hex-icon is reused all over the game at a fixed 14x16 - scoped here so
   only the card face's copy scales. Base box and the ::before highlight's
   offset/size all need the same ratio or the inner diamond drifts out of
   alignment with the outer hex outline (::after uses inset:0, so it
   already tracks the base box with no px of its own to convert). */
.cf-value .hex-icon{
  width:max(14px, 10.8cqw); height:max(16px, 12.3cqw); margin-right:max(3px, 2.3cqw);
}
.cf-value .hex-icon::before{
  left:max(3px, 2.3cqw); width:max(8px, 6.2cqw); height:max(6px, 4.6cqw);
}

.summary-panel{
  margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:18px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:520px;
}
.summary-total{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--muted);}
.summary-total b{
  color:var(--gold);
}
.summary-actions{display:flex;gap:10px;}
.sbtn{border:none;border-radius:8px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;}
.sbtn.keep{background:var(--foil2);color:#fff;box-shadow:0 0 10px rgba(157,78,221,0.4);}
.sbtn.sell{background:var(--surface2);color:var(--gold);border:1px solid var(--gold);}
.closex{position:absolute;top:18px;right:22px;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;}
.friend-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;width:100%;}
.friend-row:last-child{border-bottom:none;}
.friend-row .fr-actions{display:flex;gap:6px;flex:0 0 auto;}
.frbtn{border:none;border-radius:6px;padding:5px 10px;font-size:11.5px;font-weight:700;cursor:pointer;}
.frbtn.accept{background:var(--foil1);color:#07090a;}
.frbtn.decline,.frbtn.cancel,.frbtn.remove{background:var(--surface2);color:var(--muted);border:1px solid var(--line);}
.frbtn:disabled{opacity:.5;cursor:default;}
.frname{background:none;border:none;color:var(--text);font-size:13px;font-weight:700;text-align:left;cursor:pointer;padding:0;text-decoration:underline;text-decoration-color:var(--line);}
.frname:hover{text-decoration-color:var(--foil1);}
.msg-list{max-height:55vh;overflow-y:auto;}
.msg-row{padding:10px 0;border-bottom:1px solid var(--line);width:100%;}
.msg-row:last-child{border-bottom:none;}
.msg-head{display:flex;align-items:center;gap:8px;font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);}
.msg-kind{color:var(--foil1);}
.msg-row.gift .msg-kind{color:var(--gold);}
.msg-new{background:#ff4444;color:#fff;border-radius:999px;padding:0 6px;font-weight:800;}
.msg-when{margin-left:auto;}
.msg-title{font-weight:700;font-size:13.5px;margin-top:4px;}
.msg-body{font-size:12.5px;opacity:.85;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere;}
.msg-gift{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding:8px 10px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;font-size:13px;}
.msg-claimed{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;}
.msg-x{background:none;border:none;color:var(--muted);font-size:16px;line-height:1;padding:0 2px;cursor:pointer;}
.msg-x:hover{color:var(--text);}
.msg-toolbar{display:flex;justify-content:flex-end;}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  padding:10px 18px;font-size:13px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;
  color: var(--foil2);
}
.toast.show{opacity:1;}

.confetti{position:fixed;top:-10px;width:8px;height:8px;z-index:60;pointer-events:none;border-radius:2px;}

.footer-actions{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:34px;}
.reset-link{color:var(--muted);font-size:11px;background:none;border:none;cursor:pointer;text-decoration:underline;}

/* Maker's mark, sits between the reset link and the signature.
   No height set - renders at the PNG's native 34px. */
.sigil{
  align-self:center;
  opacity:0.85;
  filter:drop-shadow(0 0 4px rgba(57,255,20,0.55));
}

/* ---------- how to play ---------- */
.howto{max-width:680px;margin:0 auto;}
.howto p{color:var(--text);font-size:14px;line-height:1.65;margin:0 0 14px;}
.howto p.lead{color:var(--muted);}
.howto h3{
  font-family:var(--font-display);font-weight:800;font-size:18px;
  letter-spacing:0.06em;text-transform:uppercase;color:var(--foil1);
  text-shadow:0 0 8px rgba(57,255,20,0.45);
  margin:34px 0 4px;
}
.howto hr{border:none;border-top:1px solid var(--line);margin:30px 0;}
.howto strong{color:var(--foil2);font-weight:400;}
.howto em{color:var(--muted);font-style:italic;}
.howto-payout{
  border-left:2px solid var(--foil1);
  background:var(--surface2);
  padding:12px 16px;margin:0 0 14px;
  color:var(--text);font-size:14px;line-height:1.5;
}
.howto-tip{display:flex;gap:12px;margin:0 0 14px;align-items:baseline;}
.howto-tip .n{
  font-family:var(--font-display);font-weight:800;font-size:13px;color:var(--foil1);
  flex:0 0 auto;min-width:18px;
}
.howto-sign{
  display:flex;justify-content:center;align-items:center;gap:14px;
  margin-top:38px;padding-top:22px;border-top:1px solid var(--line);
  color:var(--muted);font-size:12px;
}

/* ---------- vertical terminal wheel ---------- */
.wheel-overlay-stage{display:flex;flex-direction:column;align-items:center;gap:18px;}
.term-slot-frame{
  position:relative;width:280px;height:140px;background:var(--surface);
  border:2px solid var(--foil1);border-radius:12px;overflow:hidden;
  box-shadow:0 0 24px rgba(57,255,20,0.25), inset 0 0 16px rgba(0,0,0,0.8);
}
.term-slot-frame::before{
  content:'';position:absolute;top:0;left:0;right:0;height:45px;
  background:linear-gradient(to bottom, rgba(7,9,10,0.9), transparent);
  pointer-events:none;z-index:3;
}
.term-slot-frame::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:45px;
  background:linear-gradient(to top, rgba(7,9,10,0.9), transparent);
  pointer-events:none;z-index:3;
}
.term-pointer-line{
  position:absolute;top:50%;left:0;right:0;height:2px;margin-top:-1px;
  background:var(--foil1);box-shadow:0 0 8px var(--foil1);z-index:4;pointer-events:none;
}
.term-strip{
  position:absolute;top:0;left:0;width:100%;
  display:flex;flex-direction:column;align-items:center;
  will-change:transform;
}
.term-item{
  height:46px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--gold);
  letter-spacing:0.05em;border-bottom:1px dashed var(--line);
}
.spin-btn{
  background:var(--foil2);color:#fff;border:none;border-radius:8px;
  padding:12px 26px;font-weight:700;font-size:13px;cursor:pointer;font-family:'JetBrains Mono',monospace;
  box-shadow:0 0 12px rgba(157,78,221,0.4);
}
.spin-btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;box-shadow:none;}
.wheel-result{
  font-family:'JetBrains Mono',monospace;font-size:28px;color:var(--gold);
}

/* Slippage Warning Container and Items */
.slippage-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.slippage-notice {
  background: rgba(255, 170, 0, 0.08);
  border: 1px dashed #ffaa00;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 11.5px;
  color: #ffca66;
  display: flex;
  align-items: center;
  gap: 10px;
}
.slippage-notice div {
  flex: 1;
  line-height: 1.4;
  white-space: normal;
  word-wrap: break-word;
}

/* ---------- auth screen ---------- */
.authwrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:
    repeating-linear-gradient(to bottom, rgba(57,255,20,0.025) 0px, rgba(57,255,20,0.025) 1px, transparent 1px, transparent 3px),
    radial-gradient(circle at 50% -10%, #101a12 0%, var(--bg) 55%);
  color:var(--text);font-family:'JetBrains Mono',monospace;padding:20px;box-sizing:border-box;
}
.authcard{
  width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:28px 24px;text-align:center;
}
/* The shared .brand/.authcard h1 rule above sets white-space:nowrap so the
   inline hexagon glyph can't split the PokeHex wordmark. No auth heading
   contains that glyph, so here we undo it: these are real sentences and must
   be free to wrap. Fluid size too - the rule above is overridden by this one,
   so a flat 36px here defeated its clamp and overflowed the 360px card. */
.authcard h1{
  font-size:clamp(20px, 6vw, 36px);
  margin:0 auto 4px;
  text-align:center;
  white-space:normal;
  overflow-wrap:break-word;
  max-width:100%;
}
.auth-hexmark{margin:0 auto 14px;}
.authcard p.sub{color:var(--muted);font-size:12px;text-align:center;margin:0 0 20px;}
.authfield{margin-bottom:12px;text-align:left;}
.authfield label{display:block;font-size:11px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px;}
.authfield input{
  width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:10px 12px;font-family:'JetBrains Mono',monospace;font-size:14px;
}
.authfield input:focus{outline:none;border-color:var(--foil1);}
.authbtn{
  width:100%;background:var(--foil2);color:#fff;border:none;border-radius:8px;
  padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;margin-top:6px;
  box-shadow:0 0 10px rgba(157,78,221,0.4);
}
.authbtn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;box-shadow:none;}
.authtoggle{
  background:transparent;border:none;color:var(--muted);font-size:12px;cursor:pointer;
  width:100%;text-align:center;margin-top:14px;text-decoration:underline;
}
.authmsg{font-size:12px;text-align:center;margin-top:12px;line-height:1.4;}
.authmsg.err{color:#ff6b6b;}
.authmsg.ok{color:var(--foil1);}
.signoutbtn-row{
  max-width:920px;
  margin:24px auto 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
/* The row renders even when signed out so the sound toggle is always reachable;
   space-between then puts it hard left with SIGN OUT on the right. */
.mutebtn{
  background:transparent;border:none;cursor:pointer;padding:4px 2px;
  color:var(--foil1);line-height:0;opacity:0.75;
}
.mutebtn:hover{opacity:1;filter:drop-shadow(0 0 6px rgba(57,255,20,0.6));}
.mutebtn svg{width:19px;height:19px;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.mutebtn.is-muted{color:var(--muted);}
.signoutbtn{
  display:inline-block;
  width:auto;
  background:transparent;
  border:none;
  color:var(--foil1);
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:12px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  text-decoration:none;
  cursor:pointer;
  padding:4px 0;
}
.signoutbtn:hover{text-shadow:0 0 8px rgba(57,255,20,0.6);}

/* ---------- responsive ---------- */

/* Kill sideways scroll outright. If something overflows, this contains it
   instead of letting it drag the whole page off-screen. */
html,body{ max-width:100%; overflow-x:hidden; }

/* Grid/flex children default to min-width:auto and refuse to shrink below
   their content - one long uid or number then forces the page wide. */
.wrap, .topbar, .navrow, .packgrid, .dexgrid,
.packcard, .dexslot, .dexhead, .dexhead-left{ min-width:0; }

/* Long unbroken strings (uids, big HEX values, usernames) wrap instead of overflowing. */
.mono, .nm, .cnt, .num{ overflow-wrap:anywhere; }

@media (max-width: 720px){
  #app{ padding:12px; }

  /* The 1fr auto 1fr header is the main offender - collapse it to a
     single centred column so nothing gets crushed. */
  .topbar{
    grid-template-columns:1fr;
    justify-items:center;
    gap:12px;
    text-align:center;
  }
  .brand{ grid-column:1; justify-self:center; }

  .packgrid{ grid-template-columns:1fr; }
  .dexgrid{ grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:8px; }
}

@media (max-width: 420px){
  #app{ padding:10px; }
  .card-slot{ width:104px; height:144px; }
  /* keep the placeholder the same size as the shrunken card, and tighten the
     gap so Most Valuable Pull and Favorite Card still sit in one row */
  .stats-card-empty{ width:104px; min-height:144px; }
  .stats-card-display{ gap:14px; }
  .pack-visual{ width:calc(var(--pack-w)*0.82); height:calc(var(--pack-h)*0.82); --lift:5.7px; }
  .pack-visual.mini{ --lift:2.8px; }
  .packcard.shop{ gap:12px; }
  .dexgrid{ grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); }
}

/* ---------- Skills & XP (profile page) ----------
   Bars and rows follow .stat-row's rhythm so the section reads as part of the
   page rather than bolted on. The hexagon map is inline SVG generated in JS,
   NOT a data-URI: it is data-driven and must follow --foil1/--foil2, and a
   data-URI would freeze both the colors and the shape. */
.skill-row{
  display:flex;align-items:center;gap:10px;
  padding:7px 2px;border-bottom:1px solid var(--line);font-size:13px;
}
.skill-row:last-of-type{border-bottom:none;}
.skill-row .sk-ico{
  width:18px;height:18px;flex:0 0 auto;color:var(--foil1);
  display:flex;align-items:center;justify-content:center;
}
.skill-row .sk-name{flex:0 0 74px;}
.skill-row .sk-lv{
  flex:0 0 26px;font-family:'JetBrains Mono',monospace;font-size:12px;
  color:var(--text);text-align:right;
}
/* the level you are climbing toward, on the far side of the bar, so the bar
   visibly spans FROM one level TO the next rather than floating unanchored */
.skill-row .sk-lv-next{
  flex:0 0 26px;font-family:'JetBrains Mono',monospace;font-size:12px;
  color:var(--muted);text-align:left;
}
.skill-row .sk-barwrap{flex:1 1 auto;min-width:40px;}
/* display:block is load-bearing - a span defaults to inline, and an inline box
   IGNORES width and height, so the track collapses to zero and the fill inside
   has nothing to fill. */
/* --xp-near is deliberately OFF-palette. A level-up-imminent signal has to
   stand out from the green/violet the rest of the page lives in, and the
   theme's --gold is a lavender, which reads as "purple bar" rather than
   "about to pop". Scoped here, not added to :root, so nothing else sees it. */
.skill-row{--xp-near:#ffc93c;}
/* display:block is load-bearing - a span defaults to inline, and an inline box
   IGNORES width and height, so the track collapses to zero. */
.skill-row .sk-bar{
  display:block;
  width:100%;height:8px;border-radius:4px;overflow:hidden;
  border:1px solid var(--line);
  /* the gradient spans the WHOLE track, so the colour at the fill's leading
     edge reports actual progress. Green to violet over the first three
     quarters, then violet to amber over the last quarter only - so amber
     means "nearly there" and cannot appear before 75%. Painting the gradient
     on the fill instead would make the tip the same colour at 5% as at 95%,
     which tells the player nothing. */
  background:linear-gradient(90deg,
    var(--foil1) 0%,
    var(--foil2) 75%,
    var(--xp-near) 100%);
}
/* not a bar - a MASK. it covers the UNFILLED remainder with the well colour,
   revealing the track gradient from the left. */
.skill-row .sk-bar i{
  display:block;height:100%;margin-left:0;
  background:var(--surface2);
  box-shadow:inset 1px 0 0 var(--line);
}
.skill-row .sk-xp{
  flex:0 0 88px;font-family:'JetBrains Mono',monospace;font-size:10px;
  color:var(--muted);text-align:right;white-space:nowrap;
}
/* 24px box: the tap target has to clear the finger-size floor on mobile, where
   most players are, even though the glyph itself is small */
.skill-row .sk-info{
  flex:0 0 auto;width:24px;height:24px;border-radius:50%;
  border:1px solid var(--gold);background:transparent;color:var(--gold);
  font-size:11px;line-height:1;cursor:pointer;padding:0;
  font-family:'JetBrains Mono',monospace;
}
.skill-row .sk-info:hover,.skill-row .sk-info.on{
  color:var(--bg);background:var(--gold);border-color:var(--gold);
}
/* inline panel, not a tooltip: a hover tooltip never surfaces on touch, so it
   would be invisible to most players and to desktop-only testing */
.skill-note{
  padding:8px 10px;margin:0 0 2px;border-left:2px solid var(--foil2);
  background:var(--surface2);color:var(--muted);font-size:12px;line-height:1.5;
}
.skill-note b{color:var(--text);font-weight:600;}
.skill-summary{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px 22px;
  justify-items:center;text-align:center;
  padding:10px 2px 12px;
}
.skill-summary>span{display:flex;flex-direction:column;align-items:center;gap:2px;}
.skill-summary .lab{color:var(--muted);font-size:11px;letter-spacing:0.5px;}
.skill-summary .val{
  font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--foil1);
}
.skill-summary .val.alt{color:var(--gold);}
.visibility-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--surface2);border:1px solid var(--line);border-radius:999px;
  padding:6px 12px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;
}
.visibility-pill.is-public{color:var(--foil1);border-color:var(--foil1);}
.visibility-pill.is-private{color:var(--gold);border-color:var(--gold);}
.skillmap{max-width:340px;margin:0 auto 14px;}
.skillmap svg{width:100%;height:auto;display:block;overflow:visible;}

/* ---------- Binder Shelf ---------- */
.shelfentry{
  margin:0 0 14px;padding:13px 15px;border-radius:10px;cursor:pointer;
  background:var(--surface2);border:1px solid var(--foil1);
  box-shadow:0 0 10px rgba(57,255,20,0.18);
  display:flex;align-items:center;justify-content:space-between;
}
.shelfentry-label{
  font-family:var(--font-display);font-weight:800;font-size:13px;
  letter-spacing:0.04em;text-transform:uppercase;color:var(--foil1);
}
.shelfentry-sub{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;}
.iconbtn{
  width:28px;height:28px;flex:0 0 auto;border-radius:7px;border:1px solid var(--line);
  background:var(--surface2);color:var(--text);font-size:16px;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
}
.shelfwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 0 30px;}
.shelfstage{position:relative;padding-top:22px;width:100%;max-width:520px;}
.shelf-lighting{
  position:absolute;top:-14px;left:0;right:0;height:120px;
  background:radial-gradient(ellipse 80% 100% at 50% 0%, rgba(255,255,255,0.10), transparent 72%);
  pointer-events:none;
}
.shelfcase{position:relative;display:flex;flex-direction:column;}
.shelfrow{display:flex;gap:6px;align-items:flex-end;}
/* Placeholder end caps - a spot for real bookend art later without
   touching the row layout. */
.bookend{
  width:12px;flex:0 0 auto;align-self:stretch;border-radius:4px;
  background:linear-gradient(180deg,var(--surface2),var(--surface));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.05), 0 8px 14px rgba(0,0,0,0.5);
}
.spine{
  flex:1 1 0;min-width:0;height:190px;border-radius:8px 8px 4px 4px;
  display:flex;align-items:center;justify-content:center;padding:8px 0;
  cursor:pointer;position:relative;overflow:hidden;
  border:1px solid rgba(0,0,0,0.4);
  box-shadow:0 8px 14px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.06);
}
.spine-texture{
  position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;
  background-image:
    repeating-linear-gradient(112deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(22deg, rgba(255,255,255,0.10) 0 1px, transparent 1px 3px);
}
.spine-shine{
  position:absolute;top:0;left:6%;width:16%;height:100%;
  background:linear-gradient(180deg,rgba(255,255,255,0.28),rgba(255,255,255,0));
  pointer-events:none;
}
.spine-name{
  writing-mode:vertical-rl;text-orientation:mixed;font-size:16px;
  font-family:var(--font-display);font-weight:800;
  letter-spacing:0.06em;text-transform:uppercase;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-height:100%;
  text-shadow:0 1px 2px rgba(0,0,0,0.25);
}
.spine-empty{background:transparent;border:1.5px dashed var(--line);color:var(--muted);box-shadow:none;}
.spine-plus{font-size:20px;font-weight:700;color:var(--muted);}
.shelfledge{
  height:12px;border-radius:0 0 4px 4px;
  background:linear-gradient(180deg,var(--surface2),var(--surface));
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 6px 12px rgba(0,0,0,0.5);
}
.shelfhint{text-align:center;font-size:11px;color:var(--muted);}

/* ---------- Binder color picker: a hexagon of hexagons, PokeHex-style ---------- */
.hexwrap{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 0;}
.hexrow{display:flex;gap:5px;}
.hexrow:not(:first-child){margin-top:-7px;}
.hexrow:nth-child(even){margin-left:18px;}
.swatch{
  width:32px;aspect-ratio:1;cursor:pointer;
  clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.18);
  transition:transform 0.12s ease;
}
.swatch.sel{
  filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 9px rgba(57,255,20,0.65));
  transform:scale(1.16);
}

/* ---------- Binder Page View ---------- */
.reorderhint{font-size:11px;color:var(--muted);text-align:center;margin:0 0 12px;line-height:1.4;min-height:1.4em;}
.reorderhint.active{color:var(--foil1);}
/* One continuous plastic page tinted with the binder's own color, not nine
   separate floating tiles - the borders between pockets are seams in that
   one sheet, and it gets a single diagonal sheen rather than each card
   getting its own. */
.sheet3x3{
  position:relative;overflow:hidden;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:0;aspect-ratio:3/4;max-width:420px;margin:0 auto 18px;border-radius:12px;
  background:var(--pbg, rgba(255,255,255,0.035));
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:inset 0 0 30px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.45);
}
.sheet3x3::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,0.09) 46%,rgba(255,255,255,0.02) 58%,transparent 75%);
}
.pocket{
  position:relative;display:flex;align-items:flex-end;justify-content:center;
  min-width:0;min-height:0;padding:6px 6px 8px;cursor:pointer;
  border-right:1px solid rgba(255,255,255,0.12);border-bottom:1px solid rgba(255,255,255,0.12);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;
}
.pocket:nth-child(3n){border-right:none;}
.pocket:nth-child(n+7){border-bottom:none;}
/* Cards are pushed in from the top of the pocket, so a strip of clear page
   shows above them, with a lip highlight marking the opening. */
.pocket-lip{position:absolute;top:5px;left:18%;right:18%;height:2px;border-radius:2px;background:rgba(255,255,255,0.24);pointer-events:none;z-index:2;}
.sleeve{position:relative;width:100%;height:88%;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;}
.sleeve .dexslot{width:auto;height:100%;aspect-ratio:3/4;padding:4px;}
.pocket .lifted-note{
  display:none;position:absolute;inset:0;align-items:center;justify-content:center;
  text-align:center;font-size:10px;line-height:1.3;color:var(--foil1);
  background:rgba(6,6,14,0.75);padding:6px;z-index:3;
}
.pocket.mid-lift .sleeve{opacity:0.15;}
.pocket.mid-lift .lifted-note{display:flex;}
.pocket .swap-badge{
  position:absolute;top:50%;left:8%;right:8%;transform:translateY(-50%);z-index:4;
  text-align:center;background:rgba(6,6,14,0.85);color:var(--foil1);
  font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:0.03em;
  border-radius:5px;padding:4px 0;
}
.pocket-empty{display:flex;align-items:center;justify-content:center;}
.pocket-empty .pocket-note{font-size:10px;color:var(--muted);text-align:center;line-height:1.3;pointer-events:none;}
.pocket-empty.place-target{box-shadow:inset 0 0 0 2px var(--foil1), 0 0 10px rgba(57,255,20,0.35);}
.pocket-empty.place-target .pocket-note{color:var(--foil1);}
/* Every valid target says up front what tapping it does - there's no
   hover-then-decide on touch, so a blocked pocket (filing onto an occupied
   one) has to look inert before the tap, not after. */
.pocket.blocked{opacity:0.4;cursor:default;}
.pagenav{display:flex;align-items:center;justify-content:center;gap:16px;margin:6px 0 20px;}
.pagenavbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:16px;cursor:pointer;}
.pagenavbtn:disabled{opacity:0.3;cursor:default;}
.pageindicator{font-size:11px;color:var(--muted);}
.carrytag{color:var(--foil1);margin-left:4px;}
.carrybar{
  position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:10px;max-width:396px;margin:0 auto;
  background:var(--surface2);border:1px solid var(--foil1);border-radius:10px;
  padding:8px 10px;box-shadow:0 0 14px rgba(57,255,20,0.25),0 8px 20px rgba(0,0,0,0.5);
  z-index:45;
}
.carrybar-thumb{
  width:36px;height:36px;flex:0 0 auto;border-radius:6px;overflow:hidden;
  background:var(--surface);border:1.5px solid var(--slot-color,var(--rare));
  display:flex;align-items:center;justify-content:center;
}
.carrybar-thumb img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;}
.carrytext{flex:1;min-width:0;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---------- Binder Inspect: hold the card to tilt it ---------- */
.inspect-overlay .closex{z-index:2;}
.inspect-glow{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:340px;height:340px;border-radius:50%;
  filter:blur(30px);opacity:0.55;pointer-events:none;z-index:0;
}
@media (min-width:721px){ .inspect-glow{width:420px;height:420px;} }
.inspect-card-wrap{position:relative;z-index:1;cursor:grab;touch-action:none;}
.inspect-card-wrap .already-owned-badge{display:none;}
.inspect-card-wrap .flame-aura{animation:none;box-shadow:none;}
.inspect-card-wrap .card-slot{width:210px;height:292px;user-select:none;-webkit-user-select:none;}
@media (min-width:721px){ .inspect-card-wrap .card-slot{width:260px;height:361px;} }

/* ---------- Dex -> binder filing sheet ---------- */
.dexgrid .dexslot.owned{cursor:pointer;}
.chooserow{
  display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;
  background:var(--surface2);border:1px solid var(--line);cursor:pointer;
  text-align:left;font-family:inherit;color:var(--text);width:100%;
}
.chooserow:disabled{opacity:0.45;cursor:default;}
.chooserow-dot{width:14px;height:14px;border-radius:4px;flex:0 0 auto;}
.chooserow-num{font-size:11px;color:var(--muted);flex:0 0 auto;}
.chooserow-text{flex:1;min-width:0;font-size:12.5px;}
.chooserow-name{font-size:12.5px;font-weight:700;}
.chooserow-sub{font-size:10px;color:var(--muted);margin-top:1px;}
.chooserow-thumb{position:relative;width:32px;height:32px;flex:0 0 auto;}

/* Filed-in-a-binder marker. Bottom-left everywhere so it never collides with
   a shiny star (top-right).
   The icon itself is white line art, so a white glow just bleeds into it -
   a dark shadow only, for contrast against light sprites and the art behind it. */
.filed-badge{
  pointer-events:none;z-index:3;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,0.9)) drop-shadow(0 0 3px rgba(0,0,0,0.75));
}
.chooserow-filed-badge{position:absolute;left:-6px;bottom:-6px;width:20px;height:20px;}
.dexslot-filed-badge{position:absolute;right:3px;bottom:3px;width:24px;height:24px;}

<body>
<div id="app"></div>
<script>
(function(){

// ---------- Supabase config ----------
// Fill these in with your own project's values (Project Settings > API in the Supabase dashboard).
const SUPABASE_URL = 'https://tiqtsxlavdxswpqponsv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ClOzUl8Nj3z9R02gDc91cA_r8TMa4rA';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- auth state & UI ----------
let authUser = null;      // current logged-in Supabase user, or null
let authMode = 'signin';  // 'signin' | 'signup'
let authBusy = false;
let authMsg = null;       // {type:'err'|'ok', text}
let needsUsername = false;
let usernameMsg = null;
let usernameCheckTimer = null;

// null = unknown, true = available, false = taken by someone else
async function isUsernameAvailable(username, forUserId){
  // case-insensitive, matching the lower(username) unique index server-side.
  // ilike treats '_' as a single-character wildcard in SQL, and usernames
  // are allowed to contain underscores - escape it so "dungeon_master"
  // only matches that exact string, not "dungeonXmaster" for any X
  const escaped = username.replace(/_/g, '\\_');
  const { data, error } = await sb.from('profiles').select('user_id').ilike('username', escaped).maybeSingle();
  if(error) return null;
  if(!data) return true;
  return data.user_id === forUserId;
}

async function saveUsername(username){
  const { error } = await sb.from('profiles').upsert({ user_id: authUser.id, username });
  return { ok: !error, error };
}

// The single place a profile row ever gets created or changed - used both
// for brand-new signups and for existing accounts that don't have a
// username yet. One code path means no risk of two competing inserts.
function renderUsernameGate(){
  const el = document.getElementById('app');
  el.innerHTML = `
    <div class="authwrap">
      <div class="authcard">
        <div class="brand-hexmark auth-hexmark"></div>
        <h1>Choose a username</h1>
        <p class="sub">This is how you'll appear on leaderboards. 3-20 characters: letters, numbers, underscores.</p>
        <form id="usernameform">
          <div class="authfield">
            <label>Username</label>
            <input type="text" id="usernameInput" autocomplete="off" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+" />
          </div>
          <div id="usernameStatus" style="font-size:12px;min-height:16px;"></div>
          <button type="submit" class="authbtn" id="usernameSubmitBtn">Save username</button>
        </form>
        ${usernameMsg ? `<div class="authmsg ${usernameMsg.type}">${usernameMsg.text}</div>` : ''}
      </div>
    </div>
  `;
  const input = document.getElementById('usernameInput');
  const status = document.getElementById('usernameStatus');
  const checkNow = ()=>{
    clearTimeout(usernameCheckTimer);
    const val = input.value.trim();
    if(val.length < 3){ status.textContent=''; return; }
    if(!/^[a-zA-Z0-9_]{3,20}$/.test(val)){ status.textContent='Letters, numbers, underscores only.'; status.style.color='#ff4444'; return; }
    status.textContent = 'Checking…'; status.style.color='var(--muted)';
    usernameCheckTimer = setTimeout(async ()=>{
      const available = await isUsernameAvailable(val, authUser ? authUser.id : null);
      if(input.value.trim() !== val) return; // stale response, input changed since
      if(available === true){ status.textContent='Available'; status.style.color='#39ff14'; }
      else if(available === false){ status.textContent='Already taken'; status.style.color='#ff4444'; }
      else { status.textContent=''; }
    }, 400);
  };
  input.oninput = checkNow;

  document.getElementById('usernameform').onsubmit = async (e)=>{
    e.preventDefault();
    const val = input.value.trim();
    if(!/^[a-zA-Z0-9_]{3,20}$/.test(val)){
      usernameMsg = { type:'err', text:'3-20 characters: letters, numbers, underscores only.' };
      renderUsernameGate();
      return;
    }
    const btn = document.getElementById('usernameSubmitBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    const { ok, error } = await saveUsername(val);
    if(!ok){
      usernameMsg = { type:'err', text: (error && (error.code === '23505' || (error.message||'').includes('duplicate')))
        ? 'That username was just taken - try another.'
        : 'Could not save username - try again.' };
      renderUsernameGate();
      return;
    }
    needsUsername = false;
    usernameMsg = null;
    loadState(); // proceed into the actual game now that a profile exists
  };
}

function renderAuth(){
  const el = document.getElementById('app');
  el.innerHTML = `
    <div class="authwrap">
      <div class="authcard">
        <div class="brand-hexmark auth-hexmark"></div>
        <h1>PokéHex</h1>
        <p class="sub">${authMode==='signin' ? 'Sign in to load your vault' : 'Create an account to save your progress'}</p>
        <form id="authform">
          <div class="authfield">
            <label>Email</label>
            <input type="email" id="authEmail" autocomplete="email" required />
          </div>
          <div class="authfield">
            <label>Password</label>
            <input type="password" id="authPassword" autocomplete="${authMode==='signin'?'current-password':'new-password'}" minlength="6" required />
          </div>
          <button type="submit" class="authbtn" ${authBusy?'disabled':''}>
            ${authBusy ? 'Please wait…' : (authMode==='signin' ? 'Sign in' : 'Create account')}
          </button>
        </form>
        <button class="authtoggle" id="authToggleBtn">
          ${authMode==='signin' ? "No account yet? Create one" : "Already have an account? Sign in"}
        </button>
        ${authMsg ? `<div class="authmsg ${authMsg.type}">${authMsg.text}</div>` : ''}
        ${!authUser ? `<button class="authtoggle" id="authBackBtn" style="margin-top:4px;">&larr; Back to browsing</button>` : ''}
      </div>
    </div>
  `;
  document.getElementById('authToggleBtn').onclick = ()=>{
    authMode = authMode==='signin' ? 'signup' : 'signin';
    authMsg = null;
    renderAuth();
  };
  const backBtn = document.getElementById('authBackBtn');
  if(backBtn) backBtn.onclick = ()=>{ authMsg = null; render(); };

  document.getElementById('authform').onsubmit = async (e)=>{
    e.preventDefault();
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    authBusy = true; authMsg = null; renderAuth();
    try{
      if(authMode==='signin'){
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
        // onAuthStateChange will pick up the session and boot the game
      } else {
        const { data, error } = await sb.auth.signUp({ email, password });
        if(error) throw error;
        if(!data.session){
          authBusy = false;
          authMsg = { type:'ok', text:'Check your email to confirm your account, then sign in.' };
          authMode = 'signin';
          renderAuth();
          return;
        }
        // the username gate (triggered by onAuthStateChange below) is the
        // single place that ever writes a profile row - it prompts on first
        // sign-in, once there's a real session to write with
      }
    }catch(err){
      authBusy = false;
      authMsg = { type:'err', text: err.message || 'Something went wrong.' };
      renderAuth();
    }
  };
}

async function signOut(){
  await sb.auth.signOut();
  // onAuthStateChange handles returning to the guest browsing view
}

// Gate for any action that changes state - guests get sent to the signup screen instead.
function requireAuth(){
  if(!authUser){
    authMode = 'signup';
    authMsg = null;
    renderAuth();
    return false;
  }
  return true;
}

sb.auth.onAuthStateChange(async (event, session)=>{
  const user = session ? session.user : null;
  const wasLoggedIn = !!authUser;
  authUser = user;
  if(user && !wasLoggedIn){
    authBusy = false; authMsg = null;
    const { data: profile } = await sb.from('profiles').select('username').eq('user_id', user.id).maybeSingle();
    if(!profile){
      needsUsername = true;
      renderUsernameGate();
    } else {
      loadState(); // boots the real, saved game state now that we have a user
    }
  } else if(!user && wasLoggedIn){
    // user just signed out - drop back to guest browsing of the Packs page, not the login screen
    authBusy = false;
    state = { hex:0, dex:{}, instances:[], collectibles:{}, lastSpinAt:null, valueHistory:[], longHistory:[] };
    profileStats = null; profileUsername = null; profileSkills = null; profileLoading = false;
    view = 'open';
    render();
  }
  // if !user && !wasLoggedIn (e.g. no session on initial load), leave whatever's already on screen alone
});

// Badges are earned by completing a type, not bought.
// Ownership is derived from state.dex at render time, so a badge is lost
// if the last copy of a species is sold. Progress is computed client-side
// for instant feedback; the server function get_collectibles() is the
// authority wherever a badge grants something.
//
// SOURCE OF TRUTH WARNING: this array is mirrored by the `collectibles`
// table in Supabase. id, name, criteria->>'type' and difficulty must match
// there. Changing one alone fails silently -- the page just renders wrong.
// Badge color is TYPE_COLORS[type]; there are no per-badge color vars.

// need counts are derived from POKEMON, never hardcoded, so expanding the
// card pool cannot leave a badge permanently uncompletable.
const BADGE_POOLS = BADGES.reduce((acc,b)=>{
  acc[b.id] = POKEMON.filter(p=>p.type===b.type).map(p=>p.id);
  return acc;
}, {});

// Returns {have, need, owned} for one badge, from current dex ownership.
function badgeProgress(badgeId, dex){
  const pool = BADGE_POOLS[badgeId] || [];
  const d = dex || {};
  let have = 0;
  for (const id of pool) if (d[id]) have++;
  return { have, need: pool.length, owned: pool.length > 0 && have === pool.length };
}

// Count of fully earned badges. Display only -- anything that grants
// something must recompute server-side.
function earnedBadgeCount(dex){
  return BADGES.reduce((n,b)=>n + (badgeProgress(b.id, dex).owned ? 1 : 0), 0);
}

// Badge grid. Lives on the Stats page. Locked badges stay visible but unlit --
// a hidden goal is not a goal.
//
// Difficulty is rendered on the tile face, not only in the title tooltip:
// tooltips do not exist on touch, and difficulty is the one thing that stops
// a player misreading the bar. 10/15 on Marsh looks closer than 8/11 on Earth
// and is hundreds of packs further away, because four of the missing Psychics
// are secrets. Stars are ordinal so they survive at 8px where words would not.
const BADGE_STARS = {'Gym Leader':1, 'Elite Four':2, 'Champion':3};

function renderBadgeGrid(dex){
  return `<div class="dexgrid">
    ${BADGES.map(item=>{
      const pr = badgeProgress(item.id, dex);
      const color = TYPE_COLORS[item.type];
      const pct = pr.need ? Math.round((pr.have / pr.need) * 100) : 0;
      const stars = BADGE_STARS[item.difficulty] || 0;
      return `<div class="dexslot badgeslot ${pr.owned?'owned':''}" style="--slot-color:${color};" title="${esc(item.name + ' - ' + item.difficulty + '. ' + item.desc)}">
        <span class="num mono" style="${pr.owned?`color:${color};`:''}">${esc(item.type.toUpperCase())}</span>
        <span class="diff mono" aria-label="${esc(item.difficulty)}">${'&#9733;'.repeat(stars)}</span>
        <div class="glyph" style="display:flex;align-items:center;justify-content:center;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="${pr.owned?`filter: drop-shadow(0 0 4px ${color});`:'opacity:0.35;'}"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="nm" style="${pr.owned?'':'color:var(--muted);'}">${esc(item.name.replace(/ Badge$/,''))}</div>
        <span class="cnt mono" style="${pr.owned?`color:${color};`:''}">${pr.owned?'COMPLETE':`${pr.have}/${pr.need}`}</span>
        <div class="badgebar"><i style="width:${pct}%;background:${color};"></i></div>
      </div>`;
    }).join('')}
  </div>`;
}

// Returns {cls, wordmark}. state.equippedBack is server-authoritative once the
// column exists; undefined today, so live behavior is unchanged.
function resolveCardBack(){
  const eq = state.equippedBack ? cardBackById(state.equippedBack) : null;
  if(eq) return { cls: 'back-' + eq.id, wordmark: eq.wordmark !== false };
  const pid = (opening && opening.pack) ? opening.pack.id : null;
  const cls = pid === 'basic' ? 'theme-basic' : (pid === 'whale' ? 'theme-whale' : '');
  return { cls, wordmark: true };
}

const MARKET_EPOCH = Date.parse('2024-01-01T00:00:00Z');
const MARKET_WAVES = [
  { periodMs: 5    * 60*60*1000, amp: 0.35, phase: 1.1 }, // long supercycle (~5h)
  { periodMs: 41  * 60*1000,    amp: 0.15, phase: 2.7 }, // medium swing (~41m)
  { periodMs: 9    * 60*1000,    amp: 0.07, phase: 4.2 }, // short jitter (~9m)
];
const MARKET_HELD_BONUS_CAP = 0.30;      // max +30%
const MARKET_HELD_BONUS_RATE = 0.01;     // per hour held
// Display/UX only. The real cap is the game_states_v2_favorite_uids_max3 check
// constraint plus set_favorite_slot(); changing this number alone will NOT let
// a player set a 4th - the database will reject it. Change both together.
const FAVORITE_SLOTS = 3;
const MARKET_MULT_FLOOR = 0.15;          // guard against near-zero/negative payouts

function marketIndexAt(t){
  let idx = 1;
  MARKET_WAVES.forEach(w=>{
    idx += w.amp * Math.sin((2*Math.PI*(t-MARKET_EPOCH))/w.periodMs + w.phase);
  });
  return idx;
}
function marketPhaseFor(idx){
  if(idx >= 1.15) return {label:'BULL MARKET', color:'var(--foil1)'};
  if(idx <= 0.85) return {label:'BEAR MARKET', color:'#ff4444'};
  return {label:'NEUTRAL', color:'var(--muted)'};
}
function heldBonusFor(hoursHeld){
  return Math.min(MARKET_HELD_BONUS_CAP, Math.max(0,hoursHeld) * MARKET_HELD_BONUS_RATE);
}
function cardMultiplier(hoursHeld, tNow){
  return Math.max(MARKET_MULT_FLOOR, marketIndexAt(tNow) + heldBonusFor(hoursHeld));
}
// Client-side mirror of the server's effective_card_value() - display/estimate
// only, the server recalculates authoritatively on every payout. Shiny and
// holo multiply independently, so a card can be both (10 * 3 = 30x).
function effectiveCardValue(baseValue, shiny, holo){
  return baseValue * (shiny ? 10 : 1) * (holo ? 3 : 1);
}

async function loadState(){
  try{
    // ensure a row exists for brand-new accounts (idempotent - safe to call every load)
    await sb.rpc('ensure_game_state');

    const { data, error } = await sb
      .from('game_states_v2')
      .select('hex, dex, instances, collectibles, last_spin_at, value_history, long_history, favorite_uids, equipped_back')
      .eq('user_id', authUser.id)
      .maybeSingle();
    if(error) throw error;

    if(data){
      state = {
        hex: data.hex,
        dex: data.dex || {},
        instances: data.instances || [],
        collectibles: data.collectibles || {},
        lastSpinAt: data.last_spin_at ? new Date(data.last_spin_at).getTime() : null,
        valueHistory: data.value_history || [],
        longHistory: data.long_history || [],
        // slots may point at cards that have since been liquidated - deliberate.
        // a favorite is not protected from selling, so every reader must
        // treat a uid that no longer resolves as an empty slot. order is
        // meaningful: index 0 is slot 1.
        favoriteUids: Array.isArray(data.favorite_uids) ? data.favorite_uids : [],
        equippedBack: data.equipped_back || null
      };
    } else {
      // shouldn't happen given ensure_game_state() above, but fail safe
      state = { hex:2500, dex:{}, instances:[], collectibles:{}, lastSpinAt:null, valueHistory:[], longHistory:[], favoriteUids:[] };
    }
  }catch(e){
    console.error('load failed', e);
    toast('Could not load your saved data - starting fresh this session.');
    state = { hex:2500, dex:{}, instances:[], collectibles:{}, lastSpinAt:null, valueHistory:[], longHistory:[], favoriteUids:[] };
  }

  if(state.lastSpinAt===undefined) state.lastSpinAt = null;
  if(state.collectibles===undefined) state.collectibles = {};
  if(state.instances===undefined) state.instances = [];
  if(state.valueHistory===undefined) state.valueHistory = [];
  if(state.longHistory===undefined) state.longHistory = [];

  // Binders live in their own table, not game_states_v2 - they're not
  // economy state (nothing reads them back to compute HEX or ownership),
  // so the client reads/writes this one directly instead of through an
  // RPC. A failure here shouldn't block the rest of the game from loading.
  try{
    const { data: binderRow, error: binderErr } = await sb
      .from('player_binders')
      .select('binders')
      .eq('user_id', authUser.id)
      .maybeSingle();
    if(binderErr) throw binderErr;
    state.binders = (binderRow && Array.isArray(binderRow.binders)) ? binderRow.binders : [];
  }catch(e){
    console.error('binder load failed', e);
    state.binders = [];
  }

  // Friend requests/friendships - see loadFriendRequests(). Same
  // fail-safe-and-continue treatment as binders: a failure here shouldn't
  // block the rest of the game from loading.
  await loadFriendRequests();
  await loadMessages();

  recordVaultValue();
  render();
}

function calculateCurrentVaultValue(){
  const instances = state.instances || [];
  const now = Date.now();
  let total = 0;
  instances.forEach(inst => {
    const p = POKEMON.find(x => x.id === inst.id);
    if(!p) return;
    const hoursHeld = Math.max(0, (now - (inst.acquiredAt || now)) / (1000 * 60 * 60));
    const multiplier = cardMultiplier(hoursHeld, now);
    const baseValue = effectiveCardValue(p.value, inst.shiny, inst.holo);
    total += Math.max(1, Math.round(baseValue * multiplier));
  });
  return total;
}

function recordVaultValue(){
  const now = Date.now();
  const currentVal = calculateCurrentVaultValue();
  if(!state.valueHistory) state.valueHistory = [];
  if(!state.longHistory) state.longHistory = [];

  const lastEntry = state.valueHistory[state.valueHistory.length - 1];
  if(!lastEntry || (now - lastEntry.time > 10000) || lastEntry.val !== currentVal){
    state.valueHistory.push({ time: now, val: currentVal });
    if(state.valueHistory.length > 30) state.valueHistory.shift();
  }

  const LONG_INTERVAL_MS = 5 * 60 * 1000;
  const lastLong = state.longHistory[state.longHistory.length - 1];
  if(!lastLong || (now - lastLong.time > LONG_INTERVAL_MS)){
    state.longHistory.push({ time: now, val: currentVal });
    if(state.longHistory.length > 5000) state.longHistory.shift();
  }
}

let packBusy = false;
async function openPack(pack){
  if(!requireAuth()) return;
  if(packBusy) return;
  if(state.hex < pack.price) return toast("Not enough HEX for that pack.");
  packBusy = true;
  try{
    const { data, error } = await sb.rpc('open_pack', { p_pack_id: pack.id });
    if(error){
      // server is authoritative on the balance check too - it may reject
      // even if the client's local number looked sufficient (e.g. stale cache)
      toast(error.message.includes('insufficient') ? "Not enough HEX for that pack." : "Couldn't open that pack - try again.");
      return;
    }
    // rate limit refusal comes back as a normal result, not an error, so the
    // server can log it. Nothing was charged.
    if(data.rate_limited){
      toast(`Slow down - try again in ${data.retry_after_s}s.`);
      return;
    }
    // server already rolled + charged; enrich with local cosmetic data (type/sprite) for display only
    const cards = data.cards.map(c=>{
      const p = POKEMON.find(x=>x.id===c.id);
      return { ...c, type: p.type, sprite: p.sprite };
    });
    opening = {pack, cards, flipped:[], stage:'closed', keep:cards.map(()=>true), openingId:data.opening_id};
    // mirror the server's deduction locally so the rest of the (not-yet-migrated) UI stays in sync
    state.hex -= pack.price;
    recordVaultValue();
    saveState();
    render();
  } finally {
    packBusy = false;
  }
}
let finalizeBusy = false;
async function finalizeOpening(){
  if(finalizeBusy) return;
  finalizeBusy = true;
  const keepSnapshot = opening.keep;
  const openingId = opening.openingId;
  try{
    const { error } = await sb.rpc('finalize_pack_opening', {
      p_opening_id: openingId,
      p_keep: keepSnapshot
    });
    if(error){
      toast("Couldn't finalize that opening - try again.");
      return;
    }
    // the server has already committed dex/instances/hex, so read those rows
    // back instead of rebuilding them locally. a hand-maintained object literal
    // silently drops every server-generated field it doesn't happen to list -
    // that's how uid, shiny and hasShiny all went missing - whereas a re-read
    // picks up anything the server writes, including fields added later.
    const { data: fresh, error: readErr } = await sb
      .from('game_states_v2')
      .select('hex, dex, instances')
      .eq('user_id', authUser.id)
      .maybeSingle();

    if(readErr || !fresh){
      // finalize already succeeded, so the pending row is gone and this opening
      // must not be retried. close it out, but leave local state untouched
      // rather than writing values we already know are stale - in particular
      // skip recordVaultValue(), which would persist a wrong point to the chart.
      console.error('post-finalize re-read failed', readErr);
      opening = null;
      view='open';
      render();
      toast('Your cards are saved - reload the page to see them.');
      return;
    }

    state.hex = fresh.hex;
    state.dex = fresh.dex || {};
    state.instances = fresh.instances || [];
    opening = null;
    recordVaultValue();
    saveState();
    view='open';
    render();
  } finally {
    finalizeBusy = false;
  }
}

function canSpin(){ return !state.lastSpinAt || (Date.now()-state.lastSpinAt) >= WHEEL_COOLDOWN; }
function fmtCountdown(ms){
  const s = Math.max(0,Math.floor(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return `${h>0?h+':':''}${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function spinStatusText(){
  if(canSpin()) return 'Ready';
  return fmtCountdown(WHEEL_COOLDOWN - (Date.now()-state.lastSpinAt));
}

// start-up rather than on every note.
let muted = false;
try{ muted = localStorage.getItem('pokehex_muted') === '1'; }catch(e){}
function setMuted(v){
  muted = v;
  try{ localStorage.setItem('pokehex_muted', v ? '1' : '0'); }catch(e){}
}
let actx;
function ac(){ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function tone(freq,dur,type,gain,delay){
  if(muted) return;
  try{
    const c = ac(); const t0 = c.currentTime+(delay||0);
    const osc = c.createOscillator(); const g = c.createGain();
    osc.type = type||'sine'; osc.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(gain||0.08,t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }catch(e){}
}
// Noise is what a tear and a card flip actually are - neither is a pitch, so
// neither can be built from tone(). One shared buffer is reused for every
// burst; regenerating white noise per sound is wasteful and sounds identical.
let noiseBuf;
function noiseBuffer(c){
  if(noiseBuf) return noiseBuf;
  const n = Math.floor(c.sampleRate*0.5);
  noiseBuf = c.createBuffer(1,n,c.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
  return noiseBuf;
}
// dur seconds of filtered noise, sweeping the band from f0 to f1.
// `swell` is the fraction of dur at which the sound peaks. Left off it attacks
// in 8ms and decays, which is a hit. Set near 0.7 and it crescendos instead -
// that difference is what separates a drum from a tearing sound.
function noise(dur,f0,f1,gain,q,delay,swell){
  if(muted) return;
  try{
    const c = ac(); const t0 = c.currentTime+(delay||0);
    const src = c.createBufferSource(); src.buffer = noiseBuffer(c); src.loop = true;
    const bp = c.createBiquadFilter(); bp.type='bandpass';
    bp.Q.setValueAtTime(q||1.6,t0);
    bp.frequency.setValueAtTime(f0,t0);
    bp.frequency.exponentialRampToValueAtTime(Math.max(60,f1),t0+dur);
    const g = c.createGain();
    const peak = t0 + (swell ? dur*swell : 0.008);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(gain||0.05,peak);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    g.gain.setValueAtTime(0,t0+dur);   // true silence, not an asymptote
    src.connect(bp); bp.connect(g); g.connect(c.destination);
    src.start(t0); src.stop(t0+dur+0.01);
  }catch(e){}
}
// A short tone that bends in pitch. A bubble pop is a rising bend, not a hit.
function blip(f0,f1,dur,gain,delay,type){
  if(muted) return;
  try{
    const c = ac(); const t0 = c.currentTime+(delay||0);
    const osc = c.createOscillator(); const g = c.createGain();
    osc.type = type||'sine';
    osc.frequency.setValueAtTime(f0,t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(gain||0.03,t0+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }catch(e){}
}

// A bubble pop through paper: a soft rising bend with a breath of air around
// it. Every percussive layer is gone - no contact burst, no low body sines.
// Those were the drum. `vary` detunes a dealt run so five do not sound like one.
function flipSound(delay,vary){
  const d = delay||0, v = vary||1;
  noise(0.10,1300*v,520*v,0.016,1.2,d,0.45);   // breath, swelling not hitting
  blip(300*v,560*v,0.055,0.03,d+0.02);          // the pop
  blip(600*v,880*v,0.03,0.012,d+0.022);         // paper edge, faint
}
// Shiny fanfare: a fast major arpeggio on squares, then the octave held with
// a fifth above it and a sparkle tail. Squares rather than triangles because
// the rarity chimes are triangles - this has to cut through one, not blend
// into it. Kept under half a second so it lands before the next card.
function shinySound(delay){
  const d = delay||0;
  [[523.25,0],[659.25,0.05],[783.99,0.10],[1046.50,0.15]]
    .forEach(([f,t])=>tone(f,0.10,'square',0.021,d+t));
  tone(1046.50,0.30,'square',0.025,d+0.215);
  tone(1567.98,0.32,'square',0.013,d+0.225);
  blip(1900,2700,0.20,0.0085,d+0.24,'triangle');
}
function revealSound(rarity,delay){
  const d = delay||0;
  const base = {common:440,uncommon:520,rare:600,ultra:820,secret:980}[rarity]||440;
  tone(base,0.18,'triangle',0.07,d);
  if(rarity==='ultra'||rarity==='secret'){ tone(base*1.5,0.3,'triangle',0.06,d+0.08); tone(base*2,0.4,'sine',0.05,d+0.16); }
}

function burstConfetti(){
  const colors = ['#39ff14','#9d4edd','#c77dff','#f0d9ff'];
  for(let i=0;i<26;i++){
    const el = document.createElement('div');
    el.className='confetti';
    el.style.left = (45+Math.random()*10)+'vw';
    el.style.background = colors[i%colors.length];
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(el);
    const dur = 1200+Math.random()*900;
    const drift = (Math.random()-0.5)*300;
    el.animate([
      {transform:`translate(0,0) rotate(0deg)`,opacity:1},
      {transform:`translate(${drift}px, 100vh) rotate(720deg)`,opacity:0}
    ],{duration:dur,easing:'ease-in'});
    setTimeout(()=>el.remove(),dur+50);
  }
}

let toastTimer;
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.innerHTML = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Per-species shiny hue. A single fixed rotation made every shiny read blue:
// sprite palettes cluster in the warm 20-60 band, so one constant shift maps
// that narrow band onto an equally narrow cyan band. The golden angle spreads
// sequential dex ids across the whole wheel instead, so adjacent tiles never
// match. Deterministic from id, so a species always shows the same shiny.
function shinyHue(id){
  const DEAD = 22; // skip rotations near 0/360 - they'd look unshifted
  const raw = (Number(id) * 137.508) % 360;
  return Math.round(DEAD + raw * (360 - 2*DEAD) / 360);
}

function vaultChartInner(history){
  const width = 880;
  const height = 140;
  const padTop = 15;
  const padBottom = 20;
  const padLeft = 45;
  const padRight = 20;

  const innerW = width - padLeft - padRight;
  const innerH = height - padTop - padBottom;

  const vals = history.map(h => h.val);
  const minVal = 0;
  const maxVal = Math.max(100, ...vals) * 1.15;

  const points = history.map((h, i) => {
    const x = padLeft + (history.length === 1 ? innerW / 2 : (i / (history.length - 1)) * innerW);
    const y = padTop + innerH - ((h.val - minVal) / (maxVal - minVal)) * innerH;
    return { x, y, val: h.val };
  });

  const pathD = points.length === 1
    ? `M ${points[0].x} ${points[0].y} L ${points[0].x} ${points[0].y}`
    : points.reduce((acc, p, i) => i === 0 ? `M ${p.x} ${p.y}` : `${acc} L ${p.x} ${p.y}`, '');

  const areaD = points.length === 1
    ? `M ${padLeft} ${padTop + innerH} L ${points[0].x} ${points[0].y} L ${padLeft + innerW} ${padTop + innerH} Z`
    : `${pathD} L ${points[points.length - 1].x} ${padTop + innerH} L ${points[0].x} ${padTop + innerH} Z`;

  const showDots = points.length <= 60;

  const svgInner = `
    <defs>
      <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--foil1)" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="var(--foil2)" stop-opacity="0.0"/>
      </linearGradient>
    </defs>
    <line x1="${padLeft}" y1="${padTop}" x2="${width - padRight}" y2="${padTop}" stroke="var(--line)" stroke-dasharray="3,3" />
    <line x1="${padLeft}" y1="${padTop + innerH / 2}" x2="${width - padRight}" y2="${padTop + innerH / 2}" stroke="var(--line)" stroke-dasharray="3,3" />
    <line x1="${padLeft}" y1="${padTop + innerH}" x2="${width - padRight}" y2="${padTop + innerH}" stroke="var(--line)" />

    <text x="${padLeft - 6}" y="${padTop + 4}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono" text-anchor="end">${fmtHex(Math.round(maxVal))}</text>
    <text x="${padLeft - 6}" y="${padTop + innerH + 4}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono" text-anchor="end">0</text>

    <path d="${areaD}" fill="url(#chartGrad)" />
    <path d="${pathD}" fill="none" stroke="var(--foil1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 4px rgba(57,255,20,0.5));" />

    ${showDots ? points.map(p => `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="var(--foil2)" stroke="var(--foil1)" stroke-width="1.5" />`).join('') : ''}
  `;

  return { svgInner, width, height };
}

function vaultChartHistoryForMode(){
  if(vaultChartMode === 'all'){
    return (state.longHistory && state.longHistory.length > 0)
      ? state.longHistory
      : [{ time: Date.now(), val: calculateCurrentVaultValue() }];
  }
  return (state.valueHistory && state.valueHistory.length > 0)
    ? state.valueHistory
    : [{ time: Date.now(), val: calculateCurrentVaultValue() }];
}

// Two lines on one axis: the do-nothing baseline (2500 + all wheel income,
// from get_pnl_series) and vault value over the same window (from longHistory).
// Above the baseline means opening packs beat never opening one.
function pnlChartInner(series, vaultHist){
  const width = 880, height = 140;
  const padTop = 15, padBottom = 20, padLeft = 55, padRight = 20;
  const innerW = width - padLeft - padRight;
  const innerH = height - padTop - padBottom;

  const pts = (series && series.points) || [];
  if(pts.length < 2) return { svgInner:'', width, height, empty:true };

  const t0 = pts[0].t, t1 = pts[pts.length-1].t;
  const span = Math.max(1, t1 - t0);

  // sample vault history onto the baseline's time axis - the two series are
  // recorded independently and never share timestamps
  const vh = (vaultHist || []).filter(h => h.time >= t0 && h.time <= t1)
                              .sort((a,b) => a.time - b.time);
  let vi = 0;
  const vaultAt = (t) => {
    if(!vh.length) return null;
    while(vi < vh.length - 1 && vh[vi+1].time <= t) vi++;
    return vh[vi].time <= t ? vh[vi].val : null;
  };

  const rows = pts.map(p => ({ t:p.t, base:Number(p.baseline), vault:vaultAt(p.t) }));
  const maxVal = Math.max(100, ...rows.map(r => Math.max(r.base, r.vault || 0))) * 1.12;

  const X = (t) => padLeft + ((t - t0) / span) * innerW;
  const Y = (v) => padTop + innerH - (v / maxVal) * innerH;

  const pathOf = (key) => {
    let d = '', started = false;
    rows.forEach(r => {
      const v = r[key];
      if(v === null || v === undefined) return;
      d += (started ? ' L ' : 'M ') + X(r.t).toFixed(1) + ' ' + Y(v).toFixed(1);
      started = true;
    });
    return d;
  };

  const gridVals = [0, maxVal*0.25, maxVal*0.5, maxVal*0.75, maxVal];
  const grid = gridVals.map(v => `
    <line x1="${padLeft}" y1="${Y(v).toFixed(1)}" x2="${width-padRight}" y2="${Y(v).toFixed(1)}"
          stroke="var(--line)" stroke-dasharray="3,3" />
    <text x="${padLeft-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end"
          font-family="'JetBrains Mono',monospace" font-size="8" fill="var(--muted)">${fmtHex(Math.round(v))}</text>`).join('');

  const lastVault = [...rows].reverse().find(r => r.vault !== null);
  const svgInner = `
    ${grid}
    <path d="${pathOf('base')}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5,4" />
    <path d="${pathOf('vault')}" fill="none" stroke="var(--foil1)" stroke-width="2.5" />
    ${lastVault ? `<circle cx="${X(lastVault.t).toFixed(1)}" cy="${Y(lastVault.vault).toFixed(1)}" r="3" fill="var(--foil1)" />` : ''}
  `;
  return { svgInner, width, height, empty:false };
}

function updateVaultFeedLive() {
  if (view !== 'market') return;

  const currentTotal = calculateCurrentVaultValue();
  const balanceValEl = document.querySelector('.balance .val');
  if (balanceValEl) {
    balanceValEl.innerHTML = `<i class="hex-icon"></i>${fmtHex(state.hex)}`;
  }

  const chartContainer = document.querySelector('.wrap');
  if (chartContainer && chartContainer.querySelector('#vaultChartSvg')) {
    const history = vaultChartHistoryForMode();
    const { svgInner } = vaultChartInner(history);

    const svgElement = chartContainer.querySelector('#vaultChartSvg');
    if (svgElement) {
      svgElement.innerHTML = svgInner;
    }

    const headerValLabel = chartContainer.querySelector('#vaultTotalVal');
    if (headerValLabel) {
      headerValLabel.innerHTML = `<i class="hex-icon"></i>${fmtHex(currentTotal)} HEX`;
    }
  }

  const idxSvg = document.getElementById('marketIdxSvg');
  if(idxSvg){
    const nowT = Date.now();
    const { svgInner, phase, idxNow } = marketIndexChartParts(nowT);
    idxSvg.innerHTML = svgInner;
    const labelEl = document.getElementById('marketPhaseLabel');
    const valEl = document.getElementById('marketPhaseVal');
    if(labelEl){ labelEl.textContent = phase.label; labelEl.style.color = phase.color; }
    if(valEl){ valEl.textContent = (idxNow*100).toFixed(0); valEl.style.color = phase.color; }
  }

  // Update real-time liquidation price estimates live in the DOM
  const now = Date.now();
  (state.instances || []).forEach(inst => {
    const el = document.getElementById(`price-inst-${inst.uid}`);
    if (el) {
      const p = POKEMON.find(x => x.id === inst.id);
      if (p) {
        const hoursHeld = Math.max(0, (now - (inst.acquiredAt || now)) / (1000 * 60 * 60));
        const multiplier = cardMultiplier(hoursHeld, now);
        const baseValue = effectiveCardValue(p.value, inst.shiny, inst.holo);
        const payout = Math.max(1, Math.round(baseValue * multiplier));
        el.innerHTML = `<i class="hex-icon"></i>~${fmtHex(payout)}`;
      }
    }
  });

  // Species stack totals. Collapsed stacks hide their instance rows, so without
  // this the headline number a player is actually reading would sit frozen
  // while the market moved underneath it.
  {
    const stacks = {};
    (state.instances || []).forEach(inst => {
      const p = POKEMON.find(x => x.id === inst.id);
      if (!p) return;
      const hoursHeld = Math.max(0, (now - (inst.acquiredAt || now)) / (1000 * 60 * 60));
      const baseValue = effectiveCardValue(p.value, inst.shiny, inst.holo);
      const payout = Math.max(1, Math.round(baseValue * cardMultiplier(hoursHeld, now)));
      const key = `${inst.rarity}-${inst.id}`;
      stacks[key] = (stacks[key] || 0) + payout;
    });
    Object.entries(stacks).forEach(([key, total]) => {
      const el = document.getElementById(`price-species-${key}`);
      if (el) el.innerHTML = `<i class="hex-icon"></i>~${fmtHex(total)}`;
    });
  }

  ['secret', 'ultra', 'rare', 'uncommon', 'common'].forEach(tier => {
    const el = document.getElementById(`price-tier-${tier}`);
    if (el) {
      let totalPayout = 0;
      (state.instances || []).forEach(inst => {
        if (inst.rarity === tier) {
          const p = POKEMON.find(x => x.id === inst.id);
          if (p) {
            const hoursHeld = Math.max(0, (now - (inst.acquiredAt || now)) / (1000 * 60 * 60));
            const multiplier = cardMultiplier(hoursHeld, now);
            const baseValue = effectiveCardValue(p.value, inst.shiny, inst.holo);
            totalPayout += Math.max(1, Math.round(baseValue * multiplier));
          }
        }
      });
      el.innerHTML = `<i class="hex-icon"></i>~${fmtHex(totalPayout)}`;
    }
  });
}

function computeMarketIndexSeries(now){
  const windowPastMs = 2*60*60*1000;
  const windowFutureMs = 3*60*60*1000;
  const totalMs = windowPastMs + windowFutureMs;
  const steps = 120;
  const points = [];
  for(let i=0;i<=steps;i++){
    const t = now - windowPastMs + (totalMs * i / steps);
    points.push({ t, idx: marketIndexAt(t) });
  }
  return points;
}

function marketIndexChartParts(now){
  const points = computeMarketIndexSeries(now);
  const width=880, height=140, padTop=15, padBottom=20, padLeft=45, padRight=20;
  const innerW = width-padLeft-padRight, innerH = height-padTop-padBottom;
  const vals = points.map(p=>p.idx);
  const minVal = Math.min(0.3, ...vals) - 0.05;
  const maxVal = Math.max(1.7, ...vals) + 0.05;
  const t0 = points[0].t, t1 = points[points.length-1].t;
  const xForT = t => padLeft + ((t-t0)/(t1-t0)) * innerW;
  const yForV = v => padTop + innerH - ((v-minVal)/(maxVal-minVal)) * innerH;
  const nowX = xForT(now);
  const baselineY = yForV(1);

  const pastPts = points.filter(p=>p.t<=now);
  const futurePts = points.filter(p=>p.t>now);
  if(futurePts.length && pastPts.length) futurePts.unshift(pastPts[pastPts.length-1]);

  const pathFor = pts => pts.length ? pts.reduce((acc,p,i)=> i===0 ? `M ${xForT(p.t)} ${yForV(p.idx)}` : `${acc} L ${xForT(p.t)} ${yForV(p.idx)}`, '') : '';

  const idxNow = marketIndexAt(now);
  const phase = marketPhaseFor(idxNow);

  const svgInner = `
    <line x1="${padLeft}" y1="${baselineY}" x2="${width-padRight}" y2="${baselineY}" stroke="var(--muted)" stroke-dasharray="2,4" />
    <text x="${padLeft-6}" y="${baselineY+3}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono" text-anchor="end">100%</text>
    <path d="${pathFor(pastPts)}" fill="none" stroke="${phase.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="${pathFor(futurePts)}" fill="none" stroke="${phase.color}" stroke-width="2" stroke-dasharray="5,5" opacity="0.6" stroke-linecap="round" />
    <line x1="${nowX}" y1="${padTop}" x2="${nowX}" y2="${padTop+innerH}" stroke="var(--gold)" stroke-width="1.5" />
    <text x="${nowX}" y="${padTop-4}" fill="var(--gold)" font-size="9" font-family="JetBrains Mono" text-anchor="middle">NOW</text>
  `;
  return { svgInner, phase, idxNow };
}

function renderMarketIndexChart(){
  const now = Date.now();
  const { svgInner, phase, idxNow } = marketIndexChartParts(now);
  return `
    <div style="background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:20px;">
