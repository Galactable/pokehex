<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PokéHex</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains-Mono:wght@400;500;700&display=swap');

:root{
  --bg:#07090a;
  --surface:#0e130f;
  --surface2:#141b16;
  --line:#243026;
  --text:#c8f5cc;
  --muted:#5d7a63;
  --foil1:#39ff14;
  --foil2:#9d4edd;
  --gold:#c77dff;
  --common:#5d7a63;
  --uncommon:#39ff14;
  --rare:#9d4edd;
  --ultra:#6bff5c;
  --secret:#f0d9ff;
  /* Kanto Badge Colors */
  --boulder-col:#9e9e9e;
  --cascade-col:#00bcd4;
  --thunder-col:#ffeb3b;
  --rainbow-col:#e91e63;
  --soul-col:#9c27b0;
  --marsh-col:#ff5722;
  --volcano-col:#f44336;
  --earth-col:#795548;
}
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
}
#app{
  background:
    repeating-linear-gradient(to bottom, rgba(57,255,20,0.025) 0px, rgba(57,255,20,0.025) 1px, transparent 1px, transparent 3px),
    radial-gradient(circle at 50% -10%, #101a12 0%, var(--bg) 55%);
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  min-height:100vh;
  padding:20px 16px 60px;
  box-sizing:border-box;
  overflow-x:hidden;
  position:relative;
}
*{box-sizing:border-box;}
.mono{font-family:'JetBrains Mono',monospace;}
.disp{font-family:'VT323',monospace;font-weight:400;letter-spacing:0.04em;text-transform:uppercase;color:var(--foil1);text-shadow:0 0 8px rgba(57,255,20,0.45);}

/* ---------- currency cube icon ---------- */
.hex-icon {
  display: inline-block;
  width: 14px;
  height: 16px;
  background: transparent;
  position: relative;
  vertical-align: middle;
  margin-right: 3px;
}
.hex-icon::before {
  content: '';
  position: absolute;
  top: 0;
  left: 3px;
  width: 8px;
  height: 6px;
  background: var(--foil1);
  clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
  z-index: 2;
}
.hex-icon::after {
  content: '';
  position: absolute;
  inset: 0;
  background: 
    linear-gradient(135deg, var(--foil1), var(--foil2)),
    #000000;
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
}

/* ---------- header ---------- */
.topbar{
  display:grid;
  grid-template-columns: 1fr auto 1fr;
  align-items:center;
  max-width:920px;
  margin:0 auto 22px;
  gap:10px;
}
.brand{display:flex;align-items:center;gap:10px; justify-self:center; grid-column: 2; position:relative;}
.brand-hexmark{
  width:44px;height:50px;
  position:relative;
  justify-self:start;
  grid-column: 1;
  filter: drop-shadow(0 0 10px rgba(57,255,20,0.4));
}
.brand-hexmark::before{
  content:'';
  position:absolute;
  top:0; left:9px;
  width:26px; height:20px;
  background:var(--foil1);
  clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
  z-index:2;
}
.brand-hexmark::after{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(135deg, var(--foil1), var(--foil2)),
    #000000;
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
}
.brand div:not(.brand-hexmark) { text-align: center; }

/* Slime Title with Sparkles & Floating Dust Particles */
.brand h1,
.authcard h1 {
  font-size: 42px;
  margin: 0;
  font-family: 'VT323', monospace;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--foil1);
  text-shadow: 0 0 12px rgba(57, 255, 20, 0.7), 0 0 25px rgba(57, 255, 20, 0.4);
  text-transform: uppercase;
  position: relative;
  display: inline-block;
}

.brand h1::before,
.brand h1::after,
.authcard h1::before,
.authcard h1::after {
  content: '';
  position: absolute;
  pointer-events: none;
  border-radius: 50%;
}

.brand h1::before,
.authcard h1::before {
  inset: -8px -12px;
  background: 
    radial-gradient(circle 3px at 15% 20%, var(--foil1) 0%, transparent 70%),
    radial-gradient(circle 2.5px at 85% 70%, var(--gold) 0%, transparent 70%),
    radial-gradient(circle 2px at 45% 85%, var(--foil1) 0%, transparent 70%),
    radial-gradient(circle 3.5px at 90% 15%, var(--gold) 0%, transparent 70%),
    radial-gradient(circle 2px at 10% 80%, var(--foil1) 0%, transparent 70%);
  animation: slimeSparkle 2.2s ease-in-out infinite alternate;
  z-index: 2;
}

.brand h1::after,
.authcard h1::after {
  inset: -14px -18px;
  background: 
    radial-gradient(circle 1.5px at 30% 30%, rgba(57, 255, 20, 0.9) 0%, transparent 100%),
    radial-gradient(circle 1px at 70% 40%, rgba(199, 125, 255, 0.8) 0%, transparent 100%),
    radial-gradient(circle 1.2px at 50% 10%, rgba(57, 255, 20, 0.9) 0%, transparent 100%),
    radial-gradient(circle 1.5px at 20% 60%, rgba(199, 125, 255, 0.8) 0%, transparent 100%),
    radial-gradient(circle 1px at 80% 80%, rgba(57, 255, 20, 0.9) 0%, transparent 100%);
  animation: floatDust 3.5s linear infinite;
  z-index: 2;
}

@keyframes slimeSparkle {
  0% { opacity: 0.5; filter: drop-shadow(0 0 2px var(--foil1)); transform: scale(0.98); }
  100% { opacity: 1; filter: drop-shadow(0 0 8px var(--gold)); transform: scale(1.02); }
}

@keyframes floatDust {
  0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
  50% { transform: translateY(-5px) translateX(3px); opacity: 0.9; }
  100% { transform: translateY(-10px) translateX(-2px); opacity: 0.3; }
}

.brand span{color:var(--muted);font-size:11px;display:block;letter-spacing:0.12em;text-transform:uppercase;margin-top:2px;}

.balance{
  background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:8px 16px;display:flex;align-items:center;gap:10px;
  justify-self:end;
  grid-column: 3;
  white-space:nowrap;
  flex-wrap:nowrap;
}
.balance .tick{color:var(--muted);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;}
.balance .val{
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;color:var(--gold);
}
.cta-account-row{
  display:flex;justify-content:center;max-width:920px;margin:0 auto 24px;
}
.cta-account-link{
  background:transparent;
  border:none;
  color:var(--foil2);
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:12px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  text-decoration:none;
  cursor:pointer;
  padding:4px;
}
.cta-account-link:hover{text-shadow:0 0 8px rgba(157,78,221,0.6);}

.navrow{display:flex;justify-content:center;gap:8px;max-width:920px;margin:0 auto 24px;flex-wrap:wrap;}
.navbtn{
  background:transparent;border:1px solid var(--line);color:var(--muted);
  padding:8px 16px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:600;
  transition:all .15s;
}
.navbtn.active{background:var(--surface2);color:var(--text);border-color:var(--foil1);}
.navbtn:hover{color:var(--text);}

.wrap{max-width:920px;margin:0 auto;}

/* ---------- store ---------- */
.section-label{font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px;}
.packgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;}
.packcard{
  background:linear-gradient(160deg,var(--surface),var(--surface2));
  border:1px solid var(--line);border-radius:16px;padding:20px;
  position:relative;overflow:hidden;cursor:pointer;transition:transform .18s,border-color .18s;
}
.packcard:hover{transform:translateY(-3px);border-color:var(--foil1);}
.packcard::after{
  content:'';position:absolute;inset:0;opacity:0.08;pointer-events:none;
  background:var(--pack-glow,linear-gradient(135deg,var(--foil1),var(--foil2)));
}
.pack-name{font-family:'VT323',monospace;font-weight:400;font-size:19px;margin:0 0 4px;}
.pack-desc{color:var(--muted);font-size:12.5px;margin:0 0 14px;line-height:1.4;min-height:34px;}
.pack-odds{font-size:11px;color:var(--muted);margin-bottom:14px;line-height:1.6;}
.pack-odds b{color:var(--text);}
.pack-price{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;flex-wrap:wrap;
}
.price-tag{
  font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--gold);font-size:16px;
}
.buybtn{
  background:var(--foil2);color:#fff;border:none;border-radius:8px;
  padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer;
  box-shadow:0 0 10px rgba(157,78,221,0.4);
}
.buybtn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;box-shadow:none;}
.sellbtn{
  background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:8px;
  padding:8px 12px;font-weight:700;font-size:12px;cursor:pointer;
}
.sellbtn:hover{background:rgba(199,125,255,0.1);}

/* ---------- pack theme variants ---------- */
:root{
  --luxe-gold:#d4af37;
  --luxe-gold2:#f5cf6b;
}

/* Basic Pack - black / slime green */
.packcard.theme-basic{background:linear-gradient(160deg,#050605,#0b0f0a);border-color:var(--foil1);}
.packcard.theme-basic:hover{border-color:var(--foil1);box-shadow:0 0 16px rgba(57,255,20,0.25);}
.packcard.theme-basic .pack-name{color:var(--foil1);text-shadow:0 0 6px rgba(57,255,20,0.5);}
.packcard.theme-basic::after{background:linear-gradient(135deg,var(--foil1),#0a0a0a);opacity:0.12;}

.pack-visual.theme-basic{background:linear-gradient(160deg,#050605,#0b0f0a);border-color:var(--foil1);}
.pack-visual.theme-basic .mark{color:var(--foil1);text-shadow:0 0 8px rgba(57,255,20,0.6);}

.card-back.theme-basic{background:repeating-linear-gradient(45deg,#050505,#050505 8px,#150a24 8px,#150a24 16px);}
.card-back.theme-basic span{color:var(--foil1);}

/* Whale Vault - gold luxury */
.packcard.theme-whale{background:linear-gradient(160deg,#1a1408,#0d0a04);border-color:var(--luxe-gold);}
.packcard.theme-whale:hover{border-color:var(--luxe-gold2);box-shadow:0 0 18px rgba(212,175,55,0.35);}
.packcard.theme-whale .pack-name{color:var(--luxe-gold2);text-shadow:0 0 8px rgba(212,175,55,0.6);}
.packcard.theme-whale::after{background:linear-gradient(135deg,var(--luxe-gold),var(--luxe-gold2));opacity:0.14;}

.pack-visual.theme-whale{background:linear-gradient(160deg,#1a1408,#0d0a04);border-color:var(--luxe-gold);}
.pack-visual.theme-whale .mark{color:var(--luxe-gold2);text-shadow:0 0 10px rgba(212,175,55,0.7);}
.pack-visual.theme-whale .sheen{background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,0.25) 35%,rgba(212,175,55,0.5) 45%,rgba(245,207,107,0.4) 55%,transparent 70%);}

.card-back.theme-whale{background:repeating-linear-gradient(45deg,#1a1408,#1a1408 8px,#0d0a04 8px,#0d0a04 16px);}
.card-back.theme-whale span{color:var(--luxe-gold2);text-shadow:0 0 6px rgba(212,175,55,0.6);}

/* Diamond Pack - white/light-grey border instead of the default green */
.packcard.theme-diamond:hover{border-color:#e6e6e6;box-shadow:0 0 16px rgba(230,230,230,0.25);}
.pack-visual.theme-diamond{border-color:#e6e6e6;}

/* ---------- dex ---------- */
.dexhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:12px;}
.dexhead-left{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;}
.dexhead-left h2{font-family:'VT323',monospace;font-size:26px;margin:0;letter-spacing:0.03em;text-transform:uppercase;}
.dexcount{color:var(--muted);font-size:13px;}

/* Rarity Key Legend */
.rarity-key{
  display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:6px 12px;
}
.key-item{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);font-weight:500;}
.key-dot{width:8px;height:8px;border-radius:50%;background:var(--dot-color, var(--muted));}

.dexgrid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;
}
.dexslot{
  aspect-ratio:3/4;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10px;color:var(--muted);position:relative;padding:4px;text-align:center;
}
.stat-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px;
}
.stat-row:last-child{border-bottom:none;}
.dexslot.owned{border-color:var(--slot-color,var(--rare));background:var(--surface2);color:var(--text);}
.dexslot .num{position:absolute;top:4px;left:6px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);}
.dexslot .glyph{
  width:60px;height:60px;border-radius:0;margin-bottom:3px;
  background:transparent;display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.dexslot .glyph img{
  width:56px;height:56px;object-fit:contain;image-rendering:pixelated;
}
.dexslot .nm{font-weight:600;font-size:10px;line-height:1.15;}
.dexslot .cnt{font-size:9px;margin-top:2px;color:var(--muted);}

/* ---------- opening overlay ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(6,6,14,0.94);backdrop-filter:blur(6px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:50;padding:20px;
}
.pack-stage{display:flex;flex-direction:column;align-items:center;gap:22px;}
.pack-visual{
  width:170px;height:240px;border-radius:16px;position:relative;cursor:pointer;
  background:linear-gradient(160deg,#1a1a36,#0d0d1e);
  border:1px solid var(--line);
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  display:flex;align-items:center;justify-content:center;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1);
  overflow:hidden;
}
.pack-visual .sheen{
  position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,0.18) 35%,rgba(57,255,20,0.35) 45%,rgba(157,78,221,0.3) 55%,transparent 70%);
  background-size:250% 250%;animation:sheenmove 3.2s linear infinite;
}
@keyframes sheenmove{0%{background-position:0% 0%;}100%{background-position:100% 100%;}}
.pack-visual .mark{
  font-family:'VT323',monospace;
  font-weight:400;
  font-size:22px;
  color:var(--text);
  letter-spacing:0.05em;
  z-index:1;
  text-align:center;
  padding:0 12px;
}
.pack-visual.ripping{animation:ripshake .35s ease;}
@keyframes ripshake{
  0%,100%{transform:translateX(0) rotate(0);}
  20%{transform:translateX(-6px) rotate(-2deg);}
  40%{transform:translateX(6px) rotate(2deg);}
  60%{transform:translateX(-4px) rotate(-1deg) scale(1.03);}
  80%{transform:translateX(4px) rotate(1deg) scale(1.06);}
}
.pack-hint{color:var(--muted);font-size:13px;letter-spacing:0.04em;text-align:center;}

.reveal-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:900px;}
.card-slot-wrapper{display:flex;flex-direction:column;align-items:center;gap:4px;}
.already-owned-badge{
  font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:var(--gold);
  background:rgba(199,125,255,0.15);border:1px solid var(--gold);padding:2px 6px;border-radius:4px;
  letter-spacing:0.05em;text-transform:uppercase;height:18px;display:flex;align-items:center;
}
.card-slot{perspective:900px;width:130px;height:180px;}
.card-inner{
  position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.3,.9,.4,1);cursor:pointer;
}
.card-slot.flipped .card-inner{transform:rotateY(180deg);}
.card-face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;
  display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);
}
.card-back{
  background:repeating-linear-gradient(45deg,#161630,#161630 8px,#1c1c38 8px,#1c1c38 16px);
  display:flex;align-items:center;justify-content:center;
}
.card-back span{font-family:'VT323',monospace;font-weight:400;color:var(--foil1);font-size:13px;letter-spacing:0.1em;opacity:0.8;}
.card-front{
  transform:rotateY(180deg);
  background:linear-gradient(165deg,var(--surface2),var(--surface));
  border-width:2px;border-style:solid;border-color:var(--card-color,var(--common));
  padding:8px;justify-content:space-between;
}
.card-front.shine::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,0.35) 45%,rgba(57,255,20,0.4) 50%,rgba(157,78,221,0.35) 55%,transparent 70%);
  background-size:220% 220%;animation:sheenmove 2.4s linear infinite;
  mix-blend-mode:screen;
}

/* ---------- shiny palette swap ---------- */
/* Static hue rotation on the sprite itself - deliberately NOT animated, so it
   reads differently from .shine / .flame-aura used for high-value rarity tiers.
   Applies to pack-reveal card faces (.cf-glyph) and dex tiles (.glyph). */
.shiny-card .cf-glyph img,
.shiny-card .glyph img{
  filter: hue-rotate(150deg) saturate(1.25);
}

/* ---------- white sparkle overlay for shiny (1-in-4096) card variants ---------- */
/* Distinct from .shine (rarity-tier glow) so a shiny ultra/secret shows both */
.shiny-sparkle-overlay{
  position:absolute;inset:0;pointer-events:none;z-index:2;
  background-image:
    radial-gradient(circle, #fff 1px, transparent 1.5px),
    radial-gradient(circle, #fff 1px, transparent 1.5px),
    radial-gradient(circle, #fff 1.5px, transparent 2px),
    radial-gradient(circle, #fff 1px, transparent 1.5px);
  background-size: 40px 40px, 60px 60px, 80px 80px, 50px 50px;
  background-position: 10px 15px, 40px 60px, 70px 20px, 20px 80px;
  animation: shinytwinkle 1.8s ease-in-out infinite;
  mix-blend-mode:screen;
}
@keyframes shinytwinkle{
  0%,100%{ opacity:0.35; }
  50%{ opacity:0.95; }
}
.shiny-label{
  position:absolute;top:4px;right:4px;z-index:3;
  font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;
  color:#0b0b14;background:#fff;padding:2px 5px;border-radius:4px;
  letter-spacing:0.05em;text-transform:uppercase;
  box-shadow:0 0 6px 2px rgba(255,255,255,0.7);
}

/* ---------- purple flame aura for ultra/secret tier cards ---------- */
.flame-aura{
  animation: flamePulse 1.6s ease-in-out infinite alternate;
}
@keyframes flamePulse{
  0%{ box-shadow: 0 0 8px 2px rgba(157,78,221,0.5), 0 0 20px 6px rgba(157,78,221,0.28); }
  100%{ box-shadow: 0 0 16px 5px rgba(199,125,255,0.85), 0 0 34px 12px rgba(157,78,221,0.55); }
}
.cf-top{display:flex;justify-content:space-between;align-items:center;font-size:9px;z-index:1;}
.cf-num{font-family:'JetBrains Mono',monospace;color:var(--muted);}
.cf-type{
  padding:2px 6px;border-radius:6px;font-weight:700;font-size:8px;text-transform:uppercase;
  color:#0b0b14;background:var(--type-color,#999);
}
.cf-glyph{
  width:88px;height:88px;border-radius:0;margin:0 auto;
  background:transparent;align-self:center;
  box-shadow:none;
  display:flex;align-items:center;justify-content:center;
  z-index:1;overflow:hidden;
}
.cf-glyph img{
  width:84px;height:84px;object-fit:contain;image-rendering:pixelated;
}
.cf-bottom{z-index:1;text-align:center;}
.cf-name{font-family:'VT323',monospace;font-weight:400;font-size:13px;}
.cf-rarity{font-size:8.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--card-color,var(--common));font-weight:700;}
.cf-value{
  font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--gold);margin-top:2px;
}

.summary-panel{
  margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:18px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:520px;
}
.summary-total{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--muted);}
.summary-total b{
  color:var(--gold);
}
.summary-actions{display:flex;gap:10px;}
.sbtn{border:none;border-radius:8px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;}
.sbtn.keep{background:var(--foil2);color:#fff;box-shadow:0 0 10px rgba(157,78,221,0.4);}
.sbtn.sell{background:var(--surface2);color:var(--gold);border:1px solid var(--gold);}
.closex{position:absolute;top:18px;right:22px;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  padding:10px 18px;font-size:13px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;
  color: var(--foil2);
}
.toast.show{opacity:1;}

.confetti{position:fixed;top:-10px;width:8px;height:8px;z-index:60;pointer-events:none;border-radius:2px;}

.footer-actions{display:flex;justify-content:center;gap:16px;margin-top:34px;}
.reset-link{color:var(--muted);font-size:11px;background:none;border:none;cursor:pointer;text-decoration:underline;}

/* ---------- vertical terminal wheel ---------- */
.wheel-overlay-stage{display:flex;flex-direction:column;align-items:center;gap:18px;}
.term-slot-frame{
  position:relative;width:280px;height:140px;background:var(--surface);
  border:2px solid var(--foil1);border-radius:12px;overflow:hidden;
  box-shadow:0 0 24px rgba(57,255,20,0.25), inset 0 0 16px rgba(0,0,0,0.8);
}
.term-slot-frame::before{
  content:'';position:absolute;top:0;left:0;right:0;height:45px;
  background:linear-gradient(to bottom, rgba(7,9,10,0.9), transparent);
  pointer-events:none;z-index:3;
}
.term-slot-frame::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:45px;
  background:linear-gradient(to top, rgba(7,9,10,0.9), transparent);
  pointer-events:none;z-index:3;
}
.term-pointer-line{
  position:absolute;top:50%;left:0;right:0;height:2px;margin-top:-1px;
  background:var(--foil1);box-shadow:0 0 8px var(--foil1);z-index:4;pointer-events:none;
}
.term-strip{
  position:absolute;top:0;left:0;width:100%;
  display:flex;flex-direction:column;align-items:center;
  will-change:transform;
}
.term-item{
  height:46px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--gold);
  letter-spacing:0.05em;border-bottom:1px dashed var(--line);
}
.spin-btn{
  background:var(--foil2);color:#fff;border:none;border-radius:8px;
  padding:12px 26px;font-weight:700;font-size:13px;cursor:pointer;font-family:'JetBrains Mono',monospace;
  box-shadow:0 0 12px rgba(157,78,221,0.4);
}
.spin-btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;box-shadow:none;}
.wheel-result{
  font-family:'JetBrains Mono',monospace;font-size:28px;color:var(--gold);
}

/* Slippage Warning Container and Items */
.slippage-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.slippage-notice {
  background: rgba(255, 170, 0, 0.08);
  border: 1px dashed #ffaa00;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 11.5px;
  color: #ffca66;
  display: flex;
  align-items: center;
  gap: 10px;
}
.slippage-notice div {
  flex: 1;
  line-height: 1.4;
  white-space: normal;
  word-wrap: break-word;
}

/* ---------- auth screen ---------- */
.authwrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:
    repeating-linear-gradient(to bottom, rgba(57,255,20,0.025) 0px, rgba(57,255,20,0.025) 1px, transparent 1px, transparent 3px),
    radial-gradient(circle at 50% -10%, #101a12 0%, var(--bg) 55%);
  color:var(--text);font-family:'JetBrains Mono',monospace;padding:20px;box-sizing:border-box;
}
.authcard{
  width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:28px 24px;text-align:center;
}
.authcard h1{font-size:36px;margin:0 auto 4px;text-align:center;}
.auth-hexmark{margin:0 auto 14px;}
.authcard p.sub{color:var(--muted);font-size:12px;text-align:center;margin:0 0 20px;}
.authfield{margin-bottom:12px;text-align:left;}
.authfield label{display:block;font-size:11px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px;}
.authfield input{
  width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:10px 12px;font-family:'JetBrains Mono',monospace;font-size:14px;
}
.authfield input:focus{outline:none;border-color:var(--foil1);}
.authbtn{
  width:100%;background:var(--foil2);color:#fff;border:none;border-radius:8px;
  padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;margin-top:6px;
  box-shadow:0 0 10px rgba(157,78,221,0.4);
}
.authbtn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;box-shadow:none;}
.authtoggle{
  background:transparent;border:none;color:var(--muted);font-size:12px;cursor:pointer;
  width:100%;text-align:center;margin-top:14px;text-decoration:underline;
}
.authmsg{font-size:12px;text-align:center;margin-top:12px;line-height:1.4;}
.authmsg.err{color:#ff6b6b;}
.authmsg.ok{color:var(--foil1);}
.signoutbtn-row{
  max-width:920px;
  margin:24px auto 0;
  display:flex;
  justify-content:flex-end;
}
.signoutbtn{
  display:inline-block;
  width:auto;
  background:transparent;
  border:none;
  color:var(--foil1);
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:12px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  text-decoration:none;
  cursor:pointer;
  padding:4px 0;
}
.signoutbtn:hover{text-shadow:0 0 8px rgba(57,255,20,0.6);}

/* ---------- responsive ---------- */

/* Kill sideways scroll outright. If something overflows, this contains it
   instead of letting it drag the whole page off-screen. */
html,body{ max-width:100%; overflow-x:hidden; }

/* Grid/flex children default to min-width:auto and refuse to shrink below
   their content - one long uid or number then forces the page wide. */
.wrap, .topbar, .navrow, .packgrid, .dexgrid,
.packcard, .dexslot, .dexhead, .dexhead-left{ min-width:0; }

/* Long unbroken strings (uids, big HEX values, usernames) wrap instead of overflowing. */
.mono, .nm, .cnt, .num{ overflow-wrap:anywhere; }

@media (max-width: 720px){
  #app{ padding:12px; }

  /* The 1fr auto 1fr header is the main offender - collapse it to a
     single centred column so nothing gets crushed. */
  .topbar{
    grid-template-columns:1fr;
    justify-items:center;
    gap:12px;
    text-align:center;
  }
  .brand{ grid-column:1; justify-self:center; }

  .packgrid{ grid-template-columns:1fr; }
  .dexgrid{ grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:8px; }
}

@media (max-width: 420px){
  #app{ padding:10px; }
  .card-slot{ width:104px; height:144px; }
  .pack-visual{ width:140px; height:198px; }
  .dexgrid{ grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); }
}

<script>
(function(){

// ---------- Supabase config ----------

const SUPABASE_URL = 'https://tiqtsxlavdxswpqponsv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpcXRzeGxhdmR4c3dwcXBvbnN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MDU5MjYsImV4cCI6MjEwMzE4MTkyNn0.U7tw2Gdao2SQHginORMRydS1vrU_3sQeUkzKv9Q1_Rs';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- auth state & UI ----------
let authUser = null;      // current logged-in Supabase user, or null
let authMode = 'signin';  // 'signin' | 'signup'
let authBusy = false;
let authMsg = null;       // {type:'err'|'ok', text}
let needsUsername = false;
let pendingUsername = ''; // carried over from the signup form to prefill the gate
let usernameMsg = null;
let usernameCheckTimer = null;

// null = unknown, true = available, false = taken by someone else
async function isUsernameAvailable(username, forUserId){
  // case-insensitive, matching the lower(username) unique index server-side.
  // ilike treats '_' as a single-character wildcard in SQL, and usernames
  // are allowed to contain underscores - escape it so "dungeon_master"
  // only matches that exact string, not "dungeonXmaster" for any X
  const escaped = username.replace(/_/g, '\\_');
  const { data, error } = await sb.from('profiles').select('user_id').ilike('username', escaped).maybeSingle();
  if(error) return null;
  if(!data) return true;
  return data.user_id === forUserId;
}

async function saveUsername(username){
  const { error } = await sb.from('profiles').upsert({ user_id: authUser.id, username });
  return { ok: !error, error };
}

// The single place a profile row ever gets created or changed - used both
// for brand-new signups and for existing accounts that don't have a
// username yet. One code path means no risk of two competing inserts.
function renderUsernameGate(){
  const el = document.getElementById('app');
  el.innerHTML = `
    <div class="authwrap">
      <div class="authcard">
        <div class="brand-hexmark auth-hexmark"></div>
        <h1>Choose a username</h1>
        <p class="sub">This is how you'll appear on leaderboards. 3-20 characters: letters, numbers, underscores.</p>
        <form id="usernameform">
          <div class="authfield">
            <label>Username</label>
            <input type="text" id="usernameInput" autocomplete="off" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+" value="${esc(pendingUsername)}" />
          </div>
          <div id="usernameStatus" style="font-size:12px;min-height:16px;"></div>
          <button type="submit" class="authbtn" id="usernameSubmitBtn">Save username</button>
        </form>
        ${usernameMsg ? `<div class="authmsg ${usernameMsg.type}">${usernameMsg.text}</div>` : ''}
      </div>
    </div>
  `;
  const input = document.getElementById('usernameInput');
  const status = document.getElementById('usernameStatus');
  const checkNow = ()=>{
    clearTimeout(usernameCheckTimer);
    const val = input.value.trim();
    if(val.length < 3){ status.textContent=''; return; }
    if(!/^[a-zA-Z0-9_]{3,20}$/.test(val)){ status.textContent='Letters, numbers, underscores only.'; status.style.color='#ff4444'; return; }
    status.textContent = 'Checking…'; status.style.color='var(--muted)';
    usernameCheckTimer = setTimeout(async ()=>{
      const available = await isUsernameAvailable(val, authUser ? authUser.id : null);
      if(input.value.trim() !== val) return; // stale response, input changed since
      if(available === true){ status.textContent='Available'; status.style.color='#39ff14'; }
      else if(available === false){ status.textContent='Already taken'; status.style.color='#ff4444'; }
      else { status.textContent=''; }
    }, 400);
  };
  input.oninput = checkNow;
  if(pendingUsername) checkNow();

  document.getElementById('usernameform').onsubmit = async (e)=>{
    e.preventDefault();
    const val = input.value.trim();
    if(!/^[a-zA-Z0-9_]{3,20}$/.test(val)){
      usernameMsg = { type:'err', text:'3-20 characters: letters, numbers, underscores only.' };
      renderUsernameGate();
      return;
    }
    const btn = document.getElementById('usernameSubmitBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    const { ok, error } = await saveUsername(val);
    if(!ok){
      usernameMsg = { type:'err', text: (error && error.message && error.message.includes('duplicate'))
        ? 'That username was just taken - try another.'
        : 'Could not save username - try again.' };
      renderUsernameGate();
      return;
    }
    needsUsername = false;
    pendingUsername = '';
    usernameMsg = null;
    loadState(); // proceed into the actual game now that a profile exists
  };
}

function renderAuth(){
  const el = document.getElementById('app');
  el.innerHTML = `
    <div class="authwrap">
      <div class="authcard">
        <div class="brand-hexmark auth-hexmark"></div>
        <h1>PokéHex</h1>
        <p class="sub">${authMode==='signin' ? 'Sign in to load your vault' : 'Create an account to save your progress'}</p>
        <form id="authform">
          <div class="authfield">
            <label>Email</label>
            <input type="email" id="authEmail" autocomplete="email" required />
          </div>
          <div class="authfield">
            <label>Password</label>
            <input type="password" id="authPassword" autocomplete="${authMode==='signin'?'current-password':'new-password'}" minlength="6" required />
          </div>
          ${authMode==='signup' ? `
          <div class="authfield">
            <label>Username</label>
            <input type="text" id="authUsername" autocomplete="off" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+" />
            <div id="authUsernameStatus" style="font-size:12px;min-height:16px;margin-top:2px;"></div>
          </div>` : ''}
          <button type="submit" class="authbtn" ${authBusy?'disabled':''}>
            ${authBusy ? 'Please wait…' : (authMode==='signin' ? 'Sign in' : 'Create account')}
          </button>
        </form>
        <button class="authtoggle" id="authToggleBtn">
          ${authMode==='signin' ? "No account yet? Create one" : "Already have an account? Sign in"}
        </button>
        ${authMsg ? `<div class="authmsg ${authMsg.type}">${authMsg.text}</div>` : ''}
        ${!authUser ? `<button class="authtoggle" id="authBackBtn" style="margin-top:4px;">&larr; Back to browsing</button>` : ''}
      </div>
    </div>
  `;
  document.getElementById('authToggleBtn').onclick = ()=>{
    authMode = authMode==='signin' ? 'signup' : 'signin';
    authMsg = null;
    renderAuth();
  };
  const backBtn = document.getElementById('authBackBtn');
  if(backBtn) backBtn.onclick = ()=>{ authMsg = null; render(); };

  const authUsernameInput = document.getElementById('authUsername');
  if(authUsernameInput){
    const status = document.getElementById('authUsernameStatus');
    authUsernameInput.oninput = ()=>{
      clearTimeout(usernameCheckTimer);
      const val = authUsernameInput.value.trim();
      if(val.length < 3){ status.textContent=''; return; }
      if(!/^[a-zA-Z0-9_]{3,20}$/.test(val)){ status.textContent='Letters, numbers, underscores only.'; status.style.color='#ff4444'; return; }
      status.textContent = 'Checking…'; status.style.color='var(--muted)';
      usernameCheckTimer = setTimeout(async ()=>{
        const available = await isUsernameAvailable(val, null);
        if(authUsernameInput.value.trim() !== val) return;
        if(available === true){ status.textContent='Available'; status.style.color='#39ff14'; }
        else if(available === false){ status.textContent='Already taken'; status.style.color='#ff4444'; }
        else { status.textContent=''; }
      }, 400);
    };
  }

  document.getElementById('authform').onsubmit = async (e)=>{
    e.preventDefault();
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const username = authMode==='signup' ? document.getElementById('authUsername').value.trim() : null;
    if(authMode==='signup' && !/^[a-zA-Z0-9_]{3,20}$/.test(username)){
      authMsg = { type:'err', text:'Username must be 3-20 characters: letters, numbers, underscores only.' };
      renderAuth();
      return;
    }
    authBusy = true; authMsg = null; renderAuth();
    try{
      if(authMode==='signin'){
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
        // onAuthStateChange will pick up the session and boot the game
      } else {
        const { data, error } = await sb.auth.signUp({ email, password });
        if(error) throw error;
        if(!data.session){
          authBusy = false;
          authMsg = { type:'ok', text:'Check your email to confirm your account, then sign in.' };
          authMode = 'signin';
          renderAuth();
          return;
        }
        // don't insert the profile here - the username gate (triggered by
        // onAuthStateChange below) is the single place that ever writes a
        // profile row, so there's no chance of two competing inserts
        pendingUsername = username;
      }
    }catch(err){
      authBusy = false;
      authMsg = { type:'err', text: err.message || 'Something went wrong.' };
      renderAuth();
    }
  };
}

async function signOut(){
  await sb.auth.signOut();
  // onAuthStateChange handles returning to the guest browsing view
}

// Gate for any action that changes state - guests get sent to the signup screen instead.
function requireAuth(){
  if(!authUser){
    authMode = 'signup';
    authMsg = null;
    renderAuth();
    return false;
  }
  return true;
}

sb.auth.onAuthStateChange(async (event, session)=>{
  const user = session ? session.user : null;
  const wasLoggedIn = !!authUser;
  authUser = user;
  if(user && !wasLoggedIn){
    authBusy = false; authMsg = null;
    const { data: profile } = await sb.from('profiles').select('username').eq('user_id', user.id).maybeSingle();
    if(!profile){
      needsUsername = true;
      renderUsernameGate();
    } else {
      loadState(); // boots the real, saved game state now that we have a user
    }
  } else if(!user && wasLoggedIn){
    // user just signed out - drop back to guest browsing of the Packs page, not the login screen
    authBusy = false;
    state = { hex:0, dex:{}, instances:[], collectibles:{}, lastSpinAt:null, valueHistory:[], longHistory:[] };
    profileStats = null; profileUsername = null; profileLoading = false; profileUsernameMsg = null;
    view = 'open';
    render();
  }
  // if !user && !wasLoggedIn (e.g. no session on initial load), leave whatever's already on screen alone
});

const WHEEL_COOLDOWN = 60*60*1000; // 1 hour

const MARKET_EPOCH = Date.parse('2024-01-01T00:00:00Z');
const MARKET_WAVES = [
  { periodMs: 5    * 60*60*1000, amp: 0.35, phase: 1.1 }, // long supercycle (~5h)
  { periodMs: 41  * 60*1000,    amp: 0.15, phase: 2.7 }, // medium swing (~41m)
  { periodMs: 9    * 60*1000,    amp: 0.07, phase: 4.2 }, // short jitter (~9m)
];
const MARKET_HELD_BONUS_CAP = 0.30;      // max +30%
const MARKET_HELD_BONUS_RATE = 0.01;     // per hour held
const MARKET_MULT_FLOOR = 0.15;          // guard against near-zero/negative payouts

function marketIndexAt(t){
  let idx = 1;
  MARKET_WAVES.forEach(w=>{
    idx += w.amp * Math.sin((2*Math.PI*(t-MARKET_EPOCH))/w.periodMs + w.phase);
  });
  return idx;
}
function marketPhaseFor(idx){
  if(idx >= 1.15) return {label:'BULL MARKET', color:'var(--foil1)'};
  if(idx <= 0.85) return {label:'BEAR MARKET', color:'#ff4444'};
  return {label:'NEUTRAL', color:'var(--muted)'};
}
function heldBonusFor(hoursHeld){
  return Math.min(MARKET_HELD_BONUS_CAP, Math.max(0,hoursHeld) * MARKET_HELD_BONUS_RATE);
}
function cardMultiplier(hoursHeld, tNow){
  return Math.max(MARKET_MULT_FLOOR, marketIndexAt(tNow) + heldBonusFor(hoursHeld));
}

async function loadState(){
  try{
    // ensure a row exists for brand-new accounts (idempotent - safe to call every load)
    await sb.rpc('ensure_game_state');

    const { data, error } = await sb
      .from('game_states_v2')
      .select('hex, dex, instances, collectibles, last_spin_at, value_history, long_history')
      .eq('user_id', authUser.id)
      .maybeSingle();
    if(error) throw error;

    if(data){
      state = {
        hex: data.hex,
        dex: data.dex || {},
        instances: data.instances || [],
        collectibles: data.collectibles || {},
        lastSpinAt: data.last_spin_at ? new Date(data.last_spin_at).getTime() : null,
        valueHistory: data.value_history || [],
        longHistory: data.long_history || []
      };
    } else {
      // shouldn't happen given ensure_game_state() above, but fail safe
      state = { hex:1000, dex:{}, instances:[], collectibles:{}, lastSpinAt:null, valueHistory:[], longHistory:[] };
    }
  }catch(e){
    console.error('load failed', e);
    toast('Could not load your saved data - starting fresh this session.');
    state = { hex:1000, dex:{}, instances:[], collectibles:{}, lastSpinAt:null, valueHistory:[], longHistory:[] };
  }

  if(state.lastSpinAt===undefined) state.lastSpinAt = null;
  if(state.collectibles===undefined) state.collectibles = {};
  if(state.instances===undefined) state.instances = [];
  if(state.valueHistory===undefined) state.valueHistory = [];
  if(state.longHistory===undefined) state.longHistory = [];

  recordVaultValue();
  render();
}
let saveTimer = null;
async function saveState(){
  // hex/dex/instances/collectibles are already persisted server-side by
  // whichever RPC just ran - this only needs to persist the chart history,
  // debounced so rapid-fire actions collapse into one write
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 250);
}
async function doSave(){
  if(!authUser) return;
  try{
    const { error } = await sb.rpc('save_vault_history', {
      p_value_history: state.valueHistory,
      p_long_history: state.longHistory
    });
    if(error) throw error;
  }catch(e){
    console.error('save failed', e);
    toast('Save failed - check your connection.');
  }
}

function calculateCurrentVaultValue(){
  const instances = state.instances || [];
  const now = Date.now();
  let total = 0;
  instances.forEach(inst => {
    const p = POKEMON.find(x => x.id === inst.id);
    if(!p) return;
    const hoursHeld = Math.max(0, (now - (inst.acquiredAt || now)) / (1000 * 60 * 60));
    const multiplier = cardMultiplier(hoursHeld, now);
    const baseValue = inst.shiny ? p.value * 10 : p.value;
    total += Math.max(1, Math.round(baseValue * multiplier));
  });
  return total;
}

function recordVaultValue(){
  const now = Date.now();
  const currentVal = calculateCurrentVaultValue();
  if(!state.valueHistory) state.valueHistory = [];
  if(!state.longHistory) state.longHistory = [];

  const lastEntry = state.valueHistory[state.valueHistory.length - 1];
  if(!lastEntry || (now - lastEntry.time > 10000) || lastEntry.val !== currentVal){
    state.valueHistory.push({ time: now, val: currentVal });
    if(state.valueHistory.length > 30) state.valueHistory.shift();
  }

  const LONG_INTERVAL_MS = 5 * 60 * 1000;
  const lastLong = state.longHistory[state.longHistory.length - 1];
  if(!lastLong || (now - lastLong.time > LONG_INTERVAL_MS)){
    state.longHistory.push({ time: now, val: currentVal });
    if(state.longHistory.length > 5000) state.longHistory.shift();
  }
}

let packBusy = false;
async function openPack(pack){
  if(!requireAuth()) return;
  if(packBusy) return;
  if(state.hex < pack.price) return toast("Not enough HEX for that pack.");
  packBusy = true;
  try{
    const { data, error } = await sb.rpc('open_pack', { p_pack_id: pack.id });
    if(error){
      // server is authoritative on the balance check too - it may reject
      // even if the client's local number looked sufficient (e.g. stale cache)
      toast(error.message.includes('insufficient') ? "Not enough HEX for that pack." : "Couldn't open that pack - try again.");
      return;
    }
    // server already rolled + charged; enrich with local cosmetic data (type/sprite) for display only
    const cards = data.cards.map(c=>{
      const p = POKEMON.find(x=>x.id===c.id);
      return { ...c, type: p.type, sprite: p.sprite };
    });
    opening = {pack, cards, flipped:[], stage:'closed', keep:cards.map(()=>true), openingId:data.opening_id};
    // mirror the server's deduction locally so the rest of the (not-yet-migrated) UI stays in sync
    state.hex -= pack.price;
    recordVaultValue();
    saveState();
    render();
  } finally {
    packBusy = false;
  }
}
let finalizeBusy = false;
async function finalizeOpening(){
  if(finalizeBusy) return;
  finalizeBusy = true;
  const keepSnapshot = opening.keep;
  const openingId = opening.openingId;
  try{
    const { error } = await sb.rpc('finalize_pack_opening', {
      p_opening_id: openingId,
      p_keep: keepSnapshot
    });
    if(error){
      toast("Couldn't finalize that opening - try again.");
      return;
    }
    // the server has already committed dex/instances/hex, so read those rows
    // back instead of rebuilding them locally. a hand-maintained object literal
    // silently drops every server-generated field it doesn't happen to list -
    // that's how uid, shiny and hasShiny all went missing - whereas a re-read
    // picks up anything the server writes, including fields added later.
    const { data: fresh, error: readErr } = await sb
      .from('game_states_v2')
      .select('hex, dex, instances')
      .eq('user_id', authUser.id)
      .maybeSingle();

    if(readErr || !fresh){
      // finalize already succeeded, so the pending row is gone and this opening
      // must not be retried. close it out, but leave local state untouched
      // rather than writing values we already know are stale - in particular
      // skip recordVaultValue(), which would persist a wrong point to the chart.
      console.error('post-finalize re-read failed', readErr);
      opening = null;
      view='open';
      render();
      toast('Your cards are saved - reload the page to see them.');
      return;
    }

    state.hex = fresh.hex;
    state.dex = fresh.dex || {};
    state.instances = fresh.instances || [];
    opening = null;
    recordVaultValue();
    saveState();
    view='open';
    render();
  } finally {
    finalizeBusy = false;
  }
}

let badgeBusy = false;
async function buyCollectible(item){
  if(!requireAuth()) return;
  if(badgeBusy) return;
  if(state.collectibles[item.id]) return toast("You already own this badge!");
  if(state.hex < item.price) return toast("Not enough HEX! Keep grinding packs or spinning the wheel.");
  badgeBusy = true;
  try{
    const { error } = await sb.rpc('buy_collectible', { p_item_id: item.id });
    if(error){
      toast(error.message.includes('insufficient') ? "Not enough HEX! Keep grinding packs or spinning the wheel."
        : error.message.includes('owned') ? "You already own this badge!"
        : "Couldn't complete that purchase - try again.");
      return;
    }
    state.hex -= item.price;
    state.collectibles[item.id] = 1;
    saveState();
    burstConfetti();
    toast(`Purchased ${item.name}! Milestone unlocked.`);
    render();
  } finally {
    badgeBusy = false;
  }
}

async function sellCollectible(item){
  if(!requireAuth()) return;
  if(badgeBusy) return;
  if(!state.collectibles[item.id]) return toast("You don't own this badge!");
  badgeBusy = true;
  try{
    const { data, error } = await sb.rpc('sell_collectible', { p_item_id: item.id });
    if(error){
      toast("Couldn't sell that badge - try again.");
      return;
    }
    delete state.collectibles[item.id];
    state.hex += data.refund;
    recordVaultValue();
    saveState();
    toast(`Sold ${item.name} for liquid capital: <i class="hex-icon"></i>${fmtHex(data.refund)}!`);
    render();
  } finally {
    badgeBusy = false;
  }
}

function fmtCountdown(ms){

  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return `${h>0?h+':':''}${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

let actx;
function ac(){ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function tone(freq,dur,type,gain,delay){
  try{
    const c = ac(); const t0 = c.currentTime+(delay||0);
    const osc = c.createOscillator(); const g = c.createGain();
    osc.type = type||'sine'; osc.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(gain||0.08,t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }catch(e){}
}
function ripSound(){ tone(120,0.25,'sawtooth',0.06); tone(400,0.15,'square',0.03,0.05); }
function revealSound(rarity){
  const base = {common:440,uncommon:520,rare:600,ultra:820,secret:980}[rarity]||440;
  tone(base,0.18,'triangle',0.07);
  if(rarity==='ultra'||rarity==='secret'){ tone(base*1.5,0.3,'triangle',0.06,0.08); tone(base*2,0.4,'sine',0.05,0.16); }
}

function burstConfetti(){
  const colors = ['#39ff14','#9d4edd','#c77dff','#f0d9ff'];
  for(let i=0;i<26;i++){
    const el = document.createElement('div');
    el.className='confetti';
    el.style.left = (45+Math.random()*10)+'vw';
    el.style.background = colors[i%colors.length];
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(el);
    const dur = 1200+Math.random()*900;
    const drift = (Math.random()-0.5)*300;
    el.animate([
      {transform:`translate(0,0) rotate(0deg)`,opacity:1},
      {transform:`translate(${drift}px, 100vh) rotate(720deg)`,opacity:0}
    ],{duration:dur,easing:'ease-in'});
    setTimeout(()=>el.remove(),dur+50);
  }
}

function vaultChartInner(history){
  const width = 880;
  const height = 140;
  const padTop = 15;
  const padBottom = 20;
  const padLeft = 45;
  const padRight = 20;

  const innerW = width - padLeft - padRight;
  const innerH = height - padTop - padBottom;

  const vals = history.map(h => h.val);
  const minVal = 0;
  const maxVal = Math.max(100, ...vals) * 1.15;

  const points = history.map((h, i) => {
    const x = padLeft + (history.length === 1 ? innerW / 2 : (i / (history.length - 1)) * innerW);
    const y = padTop + innerH - ((h.val - minVal) / (maxVal - minVal)) * innerH;
    return { x, y, val: h.val };
  });

  const pathD = points.length === 1
    ? `M ${points[0].x} ${points[0].y} L ${points[0].x} ${points[0].y}`
    : points.reduce((acc, p, i) => i === 0 ? `M ${p.x} ${p.y}` : `${acc} L ${p.x} ${p.y}`, '');

  const areaD = points.length === 1
    ? `M ${padLeft} ${padTop + innerH} L ${points[0].x} ${points[0].y} L ${padLeft + innerW} ${padTop + innerH} Z`
    : `${pathD} L ${points[points.length - 1].x} ${padTop + innerH} L ${points[0].x} ${padTop + innerH} Z`;

  const showDots = points.length <= 60;

  const svgInner = `
    <defs>
      <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--foil1)" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="var(--foil2)" stop-opacity="0.0"/>
      </linearGradient>
    </defs>
    <line x1="${padLeft}" y1="${padTop}" x2="${width - padRight}" y2="${padTop}" stroke="var(--line)" stroke-dasharray="3,3" />
    <line x1="${padLeft}" y1="${padTop + innerH / 2}" x2="${width - padRight}" y2="${padTop + innerH / 2}" stroke="var(--line)" stroke-dasharray="3,3" />
    <line x1="${padLeft}" y1="${padTop + innerH}" x2="${width - padRight}" y2="${padTop + innerH}" stroke="var(--line)" />

    <text x="${padLeft - 6}" y="${padTop + 4}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono" text-anchor="end">${fmtHex(Math.round(maxVal))}</text>
    <text x="${padLeft - 6}" y="${padTop + innerH + 4}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono" text-anchor="end">0</text>

    <path d="${areaD}" fill="url(#chartGrad)" />
    <path d="${pathD}" fill="none" stroke="var(--foil1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 4px rgba(57,255,20,0.5));" />

    ${showDots ? points.map(p => `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="var(--foil2)" stroke="var(--foil1)" stroke-width="1.5" />`).join('') : ''}
  `;

  return { svgInner, width, height };
}

function computeMarketIndexSeries(now){
  const windowPastMs = 2*60*60*1000;
  const windowFutureMs = 3*60*60*1000;
  const totalMs = windowPastMs + windowFutureMs;
  const steps = 120;
  const points = [];
  for(let i=0;i<=steps;i++){
    const t = now - windowPastMs + (totalMs * i / steps);
    points.push({ t, idx: marketIndexAt(t) });
  }
  return points;
}

function marketIndexChartParts(now){
  const points = computeMarketIndexSeries(now);
  const width=880, height=140, padTop=15, padBottom=20, padLeft=45, padRight=20;
  const innerW = width-padLeft-padRight, innerH = height-padTop-padBottom;
  const vals = points.map(p=>p.idx);
  const minVal = Math.min(0.3, ...vals) - 0.05;
  const maxVal = Math.max(1.7, ...vals) + 0.05;
  const t0 = points[0].t, t1 = points[points.length-1].t;
  const xForT = t => padLeft + ((t-t0)/(t1-t0)) * innerW;
  const yForV = v => padTop + innerH - ((v-minVal)/(maxVal-minVal)) * innerH;
  const nowX = xForT(now);
  const baselineY = yForV(1);

  const pastPts = points.filter(p=>p.t<=now);
  const futurePts = points.filter(p=>p.t>now);
  if(futurePts.length && pastPts.length) futurePts.unshift(pastPts[pastPts.length-1]);

  const pathFor = pts => pts.length ? pts.reduce((acc,p,i)=> i===0 ? `M ${xForT(p.t)} ${yForV(p.idx)}` : `${acc} L ${xForT(p.t)} ${yForV(p.idx)}`, '') : '';

  const idxNow = marketIndexAt(now);
  const phase = marketPhaseFor(idxNow);

  const svgInner = `
    <line x1="${padLeft}" y1="${baselineY}" x2="${width-padRight}" y2="${baselineY}" stroke="var(--muted)" stroke-dasharray="2,4" />
    <text x="${padLeft-6}" y="${baselineY+3}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono" text-anchor="end">100%</text>
    <path d="${pathFor(pastPts)}" fill="none" stroke="${phase.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="${pathFor(futurePts)}" fill="none" stroke="${phase.color}" stroke-width="2" stroke-dasharray="5,5" opacity="0.6" stroke-linecap="round" />
    <line x1="${nowX}" y1="${padTop}" x2="${nowX}" y2="${padTop+innerH}" stroke="var(--gold)" stroke-width="1.5" />
    <text x="${nowX}" y="${padTop-4}" fill="var(--gold)" font-size="9" font-family="JetBrains Mono" text-anchor="middle">NOW</text>
  `;
  return { svgInner, phase, idxNow };
}

function renderMarketIndexChart(){
  const now = Date.now();
  const { svgInner, phase, idxNow } = marketIndexChartParts(now);
  return `
    <div style="background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:20px;">

// Preview for Liquidate Duplicates. Mirrors the server's liquidate_duplicates
// grouping exactly: keep the LEAST valuable non-shiny copy of each species and
// sell the rest; if a species has a shiny, the shiny is kept and every
// non-shiny copy of it sells. Estimate only - the server recalculates each
// payout at execution time, so slippage applies.
function dupePreview(tier, now){
  const groups = {};
  (state.instances || []).forEach(inst => {
    if (inst.rarity !== tier) return;
    (groups[inst.id] = groups[inst.id] || []).push(inst);
  });

  let count = 0, est = 0, shinyKept = 0;
  Object.values(groups).forEach(g => {
    const hasShiny = g.some(x => x.shiny);
    if (hasShiny) shinyKept += g.filter(x => x.shiny).length;

    const valued = g.filter(x => !x.shiny).map(inst => {
      const p = POKEMON.find(x => x.id === inst.id);
      const hoursHeld = Math.max(0, (now - (inst.acquiredAt || now)) / (1000 * 60 * 60));
      return { inst, hoursHeld,
        // effValue is local to renderMarket(), so the same rule is inlined here
        payout: Math.max(1, Math.round((inst.shiny ? p.value * 10 : p.value) * cardMultiplier(hoursHeld, now))) };
    });
    // same tiebreak chain as the RPC: payout asc, hours asc, uid asc
    valued.sort((a, b) => a.payout - b.payout || a.hoursHeld - b.hoursHeld
                       || (a.inst.uid < b.inst.uid ? -1 : 1));

    (hasShiny ? valued : valued.slice(1)).forEach(d => { est += d.payout; count++; });
  });
  return { count, est, shinyKept };
}

async function loadProfileStats(retrying){
  profileLoading = true;
  render();
  try{
    const [{ data: statsData, error: statsErr }, { data: profileData, error: profileErr }] = await Promise.all([
      sb.rpc('get_player_stats'),
      sb.from('profiles').select('username, username_updated_at').eq('user_id', authUser.id).maybeSingle()
    ]);
    if(statsErr) throw statsErr;
    if(profileErr) throw profileErr;
    profileStats = statsData;
    profileUsername = profileData ? profileData.username : null;
    profileUsernameUpdatedAt = profileData && profileData.username_updated_at ? new Date(profileData.username_updated_at).getTime() : null;
  }catch(e){
    console.error('failed to load profile stats:', e && e.message, e);
    if(!retrying){
      // transient failures (e.g. a freshly-created RPC not yet visible to
      // the API layer) are common right after schema changes - one silent
      // retry means the player never has to know it happened
      profileLoading = false;
      return loadProfileStats(true);
    }
    toast('Could not load your stats - try again.');
  } finally {
    profileLoading = false;
    render();
  }
}

  return `

function wire(){
  const signoutBtn = document.querySelector('[data-signout]');
  if(signoutBtn) signoutBtn.onclick = ()=>{ signOut(); };
  const createAccountBtn = document.querySelector('[data-createaccount]');
  if(createAccountBtn) createAccountBtn.onclick = ()=>{
    authMode = 'signin';
    authMsg = null;
    renderAuth();
  };
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
    view=b.dataset.nav;
    if(view==='profile' && authUser) loadProfileStats();
    render();
  });

  const profileUsernameForm = document.getElementById('profileUsernameForm');
  if(profileUsernameForm){
    const input = document.getElementById('profileUsernameInput');
    const status = document.getElementById('profileUsernameStatus');
    let checkTimer = null;
    input.oninput = ()=>{
      clearTimeout(checkTimer);
      const val = input.value.trim();
      if(val === profileUsername){ status.textContent=''; return; }
      if(val.length < 3){ status.textContent=''; return; }
      if(!/^[a-zA-Z0-9_]{3,20}$/.test(val)){ status.textContent='Letters, numbers, underscores only.'; status.style.color='#ff4444'; return; }
      status.textContent = 'Checking…'; status.style.color='var(--muted)';
      checkTimer = setTimeout(async ()=>{
        const available = await isUsernameAvailable(val, authUser.id);
        if(input.value.trim() !== val) return;
        if(available === true){ status.textContent='Available'; status.style.color='#39ff14'; }
        else if(available === false){ status.textContent='Already taken'; status.style.color='#ff4444'; }
        else { status.textContent=''; }
      }, 400);
    };
    profileUsernameForm.onsubmit = async (e)=>{
      e.preventDefault();
      const val = input.value.trim();
      if(val === profileUsername) return; // nothing changed
      if(!/^[a-zA-Z0-9_]{3,20}$/.test(val)){
        profileUsernameMsg = { type:'err', text:'3-20 characters: letters, numbers, underscores only.' };
        render();
        return;
      }
      const btn = profileUsernameForm.querySelector('button');
      btn.disabled = true; btn.textContent = 'Saving…';
      const { ok, error } = await saveUsername(val);
      if(!ok){
        profileUsernameMsg = { type:'err', text: (error && error.message && error.message.includes('duplicate'))
          ? 'That username was just taken - try another.'
          : (error && error.message && error.message.includes('cooldown'))
          ? 'You can only change your username once every 7 days.'
          : 'Could not save username - try again.' };
        render();
        return;
      }
      profileUsername = val;
      profileUsernameUpdatedAt = Date.now();
      profileUsernameMsg = { type:'ok', text:'Username updated.' };
      render();
    };
  }
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
    const pack = PACKS.find(p=>p.id===b.dataset.buy);
    openPack(pack);
  });
  document.querySelectorAll('[data-buycol]').forEach(b=>b.onclick=()=>{
    const item = SHOP_COLLECTIBLES.find(i=>i.id===b.dataset.buycol);
    buyCollectible(item);
  });
  document.querySelectorAll('[data-sellcol]').forEach(b=>b.onclick=()=>{
    const item = SHOP_COLLECTIBLES.find(i=>i.id===b.dataset.sellcol);
    sellCollectible(item);
  });

  // Modal Handlers
  document.querySelectorAll('[data-open-single-modal]').forEach(btn => {
    btn.onclick = () => {
      activeModal = { type: 'single', uid: btn.dataset.openSingleModal };
      render();
    };
  });

  document.querySelectorAll('[data-open-tier-modal]').forEach(btn => {
    btn.onclick = () => {
      activeModal = { type: 'tier', tier: btn.dataset.openTierModal };
      render();
    };
  });

  const cancelBtn = document.querySelector('[data-modal-cancel]');
  if (cancelBtn) {
    cancelBtn.onclick = () => { activeModal = null; render(); };
  }

  let liquidateBusy = false;
  const confirmSingleBtn = document.querySelector('[data-modal-confirm-single]');
  if (confirmSingleBtn) {
    confirmSingleBtn.onclick = async () => {
      if(liquidateBusy) return;
      const uid = confirmSingleBtn.dataset.modalConfirmSingle;
      const idx = (state.instances || []).findIndex(x => x.uid === uid);
      if (idx === -1) { activeModal = null; render(); return; }

      liquidateBusy = true;
      try{
        const { data, error } = await sb.rpc('liquidate_instance', { p_uid: uid });
        if(error){
          toast("Couldn't liquidate that card - try again.");
          return;
        }
        const inst = state.instances[idx];
        const p = POKEMON.find(x => x.id === inst.id);

        state.instances.splice(idx, 1);
        const dexEntry = state.dex[p.id];
        if (dexEntry) {
          dexEntry.count--;
          if (dexEntry.count <= 0) delete state.dex[p.id];
        }

        state.hex += data.payout; // authoritative payout from the server, not a local recompute
        recordVaultValue();
        saveState();
        toast(`Liquidated ${p.name} for <i class="hex-icon"></i>${fmtHex(data.payout)} HEX!`);
      } finally {
        liquidateBusy = false;
        activeModal = null;
        render();
      }
    };
  }

  document.querySelectorAll('[data-open-dupes-modal]').forEach(btn => {
    btn.onclick = () => {
      activeModal = { type: 'dupes', tier: btn.dataset.openDupesModal };
      render();
    };
  });

  const confirmDupesBtn = document.querySelector('[data-modal-confirm-dupes]');
  if (confirmDupesBtn) {
    confirmDupesBtn.onclick = async () => {
      if(liquidateBusy) return;
      const targetTier = confirmDupesBtn.dataset.modalConfirmDupes;
      liquidateBusy = true;
      try{
        const { data, error } = await sb.rpc('liquidate_duplicates', { p_rarity: targetTier });
        if(error){
          toast("Couldn't liquidate those duplicates - try again.");
          return;
        }
        if (data.count > 0) {
          // the server decides which copy survives, so refetch rather than
          // reproduce the keeper logic client-side and risk drift
          activeModal = null;
          await loadState();
          recordVaultValue();
          saveState();
          toast(`Liquidated ${data.count} duplicate ${data.count === 1 ? 'card' : 'cards'} for <i class="hex-icon"></i>${fmtHex(data.payout)} HEX!`);
          return;
        }
        toast('No duplicates to liquidate in that tier.');
      } finally {
        liquidateBusy = false;
        activeModal = null;
        render();
      }
    };
  }

  const confirmTierBtn = document.querySelector('[data-modal-confirm-tier]');
  if (confirmTierBtn) {
    confirmTierBtn.onclick = async () => {
      if(liquidateBusy) return;
      const targetTier = confirmTierBtn.dataset.modalConfirmTier;
      liquidateBusy = true;
      try{
        const { data, error } = await sb.rpc('liquidate_tier', { p_rarity: targetTier });
        if(error){
          toast("Couldn't liquidate those cards - try again.");
          return;
        }
        if (data.count > 0) {
          const remainingInstances = [];
          (state.instances || []).forEach(inst => {
            if (inst.rarity === targetTier) {
              const dexEntry = state.dex[inst.id];
              if (dexEntry) {
                dexEntry.count--;
                if (dexEntry.count <= 0) delete state.dex[inst.id];
              }
            } else {
              remainingInstances.push(inst);
            }
          });
          state.instances = remainingInstances;
          state.hex += data.payout; // authoritative payout from the server, not a local recompute
          recordVaultValue();
          saveState();
          toast(`Liquidated ${data.count} ${targetTier} cards for <i class="hex-icon"></i>${fmtHex(data.payout)} HEX!`);
        }
      } finally {
        liquidateBusy = false;
        activeModal = null;
        render();
      }
    };
  }

  const rip = document.querySelector('[data-rip]');
  if(rip) rip.onclick = ()=>{
    if(opening.stage!=='closed') return;
    opening.stage='ripping'; ripSound(); render();
    setTimeout(()=>{ opening.stage='revealing'; render(); },380);
  };
  document.querySelectorAll('[data-flip]').forEach((el,i)=>{
    el.onclick = ()=>{
      if(opening.flipped.includes(i)) return;
      opening.flipped.push(i);
      const card = opening.cards[i];
      revealSound(card.rarity);
      if(card.rarity==='ultra'||card.rarity==='secret') burstConfetti();
      render();
    };
  });
  document.querySelectorAll('[data-keep]').forEach(el=>{
    el.onchange = ()=>{ opening.keep[+el.dataset.keep] = el.checked; render(); };
  });
  const sellAll = document.querySelector('[data-sellall]');
  if(sellAll) sellAll.onclick = ()=>{
    opening.keep = opening.keep.map(()=>false);
    finalizeOpening();
  };
  const confirm = document.querySelector('[data-confirm]');
  if(confirm) confirm.onclick = ()=>{ finalizeOpening(); };
  const close = document.querySelector('[data-close]');
  if(close) close.onclick = async ()=>{
    if(opening.stage==='closed'){
      const openingId = opening.openingId;
      opening = null; render(); // close immediately, don't make the player wait on the network
      try{
        const { data, error } = await sb.rpc('cancel_pack_opening', { p_opening_id: openingId });
        if(!error){
          state.hex += data.refund;
          saveState();
          render();
        }
      }catch(e){ console.error('cancel_pack_opening failed', e); }
    } else {
      // ripped but not yet finalized: closing here should behave the same
      // as hitting "Confirm & continue" (keep everything), not forfeit the
      // cards and the pack price the player already paid
      opening.keep = opening.cards.map(()=>true);
      finalizeOpening();
    }
  };
  const reset = document.querySelector('[data-reset]');
  if(reset) reset.onclick = ()=>{
    if(!requireAuth()) return;
    resetConfirmOpen = true;
    render();
  };

  const resetCancel = document.querySelector('[data-reset-cancel]');
  if(resetCancel) resetCancel.onclick = ()=>{
    resetConfirmOpen = false;
    render();
  };

  const resetConfirm = document.querySelector('[data-reset-confirm]');
  if(resetConfirm) resetConfirm.onclick = async ()=>{
    if(resetBusy) return;
    resetBusy = true;
    render();
    try{
      const { error } = await sb.rpc('reset_game_state');
      if(error){
        toast("Couldn't reset progress - try again.");
        return;
      }
      // intentionally NOT clearing lastSpinAt: the server's wheel cooldown
      // survives a reset by design (otherwise reset -> respin -> reset would
      // be a way to farm the wheel with nothing at stake), so the button
      // needs to keep showing the real remaining cooldown, not "Ready"
      const preservedLastSpinAt = state.lastSpinAt;
      state = { hex:1000, dex:{}, instances:[], collectibles:{}, lastSpinAt:preservedLastSpinAt, valueHistory:[], longHistory:[] };
      saveState();
      resetConfirmOpen = false;
    } finally {
      resetBusy = false;
      render();
    }
  };

  document.querySelectorAll('[data-vaultmode]').forEach(btn=>{
    btn.onclick = ()=>{
      vaultChartMode = btn.dataset.vaultmode;
      render();
    };
  });

  const wheelCollect = document.querySelector('[data-wheelcollect]');
  if(wheelCollect) wheelCollect.onclick = ()=>{
    wheelResult = null; render();
  };

  const wheelSpinBtn = document.getElementById('wheelSpinBtn');
  if(wheelSpinBtn) wheelSpinBtn.onclick = async ()=>{
    if(!requireAuth()) return;
    if(wheelSpinning || !canSpin()) return;
    const strip = document.getElementById('termStrip');
    if(!strip) return;
    wheelSpinning = true;
    wheelSpinBtn.disabled = true;
    wheelSpinBtn.textContent = 'Spinning…';

    const { data, error } = await sb.rpc('spin_wheel');
    if(error){
      wheelSpinning = false;
      wheelSpinBtn.disabled = !canSpin();
      wheelSpinBtn.textContent = canSpin() ? 'Spin the wheel' : 'Wait (' + spinStatusText() + ')';
      toast(error.message.includes('cooldown') ? "The wheel's still on cooldown." : "Couldn't spin - try again.");
      return;
    }
    // server has already picked (and paid out) the reward; find the matching
    // strip entry purely to know where to animate the visual to
    const reward = WHEEL_REWARDS.find(r=>r.amt===data.amount);
    const idx = WHEEL_REWARDS.indexOf(reward);

    const itemHeight = 46;
    const itemsPerSet = WHEEL_REWARDS.length;
    const targetRepetition = 8;
    const targetOffset = (targetRepetition * itemsPerSet + idx) * itemHeight;
    const finalTranslateY = targetOffset - (140 / 2) + (itemHeight / 2);

    strip.style.transition = 'transform 4.2s cubic-bezier(0.1, 0.7, 0.1, 1)';
    requestAnimationFrame(()=>{ strip.style.transform = `translateY(-${finalTranslateY}px)`; });
    revealSound('rare');

    setTimeout(()=>{
      wheelSpinning = false;
      wheelResult = reward;
      state.hex += data.amount; // authoritative payout from the server, not a local recompute
      state.lastSpinAt = Date.now();
      recordVaultValue();
      saveState();
      strip.style.transition = 'none';
      if(reward.amt>=25000) burstConfetti();
      render();
    }, 4300);
  };
}

setInterval(()=>{
  const btn = document.getElementById('wheelSpinBtn');
  if(btn && !wheelSpinning && view==='shop'){
    btn.disabled = !canSpin();
    btn.textContent = canSpin() ? 'Spin the wheel' : 'Wait (' + spinStatusText() + ')';
  }
  if(view === 'market'){
    if(state.instances && state.instances.length > 0){
      recordVaultValue();
    }
    updateVaultFeedLive();
  }
}, 1000);

render(); // guest view of the Packs page shown immediately; onAuthStateChange loads the real saved state if a session is restored
})();
</script>
</body>
</html>
