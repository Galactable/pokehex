function updateVaultFeedLive() {
  if (view !== 'market') return;

  // Runs every second on the Market. One pass values every card and sums
  // the stacks, tiers and vault total from that - it used to walk the whole
  // vault once per figure (seven times), with a catalog scan per card each time.
  const now = Date.now();
  const payoutByUid = new Map(), stackTotals = {}, tierTotals = {};
  let currentTotal = 0;
  (state.instances || []).forEach(inst => {
    const payout = cardPayout(inst, now);
    if(payout === null) return;
    currentTotal += payout;
    payoutByUid.set(inst.uid, payout);
    const key = `${inst.rarity}-${inst.id}`;
    stackTotals[key] = (stackTotals[key] || 0) + payout;
    tierTotals[inst.rarity] = (tierTotals[inst.rarity] || 0) + payout;
  });
  const balanceValEl = document.querySelector('.balance .val');
  if (balanceValEl) {
    balanceValEl.innerHTML = `<i class="hex-icon"></i>${fmtHex(state.hex)}`;
  }

  const chartContainer = document.querySelector('.wrap');
  if (chartContainer && chartContainer.querySelector('#vaultChartSvg')) {
    const history = vaultChartHistoryForMode();
    const { svgInner } = vaultChartInner(history);

    const svgElement = chartContainer.querySelector('#vaultChartSvg');
    if (svgElement) {
      svgElement.innerHTML = svgInner;
    }

    const headerValLabel = chartContainer.querySelector('#vaultTotalVal');
    if (headerValLabel) {
      headerValLabel.innerHTML = `<i class="hex-icon"></i>${fmtHex(currentTotal)} HEX`;
    }
  }

  const idxSvg = document.getElementById('marketIdxSvg');
  if(idxSvg){
    const nowT = Date.now();
    const { svgInner, phase, idxNow } = marketIndexChartParts(nowT);
    idxSvg.innerHTML = svgInner;
    const labelEl = document.getElementById('marketPhaseLabel');
    const valEl = document.getElementById('marketPhaseVal');
    if(labelEl){ labelEl.textContent = phase.label; labelEl.style.color = phase.color; }
    if(valEl){ valEl.textContent = (idxNow*100).toFixed(0); valEl.style.color = phase.color; }
  }

  // Live price labels. renderMarket builds card tiles only inside open
  // stacks and stack rows only inside open tiers, so update the labels that
  // are actually on the page rather than looking one up per card. Stack
  // totals matter most: a collapsed stack's headline number would otherwise
  // sit frozen while the market moved underneath it.
  document.querySelectorAll('[id^="price-inst-"]').forEach(el => {
    const payout = payoutByUid.get(el.id.slice('price-inst-'.length));
    if (payout !== undefined) el.innerHTML = `<i class="hex-icon"></i>~${fmtHex(payout)}`;
  });
  document.querySelectorAll('[id^="price-species-"]').forEach(el => {
    const total = stackTotals[el.id.slice('price-species-'.length)];
    if (total !== undefined) el.innerHTML = `<i class="hex-icon"></i>~${fmtHex(total)}`;
  });
  ['secret', 'ultra', 'rare', 'uncommon', 'common'].forEach(tier => {
    const el = document.getElementById(`price-tier-${tier}`);
    if (el) el.innerHTML = `<i class="hex-icon"></i>~${fmtHex(tierTotals[tier] || 0)}`;
  });
}

function computeMarketIndexSeries(now){
  const windowPastMs = 2*60*60*1000;
  const windowFutureMs = 3*60*60*1000;
  const totalMs = windowPastMs + windowFutureMs;
  const steps = 120;
  const points = [];
  for(let i=0;i<=steps;i++){
    const t = now - windowPastMs + (totalMs * i / steps);
    points.push({ t, idx: marketIndexAt(t) });
  }
  return points;
}

function marketIndexChartParts(now){
  const points = computeMarketIndexSeries(now);
  const width=880, height=140, padTop=15, padBottom=20, padLeft=45, padRight=20;
  const innerW = width-padLeft-padRight, innerH = height-padTop-padBottom;
  const vals = points.map(p=>p.idx);
  const minVal = Math.min(0.3, ...vals) - 0.05;
  const maxVal = Math.max(1.7, ...vals) + 0.05;
  const t0 = points[0].t, t1 = points[points.length-1].t;
  const xForT = t => padLeft + ((t-t0)/(t1-t0)) * innerW;
  const yForV = v => padTop + innerH - ((v-minVal)/(maxVal-minVal)) * innerH;
  const nowX = xForT(now);
  const baselineY = yForV(1);

  const pastPts = points.filter(p=>p.t<=now);
  const futurePts = points.filter(p=>p.t>now);
  if(futurePts.length && pastPts.length) futurePts.unshift(pastPts[pastPts.length-1]);

  const pathFor = pts => pts.length ? pts.reduce((acc,p,i)=> i===0 ? `M ${xForT(p.t)} ${yForV(p.idx)}` : `${acc} L ${xForT(p.t)} ${yForV(p.idx)}`, '') : '';

  const idxNow = marketIndexAt(now);
  const phase = marketPhaseFor(idxNow);

  const svgInner = `
    <line x1="${padLeft}" y1="${baselineY}" x2="${width-padRight}" y2="${baselineY}" stroke="var(--muted)" stroke-dasharray="2,4" />
    <text x="${padLeft-6}" y="${baselineY+3}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono" text-anchor="end">100%</text>
    <path d="${pathFor(pastPts)}" fill="none" stroke="${phase.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="${pathFor(futurePts)}" fill="none" stroke="${phase.color}" stroke-width="2" stroke-dasharray="5,5" opacity="0.6" stroke-linecap="round" />
    <line x1="${nowX}" y1="${padTop}" x2="${nowX}" y2="${padTop+innerH}" stroke="var(--gold)" stroke-width="1.5" />
    <text x="${nowX}" y="${padTop-4}" fill="var(--gold)" font-size="9" font-family="JetBrains Mono" text-anchor="middle">NOW</text>
  `;
  return { svgInner, phase, idxNow };
}

  return `

function renderMarketModal() {
  if (!activeModal) return '';

  if (activeModal.type === 'detail') {
    const inst = (state.instances || []).find(x => x.uid === activeModal.uid);
    // same self-clearing guard the single-liquidation modal uses: if the card
    // went away while the modal was open, close rather than render a ghost
    if (!inst) { activeModal = null; return ''; }
    const p = POKEMON.find(x => x.id === inst.id);
    if (!p) { activeModal = null; return ''; }
    const rc = RARITY[inst.rarity];
    const now = Date.now();
    const acquired = inst.acquiredAt || now;
    const hoursHeld = Math.max(0, (now - acquired) / (1000 * 60 * 60));
    const baseValue = p.value;
    const effective = effectiveCardValue(p.value, inst.shiny, inst.holo, inst.shadow);
    const multiplier = cardMultiplier(hoursHeld, now);
    const payout = Math.max(1, Math.round(effective * multiplier));
    // derived from heldBonusFor / the MARKET_* constants rather than restating
    // "+1%/hr capped at +30%" here - a second copy of the formula would drift
    // silently the moment either constant is retuned
    const hodlBonus = heldBonusFor(hoursHeld);
    const hodlPct = hodlBonus * 100;
    const hoursToCap = Math.max(0, (MARKET_HELD_BONUS_CAP / MARKET_HELD_BONUS_RATE) - hoursHeld);

// Preview for Liquidate Duplicates. Mirrors the server's liquidate_duplicates
// exactly: shinies and shadows are always kept (a shadow represents its
// species just as a shiny does), filed-in-a-binder copies are always kept
// (and still count toward whether the species "has" a shiny/holo even though
// they're excluded from the sellable pool), and a holo - anywhere in the
// species, filed or not - always outranks a plain copy as the one kept
// representative; only when no shiny and no holo exist anywhere in the group
// does the classic "keep cheapest, sell the rest" rule apply. Estimate only -
// the server recalculates each payout at execution time, so slippage applies.
function dupePreview(tier, now){
  const usedUids = usedBinderUids();
  const groups = {};
  (state.instances || []).forEach(inst => {
    if (inst.rarity !== tier) return;
    (groups[inst.id] = groups[inst.id] || []).push(inst);
  });

  let count = 0, est = 0, shinyKept = 0, shadowKept = 0, holoKept = 0, filedKept = 0;
  Object.values(groups).forEach(g => {
    const hasShiny = g.some(x => x.shiny);
    if (hasShiny) shinyKept += g.filter(x => x.shiny).length;
    const hasShadow = g.some(x => x.shadow);
    if (hasShadow) shadowKept += g.filter(x => x.shadow).length;
    const hasHolo = g.some(x => x.holo);
    const hasFiled = g.some(x => usedUids.has(x.uid));
    filedKept += g.filter(x => !x.shiny && !x.shadow && usedUids.has(x.uid)).length;

    // candidates: anything that could actually be sold - not shiny, not shadow, not filed
    const candidates = g.filter(x => !x.shiny && !x.shadow && !usedUids.has(x.uid) && POKEMON_BY_ID.has(x.id)).map(inst => {
      const p = POKEMON_BY_ID.get(inst.id);
      const hoursHeld = Math.max(0, (now - (inst.acquiredAt || now)) / (1000 * 60 * 60));
      return { inst, hoursHeld,
        // same rule as marketItem(), inlined here
        payout: Math.max(1, Math.round((effectiveCardValue(p.value, inst.shiny, inst.holo, inst.shadow)) * cardMultiplier(hoursHeld, now))) };
    });
    // same tiebreak chain as the RPC: payout asc, hours asc, uid asc
    candidates.sort((a, b) => a.payout - b.payout || a.hoursHeld - b.hoursHeld
                       || (a.inst.uid < b.inst.uid ? -1 : 1));

    let doomed;
    if (hasHolo) {
      const holoCandidates = candidates.filter(d => d.inst.holo);
      if (holoCandidates.length > 0) {
        // cheapest floating holo becomes the keeper, everything else sells
        holoKept++;
        const keptUid = holoCandidates[0].inst.uid;
        doomed = candidates.filter(d => d.inst.uid !== keptUid);
      } else {
        // the species' only holo is filed, shiny or shadow - already protected,
        // nothing floating needs to be spared on its behalf
        doomed = candidates;
      }
    } else {
      // a filed copy already represents the species, same as a shiny or shadow does
      doomed = (hasShiny || hasShadow || hasFiled) ? candidates : candidates.slice(1);
    }

    doomed.forEach(d => { est += d.payout; count++; });
  });
  return { count, est, shinyKept, shadowKept, holoKept, filedKept };
}

// Preview for Liquidate Tier. Mirrors the server's liquidate_tier: shinies,
// shadows and filed-in-a-binder copies are always kept; holos are additionally kept
// only when protectHolo is true (this function's tier has no per-species
// grouping, so it's a blanket skip, not a "keep one" rule like duplicates).
function tierPreview(tier, now, protectHolo){
  const usedUids = usedBinderUids();
  let count = 0, est = 0, shinyKept = 0, shadowKept = 0, holoKept = 0, filedKept = 0;
  (state.instances || []).forEach(inst => {
    if (inst.rarity !== tier) return;
    if (inst.shiny) { shinyKept++; return; }
    if (inst.shadow) { shadowKept++; return; }
    if (usedUids.has(inst.uid)) { filedKept++; return; }
    if (protectHolo && inst.holo) { holoKept++; return; }
    const p = POKEMON_BY_ID.get(inst.id);
    if (!p) return;
    const hoursHeld = Math.max(0, (now - (inst.acquiredAt || now)) / (1000 * 60 * 60));
    // was p.value alone here, silently dropping the holo 3x multiplier from
    // the estimate even before this feature - now matches effective_card_value
    // the RPC actually uses
    est += Math.max(1, Math.round(effectiveCardValue(p.value, inst.shiny, inst.holo, inst.shadow) * cardMultiplier(hoursHeld, now)));
    count++;
  });
  return { count, est, shinyKept, shadowKept, holoKept, filedKept };
}

const MARKET_TIER_LABELS = {
  secret: 'Secret Rare',
  ultra: 'Ultra Rare',
  rare: 'Rare',
  uncommon: 'Uncommon',
  common: 'Common'
};

// One Market row per card: its catalog entry, hours held, multiplier and
// payout at `now`. Shared by renderMarket and the lazy tier/stack fill below,
// so both build the same rows in the same order.
function marketItem(inst, now){
  const p = POKEMON_BY_ID.get(inst.id);
  if(!p) return null;
  const hoursHeld = Math.max(0, (now - (inst.acquiredAt || now)) / (1000 * 60 * 60));
  const multiplier = cardMultiplier(hoursHeld, now);
  const payout = Math.max(1, Math.round(effectiveCardValue(p.value, inst.shiny, inst.holo, inst.shadow) * multiplier));
  return { p, inst, hoursHeld, multiplier, payout };
}
function marketTierItems(tier, now){
  const items = [];
  (state.instances || []).forEach(inst => {
    if(inst.rarity !== tier) return;
    const item = marketItem(inst, now);
    if(item) items.push(item);
  });
  return items.sort((a, b) => b.payout - a.payout);
}

// An open tier's contents: the sell buttons and one row per species.
function marketTierBody(tier, items, now, usedUids, hitSet){
  const rc = RARITY[tier];
  const tierLabels = MARKET_TIER_LABELS;
  const tierTotalPayout = items.reduce((s, it) => s + it.payout, 0);
  const dupePrev = dupePreview(tier, now);
  return `<div style="padding-top:12px;">
              <div style="margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:10px; color:#ffaa00;">⚠️ Real-Time Liquidation Subject to Market Dynamics</span>
                <div style="display:flex; gap:8px; align-items:center;">
                  ${dupePrev.count > 0 ? `
                  <button class="buybtn" style="background:#a855f7; color:#fff; padding:8px 16px; font-size:12px; box-shadow:0 0 8px rgba(168,85,247,0.4);" data-open-dupes-modal="${tier}">
                    Liquidate Duplicates (<span id="btn-dupes-${tier}">~${fmtHex(dupePrev.est)}</span>)
                  </button>` : ''}
                  <button class="buybtn" style="background:#ff4444; color:#fff; padding:8px 16px; font-size:12px; box-shadow:0 0 8px rgba(255,68,68,0.4);" data-open-tier-modal="${tier}">
                    Liquidate All ${tierLabels[tier]} (<span id="btn-tier-${tier}">~${fmtHex(tierTotalPayout)}</span>)
                  </button>
                </div>
              </div>

              ${(() => {
                // Group this tier's instances by species so the list length is
                // bounded by distinct species rather than by copies held. The
                // instance tiles below are unchanged - they just live one level
                // deeper now, behind a per-species <details>.
                const species = {};
                items.forEach(item => {
                  (species[item.inst.id] = species[item.inst.id] || { p: item.p, list: [], cards: [] }).list.push(item.inst);
                  species[item.inst.id].cards.push(item);
                });

                const rows = Object.values(species).map(g => {
                  const stackEst = g.cards.reduce((s, c) => s + c.payout, 0);
                  return { ...g, stackEst };
                });
                // richest stack first, same ordering intent as the flat grid
                rows.sort((a, b) => b.stackEst - a.stackEst);

                return rows.map(({ p, list, cards, stackEst }) => {
                  const isSingle = list.length === 1;
                  const hasShiny = list.some(x => x.shiny);
                  const hasShadow = list.some(x => x.shadow);
                  const hasHolo = list.some(x => x.holo);
                  const hasHit = list.some(x => hitSet.has(x.uid));
                  const key = `${tier}:${p.id}`;
                  const open = hasHit || expandedSpecies.has(key);

                  return `
                    <details data-species="${key}" ${open ? 'open' : ''} style="margin-bottom:6px;background:var(--surface2);border:1px solid ${hasHit ? 'var(--foil1)' : 'var(--line)'};border-radius:8px;">
                      <summary style="cursor:pointer;outline:none;list-style:none;display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:12px;">
                        <span class="mono" style="color:var(--muted);font-size:11px;min-width:38px;">#${String(p.id).padStart(3,'0')}</span>
                        <span class="cf-type" style="background:${TYPE_COLORS[p.type]};color:#000;font-size:9px;">${p.type}</span>
                        <span style="font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                          ${esc(p.name)}${hasShiny ? ' <span style="color:gold;text-shadow:0 0 5px gold;" title="Shiny in stack">&#9733;</span>' : ''}${hasShadow ? ' <span style="color:#b04cff;text-shadow:0 0 5px #b04cff;" title="Shadow in stack">&#9790;</span>' : ''}${hasHolo ? ' <span style="color:#8ad0ff;text-shadow:0 0 5px #8ad0ff;" title="Holo in stack">&#10070;</span>' : ''}
                        </span>
                        ${isSingle
                          ? `<span class="mono" style="font-size:10px;color:var(--foil1);border:1px solid var(--foil1);border-radius:4px;padding:1px 5px;" title="Your only copy - selling this drops it from your Dex">ONLY COPY</span>`
                          : `<span class="mono" style="font-size:11px;color:var(--muted);">&times;${list.length}</span>`}
                        <span class="mono" style="font-size:12px;color:var(--gold);min-width:70px;text-align:right;">
                          <span id="price-species-${tier}-${p.id}"><i class="hex-icon"></i>~${fmtHex(stackEst)}</span>
                        </span>
                      </summary>

                      ${!open ? '<div data-lazy></div>' : marketStackBody(cards, rc, usedUids, hitSet, now)}

// An open species stack's contents: one tile per copy held.
function marketStackBody(cards, rc, usedUids, hitSet, now){
  return `<div style="padding:4px 12px 12px;">
                        <div class="dexgrid" style="grid-template-columns:repeat(auto-fill,minmax(154px,1fr));">
                          ${cards.map(({ p, inst, hoursHeld, multiplier, payout }) => {
                            const acquired = inst.acquiredAt || now;
                            const dateStr = new Date(acquired).toLocaleDateString(undefined, {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});

                            return `
                              <div class="packcard ${hitSet.has(inst.uid) ? 'search-hit' : ''}" style="padding:10px;border-color:${rc.color};display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);cursor:pointer;" data-open-detail-modal="${inst.uid}" title="Inspect card &mdash; value breakdown and favorite">
                                <div class="detail-card-display">${renderCardFace({
                                  id: p.id, name: p.name, rarity: inst.rarity, value: p.value,
                                  shiny: inst.shiny, holo: inst.holo, shadow: inst.shadow, type: p.type, sprite: p.sprite
                                }, true, usedUids.has(inst.uid))}</div>
                                <div style="font-size:8.5px;color:var(--muted);text-align:center;">
                                  Acquired: ${dateStr}
                                </div>
                                <div style="font-size:9px;color:var(--muted);text-align:center;">
                                  Held: <b>${hoursHeld.toFixed(1)}h</b> (${(multiplier * 100).toFixed(0)}% val)
                                </div>
                                <div style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--gold);">
                                  <span id="price-inst-${inst.uid}"><i class="hex-icon"></i>~${fmtHex(payout)}</span>
                                </div>
                                ${usedUids.has(inst.uid)
                                  ? `<button class="buybtn" style="width:100%;padding:6px;font-size:11px;" disabled title="Filed in a binder - remove it from the binder to sell">In Binder</button>`
                                  : `<button class="buybtn" style="width:100%;padding:6px;font-size:11px;" data-open-single-modal="${inst.uid}">
                                  Liquidate
                                </button>`}
                              </div>
                            `;
                          }).join('')}
                        </div>
                      </div>`;
}

// Opening a collapsed tier or stack fills in just that section rather than
// re-rendering the whole page, which takes ~0.5-1 s on a 15k-card vault. The
// markup comes from the same functions renderMarket uses, so it is what a
// full render would have drawn; wire() then binds the new buttons and stacks.
function fillMarketTier(d, lazy){
  const tier = d.dataset.tier, now = Date.now();
  lazy.outerHTML = marketTierBody(tier, marketTierItems(tier, now), now, usedBinderUids(), new Set(marketHits));
  wire();
}
function fillMarketStack(d, lazy){
  const [tier, pid] = d.dataset.species.split(':');
  const now = Date.now();
  const cards = marketTierItems(tier, now).filter(it => String(it.inst.id) === pid);
  lazy.outerHTML = marketStackBody(cards, RARITY[tier], usedBinderUids(), new Set(marketHits), now);
  wire();
}

function renderMarket(){
  const instances = state.instances || [];
  const now = Date.now();
  const usedUids = usedBinderUids();

  const tierOrder = ['secret', 'ultra', 'rare', 'uncommon', 'common'];
  const tierLabels = MARKET_TIER_LABELS;

  const groupedByTier = {};
  tierOrder.forEach(t => groupedByTier[t] = []);

  // Resolve the submitted query to a set of instance uids. Matches on dex
  // number (exact) or name (substring, case-insensitive). A player can hold
  // several copies of the same species, so this is a set, not one card.
  const q = marketSearch.trim().toLowerCase();
  marketHits = [];
  if(q){
    instances.forEach(inst => {
      const p = POKEMON_BY_ID.get(inst.id);
      if(!p) return;
      const byNum = /^\d+$/.test(q) && p.id === parseInt(q, 10);
      const byName = p.name.toLowerCase().includes(q);
      if(byNum || byName) marketHits.push(inst.uid);
    });
  }
  const hitSet = new Set(marketHits);
  const tiersWithHits = new Set(
    instances.filter(i => hitSet.has(i.uid)).map(i => i.rarity)
  );

  // payout worked out once per card here and reused below - the sort used
  // to recompute it inside its comparator, O(n log n) times
  instances.forEach((inst) => {
    if(!groupedByTier[inst.rarity]) return;
    const item = marketItem(inst, now);
    if(item) groupedByTier[inst.rarity].push(item);
  });

  tierOrder.forEach(t => {
    groupedByTier[t].sort((a, b) => b.payout - a.payout);
  });

  return `
    <div class="dexhead">
      <div class="dexhead-left">
        <h2 class="disp">Liquid Market</h2>
        <div class="dexcount mono">Individual card management &middot; Prices track the live market cycle</div>
        <div class="dexcount mono" style="margin-top:2px;">Tap any card to inspect it &mdash; full value breakdown, and set it as a favorite</div>
      </div>
    </div>

    ${instances.length === 0 ? '' : `
      <form id="marketSearchForm" style="display:flex;gap:8px;align-items:center;margin-bottom:14px;">
        <input type="text" id="marketSearchInput" value="${esc(marketSearch)}" placeholder="Search vault: name or #" autocomplete="off"
          style="flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;" />
        <button type="submit" class="sbtn keep" style="padding:7px 12px;font-size:11px;">Find</button>
        ${marketSearch ? `<button type="button" class="sbtn sell" data-searchclear style="padding:7px 12px;font-size:11px;">Clear</button>` : ''}
      </form>
      ${marketSearch ? `<div class="mono" style="font-size:11px;color:${marketHits.length ? 'var(--foil1)' : '#ff4444'};margin:-6px 0 12px 2px;">
        ${marketHits.length ? `${marketHits.length} match${marketHits.length===1?'':'es'} for "${esc(marketSearch)}"` : `Nothing in your vault matches "${esc(marketSearch)}"`}
      </div>` : ''}
    `}

    ${instances.length === 0 ? `
      <div style="text-align:center;color:var(--muted);padding:40px;font-size:13px;">Your vault is empty. Break open some packs to acquire tradeable assets.</div>
    ` : `
      ${tierOrder.map(tier => {
        const items = groupedByTier[tier];
        if(!items || items.length === 0) return '';
        const rc = RARITY[tier];

        const tierTotalPayout = items.reduce((s, it) => s + it.payout, 0);
        const tierOpen = tiersWithHits.has(tier) || expandedTiers.has(tier);

        // A collapsed tier renders its summary line only. Its buttons, species
        // rows and card tiles are built when it's opened (the toggle handler in
        // wire() re-renders) - with thousands of cards, building them all up
        // front was ~20MB of HTML and 200k DOM nodes on every render().
        const summary = `
            <summary style="font-family:var(--font-display);font-weight:800; font-size:15px; color:${rc.color}; cursor:pointer; text-transform:uppercase; letter-spacing:0.04em; outline:none; display:flex; justify-content:space-between; align-items:center;">
              <span>${tierLabels[tier]} (${items.length})</span>
              <span style="font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--gold);">
                Tier Est: <span id="price-tier-${tier}"><i class="hex-icon"></i>~${fmtHex(tierTotalPayout)}</span>
              </span>
            </summary>`;
        const detailsOpen = `<details data-tier="${tier}" ${tierOpen ? 'open' : ''} style="margin-bottom:16px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 16px;">`;
        if(!tierOpen) return `${detailsOpen}${summary}<div data-lazy></div></details>`;

        // no whitespace around the body, so filling a collapsed tier's
        // placeholder in place produces exactly this markup
        return `${detailsOpen}${summary}${marketTierBody(tier, items, now, usedUids, hitSet)}</details>`;
      }).join('')}
    `}

    <div style="margin-top:28px;border-top:1px solid var(--line);padding-top:20px;">
      <div class="section-label" style="margin-bottom:10px;">Market Charts</div>
    </div>
    ${renderMarketIndexChart()}

    ${renderVaultChart()}

    <details style="margin-bottom:16px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 16px;">
      <summary style="font-family:var(--font-display);font-weight:800; font-size:15px; color:var(--muted); cursor:pointer; text-transform:uppercase; letter-spacing:0.04em; outline:none;">How selling works</summary>
      <div style="margin-top:12px;">
    <div class="slippage-row">
      <div class="slippage-notice">
        <div>
          <b>⚡ Real-Time Slippage!</b><br>Card prices move with the market. Sell when it's up, hold off when it's down. Waiting alone won't save you from a bad sale. Final value is computed at the exact millisecond of sale.
        </div>
      </div>
      <div class="slippage-notice">
        <div>
          <b>⏳ HODL BONUS!</b><br>Holding cards a while adds a small bonus &mdash; up to <b>+30%</b>, earned at +1% per hour. It softens a dip, but it won't turn a bear market into a profit.
        </div>
      </div>
    </div>
      </div>
    </details>

    ${backToTopBtn()}
    ${renderMarketModal()}
  `;
}

// Card backs shelf. Every tile draws the real back at full card size, so the
// tile IS the preview - there is no separate preview path that could drift
// from what the reveal actually renders.
function renderCardBackShelf(){
  if(!authUser){
    return `<div class="shop-note">Sign in to browse card backs.</div>`;
  }
  if(cardBackShelf === null){
    return `<div class="shop-note">Loading card backs…</div>`;
  }
  // server rows the client has no art for are skipped, so a DB seed can land
  // before the CSS ships without rendering a blank tile. A back whose season
  // ended while the page was open stays only if owned.
  const rows = cardBackShelf.filter(r => cardBackById(r.id) && (r.owned || collectibleOnOffer(r)));
  if(rows.length === 0){
    return `<div class="shop-note">No card backs available yet.</div>`;
  }

  return `
  <div class="cbshelf">
    ${rows.map(r=>{
      const meta      = cardBackById(r.id);
      const isEquip   = state.equippedBack === r.id;
      const busy      = cardBackBusy === r.id;
      const tooPoor   = state.hex < r.price;
      const onOffer   = collectibleOnOffer(r);
      const cls       = `cbtile coll-tile ${r.owned?'owned':'locked'} ${isEquip?'equipped':''}`;
      let btn;
      if(!r.owned){
        btn = `<button class="cb-btn buy" data-buyback="${esc(r.id)}" ${(busy||tooPoor)?'disabled':''}>${busy?'…':(tooPoor?'Locked':'Purchase')}</button>`;
      } else if(isEquip){
        btn = `<button class="cb-btn equip on" data-equipback="" ${busy?'disabled':''}>${busy?'…':'Equipped'}</button>`;
      } else {
        btn = `<button class="cb-btn equip" data-equipback="${esc(r.id)}" ${busy?'disabled':''}>${busy?'…':'Equip'}</button>`;
      }
      return `
      <div class="${cls}">
        <div class="cb-swatch card-face card-back back-${esc(r.id)}">${meta.wordmark===false?'':`<span class="back-hex" aria-hidden="true"></span>`}</div>
        ${r.season && onOffer ? `<div class="coll-season">${esc(r.season)}</div>` : ''}
        <div class="cb-price">${r.owned ? (onOffer || !ownedSeasonOf(r) ? 'Owned' : `Owned - ${esc(ownedSeasonOf(r))}`) : `<i class="hex-icon" style="width:10px;height:12px;"></i>${fmtHex(r.price)}`}</div>
        ${onOffer && !r.owned && r.available_until ? `<div class="coll-left" title="${esc(new Date(r.available_until).toLocaleString())}">Leaves in ${seasonTimeLeft(Date.parse(r.available_until) - Date.now())}</div>` : ''}
        ${btn}
      </div>`;
    }).join('')}
  </div>`;
}

// Time left in a season, coarse: "3d 4h", "4h 12m", "12m".
function seasonTimeLeft(ms){
  const m = Math.max(1, Math.floor(ms / 60000)), h = Math.floor(m / 60), d = Math.floor(h / 24);
  return d ? `${d}d ${h % 24}h` : (h ? `${h}h ${m % 60}m` : `${m}m`);
}

// Is the item (cosmetic or card back) still on offer? The server decided when
// the shelf loaded; a season that ends while the page is open ends here too,
// so the tile stops offering what buy_cosmetic / buy_card_back would refuse.
function collectibleOnOffer(r){
  if(r.on_offer === false || r.active === false) return false;
  return !(r.available_until && Date.parse(r.available_until) <= Date.now());
}

// The season label on an owned item that's off sale: the season the player
// got it in (owned_season, stored with the purchase), so relabeling the item
// later doesn't change it. Older servers without owned_season: the item's own.
function ownedSeasonOf(r){ return 'owned_season' in r ? r.owned_season : r.season; }

// One tile per cosmetic: the item alone on a plain dark card. Your Avacard
// panel beside the tabs shows how your whole outfit looks.
function cosmeticTile(r){
  const art     = COSMETICS_BY_ID.get(r.id);
  const slot    = art.slot;
  const isEquip = !!(state.equipped && state.equipped[slot] === r.id);
  const busy    = cosmeticBusy === r.id;
  const level   = r.criteria && r.criteria.trainer_level;
  let label, btn;
  const onOffer = collectibleOnOffer(r);
  if(r.owned){
    // off sale now (season over, or hidden): owners keep it and can wear it;
    // it shows the season they got it in, if it had one then
    const got = ownedSeasonOf(r);
    label = onOffer || !got ? 'Owned' : `Owned - ${esc(got)}`;
    btn = isEquip
      ? `<button class="cb-btn equip on" data-equipcos="" data-slot="${slot}" ${busy?'disabled':''}>${busy?'…':'Equipped'}</button>`
      : `<button class="cb-btn equip" data-equipcos="${esc(r.id)}" data-slot="${slot}" ${busy?'disabled':''}>${busy?'…':'Equip'}</button>`;
  } else if(r.price != null){
    const tooPoor = state.hex < r.price;
    label = `<i class="hex-icon" style="width:10px;height:12px;"></i>${fmtHex(r.price)}`;
    btn = `<button class="cb-btn buy" data-buycos="${esc(r.id)}" ${(busy||tooPoor)?'disabled':''}>${busy?'…':(tooPoor?'Locked':'Purchase')}</button>`;
  } else {
    label = level ? `Trainer level ${fmtHex(level)}` : 'Locked';
    btn = `<button class="cb-btn" disabled>Locked</button>`;
  }
  return `
      <div class="cbtile coll-tile ${r.owned?'owned':'locked'} ${isEquip?'equipped':''}">
        <div class="cos-preview">${avatarStage('blank', art.svg, 3)}</div>
        ${r.season && onOffer ? `<div class="coll-season">${esc(r.season)}</div>` : ''}
        <div class="cos-name">${esc(r.name)}</div>
        <div class="cb-price">${label}</div>
        ${onOffer && !r.owned && r.available_until ? `<div class="coll-left" title="${esc(new Date(r.available_until).toLocaleString())}">Leaves in ${seasonTimeLeft(Date.parse(r.available_until) - Date.now())}</div>` : ''}
        ${btn}
      </div>`;
}

// Cosmetics bought with HEX, or (unlockables) earned at a milestone - price
// null. Server rows the client has no art for are skipped, as with backs.
function renderCosmeticShelf(unlockables){
  if(!authUser) return `<div class="shop-note">Sign in to browse ${unlockables ? 'unlockables' : 'cosmetics'}.</div>`;
  if(cosmeticShelf === null) return `<div class="shop-note">Loading…</div>`;
  const order = { hat: 0, body: 1, legs: 2 };
  const rows = cosmeticShelf
    // an item whose season ended while the page was open stays only if owned
    .filter(r => COSMETICS_BY_ID.has(r.id) && (r.price == null) === unlockables && (r.owned || collectibleOnOffer(r)))
    .sort((a, b) => order[COSMETICS_BY_ID.get(a.id).slot] - order[COSMETICS_BY_ID.get(b.id).slot]);
  if(rows.length === 0){
    return `<div class="shop-note">${unlockables ? 'Nothing to unlock yet. Milestone rewards are on the way.' : 'No cosmetics in the shop yet.'}</div>`;
  }
  return `<div class="cbshelf">${rows.map(cosmeticTile).join('')}</div>`;
}

// The right-hand panel: your Avacard as it looks right now - the equipped back
// and outfit, redrawn on every render, so a purchase or equip shows at once.
// Only cosmetics are listed by name; card back names show nowhere else.
function renderCollectiblesPanel(){
  const itemName = id => {
    if(!id) return null;
    const row = (cosmeticShelf || []).find(r => r.id === id);
    const art = COSMETICS_BY_ID.get(id);
    return (row && row.name) || (art && art.name) || null;
  };
  const line = (label, name) => `<dt>${label}</dt><dd class="${name ? '' : 'none'}">${name ? esc(name) : 'none'}</dd>`;
  const eq = state.equipped || {};
  return `
  <aside class="coll-panel" aria-label="Your Avacard">
    <div class="coll-panel-title">Your Avacard</div>
    ${avatarStage(state.equippedBack, cosmeticLayers(eq), 4)}
    <dl class="coll-outfit">
      ${line('Hat', itemName(eq.hat))}
      ${line('Body', itemName(eq.body))}
      ${line('Legs', itemName(eq.legs))}
    </dl>
  </aside>`;
}

function renderCollectiblesShop(){
  const tabs = [['backs', 'Card Backs'], ['cosmetics', 'Cosmetics'], ['unlockables', 'Unlockables']];
  const tab = tabs.some(t => t[0] === collTab) ? collTab : 'backs';
  let body;
  if(tab === 'backs'){
    body = renderCardBackShelf();
  } else if(tab === 'cosmetics'){
    body = renderCosmeticShelf(false);
  } else {
    body = renderCosmeticShelf(true);
  }
  return `
  <div class="coll-shop">
    <div>
      <div class="lb-chips coll-tabs" role="tablist">${tabs.map(([k, label]) =>
        `<button class="lb-chip ${k === tab ? 'on' : ''}" role="tab" aria-selected="${k === tab}" data-colltab="${k}">${label}</button>`).join('')}</div>
      ${body}
    </div>
    ${authUser ? renderCollectiblesPanel() : ''}
  </div>`;
}

async function loadPnlSeries(){
  if(pnlLoading) return;
  pnlLoading = true; pnlError = null;
  try{
    const { data, error } = await sb.rpc('get_pnl_series', { p_buckets: 60 });
    if(error) throw error;
    pnlSeries = data;
  }catch(e){
    console.error('get_pnl_series failed:', e && e.message, e);
    pnlError = 'Could not load P&L history.';
  }finally{
    pnlLoading = false;
    if(view === 'market') render();
  }
}

// uid whose slot picker is open in the detail modal, or null. set when the
// server answers status:'full' so the player can choose what to displace.
let favPickerFor = null;

function favSlotPicker(uid){
  if(favPickerFor !== uid) return '';
  const slots = state.favoriteUids || [];
  const cells = [];
  for(let i = 0; i < FAVORITE_SLOTS; i++){
    const held = slots[i];
    const inst = held ? (state.instances || []).find(x => x.uid === held) : null;
    const p = inst ? POKEMON.find(x => x.id === inst.id) : null;
    // an occupied slot whose card was sold still occupies the slot - say so
    // rather than showing it as free, or the count won't add up for the player
    const art = p
      ? spriteFit(p, 52, inst.shadow ? 'shadow-sprite' : '', inst.shiny ? `filter:hue-rotate(${shinyHue(p.id)}deg) saturate(1.4);` : '')
      : `<div style="width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(255,255,255,0.45);">${held ? '?' : '+'}</div>`;
    const label = p
      ? `#${String(p.id).padStart(3,'0')} ${esc(p.name)}${inst.shiny ? ' ★' : ''}${inst.shadow ? ' ☾' : ''}${inst.holo ? ' ❖' : ''}`
      : (held ? 'Sold card' : 'Empty');
    cells.push(`
      <button class="buybtn" style="flex:1;min-width:0;padding:6px 4px;font-size:10px;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:2px;"
              data-fav-slot="${uid}" data-fav-slot-n="${i + 1}">
        <span style="font-size:9px;opacity:0.75;">SLOT ${i + 1}</span>
        ${art}
        <span style="font-size:9.5px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;">${label}</span>
      </button>`);
  }
  return `
    <div style="margin:8px 0 4px;">
      <div style="font-size:11px;color:var(--muted);text-align:center;margin-bottom:6px;">
        All ${FAVORITE_SLOTS} favorite slots are full. Which one should this card replace?
      </div>
      <div style="display:flex;gap:6px;">${cells.join('')}</div>
      <button class="buybtn" style="width:100%;margin-top:6px;padding:5px;font-size:10px;"
              data-fav-slot-cancel="1">Cancel</button>
    </div>`;
}

// slot: null lets the server append or report 'full'; 1..3 overwrites that slot.
async function setFavoriteSlot(uid, slot){
  const prev = (state.favoriteUids || []).slice();
  try{
    const { data, error } = await sb.rpc('set_favorite_slot',
      { p_uid: uid, p_slot: slot ?? null });
    if(error) throw error;

    if(data && data.status === 'full'){
      // not an error - the server is asking which slot to displace. it sends
      // the authoritative slots with this response, so adopt them before the
      // picker renders or it can list occupants that are already stale.
      if(Array.isArray(data.slots)) state.favoriteUids = data.slots;
      favPickerFor = uid;
      render();
      return;
    }
    if(data && data.status === 'error'){
      toast(data.message === 'card not held'
        ? 'That card is no longer in your vault.'
        : 'Could not update your favorites - try again.');
      return;
    }

    // server is the source of truth for slot order, so take what it returns
    // rather than reconstructing it here and risking a divergent local copy
    state.favoriteUids = Array.isArray(data && data.slots) ? data.slots : prev;
    favPickerFor = null;
    render();
    toast(data.status === 'removed' ? 'Removed from favorites.'
        : data.status === 'cleared' ? 'Favorite slot cleared.'
        : 'Favorite set.');
  }catch(e){
    console.error('set_favorite_slot failed:', e && e.message, e);
    state.favoriteUids = prev;
    favPickerFor = null;
    render();
    toast('Could not update your favorites - try again.');
  }
}

async function loadProfileStats(retrying){
  profileLoading = true;
  render();
  try{
    const [{ data: statsData, error: statsErr }, { data: profileData, error: profileErr }, { data: skillsData, error: skillsErr }] = await Promise.all([
      sb.rpc('get_player_stats'),
      sb.from('profiles').select('username, is_public').eq('user_id', authUser.id).maybeSingle(),
      // skills are the newest and least-proven RPC on this page, so this call
      // is wrapped to RESOLVE on failure rather than reject. a rejection here
      // would fail the whole Promise.all and blank the entire stats page over
      // the one section that can degrade on its own.
      sb.rpc('get_player_skills', { p_user_id: authUser.id }).then(r => r, e => ({ data: null, error: e }))
    ]);
    if(statsErr) throw statsErr;
    if(profileErr) throw profileErr;
    profileStats = statsData;
    profileUsername = profileData ? profileData.username : null;
    profileIsPublic = profileData ? profileData.is_public : true;
    // deliberately NOT thrown: the skills section renders its own failure state
    if(skillsErr){
      console.error('get_player_skills failed:', skillsErr && skillsErr.message, skillsErr);
      profileSkills = null;
    } else {
      // returns table(...) so postgrest hands back an array; always one row
      profileSkills = (Array.isArray(skillsData) ? skillsData[0] : skillsData) || null;
    }
  }catch(e){
    console.error('failed to load profile stats:', e && e.message, e);
    if(!retrying){
      // transient failures (e.g. a freshly-created RPC not yet visible to
      // the API layer) are common right after schema changes - one silent
      // retry means the player never has to know it happened
      profileLoading = false;
      return loadProfileStats(true);
    }
    toast('Could not load your stats - try again.');
  } finally {
    profileLoading = false;
    render();
  }
}

// Hexagon skill map. Six skills, six axes - the shape is a hexagon by
// construction. Radius is sqrt(level/99), NOT level/99: at a linear scale a
// mid-game player renders as a small blob in the middle and the lean, which is
// the whole point of the chart, is unreadable. sqrt lifts the middle while
// preserving order exactly, and the rings are labelled so the curve is visible
// rather than hidden.
function renderSkillMap(sk){
  const N = 6, W = 340, H = 330, R = 108, DEPTH = 13;
  const cx = W/2, cy = H/2 - 4;
  const levels = SKILL_META.map(m => Math.max(1, sk[m.key + '_level'] || 1));
  const pt = (i, f, dy) => {
    const a = -Math.PI/2 + i * 2*Math.PI/N;
    return [cx + Math.cos(a)*R*f, cy + Math.sin(a)*R*f + (dy||0)];
  };
  const poly = (fs, dy) => fs.map((f,i)=>pt(i,f,dy).map(v=>v.toFixed(1)).join(',')).join(' ');
  const fr = levels.map(l => Math.sqrt(l/99));
  const rings = [10,25,50,75,99];
  let s = '';
  // ids are namespaced: a bare id="g" in a 276KB single-file document is a
  // collision waiting to happen, and svg ids are document-global
  s += '<defs>'
     + '<linearGradient id="skmap-face" x1="0" y1="0" x2="0.3" y2="1">'
     +   '<stop offset="0%" stop-color="var(--foil1)" stop-opacity="0.62"/>'
     +   '<stop offset="100%" stop-color="var(--foil2)" stop-opacity="0.62"/></linearGradient>'
     + '<linearGradient id="skmap-wall" x1="0" y1="0" x2="0" y2="1">'
     +   '<stop offset="0%" stop-color="var(--foil2)" stop-opacity="0.85"/>'
     +   '<stop offset="100%" stop-color="var(--foil2)" stop-opacity="0.10"/></linearGradient>'
     + '<filter id="skmap-glow" x="-50%" y="-50%" width="200%" height="200%">'
     +   '<feGaussianBlur stdDeviation="3.5" result="b"/>'
     +   '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'
     + '</defs>';
  rings.forEach(v=>{
    const rf = Math.sqrt(v/99);
    s += `<polygon points="${poly(Array(N).fill(rf))}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  });
  for(let i=0;i<N;i++){
    const [x,y] = pt(i,1);
    s += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
  }
  rings.forEach(v=>{
    const rf = Math.sqrt(v/99);
    s += `<text x="${cx+3}" y="${(cy-R*rf+10).toFixed(1)}" font-family="'JetBrains Mono',monospace" font-size="8" fill="var(--muted)" opacity="0.7">${v}</text>`;
  });
  // side walls painted back-to-front so the solid reads as a plate rather than
  // a shelf; without the sort the near faces are overdrawn by the far ones
  const top = fr.map((f,i)=>pt(i,f)), bot = fr.map((f,i)=>pt(i,f,DEPTH));
  const order = [0,1,2,3,4,5].sort((a,b)=>
    (top[b][1]+top[(b+1)%N][1]) - (top[a][1]+top[(a+1)%N][1]));
  order.forEach(i=>{
    const j=(i+1)%N;
    s += `<polygon points="${top[i][0].toFixed(1)},${top[i][1].toFixed(1)} ${top[j][0].toFixed(1)},${top[j][1].toFixed(1)} ${bot[j][0].toFixed(1)},${bot[j][1].toFixed(1)} ${bot[i][0].toFixed(1)},${bot[i][1].toFixed(1)}" fill="url(#skmap-wall)"/>`;
  });
  s += `<polygon points="${poly(fr)}" fill="url(#skmap-face)" stroke="var(--foil1)" stroke-width="2" filter="url(#skmap-glow)"/>`;
  fr.forEach((f,i)=>{
    const [x,y]=pt(i,f);
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--foil1)"/>`;
  });
  SKILL_META.forEach((m,i)=>{
    const a = -Math.PI/2 + i*2*Math.PI/N;
    const lx = cx + Math.cos(a)*(R+27), ly = cy + Math.sin(a)*(R+27);
    const anch = Math.cos(a) > 0.3 ? 'start' : (Math.cos(a) < -0.3 ? 'end' : 'middle');
    s += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anch}" font-family="'JetBrains Mono',monospace" font-size="10" fill="var(--muted)">${esc(m.label.slice(0,3).toUpperCase())}</text>`;
    s += `<text x="${lx.toFixed(1)}" y="${(ly+13).toFixed(1)}" text-anchor="${anch}" font-family="'JetBrains Mono',monospace" font-size="12" fill="var(--text)">${levels[i]}</text>`;
  });
  return `<div class="skillmap"><svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${s}</svg></div>`;
}

function renderSkillsSection(){
  // the section degrades on its own: loadProfileStats deliberately does not
  // throw on a skills failure, so the rest of the stats page is unaffected
  if(!profileSkills){
    return `<div class="section-label" style="margin-top:20px;">Skills</div>`
         + `<div style="color:var(--muted);padding:12px 0;font-size:13px;">Your skills could not be loaded just now. The rest of your stats are unaffected - try reloading.</div>`;
  }
  const sk = profileSkills;
  const rows = SKILL_META.map(m=>{
    const lv   = sk[m.key + '_level'] || 1;
    const xp   = Number(sk[m.key + '_xp'] || 0);
    const base = Number(sk[m.key + '_level_xp'] || 0);
    const next = sk[m.key + '_next_xp'];
    // next_xp is null at 99 by design - a maxed skill has no next band, and a
    // fabricated ceiling would mean dividing by a made-up number
    const maxed = next === null || next === undefined;
    const into  = xp - base;
    const span  = maxed ? 0 : Number(next) - base;
    const pct   = maxed ? 100 : Math.max(0, Math.min(100, (into / span) * 100));
    const open  = skillInfoFor === m.key;
    return `
      <div class="skill-row">
        <span class="sk-ico"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${m.icon}</svg></span>
        <span class="sk-name">${esc(m.label)}</span>
        <span class="sk-lv">${lv}</span>
        <span class="sk-barwrap"><span class="sk-bar"><i style="margin-left:${pct.toFixed(1)}%;width:${(100 - pct).toFixed(1)}%;"></i></span></span>
        <span class="sk-lv-next">${maxed ? '&#9733;' : lv + 1}</span>
        <span class="sk-xp">${maxed ? 'MAX' : fmtHex(Number(next) - xp) + ' to go'}</span>
        <button class="sk-info ${open ? 'on' : ''}" data-skill-info="${m.key}"
          aria-expanded="${open ? 'true' : 'false'}"
          title="How to train ${esc(m.label)}">i</button>
      </div>
      ${open ? `<div class="skill-note">${m.note}</div>` : ''}`;
  }).join('');
  return `
    <div class="section-label" style="margin-top:20px;">Skills</div>
    <div class="skill-summary">
      <span><span class="lab">TRAINER</span> <span class="val">${sk.trainer_level}</span></span>
      <span><span class="lab">TOTAL LEVEL</span> <span class="val alt">${sk.total_level}</span></span>
      <span><span class="lab">TOTAL XP</span> <span class="val alt">${fmtHex(Number(sk.total_xp))}</span></span>
    </div>
    ${renderSkillMap(sk)}
    ${rows}`;
}

// ---------- Friends & Mailbox ----------
async function loadFriendRequests(){
  try{
    const { data, error } = await sb
      .from('friend_requests')
      .select('id, requester_id, recipient_id, status, created_at, responded_at')
      .or(`requester_id.eq.${authUser.id},recipient_id.eq.${authUser.id}`);
    if(error) throw error;
    state.friendRequests = data || [];

    const otherIds = [...new Set(state.friendRequests.map(r => r.requester_id===authUser.id ? r.recipient_id : r.requester_id))];
    if(otherIds.length){
      const { data: profs, error: profErr } = await sb.from('profiles').select('user_id, username').in('user_id', otherIds);
      if(profErr) throw profErr;
      friendUsernames = {};
      (profs||[]).forEach(p => { friendUsernames[p.user_id] = p.username; });
    } else {
      friendUsernames = {};
    }
  }catch(e){
    console.error('friend request load failed', e);
    state.friendRequests = [];
    friendUsernames = {};
  }
}

function incomingRequests(){ return (state.friendRequests||[]).filter(r=>r.status==='pending' && r.recipient_id===authUser.id); }
function outgoingRequests(){ return (state.friendRequests||[]).filter(r=>r.status==='pending' && r.requester_id===authUser.id); }
function acceptedFriends(){ return (state.friendRequests||[]).filter(r=>r.status==='accepted'); }
function friendUserId(row){ return row.requester_id===authUser.id ? row.recipient_id : row.requester_id; }

// When the mailbox was last fetched by any path (sign-in, poll, opening the
// mailbox, a claim's reload). The background poll spaces itself from this.
let lastMailFetchAt = 0;

// RLS already limits this to the caller's own unexpired rows; the user_id
// filter is there so the (user_id, created_at) index serves the query.
async function loadMessages(){
  lastMailFetchAt = Date.now();
  try{
    const { data, error } = await sb
      .from('player_messages')
      .select('id, kind, title, body, gift, read_at, claimed_at, expires_at, created_at')
      .eq('user_id', authUser.id)
      .order('created_at', { ascending: false })
      .limit(100);
    if(error) throw error;
    state.messages = data || [];
  }catch(e){
    console.error('message load failed', e);
    state.messages = state.messages || [];
  }
}

// Only messages created since the newest one already held, merged in by id.
// Polls use this: nearly every poll then returns an empty list instead of the
// whole mailbox (egress). gte, not gt, so two messages sharing a timestamp
// can't be skipped - the overlap is merged away by id. Not caught here:
// changes to existing rows made on another device, and a row committed out
// of order - the periodic full reload (MAIL_FULL_EVERY) picks those up.
async function loadNewMessages(){
  const held = state.messages || [];
  if(!held.length){ await loadMessages(); return; }
  lastMailFetchAt = Date.now();
  // PostgREST timestamps share one format and offset, so string order is time order
  const since = held.reduce((m, x) => x.created_at > m ? x.created_at : m, held[0].created_at);
  try{
    const { data, error } = await sb
      .from('player_messages')
      .select('id, kind, title, body, gift, read_at, claimed_at, expires_at, created_at')
      .eq('user_id', authUser.id)
      .gte('created_at', since)
      .order('created_at', { ascending: false })
      .limit(100);
    if(error) throw error;
    if(!data || !data.length) return;
    const byId = new Map(held.map(m => [m.id, m]));
    data.forEach(m => byId.set(m.id, m));
    // same order and cap as a full load: newest first, at most 100
    state.messages = [...byId.values()]
      .sort((a, b) => a.created_at < b.created_at ? 1 : a.created_at > b.created_at ? -1 : 0)
      .slice(0, 100);
  }catch(e){
    console.error('message poll failed', e);
  }
}

// a message needs attention while unread, and a gift stays that way until claimed
function messageNeedsAttention(m){ return !m.read_at || (m.kind==='gift' && !m.claimed_at); }
function mailBadgeCount(){
  return (state.messages||[]).filter(messageNeedsAttention).length + incomingRequests().length;
}
function defaultMailboxTab(){
  if((state.messages||[]).some(messageNeedsAttention)) return 'messages';
  if(incomingRequests().length) return 'friends';
  return 'messages';
}

// Marks exactly the rows on screen, by id - not "all", which would also
// swallow anything that arrived after the last load and was never shown.
function markMessagesRead(){
  const unread = (state.messages||[]).filter(m=>!m.read_at);
  if(!unread.length) return;
  const now = new Date().toISOString();
  unread.forEach(m=>{ m.read_at = now; freshMessageIds.add(m.id); });
  // fire-and-forget: if this fails the rows just come back unread next load
  sb.rpc('mark_messages_read', { p_ids: unread.map(m=>m.id) })
    .then(({ error })=>{ if(error) console.error('mark read failed', error); });
}

// ---------- background mailbox sync ----------
// Nothing pushes to the client, so new messages - and the admin credits,
// refunds and cards their notices announce - are pulled: every 3 min while the
// tab is visible, and when the player comes back to it after a minute or more.
// Each poll is a request whatever it returns, so the interval is the egress knob.
const MAIL_POLL_MS = 180000;
// every Nth poll is a full reload (~9 min at 3 min): picks up reads, claims
// and dismissals made on another device, which the incremental poll can't see
const MAIL_FULL_EVERY = 3;
// coming back to the tab polls only if the last fetch is at least this old,
// so flicking between tabs costs nothing
const MAIL_RETURN_MIN_MS = 60000;
let mailPollCount = 0;
const IDLE_BEFORE_SYNC_MS = 10000;
let lastInteractionAt = Date.now();
let stateRefreshPending = false;
let stateRefreshTimer = null;
let mailPollBusy = false;
// capture phase, so a handler that stops propagation still counts as input
['pointerdown','keydown'].forEach(t => document.addEventListener(t, ()=>{ lastInteractionAt = Date.now(); }, true));

// Reload messages (full, or only new ones); if a new system notice arrived,
// queue a re-read of the balance and collection it refers to (the credit is
// already server-side).
async function syncMessages(full){
  const known = new Set((state.messages||[]).map(m=>m.id));
  if(full) await loadMessages(); else await loadNewMessages();
  const arrived = (state.messages||[]).filter(m=>!known.has(m.id));
  if(arrived.some(m=>m.kind==='system')){ stateRefreshPending = true; tryStateRefresh(); }
  return arrived;
}

// Every economy action mirrors its result into state after its RPC returns
// (cancel adds the refund, liquidate_instance splices by index...), so a
// re-read landing between the server commit and that mirror would get the
// mirror applied twice. Those actions all start with a click, so "no input
// for 10s and no flow open" guards all of them without auditing each one.
function stateRefreshBlocked(){
  return !!(opening || packBusy || finalizeBusy || claimBusy || activeModal
         || carrying || pressTimer
         || (Date.now() - lastInteractionAt) < IDLE_BEFORE_SYNC_MS);
}
async function tryStateRefresh(){
  clearTimeout(stateRefreshTimer);
  if(!stateRefreshPending || !authUser) return;
  if(stateRefreshBlocked()){ stateRefreshTimer = setTimeout(tryStateRefresh, 3000); return; }
  stateRefreshPending = false;
  const { data: fresh, error } = await sb
    .from('game_states_v2')
    .select('hex, dex, instances')
    .eq('user_id', authUser.id)
    .maybeSingle();
  if(error || !fresh){
    console.error('background state refresh failed', error);
    stateRefreshPending = true;
    stateRefreshTimer = setTimeout(tryStateRefresh, 30000);
    return;
  }
  // a click may have started something while the read was in flight - this
  // result could then land under its mirror, so drop it and retry once idle
  if(stateRefreshBlocked()){ stateRefreshPending = true; stateRefreshTimer = setTimeout(tryStateRefresh, 3000); return; }
  state.hex = fresh.hex;
  state.dex = fresh.dex || {};
  state.instances = fresh.instances || [];
  recordVaultValue();
  saveState();
  // the balance is on every view - patch it in place rather than render(),
  // which would rebuild the page under whatever the player is doing. Other
  // views pick up the new cards on their next render (any click).
  const bal = document.querySelector('.balance .val');
  if(bal) bal.innerHTML = `<i class="hex-icon"></i>${fmtHex(state.hex)}`;
}

function updateMailBadge(){
  const btn = document.querySelector('[data-mailbox-open]');
  if(!btn) return;
  const n = mailBadgeCount();
  let badge = btn.querySelector('.mailbadge');
  if(!n){ if(badge) badge.remove(); return; }
  if(!badge){ badge = document.createElement('span'); badge.className = 'mailbadge'; btn.appendChild(badge); }
  badge.textContent = n;
}

async function pollMailbox(){
  if(!authUser || !state.messages || document.hidden || mailPollBusy) return; // state.messages unset = login still loading
  mailPollBusy = true;
  try{
    mailPollCount++;
    const arrived = await syncMessages(mailPollCount % MAIL_FULL_EVERY === 0);
    if(!arrived.length || !authUser) return;
    // the Messages tab has no inputs or gestures to break, so a full render is
    // safe there; anywhere else only the badge changes
    if(mailboxOpen && mailboxTab==='messages'){ markMessagesRead(); render(); }
    else updateMailBadge();
  } finally {
    mailPollBusy = false;
  }
}

// An unclaimed gift is never dismissable - the server skips it too
// (dismiss_messages), this just keeps the button from being offered.
function messageDismissable(m){ return !(m.kind==='gift' && !m.claimed_at); }

// Dismissed rows drop out of the read policy, so removing them locally is
// what the next load would return anyway. On failure, reload the truth.
async function dismissMessages(ids){
  if(!ids.length) return;
  const gone = new Set(ids);
  state.messages = (state.messages||[]).filter(m=>!gone.has(m.id));
  render();
  const { error } = await sb.rpc('dismiss_messages', { p_ids: ids });
  if(error){
    console.error('dismiss failed', error);
    toast("Couldn't clear that - try again.");
    await loadMessages();
    render();
  }
}

async function claimGift(id){
  if(claimBusy) return;
  claimBusy = id;
  render();
  try{
    const { data, error } = await sb.rpc('claim_message_gift', { p_message_id: id });
    if(error){
      const m = error.message || '';
      toast(m.includes('already claimed') ? 'Already claimed.'
          : m.includes('expired')         ? 'That gift has expired.'
          : m.includes('restricted')      ? "Your account can't claim gifts right now."
          : "Couldn't claim that gift - try again.");
      await loadMessages(); // the server knows whether it's claimed or gone
      return;
    }
    let applied = false;
    if(data && Array.isArray(data.added) && data.dex_changed && typeof data.balance === 'number'){
      // the server returns what it changed - the card it added exactly as
      // stored (none for a HEX gift), the dex entry it touched and the balance
      // after - so apply that instead of re-reading the whole card list, as
      // finalizeOpening() does. data.hex is the gifted amount, not the balance.
      state.hex = data.balance;
      state.instances = state.instances || [];
      state.instances.push(...data.added);
      state.dex = Object.assign(state.dex || {}, data.dex_changed);
      recordVaultValue();
      saveState();
      applied = true;
    } else {
      // a server that doesn't send the change: read the changed rows back
      // rather than mirroring the gift locally, same reasoning as finalizeOpening()
      const { data: fresh, error: readErr } = await sb
        .from('game_states_v2')
        .select('hex, dex, instances')
        .eq('user_id', authUser.id)
        .maybeSingle();
      if(readErr || !fresh){
        console.error('post-claim re-read failed', readErr);
        toast('Gift claimed - reload the page to see it.');
      } else {
        state.hex = fresh.hex;
        state.dex = fresh.dex || {};
        state.instances = fresh.instances || [];
        recordVaultValue();
        saveState();
        applied = true;
      }
    }
    const msg = (state.messages||[]).find(x=>x.id===id);
    if(msg){ msg.claimed_at = new Date().toISOString(); msg.read_at = msg.read_at || msg.claimed_at; }
    if(applied) toast(data.hex
      ? `Claimed <i class="hex-icon"></i>${fmtHex(data.hex)} HEX!`
      : `Claimed ${esc(data.name)}${data.shiny ? ' ✨' : ''}${data.shadow ? ' ☾' : ''}${data.holo ? ' ❖' : ''}!`);
  } finally {
    claimBusy = null;
    render();
  }
}

async function sendFriendRequest(username){
  const val = (username||'').trim();
  if(!val){ addFriendMsg = { type:'err', text:'Enter a username.' }; render(); return; }
  friendActionBusy = true; render();
  try{
    const escaped = val.replace(/_/g, '\\_');
    const { data: target, error: lookupErr } = await sb.from('profiles').select('user_id, username').ilike('username', escaped).maybeSingle();
    if(lookupErr) throw lookupErr;
    if(!target){ addFriendMsg = { type:'err', text:'No player with that username.' }; return; }
    if(target.user_id === authUser.id){ addFriendMsg = { type:'err', text:"That's you." }; return; }
    const { error: rpcErr } = await sb.rpc('send_friend_request', { target_user_id: target.user_id });
    if(rpcErr) throw rpcErr;
    addFriendInput = '';
    addFriendMsg = { type:'ok', text: `Friend request sent to ${target.username}.` };
    await loadFriendRequests();
  }catch(e){
    console.error('send friend request failed', e);
    addFriendMsg = { type:'err', text: (e && e.message && e.message.includes('already exists')) ? 'A request or friendship already exists with this user.' : 'Could not send request - try again.' };
  } finally {
    friendActionBusy = false;
    render();
  }
}

async function toggleProfileVisibility(){
  const next = !profileIsPublic;
  profileIsPublic = next; render(); // optimistic - a simple boolean flip on your own row
  // update, not upsert: this only ever runs against a row that's guaranteed to
  // already exist (post username-gate), and upsert's ON CONFLICT DO UPDATE
  // still validates the candidate INSERT row's NOT NULL constraints - including
  // username, which this payload doesn't carry - before it even checks for a
  // conflict, so it was failing even though a matching row already existed.
  const { error } = await sb.from('profiles').update({ is_public: next }).eq('user_id', authUser.id);
  if(error){
    console.error('visibility toggle failed', error);
    profileIsPublic = !next;
    toast('Could not update visibility - try again.');
    render();
  }
}

async function openPublicProfile(userId){
  viewingProfileId = userId;
  viewingProfileData = null;
  viewingProfileLoading = true;
  viewingBinders = [];
  viewingFiledInstances = [];
  viewingOpenBinderId = null;
  viewingBinderPageIdx = 0;
  render();
  try{
    const [{ data: profileData, error: profileErr }, { data: skillsData, error: skillsErr }, { data: bindersData, error: bindersErr }, { data: cosData, error: cosErr }] = await Promise.all([
      sb.rpc('get_public_profile', { target_user_id: userId }),
      // same "degrade, don't fail the page" treatment as loadProfileStats -
      // a skills or binders hiccup shouldn't blank out the rest of the visit
      sb.rpc('get_player_skills', { p_user_id: userId }).then(r => r, e => ({ data: null, error: e })),
      sb.rpc('get_public_binders', { target_user_id: userId }).then(r => r, e => ({ data: null, error: e })),
      sb.rpc('get_public_cosmetics', { target_user_id: userId }).then(r => r, e => ({ data: null, error: e }))
    ]);
    if(profileErr) throw profileErr;
    viewingProfileData = {
      ...profileData,
      skills: skillsErr ? null : (Array.isArray(skillsData) ? skillsData[0] : skillsData) || null,
      // what they wear; a failure here just shows the plain card
      cosmetics: cosErr ? null : cosData
    };
    if(bindersErr){
      console.error('failed to load public binders', bindersErr && bindersErr.message, bindersErr);
    } else {
      viewingBinders = (bindersData && Array.isArray(bindersData.binders)) ? bindersData.binders : [];
      viewingFiledInstances = (bindersData && Array.isArray(bindersData.filedInstances)) ? bindersData.filedInstances : [];
    }
  }catch(e){
    console.error('failed to load public profile', e && e.message, e);
    toast(e && e.message === 'profile is private' ? "That player's profile is private." : 'Could not load that profile - try again.');
    viewingProfileId = null;
    viewingProfileData = null;
  } finally {
    viewingProfileLoading = false;
    render();
  }
}

function closePublicProfile(){
  viewingProfileId = null;
  viewingProfileData = null;
  viewingBinders = [];
  viewingFiledInstances = [];
  viewingOpenBinderId = null;
  render();
}

// Resolves a filed uid against the minimal filedInstances subset the RPC
// returned - never the owner's full instances array. A uid that doesn't
// resolve (liquidated since filing) renders as an empty pocket, same
// reconciliation rule as the owner's own binders.
function viewingInstanceCard(uid){
  const inst = viewingFiledInstances.find(x=>x.uid===uid);
  if(!inst) return null;
  const p = POKEMON.find(x=>x.id===inst.id);
  if(!p) return null;
  return { uid, id:p.id, name:p.name, type:p.type, sprite:p.sprite, value:p.value, shiny:!!inst.shiny, holo:!!inst.holo, shadow:!!inst.shadow, rarity:inst.rarity||p.rarity };
}
function viewingCountFilled(binder){
  return (binder.pages||[]).reduce((n,p)=>n + p.filter(uid=>uid && viewingInstanceCard(uid)).length, 0);
}

function renderPublicBinderShelf(){
  if(!viewingBinders.length){
    return `<div class="section-label" style="margin-top:20px;">Binders</div><div style="color:var(--muted);font-size:12px;padding:8px 0;">No binders yet.</div>`;
  }
  const spinesHtml = [];
  for(let i=0;i<BINDER_MAX_COUNT;i++){
    const b = viewingBinders[i];
    spinesHtml.push(b
      ? `<div class="spine" style="background:${spineFace(b.color)};color:${b.textColor||'#07090a'};" data-view-binder="${b.id}">
           <div class="spine-texture"></div>
           <div class="spine-shine"></div>
           <div class="spine-name">${esc(b.name)}</div>
         </div>`
      : `<div class="spine spine-empty"></div>`
    );
  }
  return `
  <div class="section-label" style="margin-top:20px;">Binders</div>
  <div class="shelfwrap">
    <div class="shelfstage">
      <div class="shelf-lighting"></div>
      <div class="shelfcase">
        <div class="shelfrow">
          <div class="bookend bookend-left"></div>
          ${spinesHtml.join('')}
          <div class="bookend bookend-right"></div>

        <div class="shelfledge"></div>
      </div>
    </div>
  </div>`;
}

function renderPublicBinderPage(){

  if(!binder){ viewingOpenBinderId = null; return renderPublicBinderShelf(); }
  const pages = binder.pages && binder.pages.length ? binder.pages : [new Array(9).fill(null)];
  const pageIdx = Math.min(viewingBinderPageIdx, pages.length-1);
  const pageArr = pages[pageIdx];

  const cellsHtml = pageArr.map(uid=>{
    const card = uid ? viewingInstanceCard(uid) : null;
    if(card){
      return `<div class="pocket">
        <div class="pocket-lip"></div>
        <div class="sleeve">
          <div class="dexslot owned ${card.shiny?'shiny-card':''} ${card.shadow?'shadow-card':''}" style="--slot-color:${rarityColor(card.rarity)};${card.shiny?`--shiny-hue:${shinyHue(card.id)}deg;`:''}">
            ${renderPocketCard(card)}
          </div>
        </div>
      </div>`;
    }
    return `<div class="pocket pocket-empty"><div class="pocket-note">Empty</div></div>`;
  }).join('');

  const pbg = `color-mix(in srgb, ${binder.color} 20%, var(--bg) 80%)`;

  return `
  <div class="dexhead">
    <div class="dexhead-left">
      <button class="iconbtn" data-viewbinder-close title="Back to Binders">&lsaquo;</button>
      <h2 class="disp">${esc(binder.name)}</h2>
      <div class="dexcount mono">${viewingCountFilled(binder)} / ${9*pages.length}</div>

  </div>
  ${binder.desc ? `<div class="mono" style="font-size:11.5px;color:var(--muted);margin:-6px 0 12px;">${esc(binder.desc)}</div>` : ''}

  <div class="sheet3x3" style="--pbg:${pbg};">${cellsHtml}</div>

  <div class="pagenav">
    <button class="pagenavbtn" data-viewbinder-page-prev ${pageIdx===0?'disabled':''}>&lsaquo;</button>
    <div class="pageindicator mono">Page ${pageIdx+1} / ${pages.length}</div>

  `;
}

function renderPublicProfile(){
  if(viewingProfileLoading || !viewingProfileData){
    return `
    <button class="iconbtn" data-viewprofile-close title="Back">&lsaquo;</button>
    <div class="section-label">Profile</div>
    <div style="color:var(--muted);padding:20px 0;">Loading profile…</div>`;
  }
  const d = viewingProfileData;
  const mvp = d.mostValuablePull;
  const mvpPokemon = mvp ? POKEMON.find(p=>p.id===mvp.id) : null;
  const mvpCard = mvpPokemon ? {
    id: mvp.id, name: mvp.name, rarity: mvp.rarity, value: mvp.value,
    shiny: mvp.shiny, holo: mvp.holo, shadow: mvp.shadow, type: mvpPokemon.type, sprite: mvpPokemon.sprite
  } : null;

  const favoriteUids = Array.isArray(d.favoriteUids) ? d.favoriteUids : [];
  const favoriteInstances = Array.isArray(d.favoriteInstances) ? d.favoriteInstances : [];
  const favCards = Array.from({ length: FAVORITE_SLOTS }, (_, i) => {
    const uid = favoriteUids[i];
    const inst = uid ? favoriteInstances.find(x => x.uid === uid) : null;
    const fp = inst ? POKEMON.find(x => x.id === inst.id) : null;
    return fp ? {
      id: fp.id, name: fp.name, rarity: inst.rarity,
      value: fp.value, shiny: inst.shiny, holo: inst.holo, shadow: inst.shadow, type: fp.type, sprite: fp.sprite
    } : null;
  });

  const dex = d.dex || {};
  const dexIds = Object.keys(dex).map(Number);
  const genRows = GENS.map(g => {
    const total = g.hi - g.lo + 1;
    const owned = dexIds.filter(n => n >= g.lo && n <= g.hi).length;
    const pct   = ((owned / total) * 100).toFixed(1);
    return `<div class="stat-row"><span>% of ${g.label}</span><span class="mono">${pct}% (${owned}/${total})</span></div>`;
  }).join('');
  const dexOwned = dexIds.filter(n => n >= 1 && n <= DEX_TOTAL).length;
  const dexPct   = ((dexOwned / DEX_TOTAL) * 100).toFixed(1);

  const packRows = PACKS.map(p=>{
    const count = (d.packsOpened && d.packsOpened[p.id]) || 0;
    return `<div class="stat-row"><span>${esc(p.name)}</span><span class="mono">${count}</span></div>`;
  }).join('');

  return `
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    <button class="iconbtn" data-viewprofile-close title="Back">&lsaquo;</button>
    ${profileAvatar(d.equippedBack, d.cosmetics)}
    <h2 class="disp" style="margin:0;">${esc(d.username || 'Player')}</h2>
  </div>

  ${d.skills ? `<div class="section-label" style="margin-top:20px;">Skills</div>
  <div class="skill-summary">
    <span><span class="lab">TRAINER</span> <span class="val">${d.skills.trainer_level}</span></span>
    <span><span class="lab">TOTAL LEVEL</span> <span class="val alt">${d.skills.total_level}</span></span>
    <span><span class="lab">TOTAL XP</span> <span class="val alt">${fmtHex(Number(d.skills.total_xp))}</span></span>
  </div>
  ${renderSkillMap(d.skills)}` : ''}

  <div class="section-label">Collection</div>
  <div class="stat-row"><span>% of Full Dex</span><span class="mono">${dexPct}% (${dexOwned}/${DEX_TOTAL})</span></div>
  ${genRows}
  <div class="stat-row"><span># of Secret Rares Pulled</span><span class="mono">${d.secretPullsCount}</span></div>
  <div class="stat-row"><span># of Shinies Found</span><span class="mono">${d.shinyPullsCount}</span></div>
  <div class="stat-row"><span># of Shadows Found</span><span class="mono">${d.shadowPullsCount ?? 0}</span></div>

  <div class="stats-card-display">
    <div class="stats-card-col">
      <div class="section-label" style="margin:0;">Most Valuable Pull</div>
      ${mvpCard
        ? renderCardFace(mvpCard, true)
        : `<div class="stats-card-empty">No pulls recorded yet.</div>`}
    </div>
  </div>

  <div class="section-label" style="margin-top:20px;">Favorite Cards</div>
  <div class="stats-card-display">
    ${favCards.map((c, i) => `
      <div class="stats-card-col">
        <div class="section-label" style="margin:0;">Slot ${i + 1}</div>
        ${c
          ? renderCardFace(c, true)
          : `<div class="stats-card-empty">No favorite in this slot.</div>`}
      </div>`).join('')}
  </div>

  <div class="section-label" style="margin-top:20px;">Badges <span class="mono" style="color:var(--muted);letter-spacing:0;">${earnedBadgeCount(dex)}/${BADGES.length}</span></div>
  ${renderBadgeGrid(dex)}

  <div class="section-label" style="margin-top:20px;">Packs Opened by Tier</div>
  ${packRows}

  ${viewingOpenBinderId ? renderPublicBinderPage() : renderPublicBinderShelf()}
  `;
}

function renderMailbox(){

  const outgoing = outgoingRequests();
  const friends = acceptedFriends();
  const nameFor = row => esc(friendUsernames[friendUserId(row)] || 'Unknown player');

  const incomingHtml = incoming.length
    ? incoming.map(r => `

        </span>

    ? outgoing.map(r => `

        <span class="fr-actions">
          <button class="frbtn remove" data-friend-remove="${friendUserId(r)}" ${friendActionBusy?'disabled':''}>Remove</button>

  const messages = state.messages || [];
  const KIND_LABEL = { announcement:'Announcement', gift:'Gift', system:'Notice', trade:'Trade' };
  const shortDate = iso => new Date(iso).toLocaleDateString(undefined, { month:'short', day:'numeric' });
  const giftLabel = g => {

    const p = POKEMON.find(x=>x.id===g.card.id);
    const color = p && RARITY[p.rarity] ? RARITY[p.rarity].color : 'var(--text)';
    return `<span style="color:${color};font-weight:700;">${esc(p ? p.name : 'Card #' + g.card.id)}${g.card.shiny ? ' ✨' : ''}${g.card.shadow ? ' ☾' : ''}${g.card.holo ? ' ❖' : ''}</span>`;

    ? `<div class="msg-list">${messages.map(m => `

        <div class="msg-head">
          <span class="msg-kind">${KIND_LABEL[m.kind] || esc(m.kind)}</span>
          ${freshMessageIds.has(m.id) ? '<span class="msg-new">New</span>' : ''}

        </div>

        </div>` : ''}
      </div>`).join('')}</div>`

  const messagesWaiting = messages.filter(messageNeedsAttention).length;

      </div>

      <div class="section-label" style="margin:0;">Friends (${friends.length})</div>${friendsHtml}
      <div class="section-label" style="margin:14px 0 0;">Incoming</div>${incomingHtml}
      <div class="section-label" style="margin:14px 0 0;">Sent</div>${outgoingHtml}`}

const LB_TTL_MS = 60 * 1000;
// Draws the ] connector between the privacy pill and the Leaderboards pill.
// Coordinates are relative to the Leaderboards row, which holds the SVG.
function sizeVisLbLink(){
  const svg = document.querySelector('.vis-lb-link');
  const pillEl = document.querySelector('[data-profile-visibility]');
  const lbEl = document.querySelector('[data-open-leaderboards]');
  if(!svg || !pillEl || !lbEl) return;
  const o = svg.getBoundingClientRect(), p = pillEl.getBoundingClientRect(), l = lbEl.getBoundingClientRect();
  const y1 = p.top + p.height / 2 - o.top, y2 = l.top + l.height / 2 - o.top;
  const x1 = p.right - o.left + 3, x2 = l.right - o.left + 3;     // arrow tips, just off each pill
  const xe = Math.max(x1, x2) + 14;                                 // the vertical run
  const r = 5;                                                      // corner rounding
  svg.innerHTML = `
    <defs><linearGradient id="vislbGrad" gradientUnits="userSpaceOnUse" x1="0" y1="${y1}" x2="0" y2="${y2}">
      <stop offset="0" stop-color="#9d4edd"/><stop offset="1" stop-color="#39ff14"/></linearGradient></defs>
    <path d="M${x1 + 6} ${y1} H${xe - r} Q${xe} ${y1} ${xe} ${y1 + r} V${y2 - r} Q${xe} ${y2} ${xe - r} ${y2} H${x2 + 6}"
      fill="none" stroke="url(#vislbGrad)" stroke-width="2" stroke-linecap="round"/>
    <path d="M${x1} ${y1} l7 -4.5 v9 z" fill="#9d4edd"/>
    <path d="M${x2} ${y2} l7 -4.5 v9 z" fill="#39ff14"/>`;
}
window.addEventListener('resize', sizeVisLbLink);
// The boards return usernames only, so a tap looks the account up by name
// (profiles is readable, same as the friend search). Cached per session.
const lbUserIds = {};
async function openLeaderboardPlayer(username){
  if(username === profileUsername){ leaderboardOpen = false; window.scrollTo(0, 0); render(); return; }
  let uid = lbUserIds[username];
  if(!uid){
    const { data, error } = await sb.from('profiles').select('user_id').eq('username', username).maybeSingle();
    if(error || !data){ toast("Couldn't open that profile - try again."); return; }
    uid = lbUserIds[username] = data.user_id;
  }
  // leaderboardOpen stays set, so closing their profile lands back on this board
  window.scrollTo(0, 0);
  openPublicProfile(uid);
}

async function loadLeaderboard(cat, force){
  const c = lbCache[cat];
  if(!force && c && (c.loading || (c.rows && Date.now() - c.at < LB_TTL_MS))) return;
  lbCache[cat] = { loading:true, rows: c && c.rows };
  if(leaderboardOpen) render();
  try{
    const { data, error } = await sb.rpc('get_leaderboard', { p_category: cat, p_limit: 100 });
    if(error) throw error;
    lbCache[cat] = { rows: data || [], at: Date.now() };
  }catch(e){
    console.error('get_leaderboard failed:', cat, e && e.message, e);
    lbCache[cat] = { error: true, rows: c && c.rows };
  }
  if(leaderboardOpen) render();
}

// A player as their profile shows them: equipped card back with their
// cosmetics on it, at 1px per cell. Only ids the game knows become a class or
// art; anything else (or none) shows the plain back, same as the profile.
function lbBack(id, equipped){
  return avatarStage(id, cosmeticLayers(equipped), 1);
}

// The card on the Most Valuable Pull board: sprite (tinted if shiny or
// shadow), name, and the game's own inline variant mark. Sized to keep rows 36px.
function lbCard(d){
  if(!d || !d.id) return '';
  const p = POKEMON_BY_ID.get(Number(d.id));
  const sprite = p ? spriteFit(p, 26, d.shadow ? 'shadow-sprite' : '', d.shiny ? `filter:hue-rotate(${shinyHue(p.id)}deg) saturate(1.4);` : '', 'lb-card-sprite') : '';
  const marks = cardBadge(d, '', true);
  const label = (d.shiny ? 'Shiny ' : '') + (d.shadow ? 'Shadow ' : '') + (d.holo ? 'Holo ' : '') + (d.name || (p && p.name) || '');
  return `<span class="lb-card" title="${esc(label)}">${sprite}<span class="lb-card-name">${esc(d.name || (p && p.name) || '')}</span>${marks}</span>`;
}

function skillIconSvg(icon, size){
  return `<svg viewBox="0 0 20 20" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icon}</svg>`;
}

function renderLeaderboards(){
  const board = LB_BOARDS.find(b => b.key === lbCategory) || LB_BOARDS[0];
  const c = lbCache[board.key] || {};
  const rows = c.rows || null;
  const chip = b => `<button class="lb-chip ${b.key === board.key ? 'on' : ''}" data-lb-cat="${b.key}" aria-pressed="${b.key === board.key}">
      ${b.icon ? `<span class="lb-chip-ico">${skillIconSvg(b.icon, 14)}</span>` : ''}${esc(b.label)}</button>`;
  const me = profileUsername;
  let body;
  if(!rows && c.loading){
    body = `<div class="lb-empty">Loading the ${esc(board.label)} board&hellip;</div>`;
  } else if(!rows && c.error){
    body = `<div class="lb-empty">Couldn't load this board just now. <button class="lb-retry" data-lb-retry>Try again</button></div>`;
  } else if(rows && !rows.length){
