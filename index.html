  }
}

function calculateCurrentVaultValue(){
  const instances = state.instances || [];
  const now = Date.now();
  let total = 0;
  instances.forEach(inst => {
    const p = POKEMON.find(x => x.id === inst.id);
    if(!p) return;
    const hoursHeld = Math.max(0, (now - (inst.acquiredAt || now)) / (1000 * 60 * 60));
    const multiplier = cardMultiplier(hoursHeld, now);
    const baseValue = inst.shiny ? p.value * 10 : p.value;
    total += Math.max(1, Math.round(baseValue * multiplier));
  });
  return total;
}

function recordVaultValue(){
  const now = Date.now();
  const currentVal = calculateCurrentVaultValue();
  if(!state.valueHistory) state.valueHistory = [];
  if(!state.longHistory) state.longHistory = [];

  const lastEntry = state.valueHistory[state.valueHistory.length - 1];
  if(!lastEntry || (now - lastEntry.time > 10000) || lastEntry.val !== currentVal){
    state.valueHistory.push({ time: now, val: currentVal });
    if(state.valueHistory.length > 30) state.valueHistory.shift();
  }

  const LONG_INTERVAL_MS = 5 * 60 * 1000;
  const lastLong = state.longHistory[state.longHistory.length - 1];
  if(!lastLong || (now - lastLong.time > LONG_INTERVAL_MS)){
    state.longHistory.push({ time: now, val: currentVal });
    if(state.longHistory.length > 5000) state.longHistory.shift();
  }
}

let packBusy = false;
async function openPack(pack){
  if(!requireAuth()) return;
  if(packBusy) return;
  if(state.hex < pack.price) return toast("Not enough HEX for that pack.");
  packBusy = true;
  try{
    const { data, error } = await sb.rpc('open_pack', { p_pack_id: pack.id });
    if(error){
      // server is authoritative on the balance check too - it may reject
      // even if the client's local number looked sufficient (e.g. stale cache)
      toast(error.message.includes('insufficient') ? "Not enough HEX for that pack." : "Couldn't open that pack - try again.");
      return;
    }
    // server already rolled + charged; enrich with local cosmetic data (type/sprite) for display only
    const cards = data.cards.map(c=>{
      const p = POKEMON.find(x=>x.id===c.id);
      return { ...c, type: p.type, sprite: p.sprite };
    });
    opening = {pack, cards, flipped:[], stage:'closed', keep:cards.map(()=>true), openingId:data.opening_id};
    // mirror the server's deduction locally so the rest of the (not-yet-migrated) UI stays in sync
    state.hex -= pack.price;
    recordVaultValue();
    saveState();
    render();
  } finally {
    packBusy = false;
  }
}
let finalizeBusy = false;
async function finalizeOpening(){
  if(finalizeBusy) return;
  finalizeBusy = true;
  const keepSnapshot = opening.keep;
  const openingId = opening.openingId;
  try{
    const { error } = await sb.rpc('finalize_pack_opening', {
      p_opening_id: openingId,
      p_keep: keepSnapshot
    });
    if(error){
      toast("Couldn't finalize that opening - try again.");
      return;
    }
    // the server has already committed dex/instances/hex, so read those rows
    // back instead of rebuilding them locally. a hand-maintained object literal
    // silently drops every server-generated field it doesn't happen to list -
    // that's how uid, shiny and hasShiny all went missing - whereas a re-read
    // picks up anything the server writes, including fields added later.
    const { data: fresh, error: readErr } = await sb
      .from('game_states_v2')
      .select('hex, dex, instances')
      .eq('user_id', authUser.id)
      .maybeSingle();

    if(readErr || !fresh){
      // finalize already succeeded, so the pending row is gone and this opening
      // must not be retried. close it out, but leave local state untouched
      // rather than writing values we already know are stale - in particular
      // skip recordVaultValue(), which would persist a wrong point to the chart.
      console.error('post-finalize re-read failed', readErr);
      opening = null;
      view='open';
      render();
      toast('Your cards are saved - reload the page to see them.');
      return;
    }

    state.hex = fresh.hex;
    state.dex = fresh.dex || {};
    state.instances = fresh.instances || [];
    opening = null;
    recordVaultValue();
    saveState();
    view='open';
    render();
  } finally {
    finalizeBusy = false;
  }
}

// Sound on/off. Persisted so the choice survives a reload, and read once at
// start-up rather than on every note.
let muted = false;
try{ muted = localStorage.getItem('pokehex_muted') === '1'; }catch(e){}
function setMuted(v){
  muted = v;
  try{ localStorage.setItem('pokehex_muted', v ? '1' : '0'); }catch(e){}
}
let actx;
function ac(){ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function tone(freq,dur,type,gain,delay){
  if(muted) return;
  try{
    const c = ac(); const t0 = c.currentTime+(delay||0);
    const osc = c.createOscillator(); const g = c.createGain();
    osc.type = type||'sine'; osc.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(gain||0.08,t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }catch(e){}
}
// Noise is what a tear and a card flip actually are - neither is a pitch, so
// neither can be built from tone(). One shared buffer is reused for every
// burst; regenerating white noise per sound is wasteful and sounds identical.
let noiseBuf;
function noiseBuffer(c){
  if(noiseBuf) return noiseBuf;
  const n = Math.floor(c.sampleRate*0.5);
  noiseBuf = c.createBuffer(1,n,c.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
  return noiseBuf;
}
// dur seconds of filtered noise, sweeping the band from f0 to f1.
// `swell` is the fraction of dur at which the sound peaks. Left off it attacks
// in 8ms and decays, which is a hit. Set near 0.7 and it crescendos instead -
// that difference is what separates a drum from a tearing sound.
function noise(dur,f0,f1,gain,q,delay,swell){
  if(muted) return;
  try{
    const c = ac(); const t0 = c.currentTime+(delay||0);
    const src = c.createBufferSource(); src.buffer = noiseBuffer(c); src.loop = true;
    const bp = c.createBiquadFilter(); bp.type='bandpass';
    bp.Q.setValueAtTime(q||1.6,t0);
    bp.frequency.setValueAtTime(f0,t0);
    bp.frequency.exponentialRampToValueAtTime(Math.max(60,f1),t0+dur);
    const g = c.createGain();
    const peak = t0 + (swell ? dur*swell : 0.008);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(gain||0.05,peak);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    g.gain.setValueAtTime(0,t0+dur);   // true silence, not an asymptote
    src.connect(bp); bp.connect(g); g.connect(c.destination);
    src.start(t0); src.stop(t0+dur+0.01);
  }catch(e){}
}
// A short tone that bends in pitch. A bubble pop is a rising bend, not a hit.
function blip(f0,f1,dur,gain,delay,type){
  if(muted) return;
  try{
    const c = ac(); const t0 = c.currentTime+(delay||0);
    const osc = c.createOscillator(); const g = c.createGain();
    osc.type = type||'sine';
    osc.frequency.setValueAtTime(f0,t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(gain||0.03,t0+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }catch(e){}
}

// Variant A from the blend picker: variant 1's low sparse grains with variant
// 6's acceleration - the gaps shrink from ~44ms to ~15ms as the tear runs, so
// it gets away from you rather than ticking evenly. S is the speed setting
// picked in the harness (158%); every time and length scales from it, so the
// whole rip can be slowed or sped up by changing one number.
// FIZZ is the bright layer riding on each grain. This is the knob that decides
// crinkle vs rattle - set it to 0 for the pure low version.
function ripSound(){
  const S = 0.633, FIZZ = 0.66;
  let t = 0, step = 0.070;
  for(let i=0;i<9;i++){
    const f = 430 - i*14 + ((i*97)%110);       // low, wandering, never bright
    noise(0.022*S, f, f*0.68, 0.090 - i*0.003, 1.8, t*S);
    noise(0.013*S, 2500+i*210, 2000+i*150, FIZZ*(0.008+i*0.0009), 2.4, t*S);
    t += step; step *= 0.88;
  }
  noise(0.40*S, 250, 195, 0.016, 0.8, 0, 0.45);  // quiet bed underneath
}

// A bubble pop through paper: a soft rising bend with a breath of air around
// it. Every percussive layer is gone - no contact burst, no low body sines.
// Those were the drum. `vary` detunes a dealt run so five do not sound like one.
function flipSound(delay,vary){
  const d = delay||0, v = vary||1;
  noise(0.10,1300*v,520*v,0.016,1.2,d,0.45);   // breath, swelling not hitting
  blip(300*v,560*v,0.055,0.03,d+0.02);          // the pop
  blip(600*v,880*v,0.03,0.012,d+0.022);         // paper edge, faint
}
// Shiny fanfare: a fast major arpeggio on squares, then the octave held with
// a fifth above it and a sparkle tail. Squares rather than triangles because
// the rarity chimes are triangles - this has to cut through one, not blend
// into it. Kept under half a second so it lands before the next card.
function shinySound(delay){
  const d = delay||0;
  [[523.25,0],[659.25,0.05],[783.99,0.10],[1046.50,0.15]]
    .forEach(([f,t])=>tone(f,0.10,'square',0.021,d+t));
  tone(1046.50,0.30,'square',0.025,d+0.215);
  tone(1567.98,0.32,'square',0.013,d+0.225);
  blip(1900,2700,0.20,0.0085,d+0.24,'triangle');
}
function revealSound(rarity,delay){
  const d = delay||0;
  const base = {common:440,uncommon:520,rare:600,ultra:820,secret:980}[rarity]||440;
  tone(base,0.18,'triangle',0.07,d);
  if(rarity==='ultra'||rarity==='secret'){ tone(base*1.5,0.3,'triangle',0.06,d+0.08); tone(base*2,0.4,'sine',0.05,d+0.16); }
}

function burstConfetti(){
  const colors = ['#39ff14','#9d4edd','#c77dff','#f0d9ff'];

    el.className='confetti';
    el.style.left = (45+Math.random()*10)+'vw';

    document.body.appendChild(el);
    const dur = 1200+Math.random()*900;
    const drift = (Math.random()-0.5)*300;
    el.animate([
      {transform:`translate(0,0) rotate(0deg)`,opacity:1},
      {transform:`translate(${drift}px, 100vh) rotate(720deg)`,opacity:0}
    ],{duration:dur,easing:'ease-in'});
    setTimeout(()=>el.remove(),dur+50);
  }
}

let toastTimer;
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.innerHTML = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Per-species shiny hue. A single fixed rotation made every shiny read blue:
// sprite palettes cluster in the warm 20-60 band, so one constant shift maps
// that narrow band onto an equally narrow cyan band. The golden angle spreads
// sequential dex ids across the whole wheel instead, so adjacent tiles never
// match. Deterministic from id, so a species always shows the same shiny.
function shinyHue(id){
  const DEAD = 22; // skip rotations near 0/360 - they'd look unshifted
  const raw = (Number(id) * 137.508) % 360;
  return Math.round(DEAD + raw * (360 - 2*DEAD) / 360);
}

function vaultChartInner(history){
  const width = 880;
  const height = 140;
  const padTop = 15;
  const padBottom = 20;
  const padLeft = 45;
  const padRight = 20;

  const innerW = width - padLeft - padRight;
  const innerH = height - padTop - padBottom;

  const vals = history.map(h => h.val);
  const minVal = 0;
  const maxVal = Math.max(100, ...vals) * 1.15;

  const points = history.map((h, i) => {
    const x = padLeft + (history.length === 1 ? innerW / 2 : (i / (history.length - 1)) * innerW);
    const y = padTop + innerH - ((h.val - minVal) / (maxVal - minVal)) * innerH;
    return { x, y, val: h.val };
  });

  const pathD = points.length === 1
    ? `M ${points[0].x} ${points[0].y} L ${points[0].x} ${points[0].y}`
    : points.reduce((acc, p, i) => i === 0 ? `M ${p.x} ${p.y}` : `${acc} L ${p.x} ${p.y}`, '');

  const areaD = points.length === 1
    ? `M ${padLeft} ${padTop + innerH} L ${points[0].x} ${points[0].y} L ${padLeft + innerW} ${padTop + innerH} Z`
    : `${pathD} L ${points[points.length - 1].x} ${padTop + innerH} L ${points[0].x} ${padTop + innerH} Z`;

  const showDots = points.length <= 60;

  const svgInner = `
    <defs>
      <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--foil1)" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="var(--foil2)" stop-opacity="0.0"/>
      </linearGradient>
    </defs>
    <line x1="${padLeft}" y1="${padTop}" x2="${width - padRight}" y2="${padTop}" stroke="var(--line)" stroke-dasharray="3,3" />
    <line x1="${padLeft}" y1="${padTop + innerH / 2}" x2="${width - padRight}" y2="${padTop + innerH / 2}" stroke="var(--line)" stroke-dasharray="3,3" />
    <line x1="${padLeft}" y1="${padTop + innerH}" x2="${width - padRight}" y2="${padTop + innerH}" stroke="var(--line)" />

    <text x="${padLeft - 6}" y="${padTop + 4}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono" text-anchor="end">${fmtHex(Math.round(maxVal))}</text>
    <text x="${padLeft - 6}" y="${padTop + innerH + 4}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono" text-anchor="end">0</text>

    <path d="${areaD}" fill="url(#chartGrad)" />
    <path d="${pathD}" fill="none" stroke="var(--foil1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 4px rgba(57,255,20,0.5));" />

    ${showDots ? points.map(p => `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="var(--foil2)" stroke="var(--foil1)" stroke-width="1.5" />`).join('') : ''}
  `;

  return { svgInner, width, height };
}

function vaultChartHistoryForMode(){
  if(vaultChartMode === 'all'){
    return (state.longHistory && state.longHistory.length > 0)
      ? state.longHistory
      : [{ time: Date.now(), val: calculateCurrentVaultValue() }];
  }
  return (state.valueHistory && state.valueHistory.length > 0)
    ? state.valueHistory

// Two lines on one axis: the do-nothing baseline (2500 + all wheel income,
// from get_pnl_series) and vault value over the same window (from longHistory).
// Above the baseline means opening packs beat never opening one.
function pnlChartInner(series, vaultHist){
  const width = 880, height = 140;
  const padTop = 15, padBottom = 20, padLeft = 55, padRight = 20;
  const innerW = width - padLeft - padRight;
  const innerH = height - padTop - padBottom;

  const pts = (series && series.points) || [];
  if(pts.length < 2) return { svgInner:'', width, height, empty:true };

  const t0 = pts[0].t, t1 = pts[pts.length-1].t;
  const span = Math.max(1, t1 - t0);

  // sample vault history onto the baseline's time axis - the two series are
  // recorded independently and never share timestamps
  const vh = (vaultHist || []).filter(h => h.time >= t0 && h.time <= t1)
                              .sort((a,b) => a.time - b.time);
  let vi = 0;
  const vaultAt = (t) => {
    if(!vh.length) return null;
    while(vi < vh.length - 1 && vh[vi+1].time <= t) vi++;
    return vh[vi].time <= t ? vh[vi].val : null;
  };

  const rows = pts.map(p => ({ t:p.t, base:Number(p.baseline), vault:vaultAt(p.t) }));
  const maxVal = Math.max(100, ...rows.map(r => Math.max(r.base, r.vault || 0))) * 1.12;

  const X = (t) => padLeft + ((t - t0) / span) * innerW;
  const Y = (v) => padTop + innerH - (v / maxVal) * innerH;

  const pathOf = (key) => {
    let d = '', started = false;
    rows.forEach(r => {
      const v = r[key];
      if(v === null || v === undefined) return;
      d += (started ? ' L ' : 'M ') + X(r.t).toFixed(1) + ' ' + Y(v).toFixed(1);
      started = true;
    });
    return d;
  };

  const gridVals = [0, maxVal*0.25, maxVal*0.5, maxVal*0.75, maxVal];
  const grid = gridVals.map(v => `
    <line x1="${padLeft}" y1="${Y(v).toFixed(1)}" x2="${width-padRight}" y2="${Y(v).toFixed(1)}"
          stroke="var(--line)" stroke-dasharray="3,3" />
    <text x="${padLeft-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end"
          font-family="'JetBrains Mono',monospace" font-size="8" fill="var(--muted)">${fmtHex(Math.round(v))}</text>`).join('');

  const lastVault = [...rows].reverse().find(r => r.vault !== null);
  const svgInner = `
    ${grid}
    <path d="${pathOf('base')}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5,4" />
    <path d="${pathOf('vault')}" fill="none" stroke="var(--foil1)" stroke-width="2.5" />
    ${lastVault ? `<circle cx="${X(lastVault.t).toFixed(1)}" cy="${Y(lastVault.vault).toFixed(1)}" r="3" fill="var(--foil1)" />` : ''}
  `;
  return { svgInner, width, height, empty:false };
}

function updateVaultFeedLive() {
  if (view !== 'market') return;

  const currentTotal = calculateCurrentVaultValue();
  const balanceValEl = document.querySelector('.balance .val');
  if (balanceValEl) {
    balanceValEl.innerHTML = `<i class="hex-icon"></i>${fmtHex(state.hex)}`;
  }

  const chartContainer = document.querySelector('.wrap');
  if (chartContainer && chartContainer.querySelector('#vaultChartSvg')) {
    const history = vaultChartHistoryForMode();
    const { svgInner } = vaultChartInner(history);

    const svgElement = chartContainer.querySelector('#vaultChartSvg');
    if (svgElement) {
      svgElement.innerHTML = svgInner;
    }

    const headerValLabel = chartContainer.querySelector('#vaultTotalVal');
    if (headerValLabel) {
      headerValLabel.innerHTML = `<i class="hex-icon"></i>${fmtHex(currentTotal)} HEX`;
    }
  }

  const idxSvg = document.getElementById('marketIdxSvg');
  if(idxSvg){
    const nowT = Date.now();
    const { svgInner, phase, idxNow } = marketIndexChartParts(nowT);
    idxSvg.innerHTML = svgInner;
    const labelEl = document.getElementById('marketPhaseLabel');
    const valEl = document.getElementById('marketPhaseVal');
    if(labelEl){ labelEl.textContent = phase.label; labelEl.style.color = phase.color; }
    if(valEl){ valEl.textContent = (idxNow*100).toFixed(0); valEl.style.color = phase.color; }
  }

  // Update real-time liquidation price estimates live in the DOM
  const now = Date.now();
  (state.instances || []).forEach(inst => {
    const el = document.getElementById(`price-inst-${inst.uid}`);
    if (el) {
      const p = POKEMON.find(x => x.id === inst.id);
      if (p) {
        const hoursHeld = Math.max(0, (now - (inst.acquiredAt || now)) / (1000 * 60 * 60));
        const multiplier = cardMultiplier(hoursHeld, now);
        const baseValue = inst.shiny ? p.value * 10 : p.value;
        const payout = Math.max(1, Math.round(baseValue * multiplier));
        el.innerHTML = `<i class="hex-icon"></i>~${fmtHex(payout)}`;
      }
    }
  });

  // Species stack totals. Collapsed stacks hide their instance rows, so without
  // this the headline number a player is actually reading would sit frozen
  // while the market moved underneath it.
  {
    const stacks = {};
    (state.instances || []).forEach(inst => {
      const p = POKEMON.find(x => x.id === inst.id);
      if (!p) return;
      const hoursHeld = Math.max(0, (now - (inst.acquiredAt || now)) / (1000 * 60 * 60));
      const baseValue = inst.shiny ? p.value * 10 : p.value;
      const payout = Math.max(1, Math.round(baseValue * cardMultiplier(hoursHeld, now)));
      const key = `${inst.rarity}-${inst.id}`;
      stacks[key] = (stacks[key] || 0) + payout;
    });
    Object.entries(stacks).forEach(([key, total]) => {
      const el = document.getElementById(`price-species-${key}`);
      if (el) el.innerHTML = `<i class="hex-icon"></i>~${fmtHex(total)}`;
    });
  }

  ['secret', 'ultra', 'rare', 'uncommon', 'common'].forEach(tier => {
    const el = document.getElementById(`price-tier-${tier}`);
    if (el) {
      let totalPayout = 0;
      (state.instances || []).forEach(inst => {
        if (inst.rarity === tier) {
          const p = POKEMON.find(x => x.id === inst.id);
          if (p) {
            const hoursHeld = Math.max(0, (now - (inst.acquiredAt || now)) / (1000 * 60 * 60));
            const multiplier = cardMultiplier(hoursHeld, now);
            const baseValue = inst.shiny ? p.value * 10 : p.value;
            totalPayout += Math.max(1, Math.round(baseValue * multiplier));
          }
        }
      });
      el.innerHTML = `<i class="hex-icon"></i>~${fmtHex(totalPayout)}`;
    }
  });
}

function computeMarketIndexSeries(now){
  const windowPastMs = 2*60*60*1000;
  const windowFutureMs = 3*60*60*1000;
  const totalMs = windowPastMs + windowFutureMs;
  const steps = 120;
  const points = [];
  for(let i=0;i<=steps;i++){
    const t = now - windowPastMs + (totalMs * i / steps);
    points.push({ t, idx: marketIndexAt(t) });
  }
  return points;
}

function marketIndexChartParts(now){
  const points = computeMarketIndexSeries(now);
  const width=880, height=140, padTop=15, padBottom=20, padLeft=45, padRight=20;
  const innerW = width-padLeft-padRight, innerH = height-padTop-padBottom;
  const vals = points.map(p=>p.idx);
  const minVal = Math.min(0.3, ...vals) - 0.05;
  const maxVal = Math.max(1.7, ...vals) + 0.05;
  const t0 = points[0].t, t1 = points[points.length-1].t;
  const xForT = t => padLeft + ((t-t0)/(t1-t0)) * innerW;
  const yForV = v => padTop + innerH - ((v-minVal)/(maxVal-minVal)) * innerH;
  const nowX = xForT(now);
  const baselineY = yForV(1);

  const pastPts = points.filter(p=>p.t<=now);
  const futurePts = points.filter(p=>p.t>now);
  if(futurePts.length && pastPts.length) futurePts.unshift(pastPts[pastPts.length-1]);

  const pathFor = pts => pts.length ? pts.reduce((acc,p,i)=> i===0 ? `M ${xForT(p.t)} ${yForV(p.idx)}` : `${acc} L ${xForT(p.t)} ${yForV(p.idx)}`, '') : '';

  const idxNow = marketIndexAt(now);
  const phase = marketPhaseFor(idxNow);

  const svgInner = `
    <line x1="${padLeft}" y1="${baselineY}" x2="${width-padRight}" y2="${baselineY}" stroke="var(--muted)" stroke-dasharray="2,4" />
    <text x="${padLeft-6}" y="${baselineY+3}" fill="var(--muted)" font-size="9" font-family="JetBrains Mono" text-anchor="end">100%</text>
    <path d="${pathFor(pastPts)}" fill="none" stroke="${phase.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="${pathFor(futurePts)}" fill="none" stroke="${phase.color}" stroke-width="2" stroke-dasharray="5,5" opacity="0.6" stroke-linecap="round" />
    <line x1="${nowX}" y1="${padTop}" x2="${nowX}" y2="${padTop+innerH}" stroke="var(--gold)" stroke-width="1.5" />
    <text x="${nowX}" y="${padTop-4}" fill="var(--gold)" font-size="9" font-family="JetBrains Mono" text-anchor="middle">NOW</text>
  `;
  return { svgInner, phase, idxNow };
}

// Preview for Liquidate Duplicates. Mirrors the server's liquidate_duplicates
// grouping exactly: keep the LEAST valuable non-shiny copy of each species and
// sell the rest; if a species has a shiny, the shiny is kept and every
// non-shiny copy of it sells. Estimate only - the server recalculates each
// payout at execution time, so slippage applies.
function dupePreview(tier, now){
  const groups = {};
  (state.instances || []).forEach(inst => {
    if (inst.rarity !== tier) return;
    (groups[inst.id] = groups[inst.id] || []).push(inst);
  });

  let count = 0, est = 0, shinyKept = 0;
  Object.values(groups).forEach(g => {
    const hasShiny = g.some(x => x.shiny);
    if (hasShiny) shinyKept += g.filter(x => x.shiny).length;

    const valued = g.filter(x => !x.shiny).map(inst => {
      const p = POKEMON.find(x => x.id === inst.id);
      const hoursHeld = Math.max(0, (now - (inst.acquiredAt || now)) / (1000 * 60 * 60));
      return { inst, hoursHeld,
        // effValue is local to renderMarket(), so the same rule is inlined here
        payout: Math.max(1, Math.round((inst.shiny ? p.value * 10 : p.value) * cardMultiplier(hoursHeld, now))) };
    });
    // same tiebreak chain as the RPC: payout asc, hours asc, uid asc
    valued.sort((a, b) => a.payout - b.payout || a.hoursHeld - b.hoursHeld
                       || (a.inst.uid < b.inst.uid ? -1 : 1));

    (hasShiny ? valued : valued.slice(1)).forEach(d => { est += d.payout; count++; });
  });
  return { count, est, shinyKept };
}

// Preview for Liquidate Tier. Mirrors the server's liquidate_tier after the
// shiny-protection fix: every non-shiny card in the tier sells, shinies are
// kept. The tier header still counts and values the whole tier including
// shinies - that is inventory. This is what will actually execute.
function tierPreview(tier, now){
  let count = 0, est = 0, shinyKept = 0;
  (state.instances || []).forEach(inst => {
    if (inst.rarity !== tier) return;
    if (inst.shiny) { shinyKept++; return; }
    const p = POKEMON.find(x => x.id === inst.id);
    if (!p) return;
    const hoursHeld = Math.max(0, (now - (inst.acquiredAt || now)) / (1000 * 60 * 60));
    est += Math.max(1, Math.round(p.value * cardMultiplier(hoursHeld, now)));
    count++;
  });
  return { count, est, shinyKept };
}

function renderMarket(){
  const instances = state.instances || [];
  const now = Date.now();

  const tierOrder = ['secret', 'ultra', 'rare', 'uncommon', 'common'];
  const tierLabels = {
    secret: 'Secret Rare',
    ultra: 'Ultra Rare',
    rare: 'Rare',
    uncommon: 'Uncommon',
    common: 'Common'
  };

  const groupedByTier = {};
  tierOrder.forEach(t => groupedByTier[t] = []);

  const effValue = (p, inst) => inst.shiny ? p.value * 10 : p.value;

  // Resolve the submitted query to a set of instance uids. Matches on dex
  // number (exact) or name (substring, case-insensitive). A player can hold
  // several copies of the same species, so this is a set, not one card.
  const q = marketSearch.trim().toLowerCase();
  marketHits = [];
  if(q){
    instances.forEach(inst => {
      const p = POKEMON.find(x => x.id === inst.id);
      if(!p) return;
      const byNum = /^\d+$/.test(q) && p.id === parseInt(q, 10);
      const byName = p.name.toLowerCase().includes(q);
      if(byNum || byName) marketHits.push(inst.uid);
    });
  }
  const hitSet = new Set(marketHits);
  const tiersWithHits = new Set(
    instances.filter(i => hitSet.has(i.uid)).map(i => i.rarity)
  );

  instances.forEach((inst) => {
    const p = POKEMON.find(x => x.id === inst.id);
    if(!p) return;
    if(groupedByTier[inst.rarity]) {
      groupedByTier[inst.rarity].push({ p, inst });
    }
  });

  tierOrder.forEach(t => {
    groupedByTier[t].sort((a, b) => {
      const getPayout = (item) => {
        const acquired = item.inst.acquiredAt || now;
        const hoursHeld = Math.max(0, (now - acquired) / (1000 * 60 * 60));
        const multiplier = cardMultiplier(hoursHeld, now);
        return Math.max(1, Math.round(effValue(item.p, item.inst) * multiplier));
      };
      return getPayout(b) - getPayout(a);
    });
  });

  return `
    <div class="dexhead">
      <div class="dexhead-left">
        <h2 class="disp">Liquid Market</h2>
        <div class="dexcount mono">Individual card management &middot; Prices track the live market cycle</div>
        <div class="dexcount mono" style="margin-top:2px;">Tap any card to inspect it &mdash; full value breakdown, and set it as a favorite</div>
      </div>
    </div>

    ${instances.length === 0 ? '' : `
      <form id="marketSearchForm" style="display:flex;gap:8px;align-items:center;margin-bottom:14px;">
        <input type="text" id="marketSearchInput" value="${esc(marketSearch)}" placeholder="Search your vault by name or number..." autocomplete="off"
          style="flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;" />
        <button type="submit" class="sbtn keep" style="padding:7px 12px;font-size:11px;">Find</button>
        ${marketSearch ? `<button type="button" class="sbtn sell" data-searchclear style="padding:7px 12px;font-size:11px;">Clear</button>` : ''}
      </form>
      ${marketSearch ? `<div class="mono" style="font-size:11px;color:${marketHits.length ? 'var(--foil1)' : '#ff4444'};margin:-6px 0 12px 2px;">
        ${marketHits.length ? `${marketHits.length} match${marketHits.length===1?'':'es'} for "${esc(marketSearch)}"` : `Nothing in your vault matches "${esc(marketSearch)}"`}
      </div>` : ''}
    `}

    ${instances.length === 0 ? `
      <div style="text-align:center;color:var(--muted);padding:40px;font-size:13px;">Your vault is empty. Break open some packs to acquire tradeable assets.</div>
    ` : `
      ${tierOrder.map(tier => {
        const items = groupedByTier[tier];
        if(!items || items.length === 0) return '';
        const rc = RARITY[tier];

        let tierTotalPayout = 0;
        items.forEach(({ p, inst }) => {
          const acquired = inst.acquiredAt || now;
          const hoursHeld = Math.max(0, (now - acquired) / (1000 * 60 * 60));
          const multiplier = cardMultiplier(hoursHeld, now);
          tierTotalPayout += Math.max(1, Math.round(effValue(p, inst) * multiplier));
        });
        const dupePrev = dupePreview(tier, now);

        return `
          <details data-tier="${tier}" ${(tiersWithHits.has(tier) || expandedTiers.has(tier)) ? 'open' : ''} style="margin-bottom:16px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 16px;">
            <summary style="font-family:'VT323',monospace; font-size:20px; color:${rc.color}; cursor:pointer; text-transform:uppercase; letter-spacing:0.04em; outline:none; display:flex; justify-content:space-between; align-items:center;">

                Tier Est: <span id="price-tier-${tier}"><i class="hex-icon"></i>~${fmtHex(tierTotalPayout)}</span>

            </summary>
            
            <div style="padding-top:12px;">
              ${(() => {
                // Group this tier's instances by species so the list length is
                // bounded by distinct species rather than by copies held. The

                // deeper now, behind a per-species <details>.
                const species = {};
                items.forEach(({ p, inst }) => {
                  (species[inst.id] = species[inst.id] || { p, list: [] }).list.push(inst);
                });

                const payoutOf = (p, inst) => {
                  const hoursHeld = Math.max(0, (now - (inst.acquiredAt || now)) / (1000 * 60 * 60));
                  return Math.max(1, Math.round(effValue(p, inst) * cardMultiplier(hoursHeld, now)));

                const rows = Object.values(species).map(g => {
                  const stackEst = g.list.reduce((s, inst) => s + payoutOf(g.p, inst), 0);
                  return { ...g, stackEst };
                });
                // richest stack first, same ordering intent as the flat grid
                rows.sort((a, b) => b.stackEst - a.stackEst);

                return rows.map(({ p, list, stackEst }) => {
                  const isSingle = list.length === 1;
                  const hasShiny = list.some(x => x.shiny);
                  const hasHit = list.some(x => hitSet.has(x.uid));
                  const key = `${tier}:${p.id}`;

// Card backs shelf. Every tile draws the real back at full card size, so the

function renderCardBackShelf(){
  if(!authUser){
    return `<div style="color:var(--muted);font-size:12px;padding:10px 2px 18px;">Sign in to browse card backs.</div>`;
  }
  if(cardBackShelf === null){
    return `<div style="color:var(--muted);font-size:12px;padding:10px 2px 18px;">Loading card backs…</div>`;
  }
  // server rows the client has no art for are skipped, so a DB seed can land
  // before the CSS ships without rendering a blank tile.
  const rows = cardBackShelf.filter(r => cardBackById(r.id));
  if(rows.length === 0){
    return `<div style="color:var(--muted);font-size:12px;padding:10px 2px 18px;">No card backs available yet.</div>`;
  }

  return `
  <div style="color:var(--muted);font-size:11.5px;margin:10px 0 12px;font-style:italic;">Card backs survive resets. They replace the pack's back on every card you flip, and sit beside your name on your profile.</div>
  <div class="cbshelf">
    ${rows.map(r=>{
      const meta      = cardBackById(r.id);
      const isEquip   = state.equippedBack === r.id;
      const busy      = cardBackBusy === r.id;
      const tooPoor   = state.hex < r.price;
      const cls       = `cbtile ${r.owned?'owned':'locked'} ${isEquip?'equipped':''}`;
      let btn;
      if(!r.owned){
        btn = `<button class="cb-btn buy" data-buyback="${esc(r.id)}" ${(busy||tooPoor)?'disabled':''}>${busy?'…':(tooPoor?'Locked':'Purchase')}</button>`;
      } else if(isEquip){
        btn = `<button class="cb-btn equip on" data-equipback="" ${busy?'disabled':''}>${busy?'…':'Equipped'}</button>`;
      } else {
        btn = `<button class="cb-btn equip" data-equipback="${esc(r.id)}" ${busy?'disabled':''}>${busy?'…':'Equip'}</button>`;
      }
      return `
      <div class="${cls}">
        <div class="cb-swatch card-face card-back back-${esc(r.id)}">${meta.wordmark===false?'':`<span>POKéHEX</span>`}</div>
        <div class="cb-price">${r.owned ? 'Owned' : `<i class="hex-icon" style="width:10px;height:12px;"></i>${fmtHex(r.price)}`}</div>
        ${btn}
      </div>`;
    }).join('')}
  </div>`;
}

// uid whose slot picker is open in the detail modal, or null. set when the
// server answers status:'full' so the player can choose what to displace.
let favPickerFor = null;

function favSlotPicker(uid){
  if(favPickerFor !== uid) return '';
  const slots = state.favoriteUids || [];
  const cells = [];
  for(let i = 0; i < FAVORITE_SLOTS; i++){
    const held = slots[i];
    const inst = held ? (state.instances || []).find(x => x.uid === held) : null;
    const p = inst ? POKEMON.find(x => x.id === inst.id) : null;
    // an occupied slot whose card was sold still occupies the slot - say so
    // rather than showing it as free, or the count won't add up for the player
    const art = p
      ? `<img src="${p.sprite}" alt="" loading="lazy" style="width:52px;height:52px;image-rendering:pixelated;${inst.shiny ? `filter:hue-rotate(${shinyHue(p.id)}deg) saturate(1.4);` : ''}">`
      : `<div style="width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(255,255,255,0.45);">${held ? '?' : '+'}</div>`;
    const label = p
      ? `#${String(p.id).padStart(3,'0')} ${esc(p.name)}${inst.shiny ? ' ★' : ''}`
      : (held ? 'Sold card' : 'Empty');
    cells.push(`
      <button class="buybtn" style="flex:1;min-width:0;padding:6px 4px;font-size:10px;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:2px;"
              data-fav-slot="${uid}" data-fav-slot-n="${i + 1}">
        <span style="font-size:9px;opacity:0.75;">SLOT ${i + 1}</span>
        ${art}
        <span style="font-size:9.5px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;">${label}</span>
      </button>`);
  }
  return `
    <div style="margin:8px 0 4px;">
      <div style="font-size:11px;color:var(--muted);text-align:center;margin-bottom:6px;">
        All ${FAVORITE_SLOTS} favorite slots are full. Which one should this card replace?
      </div>
      <div style="display:flex;gap:6px;">${cells.join('')}</div>
      <button class="buybtn" style="width:100%;margin-top:6px;padding:5px;font-size:10px;"
              data-fav-slot-cancel="1">Cancel</button>
    </div>`;
}

// slot: null lets the server append or report 'full'; 1..3 overwrites that slot.
async function setFavoriteSlot(uid, slot){
  const prev = (state.favoriteUids || []).slice();
  try{
    const { data, error } = await sb.rpc('set_favorite_slot',
      { p_uid: uid, p_slot: slot ?? null });
    if(error) throw error;

    if(data && data.status === 'full'){
      // not an error - the server is asking which slot to displace. it sends
      // the authoritative slots with this response, so adopt them before the
      // picker renders or it can list occupants that are already stale.
      if(Array.isArray(data.slots)) state.favoriteUids = data.slots;
      favPickerFor = uid;
      render();
      return;
    }
    if(data && data.status === 'error'){
      toast(data.message === 'card not held'
        ? 'That card is no longer in your vault.'
        : 'Could not update your favorites - try again.');
      return;
    }

    // server is the source of truth for slot order, so take what it returns
    // rather than reconstructing it here and risking a divergent local copy
    state.favoriteUids = Array.isArray(data && data.slots) ? data.slots : prev;
    favPickerFor = null;
    render();
    toast(data.status === 'removed' ? 'Removed from favorites.'
        : data.status === 'cleared' ? 'Favorite slot cleared.'
        : 'Favorite set.');
  }catch(e){
    console.error('set_favorite_slot failed:', e && e.message, e);
    state.favoriteUids = prev;
    favPickerFor = null;
    render();
    toast('Could not update your favorites - try again.');
  }
}

async function loadProfileStats(retrying){
  profileLoading = true;
  render();
  try{
    const [{ data: statsData, error: statsErr }, { data: profileData, error: profileErr }] = await Promise.all([
      sb.rpc('get_player_stats'),
      sb.from('profiles').select('username').eq('user_id', authUser.id).maybeSingle()
    ]);
    if(statsErr) throw statsErr;
    if(profileErr) throw profileErr;
    profileStats = statsData;
    profileUsername = profileData ? profileData.username : null;
  }catch(e){
    console.error('failed to load profile stats:', e && e.message, e);
    if(!retrying){
      // transient failures (e.g. a freshly-created RPC not yet visible to
      // the API layer) are common right after schema changes - one silent
      // retry means the player never has to know it happened
      profileLoading = false;
      return loadProfileStats(true);
    }
    toast('Could not load your stats - try again.');
  } finally {
    profileLoading = false;
    render();
  }
}

function renderProfile(){
  if(!authUser){

  }
  if(profileLoading || !profileStats){

  }

  const mvp = s.mostValuablePull;

    id: mvp.id, name: mvp.name, rarity: mvp.rarity, value: mvp.value,
    shiny: mvp.shiny, type: mvpPokemon.type, sprite: mvpPokemon.sprite
  } : null;

  // favorites are not protected from being sold, so a slot's uid may no longer
  // resolve. an unresolvable uid reads as an empty slot rather than an error.
  // fixed length so slot 3 still renders its placeholder when only 1 is set.
  const favCards = Array.from({ length: FAVORITE_SLOTS }, (_, i) => {
    const uid = (state.favoriteUids || [])[i];
    const inst = uid ? (state.instances || []).find(x => x.uid === uid) : null;
    const fp = inst ? POKEMON.find(x => x.id === inst.id) : null;
    return fp ? {
      id: fp.id, name: fp.name, rarity: inst.rarity,

  // get_player_stats divides ALL dex keys by 151, so once gen 2 rows exist

  // data, so splitting here avoids depending on the RPC being fixed first.
  const dexIds  = Object.keys(state.dex || {}).map(Number);
  const ogOwned = dexIds.filter(n => n >= 1   && n <= 151).length;
  const g2Owned = dexIds.filter(n => n >= 152 && n <= 251).length;

  return `
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    ${state.equippedBack && cardBackById(state.equippedBack)
      ? `<div class="cb-swatch card-face card-back back-${esc(state.equippedBack)}" style="width:46px;height:64px;border-radius:8px;flex:0 0 auto;"></div>`
      : ''}
    <h2 class="disp" style="margin:0;">${esc(profileUsername || 'Profile')}</h2>
  </div>

  <div class="section-label">Collection</div>
  <div class="stat-row"><span>% of Complete OG Collection</span><span class="mono">${ogPct}% (${ogOwned}/151)</span></div>
  <div class="stat-row"><span>% of Gen 2 Expansion</span><span class="mono">${g2Pct}% (${g2Owned}/100)</span></div>
  <div class="stat-row"><span># of Secret Rares Pulled</span><span class="mono">${s.secretPullsCount}</span></div>
  <div class="stat-row"><span># of Shinies Found</span><span class="mono">${s.shinyPullsCount}</span></div>

  <div class="stats-card-display">
    <div class="stats-card-col">
      <div class="section-label" style="margin:0;">Most Valuable Pull</div>
      ${mvpCard
        ? renderCardFace(mvpCard, true)
        : `<div class="stats-card-empty">No pulls recorded yet.</div>`}
    </div>
  </div>

  <div class="section-label" style="margin-top:20px;">Favorite Cards</div>
  <div class="stats-card-display">
    ${favCards.map((c, i) => `
      <div class="stats-card-col">
        <div class="section-label" style="margin:0;">Slot ${i + 1}</div>
        ${c
          ? renderCardFace(c, true)
          : `<div class="stats-card-empty">Star a card in your vault to fill this slot.</div>`}
      </div>`).join('')}
  </div>

  <div class="section-label" style="margin-top:20px;">Badges <span class="mono" style="color:var(--muted);letter-spacing:0;">${earnedBadgeCount(state.dex || {})}/${BADGES.length}</span></div>
  <div style="color:var(--muted);font-size:11px;margin:-6px 0 10px;">&#9733; Gym Leader &middot; &#9733;&#9733; Elite Four &middot; &#9733;&#9733;&#9733; Champion &mdash; difficulty is set by how rare the missing cards are, not how many.</div>
  ${renderBadgeGrid(state.dex || {})}

    <p>The index moves in cycles. Some short, some long, all of them stacked on top of each other. It is completely deterministic &mdash; the <em>same</em> market for every player at the same moment, so nobody is getting a better roll than you. You are just reading it worse.</p>
    <p><strong>The HODL bonus.</strong> Cards gain <strong>+1% per hour</strong> you hold them, up to <strong>+30%</strong>. Thirty hours of doing nothing is the most reliable return in the game.</p>
    <p><strong>One more thing.</strong> The sell button on the pack reveal screen and the sell button in your Vault do not do the same math. That's not a bug. Figure out which one you want and when. I'm not going to tell you.</p>

    <hr>

    <h3>Shinies</h3>
    <p>Some cards come out wrong. Recoloured, sparkling, and rare enough that most players will never see one.</p>
    <p>They're worth <strong>ten times</strong> a normal copy of the same card. That is the largest single swing available to you and it is entirely luck. Nothing you do makes one more likely, and there is no counter quietly filling up on your behalf.</p>
    <p>The duplicate liquidator will not touch them. Where a shiny exists it's kept as your copy and the plain duplicates sell instead.</p>

    <hr>

    <h3>The Wheel Is The Economy</h3>
    <p class="lead">Here's the part the UI doesn't say out loud:</p>
    <p><strong>Packs lose money.</strong> On average, a pack contains less value than it costs. That's not a flaw, that's the whole design &mdash; it's how a card shop works and how every card shop has always worked. The house edge is the point.</p>
    <p>So the market isn't how you get rich. The market is how you lose <em>less</em>. A good sell turns a bad pack into a survivable one, and a great sell &mdash; held long, timed right &mdash; can actually come out ahead. That's the skill. That's the entire skill.</p>
    <p>Your income is the wheel. Every hour, free, no strings. The cooldown survives a game reset, so don't get clever.</p>

    <hr>

    <h3>Badges</h3>
    <p>Sixteen badges, one per type. You get the Volcano Badge by holding every Fire card. The Cascade Badge by holding every Water card. All forty-six of them. There is no shortcut and there is no shop.</p>
    <p>They still do <strong>nothing</strong>. No bonus, no multiplier, no secret unlock. What changed is that you can no longer buy your way out of earning one, which most people will find is worse.</p>
    <p>They are also <strong>not permanent</strong>. A badge is a statement about what you're holding right now, so the moment you sell your last Poliwag the Cascade Badge goes out. Check what a card is doing for you before you liquidate it.</p>
    <p>Progress is on the Stats page. Read it carefully. Marsh needs fifteen Psychics and four of them are secrets; Earth needs eleven Grounds and none of them are. Those two bars fill at wildly different speeds and neither bar mentions it.</p>

    <hr>

    <h3>Three Things That Will Save You</h3>
    <div class="howto-tip"><span class="n">1</span><span><strong>Never sell your last copy.</strong> Duplicates are income. Singles are the entire point of the game. The Market page stacks your copies and flags anything you only hold one of &mdash; trust it over your own read.</span></div>
    <div class="howto-tip"><span class="n">2</span><span><strong>Spin every hour you're awake.</strong> It's free money and it outearns everything else you can do.</span></div>
    <div class="howto-tip"><span class="n">3</span><span><strong>Sell into strength, not into need.</strong> The moment you <em>need</em> HEX is almost never the moment the market wants to give you any. Sell when it's high and sit on the cash.</span></div>

    <hr>

    <h3>That's It</h3>
    <p>Open packs. Watch the line. Hold when it's low, dump when it's high, never sell your last one, spin every hour.</p>
    <p>251 cards. Sixteen badges you can lose. One market that doesn't care about you.</p>
    <p>Good luck.</p>

    <div class="howto-sign">
      <span>[dungeon]</span>
    </div>
    ${backToTopBtn()}
  </div>`;
}

function renderDex(){
  const owned = state.dex;
  // Shiny indication is ownership-based, derived from instances - not from the
  // dex entry. Liquidate the shiny and the dex forgets it. Lifetime credit for
  // having pulled it lives in player_stats.shiny_pulls_count instead.
  const shinyIds = new Set((state.instances || []).filter(i => i.shiny).map(i => i.id));
  // one pool, two views: ids 1-151 are Kanto, 152-251 are Johto
  const genRange = dexGen === 2 ? [152, 251] : [1, 151];
  const genList = POKEMON.filter(p => p.id >= genRange[0] && p.id <= genRange[1]);
  const genOwned = genList.filter(p => owned[p.id]).length;
  const tabBtn = (g, label) => `<button data-dexgen="${g}" style="font-family:'JetBrains Mono',monospace; font-size:10.5px; padding:4px 10px; border-radius:6px; cursor:pointer; border:1px solid ${dexGen===g?'var(--foil1)':'var(--line)'}; background:${dexGen===g?'rgba(57,255,20,0.12)':'transparent'}; color:${dexGen===g?'var(--foil1)':'var(--muted)'};">${label}</button>`;

  return `
  <div class="dexhead">

      <div class="key-item"><span class="key-dot" style="--dot-color:var(--rare)"></span>Rare</div>
      <div class="key-item"><span class="key-dot" style="--dot-color:var(--ultra)"></span>Ultra</div>

  </div>
  <div class="dexgrid" style="margin-bottom:24px;">
    ${genList.map(p=>{
      const o = owned[p.id];
      const color = TYPE_COLORS[p.type];
      return `<div class="dexslot ${o?'owned':''} ${o && shinyIds.has(p.id) ? 'shiny-card' : ''}" style="--slot-color:${o?RARITY[o.rarity]?.color||color:''};${o && shinyIds.has(p.id) ? `--shiny-hue:${shinyHue(p.id)}deg;` : ''}">

// Drag-to-tear. The pack no longer plays a canned animation: --p is tear
// progress 0..1 driven by the gesture, and the CSS masks follow it, so the tear
// can be scrubbed, held, dragged back, or flicked. Crucially nothing here calls
// render() until the tear completes - a re-render mid-drag would rebuild the
// overlay and drop the pointer capture.
const TEAR_GRAINS=[0.04,0.14,0.25,0.36,0.47,0.60,0.74,0.88];
function tearGrain(i,delay){
  const d = delay||0;
  const f = 430 - i*14 + ((i*97)%110);
  noise(0.022*0.633, f, f*0.68, 0.090 - i*0.003, 1.8, d);
  noise(0.013*0.633, 2500+i*210, 2000+i*150, 0.66*(0.008+i*0.0009), 2.4, d);
}
function wireTear(){
  const pack = document.querySelector('[data-rip]');
  const zone = document.querySelector('[data-tearzone]');
  if(!pack || !zone) return;
  let p=0, dragging=false, moved=false, startX=0, dir=1, fired=-1, done=false;
  const THRESH=0.55;

  function setP(v){
    p = Math.max(0, Math.min(1, v));
    pack.style.setProperty('--p', p.toFixed(4));
    // A flick crosses several thresholds in one pointermove; firing them all at
    // that instant is a burst, not a tear, so they are spread on the audio clock.
    const crossed=[];
    while(fired+1 < TEAR_GRAINS.length && p >= TEAR_GRAINS[fired+1]){ fired++; crossed.push(fired); }
    if(crossed.length){
      const gap = crossed.length > 4 ? 0.012 : 0.020;
      crossed.forEach((g,k)=>tearGrain(g,k*gap));
    }
    if(p < 0.02) fired = -1;
  }
  function inPack(x,y){
    const r = pack.getBoundingClientRect();
    return x>=r.left && x<=r.right && y>=r.top && y<=r.bottom;
  }
  function open(){
    if(done) return;
    done = true;
    pack.style.setProperty('--dir', dir);
    let n=0; for(let k=fired+1;k<TEAR_GRAINS.length;k++) tearGrain(k,(n++)*0.022);
    pack.classList.add('settling'); setP(1);
    setTimeout(()=>pack.classList.add('gone'), 90);
    // the body's ragged edge waits until the top piece has left frame
    setTimeout(()=>pack.classList.add('torn'), 320);
    setTimeout(()=>{ opening.stage='revealing'; render(); }, 470);
  }
  zone.addEventListener('pointerdown', e=>{
    if(done || opening.stage!=='closed') return;
    dragging=true; moved=false; startX=e.clientX;
    zone.setPointerCapture(e.pointerId);
    pack.classList.remove('settling');
  });
  zone.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx = e.clientX - startX;
    if(Math.abs(dx) > 6){
      moved = true;
      if(p < 0.05){ dir = dx < 0 ? -1 : 1;
        pack.classList.toggle('rtl', dir < 0);
        pack.style.setProperty('--dir', dir); }
    }
    setP(Math.abs(dx) / (pack.getBoundingClientRect().width * 0.85));
  });
  function release(e){
    if(!dragging) return;
    dragging=false;
    if(p >= THRESH) open();
    else if(!moved && e && inPack(e.clientX,e.clientY)) open();
    else { pack.classList.add('settling'); setP(0);
           setTimeout(()=>pack.classList.remove('settling'),300); }
  }
  zone.addEventListener('pointerup', release);
  zone.addEventListener('pointercancel', release);
  // the zone only covers the top of the pack, so a tap lower down needs its own
  // listener or it reaches nothing at all
  pack.addEventListener('click', ()=>{
    if(done || dragging || p > 0.05 || opening.stage!=='closed') return;
    open();
  });
}

function speakerIcon(off){
  const body = '<path d="M3 9v6h4l5 4V5L7 9H3Z"/>';
  return '<svg viewBox="0 0 24 24" aria-hidden="true">' + body + (off
    ? '<path d="M16 9.5l5 5M21 9.5l-5 5"/>'
    : '<path d="M15.8 8.4a5 5 0 0 1 0 7.2"/><path d="M18.4 5.8a8.6 8.6 0 0 1 0 12.4"/>')
    + '</svg>';
}

function wire(){
  const muteBtn = document.querySelector('[data-mute]');
  if(muteBtn) muteBtn.onclick = ()=>{
    setMuted(!muted);
    muteBtn.classList.toggle('is-muted', muted);
    muteBtn.innerHTML = speakerIcon(muted);
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteBtn.title = muted ? 'Sound off' : 'Sound on';
    muteBtn.setAttribute('aria-label', muted ? 'Turn sound on' : 'Turn sound off');
    // a short confirmation tone when switching back on, so the control proves
    // itself without needing to open a pack
    if(!muted) flipSound();
  };
  const signoutBtn = document.querySelector('[data-signout]');
  if(signoutBtn) signoutBtn.onclick = ()=>{ signOut(); };
  const createAccountBtn = document.querySelector('[data-createaccount]');
  if(createAccountBtn) createAccountBtn.onclick = ()=>{
    authMode = 'signin';
    authMsg = null;
    renderAuth();
  };
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
    view=b.dataset.nav;
    if(view==='profile' && authUser) loadProfileStats();
    if(view==='market' && authUser && !pnlSeries && !pnlLoading) loadPnlSeries();
    render();
  });

  document.querySelectorAll('[data-scrolltop]').forEach(b=>b.onclick=()=>{
    window.scrollTo({top:0,behavior:'smooth'});
  });

  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
    const pack = PACKS.find(p=>p.id===b.dataset.buy);
    openPack(pack);
  });
  document.querySelectorAll('[data-buyback]').forEach(b=>b.onclick=async ()=>{
    const id = b.dataset.buyback;
    if(cardBackBusy) return;
    cardBackBusy = id; render();
    try{
      const { data, error } = await sb.rpc('buy_card_back', { p_id: id });
      if(error) throw error;
      if(data.status === 'bought'){
        state.hex = data.hex;
        const row = (cardBackShelf||[]).find(r=>r.id===id);
        if(row) row.owned = true;
        toast('Card back unlocked.');
      } else if(data.status === 'insufficient'){
        toast('Not enough HEX for that back.');
      } else if(data.status === 'already_owned'){
        const row = (cardBackShelf||[]).find(r=>r.id===id);
        if(row) row.owned = true;
      }
    }catch(e){
      console.error('buy_card_back failed:', e && e.message, e);
      toast('Purchase failed - nothing was charged.');
    }finally{
      cardBackBusy = null; render();
    }
  });

  document.querySelectorAll('[data-equipback]').forEach(b=>b.onclick=async ()=>{
    const id = b.dataset.equipback || null;   // empty string = unequip
    if(cardBackBusy) return;
    cardBackBusy = id || state.equippedBack; render();
    try{
      const { data, error } = await sb.rpc('equip_card_back', { p_id: id });
      if(error) throw error;
      if(data.status === 'equipped')        state.equippedBack = data.id;
      else if(data.status === 'unequipped') state.equippedBack = null;
      else if(data.status === 'not_owned')  toast('You do not own that back.');
    }catch(e){
      console.error('equip_card_back failed:', e && e.message, e);
      toast('Could not change your card back.');
    }finally{
      cardBackBusy = null; render();
    }
  });

  document.querySelectorAll('[data-open-detail-modal]').forEach(tile => {
    tile.onclick = () => {
      activeModal = { type: 'detail', uid: tile.dataset.openDetailModal };
      render();
    };
  });

  document.querySelectorAll('[data-fav-toggle]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      // no slot: server appends if there's room, or answers 'full' and we ask
      setFavoriteSlot(btn.dataset.favToggle, null);
    };
  });

  document.querySelectorAll('[data-fav-slot]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      setFavoriteSlot(btn.dataset.favSlot, Number(btn.dataset.favSlotN));
    };
  });

  document.querySelectorAll('[data-fav-slot-cancel]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      favPickerFor = null;
      render();
    };
  });

  document.querySelectorAll('[data-open-single-modal]').forEach(btn => {
    btn.onclick = (e) => {
      // the Liquidate button on a vault tile is nested inside that tile's own
      // detail-modal click target. without this the sell confirm and the detail
      // panel both open, stacked.
      e.stopPropagation();
      activeModal = { type: 'single', uid: btn.dataset.openSingleModal };
      render();
    };
  });

  document.querySelectorAll('[data-open-tier-modal]').forEach(btn => {
    btn.onclick = () => {
      activeModal = { type: 'tier', tier: btn.dataset.openTierModal };
      render();
    };
  });

  const cancelBtn = document.querySelector('[data-modal-cancel]');
  if (cancelBtn) {
    cancelBtn.onclick = () => { activeModal = null; render(); };
  }

  let liquidateBusy = false;
  const confirmSingleBtn = document.querySelector('[data-modal-confirm-single]');
  if (confirmSingleBtn) {
    confirmSingleBtn.onclick = async () => {
      if(liquidateBusy) return;
      const uid = confirmSingleBtn.dataset.modalConfirmSingle;
      const idx = (state.instances || []).findIndex(x => x.uid === uid);
      if (idx === -1) { activeModal = null; render(); return; }

      liquidateBusy = true;
      try{
        const { data, error } = await sb.rpc('liquidate_instance', { p_uid: uid });
        if(error){
          toast("Couldn't liquidate that card - try again.");
          return;
        }
        const inst = state.instances[idx];
        const p = POKEMON.find(x => x.id === inst.id);

        state.instances.splice(idx, 1);
        const dexEntry = state.dex[p.id];
        if (dexEntry) {
          dexEntry.count--;
          if (dexEntry.count <= 0) delete state.dex[p.id];
        }

        state.hex += data.payout; // authoritative payout from the server, not a local recompute
        recordVaultValue();
        saveState();
        toast(`Liquidated ${p.name} for <i class="hex-icon"></i>${fmtHex(data.payout)} HEX!`);
      } finally {
        liquidateBusy = false;
        activeModal = null;
        render();
      }
    };
  }

  document.querySelectorAll('[data-open-dupes-modal]').forEach(btn => {
    btn.onclick = () => {
      activeModal = { type: 'dupes', tier: btn.dataset.openDupesModal };
      render();
    };
  });

  const confirmDupesBtn = document.querySelector('[data-modal-confirm-dupes]');
  if (confirmDupesBtn) {
    confirmDupesBtn.onclick = async () => {
      if(liquidateBusy) return;
      const targetTier = confirmDupesBtn.dataset.modalConfirmDupes;
      liquidateBusy = true;
      try{
        const { data, error } = await sb.rpc('liquidate_duplicates', { p_rarity: targetTier });
        if(error){
          toast("Couldn't liquidate those duplicates - try again.");
          return;
        }
        if (data.count > 0) {
          // the server decides which copy survives, so refetch rather than
          // reproduce the keeper logic client-side and risk drift
          activeModal = null;
          await loadState();
          recordVaultValue();
          saveState();
          toast(`Liquidated ${data.count} duplicate ${data.count === 1 ? 'card' : 'cards'} for <i class="hex-icon"></i>${fmtHex(data.payout)} HEX!`);
          return;
        }
        toast('No duplicates to liquidate in that tier.');
      } finally {
        liquidateBusy = false;
        activeModal = null;
        render();
      }
    };
  }

  const confirmTierBtn = document.querySelector('[data-modal-confirm-tier]');
  if (confirmTierBtn) {
    confirmTierBtn.onclick = async () => {
      if(liquidateBusy) return;
      const targetTier = confirmTierBtn.dataset.modalConfirmTier;
      liquidateBusy = true;
      try{
        const { data, error } = await sb.rpc('liquidate_tier', { p_rarity: targetTier });
        if(error){
          toast("Couldn't liquidate those cards - try again.");
          return;
        }
        if (data.count > 0) {
          const remainingInstances = [];
          (state.instances || []).forEach(inst => {
            // must mirror the server: liquidate_tier keeps shinies, so a
            // shiny stays in instances and its dex count is NOT decremented.
            if (inst.rarity === targetTier && !inst.shiny) {
              const dexEntry = state.dex[inst.id];
              if (dexEntry) {
                dexEntry.count--;
                if (dexEntry.count <= 0) delete state.dex[inst.id];
              }
            } else {
              remainingInstances.push(inst);
            }
          });
          state.instances = remainingInstances;
          state.hex += data.payout; // authoritative payout from the server, not a local recompute
          recordVaultValue();
          saveState();
          toast(`Liquidated ${data.count} ${targetTier} cards for <i class="hex-icon"></i>${fmtHex(data.payout)} HEX!`);
        }
      } finally {
        liquidateBusy = false;
        activeModal = null;
        render();
      }
    };
  }

  wireTear();
  document.querySelectorAll('.reveal-row [data-flip]').forEach((el,i)=>{
    el.onclick = ()=>{
      if(opening.flipped.includes(i)){
        // Already revealed. Once every card is flipped we are in the
        // keep/sell selection stage, so a tap here toggles this card.
        // Bound to [data-flip] rather than a wrapper element because the
        // card faces sit in a rotateY(180deg) preserve-3d context - this is
        // the element that demonstrably receives the click.
        if(opening.flipped.length === opening.cards.length){
          opening.keep[i] = !opening.keep[i];
          render();
        }
        return;
      }
      opening.flipped.push(i);
      const card = opening.cards[i];
      flipSound();
      revealSound(card.rarity,0.05);
      if(card.shiny) shinySound(0.16);
      if(card.rarity==='ultra'||card.rarity==='secret') burstConfetti();
      render();
    };
  });
  const flipAllBtn = document.querySelector('[data-flipall]');
  if(flipAllBtn) flipAllBtn.onclick = ()=>{
    // reveal every unflipped card at once. plays the sound for the BEST card
    // only rather than stacking five, and fires confetti once if any card in
    // the pack is ultra/secret - the same effects, not five copies of them.
    const order = ['common','uncommon','rare','ultra','secret'];
    let best = -1, burst = false, shiny = false; const flips = [];
    opening.cards.forEach((card,i)=>{
      if(opening.flipped.includes(i)) return;
      flips.push(i);
      if(card.shiny) shiny = true;
      opening.flipped.push(i);
      const r = order.indexOf(card.rarity);
      if(r > best) best = r;
      if(card.rarity==='ultra'||card.rarity==='secret') burst = true;
    });
    // A dealt run: same plop per card, evenly spaced and slightly detuned by
    // position so five in a row sound like five cards rather than one sound
    // repeated. The rarity chime still lands once, after the last card.
    flips.forEach((n,k)=>flipSound(k*0.105, 1 + ((k%3)-1)*0.045));
    const after = (flips.length-1)*0.105 + 0.14;
    if(best >= 0) revealSound(order[best], after);
    // one fanfare for the whole pack, however many shinies are in it
    if(shiny) shinySound(after + 0.12);
    if(burst) burstConfetti();
    render();
  };

  document.querySelectorAll('[data-keep]').forEach(el=>{
    el.onchange = ()=>{ opening.keep[+el.dataset.keep] = el.checked; render(); };
  });
  const sellAll = document.querySelector('[data-sellall]');
  if(sellAll) sellAll.onclick = ()=>{
    opening.keep = opening.keep.map(()=>false);
    finalizeOpening();
  };
  const confirm = document.querySelector('[data-confirm]');
  if(confirm) confirm.onclick = ()=>{ finalizeOpening(); };
  const close = document.querySelector('[data-close]');
  if(close) close.onclick = async ()=>{
    if(opening.stage==='closed'){
      const openingId = opening.openingId;
      opening = null; render(); // close immediately, don't make the player wait on the network
      try{
        const { data, error } = await sb.rpc('cancel_pack_opening', { p_opening_id: openingId });
        if(!error){
          state.hex += data.refund;
          saveState();
          render();
        }
      }catch(e){ console.error('cancel_pack_opening failed', e); }
    } else {
      // ripped but not yet finalized: closing here should behave the same
      // as hitting "Confirm & continue" (keep everything), not forfeit the
      // cards and the pack price the player already paid
      opening.keep = opening.cards.map(()=>true);
      finalizeOpening();
    }
  };
  const reset = document.querySelector('[data-reset]');
  if(reset) reset.onclick = ()=>{
    if(!requireAuth()) return;
    resetConfirmOpen = true;
    render();
  };

  const resetCancel = document.querySelector('[data-reset-cancel]');
  if(resetCancel) resetCancel.onclick = ()=>{
    resetConfirmOpen = false;
    render();
  };

  const resetConfirm = document.querySelector('[data-reset-confirm]');
  if(resetConfirm) resetConfirm.onclick = async ()=>{
    if(resetBusy) return;
    resetBusy = true;
    render();
    try{
      const { error } = await sb.rpc('reset_game_state');
      if(error){
        toast("Couldn't reset progress - try again.");
        return;
      }
      // intentionally NOT clearing lastSpinAt: the server's wheel cooldown
      // survives a reset by design (otherwise reset -> respin -> reset would
      // be a way to farm the wheel with nothing at stake), so the button
      // needs to keep showing the real remaining cooldown, not "Ready"
      const preservedLastSpinAt = state.lastSpinAt;
      // reset wipes instances, so any favorite_uid still stored server-side can
      // no longer resolve. cleared locally rather than via the RPC - see notes.
      // equipped_back is a permanent purchase and is NOT cleared by reset_game_state,
      // so carry it across rather than falling back to the pack theme until refresh.
      state = { hex:2500, dex:{}, instances:[], collectibles:{}, lastSpinAt:preservedLastSpinAt, valueHistory:[], longHistory:[], favoriteUids:[], equippedBack: state.equippedBack || null };
      saveState();
      resetConfirmOpen = false;
    } finally {
      resetBusy = false;
      render();
    }
  };

  document.querySelectorAll('[data-dexgen]').forEach(btn=>{
    btn.onclick = () => { dexGen = Number(btn.dataset.dexgen); render(); };
  });

  document.querySelectorAll('details[data-tier]').forEach(d => {
    d.ontoggle = () => {
      if(d.open) expandedTiers.add(d.dataset.tier);
      else expandedTiers.delete(d.dataset.tier);
    };
  });

  document.querySelectorAll('details[data-species]').forEach(d => {
    d.ontoggle = () => {
      if(d.open) expandedSpecies.add(d.dataset.species);
      else expandedSpecies.delete(d.dataset.species);
    };
  });

  const marketSearchForm = document.getElementById('marketSearchForm');
  if(marketSearchForm){
    marketSearchForm.onsubmit = (e)=>{
      e.preventDefault();
      const input = document.getElementById('marketSearchInput');
      marketSearch = input ? input.value : '';
      marketScrollPending = true;   // one-shot: cleared once we've scrolled
      render();
    };
  }
  const searchClear = document.querySelector('[data-searchclear]');
  if(searchClear) searchClear.onclick = ()=>{
    marketSearch = ''; marketHits = []; marketScrollPending = false; render();
  };
  if(marketScrollPending){
    marketScrollPending = false;
    const firstHit = document.querySelector('.packcard.search-hit');
    // scroll after paint, otherwise the <details> we just opened has not
    // laid out yet and the target lands in the wrong place
    if(firstHit) requestAnimationFrame(()=>
      firstHit.scrollIntoView({behavior:'smooth', block:'center'}));
  }

  document.querySelectorAll('[data-vaultmode]').forEach(btn=>{
    btn.onclick = ()=>{
      vaultChartMode = btn.dataset.vaultmode;
      render();
    };
  });

  const wheelCollect = document.querySelector('[data-wheelcollect]');
  if(wheelCollect) wheelCollect.onclick = ()=>{
    wheelResult = null; render();
  };

  const wheelSpinBtn = document.getElementById('wheelSpinBtn');
  if(wheelSpinBtn) wheelSpinBtn.onclick = async ()=>{
    if(!requireAuth()) return;
    if(wheelSpinning || !canSpin()) return;
    const strip = document.getElementById('termStrip');
    if(!strip) return;
    wheelSpinning = true;
    wheelSpinBtn.disabled = true;
    wheelSpinBtn.textContent = 'Spinning…';

    const { data, error } = await sb.rpc('spin_wheel');
    if(error){
      wheelSpinning = false;
      wheelSpinBtn.disabled = !canSpin();
      wheelSpinBtn.textContent = canSpin() ? 'Spin the wheel' : 'Wait (' + spinStatusText() + ')';
      toast(error.message.includes('cooldown') ? "The wheel's still on cooldown." : "Couldn't spin - try again.");
      return;
    }
    // server has already picked (and paid out) the reward; find the matching
    // strip entry purely to know where to animate the visual to
    let reward = WHEEL_REWARDS.find(r=>r.amt===data.amount);
    let idx = WHEEL_REWARDS.indexOf(reward);
    // Catalog-drift guard. WHEEL_REWARDS mirrors the wheel_rewards table with
    // no automatic sync, so a deploy window (or a stale cached build) can hand
    // us an amount this strip doesn't contain. Without this, idx is -1: the
    // strip lands a slot short and the result panel silently disappears, while
    // the server's HEX is still credited. Animate to the nearest slot instead
    // and report the amount the server actually paid.
    if (idx < 0) {
      idx = WHEEL_REWARDS.reduce((best, r, i) =>
        Math.abs(r.amt - data.amount) < Math.abs(WHEEL_REWARDS[best].amt - data.amount) ? i : best, 0);
      reward = { amt: data.amount };
    }

    const itemHeight = 46;
    const itemsPerSet = WHEEL_REWARDS.length;
    const targetRepetition = 8;
    const targetOffset = (targetRepetition * itemsPerSet + idx) * itemHeight;
    const finalTranslateY = targetOffset - (140 / 2) + (itemHeight / 2);

    strip.style.transition = 'transform 4.2s cubic-bezier(0.1, 0.7, 0.1, 1)';
    requestAnimationFrame(()=>{ strip.style.transform = `translateY(-${finalTranslateY}px)`; });
    revealSound('rare');

    setTimeout(()=>{
      wheelSpinning = false;
      wheelResult = reward;
      state.hex += data.amount; // authoritative payout from the server, not a local recompute
      state.lastSpinAt = Date.now();
      recordVaultValue();
      saveState();
      strip.style.transition = 'none';
      if(reward.amt>=25000) burstConfetti();
      render();
    }, 4300);
  };
}

setInterval(()=>{
  const btn = document.getElementById('wheelSpinBtn');
  if(btn && !wheelSpinning && view==='shop'){
    btn.disabled = !canSpin();
    btn.textContent = canSpin() ? 'Spin the wheel' : 'Wait (' + spinStatusText() + ')';
  }
  if(view === 'market'){
    if(state.instances && state.instances.length > 0){
      recordVaultValue();
    }
    updateVaultFeedLive();
  }
}, 1000);

render(); // guest view of the Packs page shown immediately; onAuthStateChange loads the real saved state if a session is restored
})();
</script>
