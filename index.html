        <tbody>${rows.map(r => `
          <tr class="${r.username === me ? 'lb-me' : ''} ${r.rank <= 3 ? 'lb-top lb-top' + r.rank : ''}">
            <td class="lb-rank">${r.rank}</td>
            <td class="lb-name"><div class="lb-who">${lbBack(r.equipped_back, r.equipped)}<button class="lb-player" data-lb-player="${esc(r.username)}" title="${r.username === me ? 'Back to your Stats' : 'View ' + esc(r.username) + '\u2019s profile'}">${esc(r.username)}</button>${r.username === me ? '<span class="lb-you">you</span>' : ''}</div></td>
            <td class="lb-num">${board.primary(r.primary_value)}</td>
            ${hasSecondary ? `<td class="lb-num lb-sec ${board.keepSecondary ? 'lb-keep' : ''}">${r.secondary_value == null ? '' : board.secondary(r.secondary_value, r)}</td>` : ''}
          </tr>`).join('')}
        </tbody>
      </table></div>`;

  return `
  <div class="lb-head">
    <button class="iconbtn" data-close-leaderboards title="Back to Stats" aria-label="Back to Stats">&lsaquo;</button>
    <h2 class="disp" style="margin:0;">Leaderboards</h2>
  </div>
  ${profileIsPublic ? '' : `<div class="lb-note">Your profile is private, so you're not on the boards. Make it public from your Stats page to join them.</div>`}
  <div class="lb-group-label">Overall</div>
  <div class="lb-chips">${LB_BOARDS.filter(b => b.group === 'overall').map(chip).join('')}</div>
  <div class="lb-group-label">Skills</div>
  <div class="lb-chips">${LB_BOARDS.filter(b => b.group === 'skills').map(chip).join('')}</div>
  <div class="lb-board-title">${board.icon ? `<span class="lb-title-ico">${skillIconSvg(board.icon, 18)}</span>` : ''}${esc(board.label)}</div>
  ${body}
  <p class="lb-foot">Public profiles only. Ties share a rank. ${board.key === 'vault_value' || board.key === 'net_worth' ? "Vault values are priced at each player's last sale or pack, not live." : ''}</p>

}

function renderProfile(){
  if(!authUser){
    return `<div class="section-label">Profile</div><div style="color:var(--muted);padding:20px 0;">Sign in to view your profile and stats.</div>`;
  }
  if(leaderboardOpen) return renderLeaderboards();
  if(profileLoading || !profileStats){
    return `<div class="section-label">Profile</div><div style="color:var(--muted);padding:20px 0;">Loading your stats…</div>`;
  }
  const s = profileStats;
  const mvp = s.mostValuablePull;
  const mvpPokemon = mvp ? POKEMON.find(p=>p.id===mvp.id) : null;
  const mvpCard = mvpPokemon ? {
    id: mvp.id, name: mvp.name, rarity: mvp.rarity, value: mvp.value,
    shiny: mvp.shiny, holo: mvp.holo, shadow: mvp.shadow, type: mvpPokemon.type, sprite: mvpPokemon.sprite
  } : null;

  // favorites are not protected from being sold, so a slot's uid may no longer
  // resolve. an unresolvable uid reads as an empty slot rather than an error.
  // fixed length so slot 3 still renders its placeholder when only 1 is set.
  const favCards = Array.from({ length: FAVORITE_SLOTS }, (_, i) => {
    const uid = (state.favoriteUids || [])[i];
    const inst = uid ? (state.instances || []).find(x => x.uid === uid) : null;
    const fp = inst ? POKEMON.find(x => x.id === inst.id) : null;
    return fp ? {
      id: fp.id, name: fp.name, rarity: inst.rarity,
      value: fp.value, shiny: inst.shiny, holo: inst.holo, shadow: inst.shadow, type: fp.type, sprite: fp.sprite, uid
    } : null;
  });
  const usedUids = usedBinderUids();

  const packRows = PACKS.map(p=>{
    const count = (s.packsOpened && s.packsOpened[p.id]) || 0;
    return `<div class="stat-row"><span>${esc(p.name)}</span><span class="mono">${count}</span></div>`;
  }).join('');

  const profitLossColor = s.totalProfitLoss >= 0 ? '#39ff14' : '#ff4444';

  // Split client-side from state.dex rather than from s.collectionPercent.
  // get_player_stats divides ALL dex keys by 151, so with gens 2-5 seeded
  // server-side that value far exceeds 100%. state.dex is the same
  // authoritative data, so splitting here avoids depending on the RPC.
  // Rows come from GENS, so a new generation needs no edit here.
  const dexIds = Object.keys(state.dex || {}).map(Number);
  const genRows = GENS.map(g => {
    const total = g.hi - g.lo + 1;
    const owned = dexIds.filter(n => n >= g.lo && n <= g.hi).length;
    const pct   = ((owned / total) * 100).toFixed(1);
    return `<div class="stat-row"><span>% of ${g.label}</span><span class="mono">${pct}% (${owned}/${total})</span></div>`;
  }).join('');
  const dexOwned = dexIds.filter(n => n >= 1 && n <= DEX_TOTAL).length;
  const dexPct   = ((dexOwned / DEX_TOTAL) * 100).toFixed(1);

  return `
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    ${profileAvatar(state.equippedBack, state.equipped)}
    <h2 class="disp" style="margin:0;">${esc(profileUsername || 'Profile')}</h2>
    <button class="visibility-pill ${profileIsPublic?'is-public':'is-private'}" style="margin-left:auto;margin-right:var(--vislb-gutter);" data-profile-visibility
      title="${profileIsPublic ? 'Anyone can view your profile and stats. Click to make it visible to friends only.' : 'Only friends can view your profile and stats. Click to make it public.'}">
      ${lockIcon(profileIsPublic)}<span>${profileIsPublic ? 'Public' : 'Private'}</span>
    </button>
  </div>
  <div class="lb-link-row">
    <svg class="vis-lb-link" aria-hidden="true"></svg>
    <button class="lb-link" data-open-leaderboards>
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17V10M10 17V4M16 17v-5"/></svg>
      Leaderboards <span aria-hidden="true">&rsaquo;</span>
    </button>
  </div>

  ${renderSkillsSection()}

  <div class="section-label">Collection</div>
  <div class="stat-row"><span>% of Full Dex</span><span class="mono">${dexPct}% (${dexOwned}/${DEX_TOTAL})</span></div>
  ${genRows}
  <div class="stat-row"><span># of Secret Rares Pulled</span><span class="mono">${s.secretPullsCount}</span></div>
  <div class="stat-row"><span># of Shinies Found</span><span class="mono">${s.shinyPullsCount}</span></div>
  <div class="stat-row"><span># of Shadows Found</span><span class="mono">${s.shadowPullsCount ?? 0}</span></div>

  <div class="stats-card-display">
    <div class="stats-card-col">
      <div class="section-label" style="margin:0;">Most Valuable Pull</div>
      ${mvpCard
        ? renderCardFace(mvpCard, true)
        : `<div class="stats-card-empty">No pulls recorded yet.</div>`}
    </div>
  </div>

  <div class="section-label" style="margin-top:20px;">Favorite Cards</div>
  <div class="stats-card-display">
    ${favCards.map((c, i) => `
      <div class="stats-card-col">
        <div class="section-label" style="margin:0;">Slot ${i + 1}</div>
        ${c
          ? renderCardFace(c, true, usedUids.has(c.uid))
          : `<div class="stats-card-empty">Star a card in your vault to fill this slot.</div>`}
      </div>`).join('')}
  </div>

  <div class="section-label" style="margin-top:20px;">Badges <span class="mono" style="color:var(--muted);letter-spacing:0;">${earnedBadgeCount(state.dex || {})}/${BADGES.length}</span></div>
  <div style="color:var(--muted);font-size:11px;margin:-6px 0 10px;">&#9733; Gym Leader &middot; &#9733;&#9733; Elite Four &middot; &#9733;&#9733;&#9733; Champion &mdash; difficulty is set by how rare the missing cards are, not how many.</div>
  ${renderBadgeGrid(state.dex || {})}

  <div class="section-label" style="margin-top:20px;">Packs Opened by Tier</div>
  ${packRows}

  <div class="section-label" style="margin-top:20px;">Vault &amp; Economy</div>
  <div class="stat-row"><span>Highest All-Time Vault Value</span><span class="mono"><i class="hex-icon"></i>${fmtHex(s.highestVaultValue)}</span></div>
  <div class="stat-row"><span>Number of Cards Liquidated</span><span class="mono">${s.cardsLiquidatedCount}</span></div>
  <div class="stat-row"><span>HEX Spent on Packs</span><span class="mono"><i class="hex-icon"></i>${fmtHex(s.hexSpentOnPacks)}</span></div>
  <div class="stat-row"><span>HEX Earned from Card Sales</span><span class="mono"><i class="hex-icon"></i>${fmtHex(s.hexEarnedFromCardSales)}</span></div>
  <div class="stat-row"><span>Total HEX Profit/Loss (incl. bonuses)</span><span class="mono" style="color:${profitLossColor};">${s.totalProfitLoss>=0?'+':''}${fmtHex(s.totalProfitLoss)}</span></div>
  `;
}

          <tr><td>${skIco('attack')}Attack</td><td>sell straight off the reveal screen</td><td>Flat rate per card. The fast, no-patience style.</td></tr>
          <tr><td>${skIco('defense')}Defense</td><td>sell a card you've held, scaled by how long</td><td>The opposite of Attack. You can't max both quickly.</td></tr>
          <tr><td>${skIco('strength')}Strength</td><td>open a pack, scaled by how much of your balance it costs</td><td>A big pack on a thin balance counts most.</td></tr>
          <tr><td>${skIco('magic')}Magic</td><td>liquidate, scaled by rarity</td><td>Bulk selling pays the full rate per card.</td></tr>
          <tr><td>${skIco('prayer')}Prayer</td><td>spin the wheel, or pull a shiny or shadow</td><td>They count even if you sell them. The slowest 99.</td></tr>
          <tr><td>${skIco('agility')}Agility</td><td>sell <em>above</em> the market average, scaled by how far</td><td>Selling into a dip earns nothing. You can't grind it, only time it.</td></tr>
        </tbody>
      </table></div>
      <p>The hexagon on your Stats page shows which way you lean. <strong>Trainer Level</strong> sums up all six. A reset wipes every level back to the start.</p>
    `)}

    ${sec('social', 'Profile, friends & mail', `
      <p>Your <strong>Stats</strong> page is your profile: collection progress, badges, skills, favorites and binders. Use the <strong>Public / Private</strong> switch at the top. Public means anyone can view it; private means friends only.</p>
      <p>That same switch is your entry for the <strong>Leaderboards</strong> (the link under it on your Stats page): public profiles are ranked, private ones don't appear. New accounts start private.</p>
      <p>The <strong>mail icon</strong> next to your HEX balance opens your mailbox. It has friend requests, your friends list (tap a friend to visit their profile and browse their binders), and messages. Some messages come with a gift to claim.</p>
      <p>Viewing a profile is read-only. Nobody can touch your cards but you.</p>
    `)}

    ${sec('backs', 'Card backs', `
      <p>In <strong>Shop and Bonuses</strong> you can buy card backs with HEX, from cheap and simple to very expensive and animated. The one you equip shows on every card you flip and next to your name on your profile.</p>
      <p>They're purely cosmetic. They don't change odds or prices. You keep them even if you reset your game.</p>
    `)}

    ${sec('tips', 'Three tips', `
      <div class="howto-tip"><span class="n">1</span><span><strong>Never sell your last copy.</strong> Duplicates are income; singles are the whole game. The Market page stacks your copies and flags anything you only have one of. Trust it over a quick glance.</span></div>
      <div class="howto-tip"><span class="n">2</span><span><strong>Spin every hour you're around.</strong> It's free, it out-earns everything else, and it trains Prayer.</span></div>
      <div class="howto-tip"><span class="n">3</span><span><strong>Sell when the market is high, not when you need HEX.</strong> Those are rarely the same moment. Sell high and sit on the HEX. Agility agrees.</span></div>
    `)}

    <div class="howto-end">
      <p>${DEX_TOTAL} cards. ${BADGES.length} badges you can lose. Six skills that don't agree with each other. One market that doesn't care about you.</p>
      <p>Good luck.</p>
    </div>
    <div class="howto-sign"><span>[dungeon]</span></div>
    ${backToTopBtn()}
  </div>`;
}

function renderDex(){
  if(dexTab === 'page') return renderBinderPage();
  const owned = state.dex;
  // Shiny indication is ownership-based, derived from instances - not from the
  // dex entry. Liquidate the shiny and the dex forgets it. Lifetime credit for
  // having pulled it lives in player_stats.shiny_pulls_count instead.
  const shinyIds = new Set((state.instances || []).filter(i => i.shiny).map(i => i.id));
  const shadowIds = new Set((state.instances || []).filter(i => i.shadow).map(i => i.id));
  const holoIds  = new Set((state.instances || []).filter(i => i.holo).map(i => i.id));
  // Fully-filed indicator: every copy you own of this species is placed in
  // a binder somewhere, not just one of several. A per-copy "filed" badge
  // here would misreport a species with one filed and two loose copies as
  // "in your binder", which is what prompted this in the first place.
  const usedUids = usedBinderUids();
  const instancesBySpecies = {};
  (state.instances || []).forEach(i => { (instancesBySpecies[i.id] = instancesBySpecies[i.id] || []).push(i); });
  const fullyFiledIds = new Set(
    Object.keys(instancesBySpecies)
      .map(Number)
      .filter(id => instancesBySpecies[id].every(i => usedUids.has(i.uid)))
  );
  // Dex tile badges show only the most valuable copy's own flags, not "owns
  // a shiny somewhere AND a holo somewhere" - those can be two different
  // copies. Shiny (10x) always outvalues plain holo (3x), so a species with
  // a plain shiny and a separate plain holo shows only the shiny star; a
  // single copy that's genuinely both still shows both. Shadow (20x) beats
  // shiny holo (30x) only when it's a shadow holo (60x).
  const bestFlagsById = {};
  Object.keys(instancesBySpecies).forEach(idStr => {
    const id = Number(idStr);
    const p = POKEMON.find(x => x.id === id);
    if(!p) return;
    const best = instancesBySpecies[id].reduce((a, b) =>
      effectiveCardValue(p.value, b.shiny, b.holo, b.shadow) > effectiveCardValue(p.value, a.shiny, a.holo, a.shadow) ? b : a
    );
    bestFlagsById[id] = { shiny: !!best.shiny, holo: !!best.holo, shadow: !!best.shadow };
  });
  const genDef = GENS.find(g => g.n === dexGen) || GENS[0];
  const genRange = [genDef.lo, genDef.hi];
  const genList = POKEMON.filter(p => p.id >= genRange[0] && p.id <= genRange[1]);
  const genOwned = genList.filter(p => owned[p.id]).length;

  // A search looks across every generation and ignores the tab - typing a Gen 1
  // name while sitting on the Gen 5 tab returning nothing would read as broken.
  const q = dexSearch.trim().toLowerCase();
  let list = q ? POKEMON.slice() : genList;
  if(q) list = list.filter(p => p.name.toLowerCase().includes(q) || String(p.id) === q || String(p.id).padStart(3,'0') === q);
  if(dexTypeFilter) list = list.filter(p => p.type === dexTypeFilter);
  if(dexShinyOnly)  list = list.filter(p => shinyIds.has(p.id));
  if(dexShadowOnly) list = list.filter(p => shadowIds.has(p.id));
  if(dexHoloOnly)   list = list.filter(p => holoIds.has(p.id));
  if(dexHideEmpty)  list = list.filter(p => owned[p.id]);
  const shownOwned = list.filter(p => owned[p.id]).length;
  const tabBtn = (g, label) => `<button data-dexgen="${g}" style="font-family:'JetBrains Mono',monospace; font-size:10.5px; padding:4px 10px; border-radius:6px; cursor:pointer; border:1px solid ${dexGen===g?'var(--foil1)':'var(--line)'}; background:${dexGen===g?'rgba(57,255,20,0.12)':'transparent'}; color:${dexGen===g?'var(--foil1)':'var(--muted)'};">${label}</button>`;

  return `
  <div class="dexhead">
    <div class="dexhead-left">
      <h2 class="disp">Collection</h2>
      <div class="dexcount mono">${Object.keys(owned).length}/${DEX_TOTAL} Cards</div>
    </div>
    <div class="rarity-key">
      <div class="key-item"><span class="key-dot" style="--dot-color:var(--common)"></span>Common</div>
      <div class="key-item"><span class="key-dot" style="--dot-color:var(--uncommon)"></span>Uncommon</div>
      <div class="key-item"><span class="key-dot" style="--dot-color:var(--rare)"></span>Rare</div>
      <div class="key-item"><span class="key-dot" style="--dot-color:var(--ultra)"></span>Ultra</div>
      <div class="key-item"><span class="key-dot" style="--dot-color:var(--secret)"></span>Secret</div>
    </div>
  </div>

  <button class="shelfentry ${shelfOpen && authUser?'open':''}" data-shelf-toggle aria-expanded="${!!(shelfOpen && authUser)}">
    <div class="shelfentry-label">Binder Shelf</div>
    <div class="shelfentry-sub">${(state.binders||[]).length} / ${BINDER_MAX_COUNT}
      <svg class="shelf-chev" viewBox="0 0 12 12" aria-hidden="true"><polyline points="4,2 8,6 4,10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </button>
  ${shelfOpen && authUser ? renderBinderShelf() : ''}

  <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
    ${GENS.map(g => tabBtn(g.n, g.label)).join('')}
    <span class="mono" style="font-size:10px;color:var(--muted);">${genOwned}/${genList.length}</span>
  </div>

  <form id="dexSearchForm" style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
    <input type="text" id="dexSearchInput" value="${esc(dexSearch)}" placeholder="Search all gens: name or #" autocomplete="off"
      style="flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;" />
    <button type="submit" class="sbtn keep" style="padding:7px 12px;font-size:11px;">Find</button>
  </form>

  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
    <button data-dexfilter="empty" class="dexfbtn ${dexHideEmpty?'on':''}">${dexHideEmpty?'&#10003; ':''}Hide Empty</button>
    <button data-dexfilter="shiny" class="dexfbtn ${dexShinyOnly?'on':''}">${dexShinyOnly?'&#10003; ':''}Shiny Only</button>
    <button data-dexfilter="shadow" class="dexfbtn ${dexShadowOnly?'on':''}">${dexShadowOnly?'&#10003; ':''}Shadow Only</button>
    <button data-dexfilter="holo" class="dexfbtn ${dexHoloOnly?'on':''}">${dexHoloOnly?'&#10003; ':''}Holo Only</button>
    <select id="dexTypeSelect" class="dexfsel">
      <option value="">All Types</option>
      ${Object.keys(TYPE_COLORS).map(t => `<option value="${t}" ${dexTypeFilter===t?'selected':''}>${titleType(t)}</option>`).join('')}
    </select>
  </div>

  ${dexFiltersActive() ? `<div class="dexfbar">
    <span class="mono" style="font-size:11px;">
      Filtered${q?` &middot; "${esc(dexSearch)}" across all gens`:''}${dexTypeFilter?` &middot; ${titleType(dexTypeFilter)}`:''}${dexShinyOnly?' &middot; shiny only':''}${dexShadowOnly?' &middot; shadow only':''}${dexHoloOnly?' &middot; holo only':''}${dexHideEmpty?' &middot; owned only':''}
      &mdash; showing ${list.length} slot${list.length===1?'':'s'} (${shownOwned} owned)
    </span>
    <button data-dexfilter="clear" class="sbtn sell" style="padding:5px 10px;font-size:11px;">Clear Filters</button>
  </div>` : ''}

  ${list.length === 0 ? `<div class="mono" style="color:var(--muted);font-size:12px;padding:24px 2px;">Nothing matches those filters.</div>` : ''}

  <div class="dexgrid" style="margin-bottom:24px;">
    ${list.map(p=>{
      const o = owned[p.id];
      const color = TYPE_COLORS[p.type];
      const bf = bestFlagsById[p.id];
      return `<div class="dexslot ${o?'owned':''} ${o && bf && bf.shiny ? 'shiny-card' : ''} ${o && bf && bf.shadow ? 'shadow-card' : ''}" ${o?`data-species="${p.id}"`:''} style="--slot-color:${o?RARITY[o.rarity]?.color||color:''};${o && bf && bf.shiny ? `--shiny-hue:${shinyHue(p.id)}deg;` : ''}">
        <span class="num mono">#${String(p.id).padStart(3,'0')}</span>
        ${o && bf ? variantOverlays(bf) : ''}
        ${o && bf ? cardBadge(bf, 'owned') : ''}
        ${o && fullyFiledIds.has(p.id) ? `<img class="filed-badge dexslot-filed-badge" src="${FILED_BADGE_ICON}" alt="" title="${o.count > 1 ? 'All copies filed in a binder' : 'Filed in a binder'}">` : ''}
        <div class="glyph art">
          ${o?`<img src="${p.sprite}" alt="${esc(p.name)}" loading="lazy" style="${spriteFitStyle(p.id)}">`:``}
        </div>
        ${o?`<div class="nm">${esc(p.name)}</div><span class="cnt">x${o.count}</span>`:`<div class="nm" style="color:var(--muted)">???</div>`}
      </div>`;
    }).join('')}
  </div>

  ${backToTopBtn()}
  ${renderDexAddSheet()}
  ${renderBinderSheet()}
  `;
}

function spineFace(color){
  return `linear-gradient(180deg, ${color}, color-mix(in srgb, ${color} 65%, black 35%))`;
}

// The "File which X?" picker's rows. Loose copies (not filed, not a favorite)
// that look the same are interchangeable, so they collapse into one row per
// variant; tapping it files the newest copy, which has the smallest held
// bonus, and leaves the older, higher-paying copies free to liquidate. A copy
// that's filed or a favorite is a specific card the player cares about, so it
// keeps a row of its own - that's how a filed card stays reachable to move or
// favorite.
function dexAddChoices(speciesId){
  const used = usedBinderUids();
  const favs = new Set(state.favoriteUids || []);
  const groups = new Map();
  const singles = [];
  for(const inst of instancesFor(speciesId)){
    if(used.has(inst.uid) || favs.has(inst.uid)){ singles.push(inst); continue; }
    const key = `${inst.rarity}|${inst.holo?1:0}|${inst.shiny?1:0}|${inst.shadow?1:0}`;
    const g = groups.get(key);
    if(!g){ groups.set(key, { inst, count:1 }); continue; }
    g.count++;
    // no acquiredAt reads as "held 0 hours" in payouts, so treat it as newest here too
    if((inst.acquiredAt || Infinity) > (g.inst.acquiredAt || Infinity)) g.inst = inst;
  }
  // plain first, then holo, shiny, shiny holo, shadow, shadow holo
  const rank = inst => (inst.shadow ? 4 : inst.shiny ? 2 : 0) + (inst.holo ? 1 : 0);
  return { groups: [...groups.values()].sort((a,b)=>rank(a.inst)-rank(b.inst)), singles, used };
}
// The uid to go straight to the binder list with, or null when the player
// has a real choice to make.
function dexAddSoleUid(speciesId){
  const { groups, singles } = dexAddChoices(speciesId);
  if(groups.length + singles.length !== 1) return null;
  return groups.length ? groups[0].inst.uid : singles[0].uid;
}
function variantLabel(inst){
  return `${inst.shiny?'&#9733; Shiny ':''}${inst.shadow?'&#9790; Shadow ':''}${inst.holo?'&#10070; Holo ':''}${(RARITY[inst.rarity]||RARITY.common).label}`;
}

function renderDexAddSheet(){
  if(!dexAddOpen) return '';
  const p = POKEMON.find(x=>x.id===dexAddSpeciesId);
  if(!p) return '';
  const avail = instancesFor(dexAddSpeciesId);

  if(!avail.length){
    return `<div class="overlay" data-dexaddclose-backdrop>
      <div class="summary-panel" style="max-width:380px;">
        <div style="font-family:var(--font-display);font-weight:800;font-size:15px;text-transform:uppercase;text-align:center;">${esc(p.name)}</div>
        <div style="font-size:12.5px;text-align:center;color:var(--muted);line-height:1.5;">You don't own a copy of ${esc(p.name)} right now.</div>
        <div class="summary-actions"><button class="sbtn keep" data-dexadd-close>Close</button></div>
      </div>
    </div>`;
  }

  if(!dexAddUid){
    const { groups, singles, used } = dexAddChoices(dexAddSpeciesId);
    const thumb = inst => `<span class="chooserow-thumb">
                ${spriteFit(p, 32, inst.shadow ? 'shadow-sprite' : '', inst.shiny ? `filter:hue-rotate(${shinyHue(p.id)}deg) saturate(1.4);` : '')}
                ${used.has(inst.uid) ? `<img class="filed-badge chooserow-filed-badge" src="${FILED_BADGE_ICON}" alt="" title="Already filed in a binder">` : ''}
              </span>`;
    return `<div class="overlay" data-dexaddclose-backdrop>
      <div class="summary-panel chooser-panel" style="max-width:380px;align-items:stretch;">
        <div style="font-family:var(--font-display);font-weight:800;font-size:15px;text-transform:uppercase;text-align:center;">File which ${esc(p.name)}?</div>
        <div class="chooser-list">
          ${groups.map(g=>`
            <button class="chooserow" data-dexadd-pick="${g.inst.uid}">
              ${thumb(g.inst)}
              <span class="chooserow-text">${variantLabel(g.inst)}</span>
              <span class="mono chooserow-count">&times;${g.count}</span>
            </button>
          `).join('')}
          ${singles.length ? `<div class="chooser-head">Filed &amp; favorites</div>` : ''}
          ${singles.map(inst=>{
            const loc = findFiledSlot(inst.uid);
            const favSlot = (state.favoriteUids || []).indexOf(inst.uid) + 1;
            const sub = [loc ? `In ${esc(loc.binder.name)}` : '', favSlot ? `Favorite &middot; Slot ${favSlot}` : ''].filter(Boolean).join(' &middot; ');
            return `<button class="chooserow" data-dexadd-pick="${inst.uid}">
              ${thumb(inst)}
              <span class="chooserow-text">
                <div class="chooserow-name">${variantLabel(inst)}</div>
                <div class="mono chooserow-sub">${sub}</div>
              </span>
            </button>`;
          }).join('')}
        </div>
        <div class="summary-actions"><button class="sbtn sell" data-dexadd-close>Cancel</button></div>
      </div>
    </div>`;
  }

  const uid = dexAddUid;
  const binders = state.binders || [];
  const favSlot = (state.favoriteUids || []).indexOf(uid) + 1; // 0 = not favorited
  const isFav = favSlot > 0;
  const slotsFull = (state.favoriteUids || []).length >= FAVORITE_SLOTS;
  const filedLoc = findFiledSlot(uid);
  return `<div class="overlay" data-dexaddclose-backdrop>
    <div class="summary-panel chooser-panel" style="max-width:380px;align-items:stretch;">
      <div style="font-family:var(--font-display);font-weight:800;font-size:15px;text-transform:uppercase;text-align:center;">File ${esc(p.name)} in&hellip;</div>
      <button class="fav-toggle ${isFav ? 'on' : ''}" data-fav-toggle="${uid}" title="${isFav ? `Remove from favorite slot ${favSlot}` : (slotsFull ? 'All 3 slots full - pick one to replace' : 'Set as a favorite')}">
        <span class="fav-star">${isFav ? '★' : '☆'}</span>
        <span>${isFav ? `Favorite &middot; Slot ${favSlot}` : 'Favorite Card'}</span>
      </button>
      ${favSlotPicker(uid)}
      ${filedLoc ? `<div style="font-size:11px;text-align:center;color:var(--muted);">Currently in <strong style="color:var(--text);">${esc(filedLoc.binder.name)}</strong> &mdash; picking a binder below moves it there.</div>` : ''}
      ${binders.length === 0 ? `
        <div style="font-size:12.5px;text-align:center;color:var(--muted);line-height:1.5;">You don't have a binder yet.</div>
        <div class="summary-actions"><button class="sbtn keep" data-dexadd-goto-shelf>Create a Binder</button></div>
      ` : `
        <div class="chooser-list">
          ${binders.map(b=>{
            const filled = countFilled(b);
            const isFull = filled >= BINDER_MAX_CARDS;
            return `<button class="chooserow" ${isFull?'disabled':''} data-dexadd-binder="${b.id}" data-dexadd-uid="${uid}">
              <span class="chooserow-dot" style="background:${b.color};"></span>
              <span class="chooserow-text">
                <div class="chooserow-name">${esc(b.name)}</div>
                <div class="mono chooserow-sub">${isFull?'Full &middot; ':''}${filled} / ${BINDER_MAX_CARDS}</div>
              </span>
            </button>`;
          }).join('')}
        </div>
      `}
      <div class="summary-actions"><button class="sbtn sell" data-dexadd-close>Cancel</button></div>
    </div>
  </div>`;
}

// Cancel / backdrop on the binder chooser. Opened from the Market detail
// modal, it goes back to that modal; opened from the Dex, it just closes.
function closeDexAdd(){
  const backToUid = dexAddFromMarket;
  dexAddOpen = false;
  dexAddSpeciesId = null;
  dexAddUid = null;
  dexAddFromMarket = null;
  if(backToUid){
    view = 'market';
    activeModal = { type: 'detail', uid: backToUid };
  }
  render();
}

function addCardToBinder(binderId, uid){
  const binder = binderById(binderId);
  if(!binder) return;
  let pages = binder.pages.map(p=>p.slice());
  let pageIdx = pages.findIndex(p=>p.some(c=>!slotIsFilled(c)));
  if(pageIdx === -1){
    if(pages.length >= BINDER_MAX_PAGES) return;
    pages = pages.concat([new Array(9).fill(null)]);
    pageIdx = pages.length - 1;
    state.binders = state.binders.map(b => b.id===binderId ? Object.assign({}, b, { pages }) : b);
    saveBinders();
  }
  dexAddOpen = false;
  dexAddSpeciesId = null;
  dexAddUid = null;
  dexAddFromMarket = null; // filing lands on the binder page, not back in the Market
  openBinderId = binderId;
  binderPage = pageIdx;
  // Land on the page with room and let the player tap exactly which pocket
  // it goes in, rather than guessing the first empty slot for them.
  carrying = { source:'dex', uid };
  dexTab = 'page';
  render();
}

function renderBinderShelf(){
  const binders = state.binders || [];
  const spinesHtml = [];
  for(let i=0;i<BINDER_MAX_COUNT;i++){
    const b = binders[i];
    spinesHtml.push(b
      ? `<div class="spine" style="background:${spineFace(b.color)};color:${b.textColor||'#07090a'};" data-openbinder="${b.id}">
           <div class="spine-texture"></div>
           <div class="spine-shine"></div>
           <div class="spine-name">${esc(b.name)}</div>
         </div>`
      : `<div class="spine spine-empty" data-createbinder>
           <div class="spine-plus">+</div>
         </div>`
    );
  }
  return `
  <div class="shelfwrap">
    <div class="shelfstage">
      <div class="shelf-lighting"></div>
      <div class="shelfcase">
        <div class="shelfrow">
          <div class="bookend bookend-left"></div>
          ${spinesHtml.join('')}
          <div class="bookend bookend-right"></div>
        </div>
        <div class="shelfledge"></div>
      </div>
    </div>
    <div class="shelfhint">Tap an empty slot to add a binder &middot; up to ${BINDER_MAX_COUNT}</div>
  </div>
  `;
}

function renderBinderSheet(){
  if(!binderSheetOpen) return '';
  const editing = editingBinderId ? (state.binders||[]).find(b=>b.id===editingBinderId) : null;

  if(deleteBinderConfirm && editing){
    return `
    <div class="overlay" data-binderdeleteclose-backdrop>
      <div class="summary-panel" style="max-width:420px;">
        <div style="font-family:var(--font-display);font-weight:800;font-size:16px;color:#ff4444;text-transform:uppercase;">Delete ${esc(editing.name)}?</div>
        <div style="font-size:12.5px;text-align:center;line-height:1.5;color:var(--muted);">Its cards go back to your Dex &mdash; nothing is lost. This can't be undone.</div>
        <div class="summary-actions">
          <button class="sbtn sell" data-binder-delete-cancel>Cancel</button>
          <button class="sbtn keep" style="background:#ff4444;box-shadow:0 0 10px rgba(255,68,68,0.4);" data-binder-delete-confirm>Delete Binder</button>
        </div>
      </div>
    </div>`;
  }

  // Rows of 7 - the whole picker reads as one hexagon of hexagons.
  const rows = [];
  for(let i=0;i<BINDER_SWATCHES.length;i+=7) rows.push(BINDER_SWATCHES.slice(i,i+7));
  const swatchesHtml = rows.map(row => `
    <div class="hexrow">
      ${row.map(sw => `<div class="swatch ${binderDraft.color===sw.hex?'sel':''}" style="background:${sw.hex};" data-binder-color="${sw.hex}"></div>`).join('')}
    </div>
  `).join('');

  return `
  <div class="overlay">
    <div class="summary-panel" style="max-width:420px;align-items:stretch;">
      <div style="font-family:var(--font-display);font-weight:800;font-size:16px;text-transform:uppercase;text-align:center;">${editing ? 'Edit Binder' : 'New Binder'}</div>
      <div>
        <div class="mono" style="font-size:10.5px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;">Name</div>

    </div>
  </div>`;
}

function binderById(id){ return (state.binders||[]).find(b=>b.id===id); }

// A raw non-null slot value isn't the same thing as an occupied pocket - a
// liquidated instance leaves its uid sitting in the pages array with nothing
// left for it to resolve to. Every read of the raw pages array that decides
// "is this slot taken" (not just "what do I render here") has to go through
// this, or a dead uid counts as a card that no longer exists anywhere.
function slotIsFilled(uid){ return !!(uid && instanceCard(uid)); }

function countFilled(binder){
  return (binder.pages||[]).reduce((n,p)=>n + p.filter(slotIsFilled).length, 0);
}

// Binder slots store a bare instance uid, never a duplicated card snapshot -
// so a liquidated instance simply stops resolving here and its pocket renders
// empty on its own, with no separate reconciliation pass needed for display.
function instanceCard(uid){
  const inst = (state.instances||[]).find(x=>x.uid===uid);
  if(!inst) return null;
  const p = POKEMON.find(x=>x.id===inst.id);
  if(!p) return null;
  return { uid, id:p.id, name:p.name, type:p.type, sprite:p.sprite, value:p.value, shiny:!!inst.shiny, holo:!!inst.holo, shadow:!!inst.shadow, rarity:inst.rarity||p.rarity };
}

// A physical card only sits in one pocket at a time, but a filed copy is
// still offered as a choice in the dex - usedBinderUids() flags it (for the
// "already filed" badge), findFiledSlot() locates exactly where, so picking
// it again moves it instead of silently duplicating it.
function usedBinderUids(){
  const used = new Set();
  (state.binders||[]).forEach(b=>(b.pages||[]).forEach(page=>page.forEach(uid=>{ if(uid) used.add(uid); })));
  return used;
}
function findFiledSlot(uid){
  for(const b of (state.binders||[])){
    const pages = b.pages || [];
    for(let pi=0; pi<pages.length; pi++){
      const si = pages[pi].indexOf(uid);
      if(si !== -1) return { binder:b, pageIdx:pi, slotIdx:si };
    }
  }
  return null;
}
function instancesFor(speciesId){
  return (state.instances||[]).filter(i=>i.id===speciesId);
}

function renderPocketCard(card){
  const rc = RARITY[card.rarity] || RARITY.common;
  return `
    <span class="num mono">#${String(card.id).padStart(3,'0')}</span>
    ${variantOverlays(card)}
    ${cardBadge(card)}
    <div class="glyph art"><img src="${card.sprite}" alt="${esc(card.name)}" loading="lazy" style="${spriteFitStyle(card.id)}"></div>

}

// ---------- Binder Page View: pocket reorder + inspect gestures ----------
//
// render() rebuilds #app's entire innerHTML from scratch on every call - it
// destroys and recreates every DOM node under it. If a re-render happened
// while a touch was still down on a node it just destroyed, the browser
// fires touchcancel for that touch and the gesture dies mid-air (this is
// exactly the "pops up above my finger" bug from the design prototype).
//
// So render() is NEVER called from a handler that can fire while a
// touch/mouse button is still held: the press-hold pickup timer, and the
// inspect-card tilt-on-move, both mutate the DOM directly instead (a
// classList toggle or a style.transform assignment on the exact node
// already under the finger - never a node swap). render() only runs from
// touchend/mouseup/click handlers, i.e. once that gesture has already
// concluded and there is no pending touch state left for the browser to
// lose.

// After a real touch, mobile browsers replay it as a synthetic mouse event
// (~300ms later) for compatibility - one physical tap otherwise fires this
// logic twice, and the ghost firing is what undid a swap right after it
// landed. preventDefault() on the real touch stops the replay outright; the
// timestamp guard catches any that still get through.
function isGhostMouse(e){
  if(!e) return false;
  if(e.type && e.type.indexOf('touch')===0){
    lastTouchAt = Date.now();
    if(e.cancelable) e.preventDefault();
    return false;
  }
  return !!(lastTouchAt && (Date.now()-lastTouchAt) < 800);
}

function pocketPressStart(pageIdx, slotIdx, uid, el, e){
  if(isGhostMouse(e)) return;
  if(carrying || !uid) return;
  pressFired = false;
  pressTimer = setTimeout(()=>{
    pressFired = true;
    carrying = { source:'reorder', fromPage:pageIdx, fromSlot:slotIdx, uid };
    el.classList.add('mid-lift'); // direct DOM tweak only - no render() here
  }, PRESS_HOLD_MS);
}

function pocketPressEnd(pageIdx, slotIdx, uid, e){
  if(isGhostMouse(e)) return;
  if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
  const justPickedUp = pressFired;
  pressFired = false;
  if(carrying){
    // The release at the tail end of the hold that just picked this card up -
    // safe to render() now, since this touch has fully ended.
    if(justPickedUp){ render(); return; }
    if(carrying.source==='dex' && uid) return; // filing never overwrites an occupied pocket
    dropCard(pageIdx, slotIdx);
    return;
  }
  if(!justPickedUp && uid){ openInspectFor(uid); }
}

function pocketPressCancel(){
  if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
  pressFired = false;
}

function dropCard(targetPage, targetSlot){
  if(!carrying) return;
  const binder = binderById(openBinderId);
  if(!binder){ carrying = null; return; }
  const pages = binder.pages.map(p=>p.slice());
  const targetUid = pages[targetPage][targetSlot];
  // A dex-sourced carry can be a copy that's already filed somewhere (the dex
  // chooser now offers those too) - clear its old pocket in the same update,
  // or the card ends up sitting in two pockets at once.
  let prevLoc = null;
  if(carrying.source==='dex'){
    if(slotIsFilled(targetUid)){ carrying = null; return; } // filing never overwrites an occupied pocket
    prevLoc = findFiledSlot(carrying.uid);
    if(prevLoc && prevLoc.binder.id===openBinderId) pages[prevLoc.pageIdx][prevLoc.slotIdx] = null;
    pages[targetPage][targetSlot] = carrying.uid;
  } else {
    pages[targetPage][targetSlot] = carrying.uid;
    pages[carrying.fromPage][carrying.fromSlot] = targetUid;
  }
  state.binders = state.binders.map(b => {
    if(b.id===openBinderId) return Object.assign({}, b, { pages });
    if(prevLoc && b.id===prevLoc.binder.id){
      const p2 = b.pages.map(p=>p.slice());
      p2[prevLoc.pageIdx][prevLoc.slotIdx] = null;
      return Object.assign({}, b, { pages: p2 });
    }
    return b;
  });
  carrying = null;
  saveBinders();
  render();
}

function openInspectFor(uid){
  inspectUid = uid;
  inspectShowBack = false;
  render();
}
function closeInspect(){
  inspectUid = null;
  inspectShowBack = false;
  render();
}

// Reachable from the carry bar during a reorder pickup (press-hold a filed
// pocket) - carrying.source is only 'reorder' when the picked-up card was
// already filed, so a removed card just stops being filed. It's still
// owned, still in the dex, and can be re-filed from there any time.
function removeFromBinder(){
  if(!carrying || carrying.source!=='reorder' || !openBinderId) return;
  const binder = binderById(openBinderId);
  if(!binder) return;
  const pages = binder.pages.map(p=>p.slice());
  pages[carrying.fromPage][carrying.fromSlot] = null;
  state.binders = state.binders.map(b => b.id===openBinderId ? Object.assign({}, b, { pages }) : b);
  saveBinders();
  carrying = null;
  toast('Removed from binder.');
  render();
}

// Holding the enlarged card and moving a finger/cursor over it tilts it in
// 3D. Applied directly to the card's own style.transform on every move -
// never through render(), which would rebuild the very node being dragged.
// Max tilt either way, at the card's edge (or beyond it - position clamps).
const INSPECT_TILT_MAX_DEG = 18;
// A press that moves less than this is a tap (flip); more is a tilt.
const INSPECT_TAP_SLOP_PX = 6;
let inspectShowBack = false; // inspect view is showing the cardback
let inspectStartX = 0, inspectStartY = 0, inspectMoved = false;
// A mouse drag released off the card lands its click on the backdrop,
// which would close the view. Set on release, cleared once that click
// has had its chance to fire.
let inspectSuppressClick = false;
function inspectPressStart(e){
  const p = (e.touches && e.touches[0]) || e;
  inspectPressed = true;
  inspectStartX = p.clientX; inspectStartY = p.clientY;
  inspectMoved = false;
}
// Toggles the class directly rather than re-rendering, so the flip gets the
// card's own .6s transition; inspectShowBack keeps any later render in sync.
function toggleInspectFlip(){
  inspectShowBack = !inspectShowBack;
  const slot = document.querySelector('[data-inspectcard] .card-slot');
  if(slot) slot.classList.toggle('flipped', !inspectShowBack);
}
function inspectPressEnd(){
  const wasTap = inspectPressed && !inspectMoved;
  inspectPressed = false;
  const el = document.querySelector('[data-inspectcard]');
  if(el) el.style.transform = '';
  if(wasTap) toggleInspectFlip();
}
function inspectMove(e){
  if(!inspectPressed) return;
  if(e.cancelable) e.preventDefault();
  const list = (e.touches && e.touches.length) ? e.touches : ((e.changedTouches && e.changedTouches.length) ? e.changedTouches : null);
  const p = list ? list[0] : e;
  if(!p || typeof p.clientX !== 'number') return;
  if(!inspectMoved && Math.hypot(p.clientX - inspectStartX, p.clientY - inspectStartY) > INSPECT_TAP_SLOP_PX) inspectMoved = true;
  // Looked up, not e.currentTarget: mouse moves arrive via window so the
  // tilt keeps tracking off the card, the same way touch already does.
  const el = document.querySelector('[data-inspectcard]');
  if(!el) return;
  const rect = el.getBoundingClientRect();
  let relX = (p.clientX - rect.left) / rect.width;
  let relY = (p.clientY - rect.top) / rect.height;
  relX = Math.max(0, Math.min(1, relX));
  relY = Math.max(0, Math.min(1, relY));
  const ry = (relX - 0.5) * 2 * INSPECT_TILT_MAX_DEG;
  const rx = (0.5 - relY) * 2 * INSPECT_TILT_MAX_DEG;
  el.style.transform = `perspective(700px) rotateX(${rx}deg) rotateY(${ry}deg) scale(1.05)`;
}
// Registered once at load, not in wire() (which runs every render).
// inspectMove bails immediately unless a press is active, so idle cost is nil.
window.addEventListener('mousemove', inspectMove);
window.addEventListener('mouseup', ()=>{
  if(!inspectPressed) return;
  inspectPressEnd();
  inspectSuppressClick = true;
  setTimeout(()=>{ inspectSuppressClick = false; }, 0);
});

// Drag-to-tear. The pack no longer plays a canned animation: --p is tear
// progress 0..1 driven by the gesture, and the CSS masks follow it, so the tear
// can be scrubbed, held, dragged back, or flicked. Crucially nothing here calls
// render() until the tear completes - a re-render mid-drag would rebuild the
// overlay and drop the pointer capture.
const TEAR_GRAINS=[0.04,0.14,0.25,0.36,0.47,0.60,0.74,0.88];
function tearGrain(i,delay){
  const d = delay||0;
  const f = 430 - i*14 + ((i*97)%110);
  noise(0.022*0.633, f, f*0.68, 0.090 - i*0.003, 1.8, d);
  noise(0.013*0.633, 2500+i*210, 2000+i*150, 0.66*(0.008+i*0.0009), 2.4, d);
}
function wireTear(){
  const pack = document.querySelector('[data-rip]');
  const zone = document.querySelector('[data-tearzone]');
  if(!pack || !zone) return;
  let p=0, dragging=false, moved=false, startX=0, dir=1, fired=-1, done=false;
  const THRESH=0.55;

  function setP(v){
    p = Math.max(0, Math.min(1, v));
    pack.style.setProperty('--p', p.toFixed(4));
    // A flick crosses several thresholds in one pointermove; firing them all at
    // that instant is a burst, not a tear, so they are spread on the audio clock.
    const crossed=[];
    while(fired+1 < TEAR_GRAINS.length && p >= TEAR_GRAINS[fired+1]){ fired++; crossed.push(fired); }
    if(crossed.length){
      const gap = crossed.length > 4 ? 0.012 : 0.020;
      crossed.forEach((g,k)=>tearGrain(g,k*gap));
    }
    if(p < 0.02) fired = -1;
  }
  function inPack(x,y){
    const r = pack.getBoundingClientRect();
    return x>=r.left && x<=r.right && y>=r.top && y<=r.bottom;
  }
  function open(){
    if(done) return;
    done = true;
    pack.style.setProperty('--dir', dir);
    let n=0; for(let k=fired+1;k<TEAR_GRAINS.length;k++) tearGrain(k,(n++)*0.022);
    pack.classList.add('settling'); setP(1);
    setTimeout(()=>pack.classList.add('gone'), 90);
    setTimeout(()=>{ opening.stage='revealing'; render(); }, 470);
  }
  zone.addEventListener('pointerdown', e=>{
    if(done || opening.stage!=='closed') return;
    dragging=true; moved=false; startX=e.clientX;
    zone.setPointerCapture(e.pointerId);
    pack.classList.remove('settling');
  });
  zone.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx = e.clientX - startX;
    if(Math.abs(dx) > 6){
      moved = true;
      if(p < 0.05){ dir = dx < 0 ? -1 : 1;
        pack.classList.toggle('rtl', dir < 0);
        pack.style.setProperty('--dir', dir); }
    }
    setP(Math.abs(dx) / (pack.getBoundingClientRect().width * 0.85));
  });
  function release(e){
    if(!dragging) return;
    dragging=false;
    if(p >= THRESH) open();
    else if(!moved && e && inPack(e.clientX,e.clientY)) open();
    else { pack.classList.add('settling'); setP(0);
           setTimeout(()=>pack.classList.remove('settling'),300); }
  }
  zone.addEventListener('pointerup', release);
  zone.addEventListener('pointercancel', release);
  // the zone only covers the top of the pack, so a tap lower down needs its own
  // listener or it reaches nothing at all
  pack.addEventListener('click', ()=>{
    if(done || dragging || p > 0.05 || opening.stage!=='closed') return;
    open();
  });
}

function speakerIcon(off){
  const body = '<path d="M3 9v6h4l5 4V5L7 9H3Z"/>';
  return '<svg viewBox="0 0 24 24" aria-hidden="true">' + body + (off
    ? '<path d="M16 9.5l5 5M21 9.5l-5 5"/>'
    : '<path d="M15.8 8.4a5 5 0 0 1 0 7.2"/><path d="M18.4 5.8a8.6 8.6 0 0 1 0 12.4"/>')
    + '</svg>';
}

function wire(){
  const mailBtn = document.querySelector('[data-mailbox-open]');
  if(mailBtn) mailBtn.onclick = async ()=>{
    mailboxOpen = true;
    mailboxTab = defaultMailboxTab();
    freshMessageIds = new Set();
    if(mailboxTab==='messages') markMessagesRead();
    render();
    // pick up anything sent since the last load or poll, and any change made
    // on another device
    await syncMessages(true);

        recordVaultValue();
        saveState();
        toast(`Liquidated ${p ? p.name : 'card #' + inst.id} for <i class="hex-icon"></i>${fmtHex(data.payout)} HEX!`);
      } finally {
        liquidateBusy = false;
        activeModal = null;
        render();
      }
    };
  }

  document.querySelectorAll('[data-open-dupes-modal]').forEach(btn => {
    btn.onclick = () => {
      activeModal = { type: 'dupes', tier: btn.dataset.openDupesModal };
      render();
    };
  });

  const confirmDupesBtn = document.querySelector('[data-modal-confirm-dupes]');
  if (confirmDupesBtn) {
    confirmDupesBtn.onclick = async () => {
      if(liquidateBusy) return;
      const targetTier = confirmDupesBtn.dataset.modalConfirmDupes;
      liquidateBusy = true;
      try{
        const { data, error } = await sb.rpc('liquidate_duplicates', { p_rarity: targetTier });
        if(error){
          toast("Couldn't liquidate those duplicates - try again.");
          return;
        }
        if (data.count > 0) {
          // the server decides which copy survives, so apply the uids it
          // reports sold rather than reproduce the keeper logic client-side;
          // reload everything only if that change can't be applied cleanly
          activeModal = null;
          if(!applySaleDelta(data)) await loadState();
          recordVaultValue();
          saveState();
          toast(`Liquidated ${data.count} duplicate ${data.count === 1 ? 'card' : 'cards'} for <i class="hex-icon"></i>${fmtHex(data.payout)} HEX!`);
          return;
        }
        toast('No duplicates to liquidate in that tier.');
      } finally {
        liquidateBusy = false;
        activeModal = null;
        render();
      }
    };
  }

  const confirmTierBtn = document.querySelector('[data-modal-confirm-tier]');
  if (confirmTierBtn) {
    confirmTierBtn.onclick = async () => {
      if(liquidateBusy) return;
      const targetTier = confirmTierBtn.dataset.modalConfirmTier;
      const protectHolo = tierProtectHolo;
      liquidateBusy = true;
      try{
        const { data, error } = await sb.rpc('liquidate_tier', { p_rarity: targetTier, p_protect_holo: protectHolo });
        if(error){
          toast("Couldn't liquidate those cards - try again.");
          return;
        }
        if (data.count > 0) {
          // the server now decides what survives - shiny, filed, and
          // optionally holo protection all interact - so apply what it reports
          // sold rather than reproduce the keeper logic client-side, with the
          // same reload fallback as Liquidate Duplicates above
          activeModal = null;
          if(!applySaleDelta(data)) await loadState();
          recordVaultValue();
          saveState();
          toast(`Liquidated ${data.count} ${targetTier} cards for <i class="hex-icon"></i>${fmtHex(data.payout)} HEX!`);
        }
      } finally {
        liquidateBusy = false;
        activeModal = null;
        render();
      }
    };
  }

  wireTear();
  document.querySelectorAll('.reveal-row [data-flip]').forEach((el,i)=>{
    el.onclick = ()=>{
      if(opening.flipped.includes(i)){
        // Already revealed. Once every card is flipped we are in the
        // keep/sell selection stage, so a tap here toggles this card.
        // Bound to [data-flip] rather than a wrapper element because the
        // card faces sit in a rotateY(180deg) preserve-3d context - this is
        // the element that demonstrably receives the click.
        if(opening.flipped.length === opening.cards.length){
          opening.keep[i] = !opening.keep[i];
          render();
        }
        return;
      }
      opening.flipped.push(i);
      const card = opening.cards[i];
      flipSound();
      revealSound(card.rarity,0.05);
      if(card.shiny || card.shadow) shinySound(0.16);
      if(card.rarity==='ultra'||card.rarity==='secret') burstConfetti();
      render();
    };
  });
  const flipAllBtn = document.querySelector('[data-flipall]');
  if(flipAllBtn) flipAllBtn.onclick = ()=>{
    // reveal every unflipped card at once. plays the sound for the BEST card
    // only rather than stacking five, and fires confetti once if any card in
    // the pack is ultra/secret - the same effects, not five copies of them.
    const order = ['common','uncommon','rare','ultra','secret'];
    let best = -1, burst = false, shiny = false; const flips = [];
    opening.cards.forEach((card,i)=>{
      if(opening.flipped.includes(i)) return;
      flips.push(i);
      if(card.shiny || card.shadow) shiny = true;
      opening.flipped.push(i);
      const r = order.indexOf(card.rarity);
      if(r > best) best = r;
      if(card.rarity==='ultra'||card.rarity==='secret') burst = true;
    });
    // A dealt run: same plop per card, evenly spaced and slightly detuned by
    // position so five in a row sound like five cards rather than one sound
    // repeated. The rarity chime still lands once, after the last card.
    flips.forEach((n,k)=>flipSound(k*0.105, 1 + ((k%3)-1)*0.045));
    const after = (flips.length-1)*0.105 + 0.14;
    if(best >= 0) revealSound(order[best], after);
    // one fanfare for the whole pack, however many shinies are in it
    if(shiny) shinySound(after + 0.12);
    if(burst) burstConfetti();
    render();
  };

  document.querySelectorAll('[data-keep]').forEach(el=>{
    el.onchange = ()=>{ opening.keep[+el.dataset.keep] = el.checked; render(); };
  });
  const sellAll = document.querySelector('[data-sellall]');
  if(sellAll) sellAll.onclick = ()=>{
    opening.keep = opening.keep.map(()=>false);
    finalizeOpening();
  };
  const confirm = document.querySelector('[data-confirm]');
  if(confirm) confirm.onclick = ()=>{ finalizeOpening(); };
  const close = document.querySelector('[data-close]');
  if(close) close.onclick = async ()=>{
    if(opening.stage==='closed'){
      const openingId = opening.openingId;
      opening = null; render(); // close immediately, don't make the player wait on the network
      try{
        const { data, error } = await sb.rpc('cancel_pack_opening', { p_opening_id: openingId });
        if(!error){
          state.hex += data.refund;
          saveState();
          render();
        }
      }catch(e){ console.error('cancel_pack_opening failed', e); }
    } else {
      // ripped but not yet finalized: closing here should behave the same
      // as hitting "Confirm & continue" (keep everything), not forfeit the
      // cards and the pack price the player already paid
      opening.keep = opening.cards.map(()=>true);
      finalizeOpening();
    }
  };
  const reset = document.querySelector('[data-reset]');
  if(reset) reset.onclick = ()=>{
    if(!requireAuth()) return;
    resetConfirmOpen = true;
    render();
  };

  const resetCancel = document.querySelector('[data-reset-cancel]');
  if(resetCancel) resetCancel.onclick = ()=>{
    resetConfirmOpen = false;
    render();
  };

  const resetConfirm = document.querySelector('[data-reset-confirm]');
  if(resetConfirm) resetConfirm.onclick = async ()=>{
    if(resetBusy) return;
    resetBusy = true;
    render();
    try{
      const { error } = await sb.rpc('reset_game_state');
      if(error){
        toast("Couldn't reset progress - try again.");
        return;
      }
      // intentionally NOT clearing lastSpinAt: the server's wheel cooldown
      // survives a reset by design (otherwise reset -> respin -> reset would
      // be a way to farm the wheel with nothing at stake), so the button
      // needs to keep showing the real remaining cooldown, not "Ready"
      const preservedLastSpinAt = state.lastSpinAt;
      // reset wipes instances, so any favorite_uid still stored server-side can
      // no longer resolve. cleared locally rather than via the RPC - see notes.
      // equipped_back is a permanent purchase and is NOT cleared by reset_game_state,
      // so carry it across rather than falling back to the pack theme until refresh.
      // Binders are organizational, not economy state, so a "burn everything" reset
      // keeps each binder - name, colour, page count - but reset_game_state empties
      // every slot server-side, since every card they pointed at is gone. Mirror that
      // here: the next saveBinders() writes this whole array back, and stale uids
      // would put the ghosts straight back into player_binders.
      const emptiedBinders = (state.binders || []).map(b => b.pages
        ? Object.assign({}, b, { pages: b.pages.map(pg => pg.map(() => null)) })
        : b);
      state = { hex:2500, dex:{}, instances:[], collectibles:{}, lastSpinAt:preservedLastSpinAt, valueHistory:[], longHistory:[], favoriteUids:[], equippedBack: state.equippedBack || null, equipped: state.equipped || {}, binders: emptiedBinders };
      // reset_game_state already emptied both chart histories server-side;
      // drop any pre-reset points still waiting for the save timer
      clearTimeout(saveTimer);
      saveTimer = null;
      markVaultHistorySynced();
      resetConfirmOpen = false;
    } finally {
      resetBusy = false;
      render();
    }
  };

  document.querySelectorAll('[data-dexgen]').forEach(btn=>{
    btn.onclick = () => { dexGen = Number(btn.dataset.dexgen); render(); };
  });

  const dexSearchForm = document.getElementById('dexSearchForm');
  if(dexSearchForm){
    dexSearchForm.onsubmit = (e)=>{
      e.preventDefault();
      const input = document.getElementById('dexSearchInput');
      dexSearch = input ? input.value : '';
      render();
    };
  }

  const dexTypeSelect = document.getElementById('dexTypeSelect');
  if(dexTypeSelect){
    dexTypeSelect.onchange = ()=>{ dexTypeFilter = dexTypeSelect.value; render(); };
  }

  document.querySelectorAll('[data-dexfilter]').forEach(btn=>{
    btn.onclick = ()=>{
      const f = btn.dataset.dexfilter;
      if(f === 'empty') dexHideEmpty = !dexHideEmpty;
      else if(f === 'shiny') dexShinyOnly = !dexShinyOnly;
      else if(f === 'shadow') dexShadowOnly = !dexShadowOnly;
      else if(f === 'holo') dexHoloOnly = !dexHoloOnly;
      else if(f === 'clear') resetDexFilters();
      render();
    };
  });

  // Collapsed tiers and species stacks render a [data-lazy] placeholder
  // instead of their contents (see renderMarket). Opening one records it and
  // fills in just that section (fillMarketTier / fillMarketStack). Only a placeholder triggers that, so a
  // details that is already built - or one the render itself created open -
  // never re-renders on toggle.
  document.querySelectorAll('details[data-tier]').forEach(d => {
    d.ontoggle = () => {
      if(d.open) expandedTiers.add(d.dataset.tier);
      else expandedTiers.delete(d.dataset.tier);
      const lazy = d.open && d.querySelector(':scope > [data-lazy]');
      if(lazy) fillMarketTier(d, lazy);
    };
  });

  document.querySelectorAll('details[data-species]').forEach(d => {
    d.ontoggle = () => {
      if(d.open) expandedSpecies.add(d.dataset.species);
      else expandedSpecies.delete(d.dataset.species);
      const lazy = d.open && d.querySelector(':scope > [data-lazy]');
      if(lazy) fillMarketStack(d, lazy);
    };
  });

  const marketSearchForm = document.getElementById('marketSearchForm');
  if(marketSearchForm){
    marketSearchForm.onsubmit = (e)=>{
      e.preventDefault();
      const input = document.getElementById('marketSearchInput');
      marketSearch = input ? input.value : '';
      marketScrollPending = true;   // one-shot: cleared once we've scrolled
      render();
    };
  }
  const searchClear = document.querySelector('[data-searchclear]');
  if(searchClear) searchClear.onclick = ()=>{
    marketSearch = ''; marketHits = []; marketScrollPending = false; render();
  };
  if(marketScrollPending){
    marketScrollPending = false;
    const firstHit = document.querySelector('.packcard.search-hit');
    // scroll after paint, otherwise the <details> we just opened has not
    // laid out yet and the target lands in the wrong place
    if(firstHit) requestAnimationFrame(()=>
      firstHit.scrollIntoView({behavior:'smooth', block:'center'}));
  }

  document.querySelectorAll('[data-vaultmode]').forEach(btn=>{
    btn.onclick = ()=>{
      vaultChartMode = btn.dataset.vaultmode;
      render();
    };
  });

  const wheelCollect = document.querySelector('[data-wheelcollect]');
  if(wheelCollect) wheelCollect.onclick = ()=>{
    wheelResult = null; render();
  };

  const wheelSpinBtn = document.getElementById('wheelSpinBtn');
  if(wheelSpinBtn) wheelSpinBtn.onclick = async ()=>{
    if(!requireAuth()) return;
    if(wheelSpinning || !canSpin()) return;
    const strip = document.getElementById('termStrip');
    if(!strip) return;
    wheelSpinning = true;
    wheelSpinBtn.disabled = true;
    wheelSpinBtn.textContent = 'Spinning…';

    const { data, error } = await sb.rpc('spin_wheel');
    if(error){
      wheelSpinning = false;
      wheelSpinBtn.disabled = !canSpin();
      wheelSpinBtn.textContent = canSpin() ? 'Spin the wheel' : 'Wait (' + spinStatusText() + ')';
      toast(error.message.includes('cooldown') ? "The wheel's still on cooldown." : "Couldn't spin - try again.");
      return;
    }
    // server has already picked (and paid out) the reward; find the matching
    // strip entry purely to know where to animate the visual to
    let reward = WHEEL_REWARDS.find(r=>r.amt===data.amount);
    let idx = WHEEL_REWARDS.indexOf(reward);
    // Catalog-drift guard. WHEEL_REWARDS mirrors the wheel_rewards table with
    // no automatic sync, so a deploy window (or a stale cached build) can hand
    // us an amount this strip doesn't contain. Without this, idx is -1: the
    // strip lands a slot short and the result panel silently disappears, while
    // the server's HEX is still credited. Animate to the nearest slot instead
    // and report the amount the server actually paid.
    if (idx < 0) {
      idx = WHEEL_REWARDS.reduce((best, r, i) =>
        Math.abs(r.amt - data.amount) < Math.abs(WHEEL_REWARDS[best].amt - data.amount) ? i : best, 0);
      reward = { amt: data.amount };
    }

    const itemHeight = 46;
    const itemsPerSet = WHEEL_REWARDS.length;
    const targetRepetition = 8;
    const targetOffset = (targetRepetition * itemsPerSet + idx) * itemHeight;
    const finalTranslateY = targetOffset - (140 / 2) + (itemHeight / 2);

    strip.style.transition = 'transform 4.2s cubic-bezier(0.1, 0.7, 0.1, 1)';
    requestAnimationFrame(()=>{ strip.style.transform = `translateY(-${finalTranslateY}px)`; });
    revealSound('rare');

    setTimeout(()=>{
      wheelSpinning = false;
      wheelResult = reward;
      state.hex += data.amount; // authoritative payout from the server, not a local recompute
      state.lastSpinAt = Date.now();
      recordVaultValue();
      saveState();
      strip.style.transition = 'none';
      if(reward.amt>=25000) burstConfetti();
      render();
    }, 4300);
  };
}

setInterval(()=>{
  const btn = document.getElementById('wheelSpinBtn');
  if(btn && !wheelSpinning && view==='shop'){
    btn.disabled = !canSpin();
    btn.textContent = canSpin() ? 'Spin the wheel' : 'Wait (' + spinStatusText() + ')';
  }
  if(view === 'market'){
    if(state.instances && state.instances.length > 0){
      recordVaultValue();
    }
    updateVaultFeedLive();
  }
}, 1000);

// a local check every 15 s; a poll goes out only once MAIL_POLL_MS has passed
// since the last fetch of any kind, so a tab-return poll or opening the
// mailbox pushes the next timed poll back instead of doubling up
setInterval(()=>{ if(Date.now() - lastMailFetchAt >= MAIL_POLL_MS) pollMailbox(); }, 15000);
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && Date.now() - lastMailFetchAt >= MAIL_RETURN_MIN_MS) pollMailbox();
});
// the chart history waits up to VAULT_SAVE_MS between saves; send it before the tab can be closed
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && saveTimer) doSave(); });

// guest view of the Packs page shown immediately; onAuthStateChange loads the
// real saved state if a session is restored. A dead email link opens the
// sign-in card instead, so its error message is actually seen.
if(authLinkError) renderAuth(); else render();
})();
</script>
</body>
</html>
