// Preview for Liquidate Duplicates. Mirrors the server's liquidate_duplicates
// exactly: shinies are always kept, filed-in-a-binder copies are always kept
// (and still count toward whether the species "has" a shiny/holo even though
// they're excluded from the sellable pool), and a holo - anywhere in the
// species, filed or not - always outranks a plain copy as the one kept
// representative; only when no shiny and no holo exist anywhere in the group
// does the classic "keep cheapest, sell the rest" rule apply. Estimate only -
// the server recalculates each payout at execution time, so slippage applies.
function dupePreview(tier, now){
  const usedUids = usedBinderUids();
  const groups = {};
  (state.instances || []).forEach(inst => {
    if (inst.rarity !== tier) return;
    (groups[inst.id] = groups[inst.id] || []).push(inst);
  });

  let count = 0, est = 0, shinyKept = 0, holoKept = 0, filedKept = 0;
  Object.values(groups).forEach(g => {
    const hasShiny = g.some(x => x.shiny);
    if (hasShiny) shinyKept += g.filter(x => x.shiny).length;
    const hasHolo = g.some(x => x.holo);
    const hasFiled = g.some(x => usedUids.has(x.uid));
    filedKept += g.filter(x => !x.shiny && usedUids.has(x.uid)).length;

    // candidates: anything that could actually be sold - not shiny, not filed
    const candidates = g.filter(x => !x.shiny && !usedUids.has(x.uid)).map(inst => {
      const p = POKEMON.find(x => x.id === inst.id);
      const hoursHeld = Math.max(0, (now - (inst.acquiredAt || now)) / (1000 * 60 * 60));
      return { inst, hoursHeld,
        // effValue is local to renderMarket(), so the same rule is inlined here
        payout: Math.max(1, Math.round((effectiveCardValue(p.value, inst.shiny, inst.holo)) * cardMultiplier(hoursHeld, now))) };
    });
    // same tiebreak chain as the RPC: payout asc, hours asc, uid asc
    candidates.sort((a, b) => a.payout - b.payout || a.hoursHeld - b.hoursHeld
                       || (a.inst.uid < b.inst.uid ? -1 : 1));

    let doomed;
    if (hasHolo) {
      const holoCandidates = candidates.filter(d => d.inst.holo);
      if (holoCandidates.length > 0) {
        // cheapest floating holo becomes the keeper, everything else sells
        holoKept++;
        const keptUid = holoCandidates[0].inst.uid;
        doomed = candidates.filter(d => d.inst.uid !== keptUid);
      } else {
        // the species' only holo is filed or shiny - already protected,
        // nothing floating needs to be spared on its behalf
        doomed = candidates;
      }
    } else {
      // a filed copy already represents the species, same as a shiny does
      doomed = (hasShiny || hasFiled) ? candidates : candidates.slice(1);
    }

    doomed.forEach(d => { est += d.payout; count++; });
  });
  return { count, est, shinyKept, holoKept, filedKept };
}

// Preview for Liquidate Tier. Mirrors the server's liquidate_tier: shinies
// and filed-in-a-binder copies are always kept; holos are additionally kept
// only when protectHolo is true (this function's tier has no per-species
// grouping, so it's a blanket skip, not a "keep one" rule like duplicates).
function tierPreview(tier, now, protectHolo){
  const usedUids = usedBinderUids();
  let count = 0, est = 0, shinyKept = 0, holoKept = 0, filedKept = 0;
  (state.instances || []).forEach(inst => {
    if (inst.rarity !== tier) return;
    if (inst.shiny) { shinyKept++; return; }
    if (usedUids.has(inst.uid)) { filedKept++; return; }
    if (protectHolo && inst.holo) { holoKept++; return; }
    const p = POKEMON.find(x => x.id === inst.id);
    if (!p) return;
    const hoursHeld = Math.max(0, (now - (inst.acquiredAt || now)) / (1000 * 60 * 60));
    // was p.value alone here, silently dropping the holo 3x multiplier from
    // the estimate even before this feature - now matches effective_card_value
    // the RPC actually uses
    est += Math.max(1, Math.round(effectiveCardValue(p.value, inst.shiny, inst.holo) * cardMultiplier(hoursHeld, now)));
    count++;
  });
  return { count, est, shinyKept, holoKept, filedKept };
}

  const instances = state.instances || [];

  const usedUids = usedBinderUids();

  const tierOrder = ['secret', 'ultra', 'rare', 'uncommon', 'common'];
  const tierLabels = {
    secret: 'Secret Rare',
    ultra: 'Ultra Rare',
    rare: 'Rare',
    uncommon: 'Uncommon',
    common: 'Common'
  };

  const groupedByTier = {};
  tierOrder.forEach(t => groupedByTier[t] = []);

  const effValue = (p, inst) => effectiveCardValue(p.value, inst.shiny, inst.holo);

  // Resolve the submitted query to a set of instance uids. Matches on dex
  // number (exact) or name (substring, case-insensitive). A player can hold
  // several copies of the same species, so this is a set, not one card.
  const q = marketSearch.trim().toLowerCase();
  marketHits = [];
  if(q){
    instances.forEach(inst => {
      const p = POKEMON.find(x => x.id === inst.id);
      if(!p) return;
      const byNum = /^\d+$/.test(q) && p.id === parseInt(q, 10);
      const byName = p.name.toLowerCase().includes(q);
      if(byNum || byName) marketHits.push(inst.uid);
    });
  }
  const hitSet = new Set(marketHits);
  const tiersWithHits = new Set(
    instances.filter(i => hitSet.has(i.uid)).map(i => i.rarity)
  );

  instances.forEach((inst) => {
    const p = POKEMON.find(x => x.id === inst.id);
    if(!p) return;
    if(groupedByTier[inst.rarity]) {
      groupedByTier[inst.rarity].push({ p, inst });
    }
  });

  tierOrder.forEach(t => {
    groupedByTier[t].sort((a, b) => {
      const getPayout = (item) => {
        const acquired = item.inst.acquiredAt || now;
        const hoursHeld = Math.max(0, (now - acquired) / (1000 * 60 * 60));
        const multiplier = cardMultiplier(hoursHeld, now);
        return Math.max(1, Math.round(effValue(item.p, item.inst) * multiplier));
      };
      return getPayout(b) - getPayout(a);
    });
  });

  return `

        <button type="submit" class="sbtn keep" style="padding:7px 12px;font-size:11px;">Find</button>
        ${marketSearch ? `<button type="button" class="sbtn sell" data-searchclear style="padding:7px 12px;font-size:11px;">Clear</button>` : ''}
      </form>
      ${marketSearch ? `<div class="mono" style="font-size:11px;color:${marketHits.length ? 'var(--foil1)' : '#ff4444'};margin:-6px 0 12px 2px;">
        ${marketHits.length ? `${marketHits.length} match${marketHits.length===1?'':'es'} for "${esc(marketSearch)}"` : `Nothing in your vault matches "${esc(marketSearch)}"`}
      </div>` : ''}
    `}

    ${instances.length === 0 ? `
      <div style="text-align:center;color:var(--muted);padding:40px;font-size:13px;">Your vault is empty. Break open some packs to acquire tradeable assets.</div>
    ` : `
      ${tierOrder.map(tier => {
        const items = groupedByTier[tier];
        if(!items || items.length === 0) return '';
        const rc = RARITY[tier];

        let tierTotalPayout = 0;
        items.forEach(({ p, inst }) => {
          const acquired = inst.acquiredAt || now;
          const hoursHeld = Math.max(0, (now - acquired) / (1000 * 60 * 60));
          const multiplier = cardMultiplier(hoursHeld, now);
          tierTotalPayout += Math.max(1, Math.round(effValue(p, inst) * multiplier));
        });
        const dupePrev = dupePreview(tier, now);

        return `
          <details data-tier="${tier}" ${(tiersWithHits.has(tier) || expandedTiers.has(tier)) ? 'open' : ''} style="margin-bottom:16px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 16px;">
            <summary style="font-family:var(--font-display);font-weight:800; font-size:15px; color:${rc.color}; cursor:pointer; text-transform:uppercase; letter-spacing:0.04em; outline:none; display:flex; justify-content:space-between; align-items:center;">
              <span>${tierLabels[tier]} (${items.length})</span>

            <div style="padding-top:12px;">

                <div style="display:flex; gap:8px; align-items:center;">
                  ${dupePrev.count > 0 ? `
                  <button class="buybtn" style="background:#a855f7; color:#fff; padding:8px 16px; font-size:12px; box-shadow:0 0 8px rgba(168,85,247,0.4);" data-open-dupes-modal="${tier}">
                    Liquidate Duplicates (<span id="btn-dupes-${tier}">~${fmtHex(dupePrev.est)}</span>)
                  </button>` : ''}
                  <button class="buybtn" style="background:#ff4444; color:#fff; padding:8px 16px; font-size:12px; box-shadow:0 0 8px rgba(255,68,68,0.4);" data-open-tier-modal="${tier}">

                  </button>
                </div>
              </div>

              ${(() => {
                // Group this tier's instances by species so the list length is
                // bounded by distinct species rather than by copies held. The
                // instance tiles below are unchanged - they just live one level
                // deeper now, behind a per-species <details>.
                const species = {};
                items.forEach(({ p, inst }) => {

                                <div class="detail-card-display">${renderCardFace({
                                  id: p.id, name: p.name, rarity: inst.rarity, value: p.value,
                                  shiny: inst.shiny, holo: inst.holo, type: p.type, sprite: p.sprite
                                }, true, usedUids.has(inst.uid))}</div>
                                <div style="font-size:8.5px;color:var(--muted);text-align:center;">
                                  Acquired: ${dateStr}
                                </div>
                                <div style="font-size:9px;color:var(--muted);text-align:center;">

                                </div>
                                <div style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--gold);">
                                  <span id="price-inst-${inst.uid}"><i class="hex-icon"></i>~${fmtHex(payout)}</span>
                                </div>
                                <button class="buybtn" style="width:100%;padding:6px;font-size:11px;" data-open-single-modal="${inst.uid}">

    <div style="margin-top:28px;border-top:1px solid var(--line);padding-top:20px;">

// Card backs shelf. Every tile draws the real back at full card size, so the
// tile IS the preview - there is no separate preview path that could drift
// from what the reveal actually renders.
function renderCardBackShelf(){
  if(!authUser){
    return `<div style="color:var(--muted);font-size:12px;padding:10px 2px 18px;">Sign in to browse card backs.</div>`;
  }
  if(cardBackShelf === null){
    return `<div style="color:var(--muted);font-size:12px;padding:10px 2px 18px;">Loading card backs…</div>`;
  }
  // server rows the client has no art for are skipped, so a DB seed can land
  // before the CSS ships without rendering a blank tile.
  const rows = cardBackShelf.filter(r => cardBackById(r.id));
  if(rows.length === 0){
    return `<div style="color:var(--muted);font-size:12px;padding:10px 2px 18px;">No card backs available yet.</div>`;
  }

  return `
  <div style="color:var(--muted);font-size:11.5px;margin:10px 0 12px;font-style:italic;">Card backs survive resets. They replace the pack's back on every card you flip, and sit beside your name on your profile.</div>
  <div class="cbshelf">
    ${rows.map(r=>{
      const meta      = cardBackById(r.id);
      const isEquip   = state.equippedBack === r.id;
      const busy      = cardBackBusy === r.id;
      const tooPoor   = state.hex < r.price;
      const cls       = `cbtile ${r.owned?'owned':'locked'} ${isEquip?'equipped':''}`;
      let btn;
      if(!r.owned){
        btn = `<button class="cb-btn buy" data-buyback="${esc(r.id)}" ${(busy||tooPoor)?'disabled':''}>${busy?'…':(tooPoor?'Locked':'Purchase')}</button>`;
      } else if(isEquip){
        btn = `<button class="cb-btn equip on" data-equipback="" ${busy?'disabled':''}>${busy?'…':'Equipped'}</button>`;
      } else {
        btn = `<button class="cb-btn equip" data-equipback="${esc(r.id)}" ${busy?'disabled':''}>${busy?'…':'Equip'}</button>`;
      }
      return `
      <div class="${cls}">
        <div class="cb-swatch card-face card-back back-${esc(r.id)}">${meta.wordmark===false?'':`<span>POKéHEX</span>`}</div>
        <div class="cb-price">${r.owned ? 'Owned' : `<i class="hex-icon" style="width:10px;height:12px;"></i>${fmtHex(r.price)}`}</div>
        ${btn}
      </div>`;
    }).join('')}
  </div>`;
}

// uid whose slot picker is open in the detail modal, or null. set when the
// server answers status:'full' so the player can choose what to displace.
let favPickerFor = null;

function favSlotPicker(uid){
  if(favPickerFor !== uid) return '';
  const slots = state.favoriteUids || [];
  const cells = [];
  for(let i = 0; i < FAVORITE_SLOTS; i++){
    const held = slots[i];
    const inst = held ? (state.instances || []).find(x => x.uid === held) : null;
    const p = inst ? POKEMON.find(x => x.id === inst.id) : null;
    // an occupied slot whose card was sold still occupies the slot - say so
    // rather than showing it as free, or the count won't add up for the player
    const art = p
      ? `<img src="${p.sprite}" alt="" loading="lazy" style="width:52px;height:52px;image-rendering:pixelated;${inst.shiny ? `filter:hue-rotate(${shinyHue(p.id)}deg) saturate(1.4);` : ''}">`
      : `<div style="width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(255,255,255,0.45);">${held ? '?' : '+'}</div>`;
    const label = p
      ? `#${String(p.id).padStart(3,'0')} ${esc(p.name)}${inst.shiny ? ' ★' : ''}${inst.holo ? ' ❖' : ''}`
      : (held ? 'Sold card' : 'Empty');
    cells.push(`
      <button class="buybtn" style="flex:1;min-width:0;padding:6px 4px;font-size:10px;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:2px;"
              data-fav-slot="${uid}" data-fav-slot-n="${i + 1}">
        <span style="font-size:9px;opacity:0.75;">SLOT ${i + 1}</span>
        ${art}
        <span style="font-size:9.5px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;">${label}</span>
      </button>`);
  }
  return `
    <div style="margin:8px 0 4px;">
      <div style="font-size:11px;color:var(--muted);text-align:center;margin-bottom:6px;">
        All ${FAVORITE_SLOTS} favorite slots are full. Which one should this card replace?
      </div>
      <div style="display:flex;gap:6px;">${cells.join('')}</div>
      <button class="buybtn" style="width:100%;margin-top:6px;padding:5px;font-size:10px;"
              data-fav-slot-cancel="1">Cancel</button>
    </div>`;
}

// slot: null lets the server append or report 'full'; 1..3 overwrites that slot.
async function setFavoriteSlot(uid, slot){
  const prev = (state.favoriteUids || []).slice();
  try{
    const { data, error } = await sb.rpc('set_favorite_slot',
      { p_uid: uid, p_slot: slot ?? null });
    if(error) throw error;

    if(data && data.status === 'full'){
      // not an error - the server is asking which slot to displace. it sends
      // the authoritative slots with this response, so adopt them before the
      // picker renders or it can list occupants that are already stale.
      if(Array.isArray(data.slots)) state.favoriteUids = data.slots;
      favPickerFor = uid;
      render();
      return;
    }
    if(data && data.status === 'error'){
      toast(data.message === 'card not held'
        ? 'That card is no longer in your vault.'
        : 'Could not update your favorites - try again.');
      return;
    }

    // server is the source of truth for slot order, so take what it returns
    // rather than reconstructing it here and risking a divergent local copy
    state.favoriteUids = Array.isArray(data && data.slots) ? data.slots : prev;
    favPickerFor = null;
    render();
    toast(data.status === 'removed' ? 'Removed from favorites.'
        : data.status === 'cleared' ? 'Favorite slot cleared.'
        : 'Favorite set.');
  }catch(e){
    console.error('set_favorite_slot failed:', e && e.message, e);
    state.favoriteUids = prev;
    favPickerFor = null;
    render();
    toast('Could not update your favorites - try again.');
  }
}

async function loadProfileStats(retrying){
  profileLoading = true;
  render();
  try{
    const [{ data: statsData, error: statsErr }, { data: profileData, error: profileErr }, { data: skillsData, error: skillsErr }] = await Promise.all([
      sb.rpc('get_player_stats'),
      sb.from('profiles').select('username, is_public').eq('user_id', authUser.id).maybeSingle(),
      // skills are the newest and least-proven RPC on this page, so this call
      // is wrapped to RESOLVE on failure rather than reject. a rejection here
      // would fail the whole Promise.all and blank the entire stats page over
      // the one section that can degrade on its own.
      sb.rpc('get_player_skills', { p_user_id: authUser.id }).then(r => r, e => ({ data: null, error: e }))
    ]);
    if(statsErr) throw statsErr;
    if(profileErr) throw profileErr;
    profileStats = statsData;
    profileUsername = profileData ? profileData.username : null;
    profileIsPublic = profileData ? profileData.is_public : true;
    // deliberately NOT thrown: the skills section renders its own failure state
    if(skillsErr){
      console.error('get_player_skills failed:', skillsErr && skillsErr.message, skillsErr);
      profileSkills = null;
    } else {
      // returns table(...) so postgrest hands back an array; always one row
      profileSkills = (Array.isArray(skillsData) ? skillsData[0] : skillsData) || null;
    }
  }catch(e){
    console.error('failed to load profile stats:', e && e.message, e);
    if(!retrying){
      // transient failures (e.g. a freshly-created RPC not yet visible to
      // the API layer) are common right after schema changes - one silent
      // retry means the player never has to know it happened
      profileLoading = false;
      return loadProfileStats(true);
    }
    toast('Could not load your stats - try again.');
  } finally {
    profileLoading = false;
    render();
  }
}

// Hexagon skill map. Six skills, six axes - the shape is a hexagon by
// construction. Radius is sqrt(level/99), NOT level/99: at a linear scale a
// mid-game player renders as a small blob in the middle and the lean, which is
// the whole point of the chart, is unreadable. sqrt lifts the middle while
// preserving order exactly, and the rings are labelled so the curve is visible
// rather than hidden.
function renderSkillMap(sk){
  const N = 6, W = 340, H = 330, R = 108, DEPTH = 13;
  const cx = W/2, cy = H/2 - 4;
  const levels = SKILL_META.map(m => Math.max(1, sk[m.key + '_level'] || 1));
  const pt = (i, f, dy) => {
    const a = -Math.PI/2 + i * 2*Math.PI/N;
    return [cx + Math.cos(a)*R*f, cy + Math.sin(a)*R*f + (dy||0)];
  };
  const poly = (fs, dy) => fs.map((f,i)=>pt(i,f,dy).map(v=>v.toFixed(1)).join(',')).join(' ');
  const fr = levels.map(l => Math.sqrt(l/99));
  const rings = [10,25,50,75,99];
  let s = '';
  // ids are namespaced: a bare id="g" in a 276KB single-file document is a
  // collision waiting to happen, and svg ids are document-global
  s += '<defs>'
     + '<linearGradient id="skmap-face" x1="0" y1="0" x2="0.3" y2="1">'
     +   '<stop offset="0%" stop-color="var(--foil1)" stop-opacity="0.62"/>'
     +   '<stop offset="100%" stop-color="var(--foil2)" stop-opacity="0.62"/></linearGradient>'
     + '<linearGradient id="skmap-wall" x1="0" y1="0" x2="0" y2="1">'
     +   '<stop offset="0%" stop-color="var(--foil2)" stop-opacity="0.85"/>'
     +   '<stop offset="100%" stop-color="var(--foil2)" stop-opacity="0.10"/></linearGradient>'
     + '<filter id="skmap-glow" x="-50%" y="-50%" width="200%" height="200%">'
     +   '<feGaussianBlur stdDeviation="3.5" result="b"/>'
     +   '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'
     + '</defs>';
  rings.forEach(v=>{
    const rf = Math.sqrt(v/99);
    s += `<polygon points="${poly(Array(N).fill(rf))}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  });
  for(let i=0;i<N;i++){
    const [x,y] = pt(i,1);
    s += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
  }
  rings.forEach(v=>{
    const rf = Math.sqrt(v/99);
    s += `<text x="${cx+3}" y="${(cy-R*rf+10).toFixed(1)}" font-family="'JetBrains Mono',monospace" font-size="8" fill="var(--muted)" opacity="0.7">${v}</text>`;
  });
  // side walls painted back-to-front so the solid reads as a plate rather than
  // a shelf; without the sort the near faces are overdrawn by the far ones
  const top = fr.map((f,i)=>pt(i,f)), bot = fr.map((f,i)=>pt(i,f,DEPTH));
  const order = [0,1,2,3,4,5].sort((a,b)=>
    (top[b][1]+top[(b+1)%N][1]) - (top[a][1]+top[(a+1)%N][1]));
  order.forEach(i=>{
    const j=(i+1)%N;
    s += `<polygon points="${top[i][0].toFixed(1)},${top[i][1].toFixed(1)} ${top[j][0].toFixed(1)},${top[j][1].toFixed(1)} ${bot[j][0].toFixed(1)},${bot[j][1].toFixed(1)} ${bot[i][0].toFixed(1)},${bot[i][1].toFixed(1)}" fill="url(#skmap-wall)"/>`;
  });
  s += `<polygon points="${poly(fr)}" fill="url(#skmap-face)" stroke="var(--foil1)" stroke-width="2" filter="url(#skmap-glow)"/>`;
  fr.forEach((f,i)=>{
    const [x,y]=pt(i,f);
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--foil1)"/>`;
  });
  SKILL_META.forEach((m,i)=>{
    const a = -Math.PI/2 + i*2*Math.PI/N;
    const lx = cx + Math.cos(a)*(R+27), ly = cy + Math.sin(a)*(R+27);
    const anch = Math.cos(a) > 0.3 ? 'start' : (Math.cos(a) < -0.3 ? 'end' : 'middle');
    s += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anch}" font-family="'JetBrains Mono',monospace" font-size="10" fill="var(--muted)">${esc(m.label.slice(0,3).toUpperCase())}</text>`;
    s += `<text x="${lx.toFixed(1)}" y="${(ly+13).toFixed(1)}" text-anchor="${anch}" font-family="'JetBrains Mono',monospace" font-size="12" fill="var(--text)">${levels[i]}</text>`;
  });
  return `<div class="skillmap"><svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${s}</svg></div>`;
}

function renderSkillsSection(){
  // the section degrades on its own: loadProfileStats deliberately does not
  // throw on a skills failure, so the rest of the stats page is unaffected
  if(!profileSkills){
    return `<div class="section-label" style="margin-top:20px;">Skills</div>`
         + `<div style="color:var(--muted);padding:12px 0;font-size:13px;">Your skills could not be loaded just now. The rest of your stats are unaffected - try reloading.</div>`;
  }
  const sk = profileSkills;
  const rows = SKILL_META.map(m=>{
    const lv   = sk[m.key + '_level'] || 1;
    const xp   = Number(sk[m.key + '_xp'] || 0);
    const base = Number(sk[m.key + '_level_xp'] || 0);
    const next = sk[m.key + '_next_xp'];
    // next_xp is null at 99 by design - a maxed skill has no next band, and a
    // fabricated ceiling would mean dividing by a made-up number
    const maxed = next === null || next === undefined;
    const into  = xp - base;
    const span  = maxed ? 0 : Number(next) - base;
    const pct   = maxed ? 100 : Math.max(0, Math.min(100, (into / span) * 100));
    const open  = skillInfoFor === m.key;
    return `
      <div class="skill-row">
        <span class="sk-ico"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${m.icon}</svg></span>
        <span class="sk-name">${esc(m.label)}</span>
        <span class="sk-lv">${lv}</span>
        <span class="sk-barwrap"><span class="sk-bar"><i style="margin-left:${pct.toFixed(1)}%;width:${(100 - pct).toFixed(1)}%;"></i></span></span>
        <span class="sk-lv-next">${maxed ? '&#9733;' : lv + 1}</span>
        <span class="sk-xp">${maxed ? 'MAX' : fmtHex(Number(next) - xp) + ' to go'}</span>
        <button class="sk-info ${open ? 'on' : ''}" data-skill-info="${m.key}"
          aria-expanded="${open ? 'true' : 'false'}"
          title="How to train ${esc(m.label)}">i</button>
      </div>
      ${open ? `<div class="skill-note">${m.note}</div>` : ''}`;
  }).join('');
  return `
    <div class="section-label" style="margin-top:20px;">Skills</div>
    <div class="skill-summary">
      <span><span class="lab">TRAINER</span> <span class="val">${sk.trainer_level}</span></span>
      <span><span class="lab">TOTAL LEVEL</span> <span class="val alt">${sk.total_level}</span></span>
      <span><span class="lab">TOTAL XP</span> <span class="val alt">${fmtHex(Number(sk.total_xp))}</span></span>
    </div>
    ${renderSkillMap(sk)}
    ${rows}`;
}

// ---------- Friends & Mailbox ----------
async function loadFriendRequests(){
  try{
    const { data, error } = await sb
      .from('friend_requests')
      .select('id, requester_id, recipient_id, status, created_at, responded_at')
      .or(`requester_id.eq.${authUser.id},recipient_id.eq.${authUser.id}`);
    if(error) throw error;
    state.friendRequests = data || [];

    const otherIds = [...new Set(state.friendRequests.map(r => r.requester_id===authUser.id ? r.recipient_id : r.requester_id))];
    if(otherIds.length){
      const { data: profs, error: profErr } = await sb.from('profiles').select('user_id, username').in('user_id', otherIds);
      if(profErr) throw profErr;
      friendUsernames = {};
      (profs||[]).forEach(p => { friendUsernames[p.user_id] = p.username; });
    } else {
      friendUsernames = {};
    }
  }catch(e){
    console.error('friend request load failed', e);
    state.friendRequests = [];
    friendUsernames = {};
  }
}

function incomingRequests(){ return (state.friendRequests||[]).filter(r=>r.status==='pending' && r.recipient_id===authUser.id); }
function outgoingRequests(){ return (state.friendRequests||[]).filter(r=>r.status==='pending' && r.requester_id===authUser.id); }
function acceptedFriends(){ return (state.friendRequests||[]).filter(r=>r.status==='accepted'); }
function friendUserId(row){ return row.requester_id===authUser.id ? row.recipient_id : row.requester_id; }

// RLS already limits this to the caller's own unexpired rows; the user_id
// filter is there so the (user_id, created_at) index serves the query.
async function loadMessages(){
  try{
    const { data, error } = await sb
      .from('player_messages')
      .select('id, kind, title, body, gift, read_at, claimed_at, expires_at, created_at')
      .eq('user_id', authUser.id)
      .order('created_at', { ascending: false })
      .limit(100);
    if(error) throw error;
    state.messages = data || [];
  }catch(e){
    console.error('message load failed', e);
    state.messages = state.messages || [];
  }
}

// a message needs attention while unread, and a gift stays that way until claimed
function messageNeedsAttention(m){ return !m.read_at || (m.kind==='gift' && !m.claimed_at); }
function mailBadgeCount(){
  return (state.messages||[]).filter(messageNeedsAttention).length + incomingRequests().length;
}
function defaultMailboxTab(){
  if((state.messages||[]).some(messageNeedsAttention)) return 'messages';
  if(incomingRequests().length) return 'friends';
  return 'messages';
}

// Marks exactly the rows on screen, by id - not "all", which would also
// swallow anything that arrived after the last load and was never shown.
function markMessagesRead(){
  const unread = (state.messages||[]).filter(m=>!m.read_at);
  if(!unread.length) return;
  const now = new Date().toISOString();
  unread.forEach(m=>{ m.read_at = now; freshMessageIds.add(m.id); });
  // fire-and-forget: if this fails the rows just come back unread next load
  sb.rpc('mark_messages_read', { p_ids: unread.map(m=>m.id) })
    .then(({ error })=>{ if(error) console.error('mark read failed', error); });
}

// ---------- background mailbox sync ----------
// Nothing pushes to the client, so new messages - and the admin credits,
// refunds and cards their notices announce - are pulled: every 45s while the
// tab is visible, and straight away when the player comes back to it.
const MAIL_POLL_MS = 45000;
const IDLE_BEFORE_SYNC_MS = 10000;
let lastInteractionAt = Date.now();
let stateRefreshPending = false;
let stateRefreshTimer = null;
let mailPollBusy = false;
// capture phase, so a handler that stops propagation still counts as input
['pointerdown','keydown'].forEach(t => document.addEventListener(t, ()=>{ lastInteractionAt = Date.now(); }, true));

// Reload messages; if a new system notice arrived, queue a re-read of the
// balance and collection it refers to (the credit is already server-side).
async function syncMessages(){
  const known = new Set((state.messages||[]).map(m=>m.id));
  await loadMessages();
  const arrived = (state.messages||[]).filter(m=>!known.has(m.id));
  if(arrived.some(m=>m.kind==='system')){ stateRefreshPending = true; tryStateRefresh(); }
  return arrived;
}

// Every economy action mirrors its result into state after its RPC returns
// (cancel adds the refund, liquidate_instance splices by index...), so a
// re-read landing between the server commit and that mirror would get the
// mirror applied twice. Those actions all start with a click, so "no input
// for 10s and no flow open" guards all of them without auditing each one.
function stateRefreshBlocked(){
  return !!(opening || packBusy || finalizeBusy || claimBusy || activeModal
         || carrying || pressTimer
         || (Date.now() - lastInteractionAt) < IDLE_BEFORE_SYNC_MS);
}
async function tryStateRefresh(){
  clearTimeout(stateRefreshTimer);
  if(!stateRefreshPending || !authUser) return;
  if(stateRefreshBlocked()){ stateRefreshTimer = setTimeout(tryStateRefresh, 3000); return; }
  stateRefreshPending = false;
  const { data: fresh, error } = await sb
    .from('game_states_v2')
    .select('hex, dex, instances')
    .eq('user_id', authUser.id)
    .maybeSingle();
  if(error || !fresh){
    console.error('background state refresh failed', error);
    stateRefreshPending = true;
    stateRefreshTimer = setTimeout(tryStateRefresh, 30000);
    return;
  }
  // a click may have started something while the read was in flight - this
  // result could then land under its mirror, so drop it and retry once idle
  if(stateRefreshBlocked()){ stateRefreshPending = true; stateRefreshTimer = setTimeout(tryStateRefresh, 3000); return; }
  state.hex = fresh.hex;
  state.dex = fresh.dex || {};
  state.instances = fresh.instances || [];
  recordVaultValue();
  saveState();
  // the balance is on every view - patch it in place rather than render(),
  // which would rebuild the page under whatever the player is doing. Other
  // views pick up the new cards on their next render (any click).
  const bal = document.querySelector('.balance .val');
  if(bal) bal.innerHTML = `<i class="hex-icon"></i>${fmtHex(state.hex)}`;
}

function updateMailBadge(){
  const btn = document.querySelector('[data-mailbox-open]');
  if(!btn) return;
  const n = mailBadgeCount();
  let badge = btn.querySelector('.mailbadge');
  if(!n){ if(badge) badge.remove(); return; }
  if(!badge){ badge = document.createElement('span'); badge.className = 'mailbadge'; btn.appendChild(badge); }
  badge.textContent = n;
}

async function pollMailbox(){
  if(!authUser || !state.messages || document.hidden || mailPollBusy) return; // state.messages unset = login still loading
  mailPollBusy = true;
  try{
    const arrived = await syncMessages();
    if(!arrived.length || !authUser) return;
    // the Messages tab has no inputs or gestures to break, so a full render is
    // safe there; anywhere else only the badge changes
    if(mailboxOpen && mailboxTab==='messages'){ markMessagesRead(); render(); }
    else updateMailBadge();
  } finally {
    mailPollBusy = false;
  }
}

// An unclaimed gift is never dismissable - the server skips it too
// (dismiss_messages), this just keeps the button from being offered.
function messageDismissable(m){ return !(m.kind==='gift' && !m.claimed_at); }

// Dismissed rows drop out of the read policy, so removing them locally is
// what the next load would return anyway. On failure, reload the truth.
async function dismissMessages(ids){
  if(!ids.length) return;
  const gone = new Set(ids);
  state.messages = (state.messages||[]).filter(m=>!gone.has(m.id));
  render();
  const { error } = await sb.rpc('dismiss_messages', { p_ids: ids });
  if(error){
    console.error('dismiss failed', error);
    toast("Couldn't clear that - try again.");
    await loadMessages();
    render();
  }
}

async function claimGift(id){
  if(claimBusy) return;
  claimBusy = id;
  render();
  try{
    const { data, error } = await sb.rpc('claim_message_gift', { p_message_id: id });
    if(error){
      const m = error.message || '';
      toast(m.includes('already claimed') ? 'Already claimed.'
          : m.includes('expired')         ? 'That gift has expired.'
          : m.includes('restricted')      ? "Your account can't claim gifts right now."
          : "Couldn't claim that gift - try again.");
      await loadMessages(); // the server knows whether it's claimed or gone
      return;
    }
    // the server has credited it - read the changed rows back rather than
    // mirroring the gift locally, same reasoning as finalizeOpening()
    const { data: fresh, error: readErr } = await sb
      .from('game_states_v2')
      .select('hex, dex, instances')
      .eq('user_id', authUser.id)
      .maybeSingle();
    if(readErr || !fresh){
      console.error('post-claim re-read failed', readErr);
      toast('Gift claimed - reload the page to see it.');
    } else {
      state.hex = fresh.hex;
      state.dex = fresh.dex || {};
      state.instances = fresh.instances || [];
      recordVaultValue();
      saveState();
    }
    const msg = (state.messages||[]).find(x=>x.id===id);
    if(msg){ msg.claimed_at = new Date().toISOString(); msg.read_at = msg.read_at || msg.claimed_at; }
    if(fresh) toast(data.hex
      ? `Claimed <i class="hex-icon"></i>${fmtHex(data.hex)} HEX!`
      : `Claimed ${esc(data.name)}${data.shiny ? ' ✨' : ''}${data.holo ? ' ❖' : ''}!`);
  } finally {
    claimBusy = null;
    render();
  }
}

async function sendFriendRequest(username){
  const val = (username||'').trim();
  if(!val){ addFriendMsg = { type:'err', text:'Enter a username.' }; render(); return; }
  friendActionBusy = true; render();
  try{
    const escaped = val.replace(/_/g, '\\_');
    const { data: target, error: lookupErr } = await sb.from('profiles').select('user_id, username').ilike('username', escaped).maybeSingle();
    if(lookupErr) throw lookupErr;
    if(!target){ addFriendMsg = { type:'err', text:'No player with that username.' }; return; }
    if(target.user_id === authUser.id){ addFriendMsg = { type:'err', text:"That's you." }; return; }
    const { error: rpcErr } = await sb.rpc('send_friend_request', { target_user_id: target.user_id });
    if(rpcErr) throw rpcErr;
    addFriendInput = '';
    addFriendMsg = { type:'ok', text: `Friend request sent to ${target.username}.` };
    await loadFriendRequests();
  }catch(e){
    console.error('send friend request failed', e);
    addFriendMsg = { type:'err', text: (e && e.message && e.message.includes('already exists')) ? 'A request or friendship already exists with this user.' : 'Could not send request - try again.' };
  } finally {
    friendActionBusy = false;
    render();
  }
}

async function respondFriendRequest(requestId, accept){
  friendActionBusy = true; render();

    const { error } = await sb.rpc('respond_friend_request', { request_id: requestId, accept });
    if(error) throw error;

  }catch(e){

}

async function removeFriend(otherUserId){

async function toggleProfileVisibility(){
  const next = !profileIsPublic;
  profileIsPublic = next; render(); // optimistic - a simple boolean flip on your own row
  // update, not upsert: this only ever runs against a row that's guaranteed to
  // already exist (post username-gate), and upsert's ON CONFLICT DO UPDATE
  // still validates the candidate INSERT row's NOT NULL constraints - including
  // username, which this payload doesn't carry - before it even checks for a
  // conflict, so it was failing even though a matching row already existed.
  const { error } = await sb.from('profiles').update({ is_public: next }).eq('user_id', authUser.id);
  if(error){
    console.error('visibility toggle failed', error);
    profileIsPublic = !next;
    toast('Could not update visibility - try again.');
    render();
  }
}

async function openPublicProfile(userId){
  viewingProfileId = userId;
  viewingProfileData = null;
  viewingProfileLoading = true;
  viewingBinders = [];
  viewingFiledInstances = [];
  viewingOpenBinderId = null;
  viewingBinderPageIdx = 0;
  render();
  try{
    const [{ data: profileData, error: profileErr }, { data: skillsData, error: skillsErr }, { data: bindersData, error: bindersErr }] = await Promise.all([
      sb.rpc('get_public_profile', { target_user_id: userId }),
      // same "degrade, don't fail the page" treatment as loadProfileStats -
      // a skills or binders hiccup shouldn't blank out the rest of the visit
      sb.rpc('get_player_skills', { p_user_id: userId }).then(r => r, e => ({ data: null, error: e })),
      sb.rpc('get_public_binders', { target_user_id: userId }).then(r => r, e => ({ data: null, error: e }))
    ]);
    if(profileErr) throw profileErr;
    viewingProfileData = {
      ...profileData,
      skills: skillsErr ? null : (Array.isArray(skillsData) ? skillsData[0] : skillsData) || null
    };
    if(bindersErr){
      console.error('failed to load public binders', bindersErr && bindersErr.message, bindersErr);
    } else {
      viewingBinders = (bindersData && Array.isArray(bindersData.binders)) ? bindersData.binders : [];
      viewingFiledInstances = (bindersData && Array.isArray(bindersData.filedInstances)) ? bindersData.filedInstances : [];
    }
  }catch(e){
    console.error('failed to load public profile', e && e.message, e);
    toast(e && e.message === 'profile is private' ? "That player's profile is private." : 'Could not load that profile - try again.');
    viewingProfileId = null;
    viewingProfileData = null;
  } finally {
    viewingProfileLoading = false;
    render();
  }
}

function closePublicProfile(){
  viewingProfileId = null;
  viewingProfileData = null;
  viewingBinders = [];
  viewingFiledInstances = [];
  viewingOpenBinderId = null;
  render();
}

// Resolves a filed uid against the minimal filedInstances subset the RPC
// returned - never the owner's full instances array. A uid that doesn't
// resolve (liquidated since filing) renders as an empty pocket, same
// reconciliation rule as the owner's own binders.
function viewingInstanceCard(uid){
  const inst = viewingFiledInstances.find(x=>x.uid===uid);
  if(!inst) return null;
  const p = POKEMON.find(x=>x.id===inst.id);
  if(!p) return null;
  return { uid, id:p.id, name:p.name, type:p.type, sprite:p.sprite, value:p.value, shiny:!!inst.shiny, holo:!!inst.holo, rarity:inst.rarity||p.rarity };
}
function viewingCountFilled(binder){
  return (binder.pages||[]).reduce((n,p)=>n + p.filter(uid=>uid && viewingInstanceCard(uid)).length, 0);
}

function renderPublicBinderShelf(){
  if(!viewingBinders.length){
    return `<div class="section-label" style="margin-top:20px;">Binders</div><div style="color:var(--muted);font-size:12px;padding:8px 0;">No binders yet.</div>`;
  }
  const spinesHtml = [];
  for(let i=0;i<BINDER_MAX_COUNT;i++){
    const b = viewingBinders[i];
    spinesHtml.push(b
      ? `<div class="spine" style="background:${spineFace(b.color)};color:${b.textColor||'#07090a'};" data-view-binder="${b.id}">
           <div class="spine-texture"></div>
           <div class="spine-shine"></div>
           <div class="spine-name">${esc(b.name)}</div>
         </div>`
      : `<div class="spine spine-empty"></div>`
    );
  }
  return `
  <div class="section-label" style="margin-top:20px;">Binders</div>
  <div class="shelfwrap">
    <div class="shelfstage">
      <div class="shelf-lighting"></div>
      <div class="shelfcase">
        <div class="shelfrow">
          <div class="bookend bookend-left"></div>
          ${spinesHtml.join('')}
          <div class="bookend bookend-right"></div>
        </div>
        <div class="shelfledge"></div>
      </div>
    </div>
  </div>`;
}

function renderPublicBinderPage(){
  const binder = viewingBinders.find(b=>b.id===viewingOpenBinderId);
  if(!binder){ viewingOpenBinderId = null; return renderPublicBinderShelf(); }
  const pages = binder.pages && binder.pages.length ? binder.pages : [new Array(9).fill(null)];
  const pageIdx = Math.min(viewingBinderPageIdx, pages.length-1);
  const pageArr = pages[pageIdx];

  const cellsHtml = pageArr.map(uid=>{
    const card = uid ? viewingInstanceCard(uid) : null;
    if(card){
      return `<div class="pocket">
        <div class="pocket-lip"></div>
        <div class="sleeve">
          <div class="dexslot owned ${card.shiny?'shiny-card':''}" style="--slot-color:${rarityColor(card.rarity)};${card.shiny?`--shiny-hue:${shinyHue(card.id)}deg;`:''}">
            ${renderPocketCard(card)}
          </div>
        </div>
      </div>`;
    }
    return `<div class="pocket pocket-empty"><div class="pocket-note">Empty</div></div>`;
  }).join('');

  const pbg = `color-mix(in srgb, ${binder.color} 20%, var(--bg) 80%)`;

  return `
  <div class="dexhead">
    <div class="dexhead-left">
      <button class="iconbtn" data-viewbinder-close title="Back to Binders">&lsaquo;</button>
      <h2 class="disp">${esc(binder.name)}</h2>
      <div class="dexcount mono">${viewingCountFilled(binder)} / ${9*pages.length}</div>
    </div>
  </div>
  ${binder.desc ? `<div class="mono" style="font-size:11.5px;color:var(--muted);margin:-6px 0 12px;">${esc(binder.desc)}</div>` : ''}

  <div class="sheet3x3" style="--pbg:${pbg};">${cellsHtml}</div>

  <div class="pagenav">
    <button class="pagenavbtn" data-viewbinder-page-prev ${pageIdx===0?'disabled':''}>&lsaquo;</button>
    <div class="pageindicator mono">Page ${pageIdx+1} / ${pages.length}</div>
    <button class="pagenavbtn" data-viewbinder-page-next ${pageIdx===pages.length-1?'disabled':''}>&rsaquo;</button>
  </div>
  `;
}

function renderPublicProfile(){
  if(viewingProfileLoading || !viewingProfileData){
    return `
    <button class="iconbtn" data-viewprofile-close title="Back">&lsaquo;</button>
    <div class="section-label">Profile</div>
    <div style="color:var(--muted);padding:20px 0;">Loading profile…</div>`;
  }
  const d = viewingProfileData;
  const mvp = d.mostValuablePull;
  const mvpPokemon = mvp ? POKEMON.find(p=>p.id===mvp.id) : null;
  const mvpCard = mvpPokemon ? {
    id: mvp.id, name: mvp.name, rarity: mvp.rarity, value: mvp.value,
    shiny: mvp.shiny, holo: mvp.holo, type: mvpPokemon.type, sprite: mvpPokemon.sprite
  } : null;

  const favoriteUids = Array.isArray(d.favoriteUids) ? d.favoriteUids : [];
  const favoriteInstances = Array.isArray(d.favoriteInstances) ? d.favoriteInstances : [];
  const favCards = Array.from({ length: FAVORITE_SLOTS }, (_, i) => {
    const uid = favoriteUids[i];
    const inst = uid ? favoriteInstances.find(x => x.uid === uid) : null;
    const fp = inst ? POKEMON.find(x => x.id === inst.id) : null;
    return fp ? {
      id: fp.id, name: fp.name, rarity: inst.rarity,
      value: fp.value, shiny: inst.shiny, holo: inst.holo, type: fp.type, sprite: fp.sprite
    } : null;
  });

  const dex = d.dex || {};
  const dexIds = Object.keys(dex).map(Number);
  const genRows = GENS.map(g => {
    const total = g.hi - g.lo + 1;
    const owned = dexIds.filter(n => n >= g.lo && n <= g.hi).length;
    const pct   = ((owned / total) * 100).toFixed(1);
    return `<div class="stat-row"><span>% of ${g.label}</span><span class="mono">${pct}% (${owned}/${total})</span></div>`;
  }).join('');
  const dexOwned = dexIds.filter(n => n >= 1 && n <= DEX_TOTAL).length;
  const dexPct   = ((dexOwned / DEX_TOTAL) * 100).toFixed(1);

  const packRows = PACKS.map(p=>{
    const count = (d.packsOpened && d.packsOpened[p.id]) || 0;
    return `<div class="stat-row"><span>${esc(p.name)}</span><span class="mono">${count}</span></div>`;
  }).join('');

  return `
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    <button class="iconbtn" data-viewprofile-close title="Back">&lsaquo;</button>
    ${(() => {

      return `<div class="cb-swatch card-face card-back ${eq ? 'back-' + esc(d.equippedBack) : ''}" style="width:46px;height:64px;border-radius:8px;flex:0 0 auto;">${eq ? '' : '<span>POKéHEX</span>'}</div>`;
    })()}
    <h2 class="disp" style="margin:0;">${esc(d.username || 'Player')}</h2>
  </div>

  ${d.skills ? `<div class="section-label" style="margin-top:20px;">Skills</div>
  <div class="skill-summary">
    <span><span class="lab">TRAINER</span> <span class="val">${d.skills.trainer_level}</span></span>
    <span><span class="lab">TOTAL LEVEL</span> <span class="val alt">${d.skills.total_level}</span></span>
    <span><span class="lab">TOTAL XP</span> <span class="val alt">${fmtHex(Number(d.skills.total_xp))}</span></span>
  </div>
  ${renderSkillMap(d.skills)}` : ''}

  <div class="section-label">Collection</div>
  <div class="stat-row"><span>% of Full Dex</span><span class="mono">${dexPct}% (${dexOwned}/${DEX_TOTAL})</span></div>
  ${genRows}
  <div class="stat-row"><span># of Secret Rares Pulled</span><span class="mono">${d.secretPullsCount}</span></div>
  <div class="stat-row"><span># of Shinies Found</span><span class="mono">${d.shinyPullsCount}</span></div>

  <div class="stats-card-display">
    <div class="stats-card-col">
      <div class="section-label" style="margin:0;">Most Valuable Pull</div>
      ${mvpCard
        ? renderCardFace(mvpCard, true)
        : `<div class="stats-card-empty">No pulls recorded yet.</div>`}
    </div>
  </div>

  <div class="section-label" style="margin-top:20px;">Favorite Cards</div>
  <div class="stats-card-display">
    ${favCards.map((c, i) => `
      <div class="stats-card-col">
        <div class="section-label" style="margin:0;">Slot ${i + 1}</div>
        ${c
          ? renderCardFace(c, true)
          : `<div class="stats-card-empty">No favorite in this slot.</div>`}
      </div>`).join('')}
  </div>

  <div class="section-label" style="margin-top:20px;">Badges <span class="mono" style="color:var(--muted);letter-spacing:0;">${earnedBadgeCount(dex)}/${BADGES.length}</span></div>
  ${renderBadgeGrid(dex)}

  <div class="section-label" style="margin-top:20px;">Packs Opened by Tier</div>
  ${packRows}

  ${viewingOpenBinderId ? renderPublicBinderPage() : renderPublicBinderShelf()}

function renderMailbox(){
  if(!mailboxOpen) return '';
  const incoming = incomingRequests();
  const outgoing = outgoingRequests();
  const friends = acceptedFriends();
  const nameFor = row => esc(friendUsernames[friendUserId(row)] || 'Unknown player');

  const incomingHtml = incoming.length
    ? incoming.map(r => `
      <div class="friend-row">
        <span>${nameFor(r)}</span>

        </span>
      </div>`).join('')

  const outgoingHtml = outgoing.length
    ? outgoing.map(r => `

  const messages = state.messages || [];
  const KIND_LABEL = { announcement:'Announcement', gift:'Gift', system:'Notice', trade:'Trade' };
  const shortDate = iso => new Date(iso).toLocaleDateString(undefined, { month:'short', day:'numeric' });
  const giftLabel = g => {
    if(g.hex) return `<span><i class="hex-icon"></i>${fmtHex(g.hex)} HEX</span>`;
    const p = POKEMON.find(x=>x.id===g.card.id);
    const color = p && RARITY[p.rarity] ? RARITY[p.rarity].color : 'var(--text)';
    return `<span style="color:${color};font-weight:700;">${esc(p ? p.name : 'Card #' + g.card.id)}${g.card.shiny ? ' ✨' : ''}${g.card.holo ? ' ❖' : ''}</span>`;
  };
  const messagesHtml = messages.length
    ? `<div class="msg-list">${messages.map(m => `
      <div class="msg-row ${esc(m.kind)}">
        <div class="msg-head">
          <span class="msg-kind">${KIND_LABEL[m.kind] || esc(m.kind)}</span>
          ${freshMessageIds.has(m.id) ? '<span class="msg-new">New</span>' : ''}
          <span class="msg-when">${shortDate(m.created_at)}${m.expires_at && !m.claimed_at ? ` · expires ${shortDate(m.expires_at)}` : ''}</span>
          ${messageDismissable(m) ? `<button class="msg-x" data-dismiss-msg="${m.id}" title="Dismiss" aria-label="Dismiss message">&times;</button>` : ''}
        </div>
        <div class="msg-title">${esc(m.title)}</div>
        ${m.body ? `<div class="msg-body">${esc(m.body)}</div>` : ''}
        ${m.kind==='gift' && m.gift ? `
        <div class="msg-gift">
          ${giftLabel(m.gift)}
          ${m.claimed_at
            ? '<span class="msg-claimed">Claimed</span>'
            : `<button class="frbtn accept" data-claim-gift="${m.id}" ${claimBusy?'disabled':''}>${claimBusy===m.id ? 'Claiming…' : 'Claim'}</button>`}
        </div>` : ''}
      </div>`).join('')}</div>`
    : `<div style="color:var(--muted);font-size:12px;padding:8px 0;">No messages yet.</div>`;
  const messagesWaiting = messages.filter(messageNeedsAttention).length;
  const clearable = messages.filter(m => m.read_at && messageDismissable(m));
  const messagesTab = (clearable.length
    ? `<div class="msg-toolbar"><button class="frbtn cancel" data-clear-read title="Dismiss every read message - unclaimed gifts stay">Clear read (${clearable.length})</button></div>`
    : '') + messagesHtml;

  return `
  <div class="overlay" data-mailboxclose-backdrop>
    <button class="closex" data-mailbox-close>&times;</button>
    <div class="summary-panel" style="max-width:460px;align-items:stretch;">

        <button class="navbtn ${mailboxTab==='friends'?'active':''}" data-mailbox-tab="friends">Friends${incoming.length?` (${incoming.length})`:''}</button>
      </div>

      ${mailboxTab==='messages' ? messagesTab : `

        <div class="mono" style="font-size:10.5px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;">Add Friend</div>
        <div style="display:flex;gap:8px;">

          <button class="sbtn keep" data-friend-send ${friendActionBusy?'disabled':''}>Send</button>
        </div>
        ${addFriendMsg ? `<div style="font-size:11.5px;margin-top:6px;color:${addFriendMsg.type==='err'?'#ff4444':'#39ff14'};">${esc(addFriendMsg.text)}</div>` : ''}
      </div>

      <div class="section-label" style="margin:0;">Friends (${friends.length})</div>${friendsHtml}
      <div class="section-label" style="margin:14px 0 0;">Incoming</div>${incomingHtml}
      <div class="section-label" style="margin:14px 0 0;">Sent</div>${outgoingHtml}`}
    </div>
  </div>`;
}

function renderProfile(){
  if(!authUser){
    return `<div class="section-label">Profile</div><div style="color:var(--muted);padding:20px 0;">Sign in to view your profile and stats.</div>`;
  }
  if(profileLoading || !profileStats){
    return `<div class="section-label">Profile</div><div style="color:var(--muted);padding:20px 0;">Loading your stats…</div>`;
  }
  const s = profileStats;
  const mvp = s.mostValuablePull;
  const mvpPokemon = mvp ? POKEMON.find(p=>p.id===mvp.id) : null;
  const mvpCard = mvpPokemon ? {
    id: mvp.id, name: mvp.name, rarity: mvp.rarity, value: mvp.value,
    shiny: mvp.shiny, holo: mvp.holo, type: mvpPokemon.type, sprite: mvpPokemon.sprite
  } : null;

  // favorites are not protected from being sold, so a slot's uid may no longer
  // resolve. an unresolvable uid reads as an empty slot rather than an error.
  // fixed length so slot 3 still renders its placeholder when only 1 is set.
  const favCards = Array.from({ length: FAVORITE_SLOTS }, (_, i) => {
    const uid = (state.favoriteUids || [])[i];
    const inst = uid ? (state.instances || []).find(x => x.uid === uid) : null;
    const fp = inst ? POKEMON.find(x => x.id === inst.id) : null;
    return fp ? {
      id: fp.id, name: fp.name, rarity: inst.rarity,
      value: fp.value, shiny: inst.shiny, holo: inst.holo, type: fp.type, sprite: fp.sprite, uid
    } : null;
  });
  const usedUids = usedBinderUids();

  const packRows = PACKS.map(p=>{
    const count = (s.packsOpened && s.packsOpened[p.id]) || 0;
    return `<div class="stat-row"><span>${esc(p.name)}</span><span class="mono">${count}</span></div>`;
  }).join('');

  const profitLossColor = s.totalProfitLoss >= 0 ? '#39ff14' : '#ff4444';

  // Split client-side from state.dex rather than from s.collectionPercent.
  // get_player_stats divides ALL dex keys by 151, so with gens 2-5 seeded
  // server-side that value far exceeds 100%. state.dex is the same
  // authoritative data, so splitting here avoids depending on the RPC.
  // Rows come from GENS, so a new generation needs no edit here.
  const dexIds = Object.keys(state.dex || {}).map(Number);
  const genRows = GENS.map(g => {
    const total = g.hi - g.lo + 1;
    const owned = dexIds.filter(n => n >= g.lo && n <= g.hi).length;
    const pct   = ((owned / total) * 100).toFixed(1);
    return `<div class="stat-row"><span>% of ${g.label}</span><span class="mono">${pct}% (${owned}/${total})</span></div>`;
  }).join('');
  const dexOwned = dexIds.filter(n => n >= 1 && n <= DEX_TOTAL).length;
  const dexPct   = ((dexOwned / DEX_TOTAL) * 100).toFixed(1);

  return `
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    ${(() => {
      const eq = state.equippedBack && cardBackById(state.equippedBack);
      // no purchase yet -> plain striped back, same fallback pack-opening
      // uses. Rendering it (instead of nothing) is the nudge to buy one.
      return `<div class="cb-swatch card-face card-back ${eq ? 'back-' + esc(state.equippedBack) : ''}" style="width:46px;height:64px;border-radius:8px;flex:0 0 auto;">${eq ? '' : '<span>POKéHEX</span>'}</div>`;
    })()}
    <h2 class="disp" style="margin:0;">${esc(profileUsername || 'Profile')}</h2>
    <button class="visibility-pill ${profileIsPublic?'is-public':'is-private'}" style="margin-left:auto;" data-profile-visibility
      title="${profileIsPublic ? 'Anyone can view your profile and stats. Click to make it visible to friends only.' : 'Only friends can view your profile and stats. Click to make it public.'}">
      ${lockIcon(profileIsPublic)}<span>${profileIsPublic ? 'Public' : 'Private'}</span>
    </button>
  </div>

  ${renderSkillsSection()}

  <div class="section-label">Collection</div>
  <div class="stat-row"><span>% of Full Dex</span><span class="mono">${dexPct}% (${dexOwned}/${DEX_TOTAL})</span></div>
  ${genRows}
  <div class="stat-row"><span># of Secret Rares Pulled</span><span class="mono">${s.secretPullsCount}</span></div>
  <div class="stat-row"><span># of Shinies Found</span><span class="mono">${s.shinyPullsCount}</span></div>

  <div class="stats-card-display">
    <div class="stats-card-col">
      <div class="section-label" style="margin:0;">Most Valuable Pull</div>
      ${mvpCard
        ? renderCardFace(mvpCard, true)
        : `<div class="stats-card-empty">No pulls recorded yet.</div>`}
    </div>
  </div>

  <div class="section-label" style="margin-top:20px;">Favorite Cards</div>
  <div class="stats-card-display">
    ${favCards.map((c, i) => `
      <div class="stats-card-col">
        <div class="section-label" style="margin:0;">Slot ${i + 1}</div>
        ${c
          ? renderCardFace(c, true, usedUids.has(c.uid))
          : `<div class="stats-card-empty">Star a card in your vault to fill this slot.</div>`}
      </div>`).join('')}
  </div>

  <div class="section-label" style="margin-top:20px;">Badges <span class="mono" style="color:var(--muted);letter-spacing:0;">${earnedBadgeCount(state.dex || {})}/${BADGES.length}</span></div>
  <div style="color:var(--muted);font-size:11px;margin:-6px 0 10px;">&#9733; Gym Leader &middot; &#9733;&#9733; Elite Four &middot; &#9733;&#9733;&#9733; Champion &mdash; difficulty is set by how rare the missing cards are, not how many.</div>

  <div class="stat-row"><span>HEX Spent on Packs</span><span class="mono"><i class="hex-icon"></i>${fmtHex(s.hexSpentOnPacks)}</span></div>
  <div class="stat-row"><span>HEX Earned from Card Sales</span><span class="mono"><i class="hex-icon"></i>${fmtHex(s.hexEarnedFromCardSales)}</span></div>
  <div class="stat-row"><span>Total HEX Profit/Loss (incl. bonuses)</span><span class="mono" style="color:${profitLossColor};">${s.totalProfitLoss>=0?'+':''}${fmtHex(s.totalProfitLoss)}</span></div>
  `;
}

function renderHowTo(){
  // Counts are derived from POKEMON so this copy can't go stale when the pool grows.
  const ofType = t => POKEMON.filter(p => p.type === t);
  const secretsOf = t => ofType(t).filter(p => p.rarity === 'secret').length;
  const nWater = ofType('water').length;
  const nPsychic = ofType('psychic').length, sPsychic = secretsOf('psychic');
  const nPoison = ofType('poison').length, sPoison = secretsOf('poison');
  const nDragon = ofType('dragon').length, sDragon = secretsOf('dragon');
  return `
  <div class="howto">
    <h2 class="disp" style="font-size:26px;margin:0 0 6px;">How to Play</h2>

<h3>The Goal</h3>
<p>Collect all ${DEX_TOTAL}. That's it. That's the game. Or set your own goals.</p>
<p>You need to be <strong>holding</strong> one of each. Not "pulled it once." Not "had it for a while." Holding it. Right now. This is a binder, not a diary &mdash; sell your only Charizard and #006 goes dark like you never met him.</p>
<p>${GENS.length} generations, one pool, ${GENS.length} tabs. Everyone who finished Kanto and Johto watched their dex sprout a few hundred holes and their badges vanish overnight. That wasn't a bug. You'd got comfortable.</p>
<p>And when the binder's full, fill it again &mdash; shiny. Nobody has. The odds would like it kept that way.</p>

<hr>

<h3><i class="hex-icon"></i> HEX</h3>
<p>HEX is the only currency. HEX buys packs. Packs contain cards. Cards, when you no longer want them, become HEX again.</p>
<p>You were given some to start. It was not enough and it was never going to be.</p>

<hr>

    <h3>The Three Things You Can Do</h3>
    <p><strong>Open packs.</strong> Basic, Diamond, Whale Vault, in ascending order of price and descending order of financial responsibility. Five cards each. Diamond guarantees a Rare or better. Whale guarantees an Ultra or better.</p>
    <p>Drag the top of the pack to tear it. Slowly, if you want to hear it go. Tap it instead and it opens all at once, which is faster and worse.</p>
    <p><strong>Sell cards.</strong> Every card you're holding sits in your Vault. The Vault is not a display case. It's inventory.</p>
    <p><strong>Spin the wheel.</strong> Once an hour. Free.</p>
    <p>Three things. There is no fourth &mdash; and there's no separate place to go and grind, because all three of them are already training you. Every pack, every sale, every spin feeds a skill. You don't choose whether to train. You choose <em>what</em>, by choosing which of the three you do and how you do it.</p>

<hr>

<h3>The Market (Read This One)</h3>
<p>Card prices move. Constantly. There's a live index at the top of the Market page and it is going up or down at all times.</p>
<p>When you sell a card, you get:</p>
<div class="howto-payout">its base value &times; whatever the market feels like right now</div>
<p>The index moves in cycles. Some short, some long, all of them stacked on top of each other. It is completely deterministic &mdash; the <em>same</em> market for every player at the same moment, so nobody is getting a better roll than you. You are just reading it worse.</p>
<p><strong>The HODL bonus.</strong> Cards gain <strong>+1% per hour</strong> you hold them, up to <strong>+30%</strong>. Thirty hours of doing nothing is the most reliable return in the game. It softens a dip. It will not turn a bear market into a profit.</p>
<p><strong>One more thing.</strong> The sell button on the pack reveal screen and the sell button in your Vault do not do the same math. That's not a bug. Figure out which one you want and when. I'm not going to tell you.</p>

<hr>

<h3>Skills</h3>
    <p>Six skills. Each one has its own 99, and they train on what you actually do &mdash; not on what you spend. A rich player and a broke player earn the same XP for the same action. Levels are not a wealth readout and they are not going to become one.</p>
<p><strong>Attack</strong> trains when you sell a card straight off the reveal screen, before it ever reaches your Vault. Flat rate per card. No patience, no market read, no waiting.</p>
<p><strong>Defense</strong> trains when you sell a card you've held, scaled by how long you held it. Nothing accrues while you wait &mdash; it pays on the sale, which means the XP costs you the card.</p>
<p>Read those two again. They are opposites, and both of them are correct. Everything above this section told you to be patient &mdash; and there is an entire skill that only rewards you for not being. You cannot max both quickly. Pick a way to play, or split the difference and be mediocre at two things instead of good at one.</p>
<p><strong>Strength</strong> is nerve. It trains on every pack, scaled by how much of <em>what you have</em> you just put on it. Whale Vaults on a fat balance barely register. Whale Vaults on a thin one are the whole skill.</p>
<p><strong>Magic</strong> trains by liquidating, scaled by rarity. Bulk liquidation pays the full rate per card. It is the only skill that grows by destroying the collection, which is either a nice piece of symmetry or a warning, depending on how the dex is going.</p>
<p><strong>Prayer</strong> trains on wheel spins and shinies &mdash; every shiny you pull, whether you keep it or not. Spins are steady and small. Shinies are rare and enormous. It is the slowest 99 in the game by a wide margin, and if you are chasing a shiny dex it is the one that will define your account.</p>
<p><!-- SIXTH-SKILL --><strong>Agility</strong> only pays when you sell <em>above</em> the market average, scaled by how far above. Sell into a dip and it earns nothing. You can't grind it. You can only time it, which makes it the closest thing here to a verdict on whether you're any good.</p>
<p>The hexagon on your Stats page shows which way you lean. <strong>Trainer Level</strong> summarizes all six; Total Level is just the sum. A reset wipes all of it &mdash; every level, every point of XP, back to the start.</p>

<hr>

<h3>Shinies</h3>
<style>.howto-shiny{display:flex;justify-content:center;margin:8px 0 14px;pointer-events:none;}.howto-shiny .already-owned-badge{display:none;}</style>
<div class="howto-shiny">${(()=>{ const p = POKEMON.find(x => x.id === 6); return renderCardFace({ id:p.id, name:p.name, rarity:p.rarity, value:p.value, shiny:true, type:p.type, sprite:p.sprite }, true); })()}</div>
<p>Some cards come out wrong. Funky colored, sparkling, and rare enough that it matters when you see one.</p>
<p>They're worth <strong>ten times</strong> a normal copy of the same card. That is the largest single swing available to you and it is entirely luck. Nothing you do makes one more likely, and there is no counter quietly filling up on your behalf.</p>
<p>The bulk liquidators will not touch them. Where a shiny exists, it's kept as your copy until you sell it yourself.</p>

<hr>

<h3>The Wheel Is The Economy</h3>
<p class="lead">Here's the part the UI doesn't say out loud:</p>
<p><strong>Packs lose money.</strong> On average, a pack contains less value than it costs. That's not a flaw, that's the whole design &mdash; it's how a card shop works and how every card shop has always worked. The house edge is the point.</p>
<p>So the market isn't how you get rich. The market is how you lose <em>less</em>. A good sell turns a bad pack into a survivable one, and a great sell &mdash; held long, timed right &mdash; can actually come out ahead. That's the skill.</p>
<p>Your income is the wheel. Every hour, free, no strings. The cooldown survives a game reset, so don't get clever.</p>

<hr>

<h3>Badges</h3>
<p>Sixteen badges, one per type. The Volcano Badge is every Fire card. The Cascade Badge is every Water card &mdash; all ${nWater} of them. There is no shortcut, and the shop doesn't sell them. It never will.</p>
<p>They do <strong>nothing</strong>. No bonus, no multiplier, no secret unlock. You can't buy your way out of earning one, which most people will find is worse.</p>
<p>They are also <strong>not permanent</strong>. A badge is a statement about what you're holding right now. Check what a card is doing for you before you liquidate it.</p>
<p>Progress is on the Stats page. Read it carefully. Marsh needs ${nPsychic} Psychics and ${sPsychic} of them are secrets. Soul needs ${nPoison} Poisons and ${sPoison ? sPoison + ' of them are' : 'none of them are'}. Dragon is only ${nDragon} cards, and ${sDragon} of those are secrets. The bars fill at wildly different speeds and none of them mention it.</p>

<hr>

<h3>Binders</h3>
<p>The dex tells you what you have. Binders are where you <em>keep</em> it. Up to ${BINDER_MAX_COUNT} on the shelf, ${BINDER_MAX_CARDS} pockets each, named and colored however you like. Pick up a card, drop it in a pocket, swap it around until the page looks right.</p>
<p>They are organization, not economy. A card in a binder is still a card in your Vault &mdash; it sells exactly like any other, and when it goes, its pocket goes empty.</p>
<p>A reset keeps your binders on the shelf. Every pocket in them comes back empty.</p>

<hr>

<h3>Three Things That Will Save You</h3>
<div class="howto-tip"><span class="n">1</span><span><strong>Never sell your last copy.</strong> Duplicates are income. Singles are the entire point of the game. The Market page stacks your copies and flags anything you only hold one of &mdash; trust it over your own read. Star up to three favorites too: they go on your profile, and, more usefully, they make you look at them before you do something stupid.</span></div>
<div class="howto-tip"><span class="n">2</span><span><strong>Spin every hour you're awake.</strong> It's free money, it outearns everything else you can do, and it's half of Prayer.</span></div>
<div class="howto-tip"><span class="n">3</span><span><strong>Sell into strength, not into need.</strong> The moment you <em>need</em> HEX is almost never the moment the market wants to give you any. Sell when it's high and sit on the cash. Agility agrees.</span></div>

<hr>

<h3>That's It</h3>
<p>Open packs. Watch the line. Hold when it's low, dump when it's high, never sell your last one, spin every hour.</p>
<p>${DEX_TOTAL} cards. Sixteen badges you can lose. Six skills that don't agree with each other. One market that doesn't care about you.</p>
<p>Good luck.</p>

<div class="howto-sign">
  <span>[dungeon]</span>
</div>
${backToTopBtn()}
  </div>`;
}

function renderDex(){
  if(dexTab === 'shelf') return renderBinderShelf();
  if(dexTab === 'page') return renderBinderPage();
  const owned = state.dex;
  // Shiny indication is ownership-based, derived from instances - not from the
  // dex entry. Liquidate the shiny and the dex forgets it. Lifetime credit for
  // having pulled it lives in player_stats.shiny_pulls_count instead.
  const shinyIds = new Set((state.instances || []).filter(i => i.shiny).map(i => i.id));
  const holoIds  = new Set((state.instances || []).filter(i => i.holo).map(i => i.id));
  // Fully-filed indicator: every copy you own of this species is placed in
  // a binder somewhere, not just one of several. A per-copy "filed" badge
  // here would misreport a species with one filed and two loose copies as
  // "in your binder", which is what prompted this in the first place.
  const usedUids = usedBinderUids();
  const instancesBySpecies = {};
  (state.instances || []).forEach(i => { (instancesBySpecies[i.id] = instancesBySpecies[i.id] || []).push(i); });
  const fullyFiledIds = new Set(
    Object.keys(instancesBySpecies)
      .map(Number)
      .filter(id => instancesBySpecies[id].every(i => usedUids.has(i.uid)))
  );
  // Dex tile badges show only the most valuable copy's own flags, not "owns
  // a shiny somewhere AND a holo somewhere" - those can be two different
  // copies. Shiny (10x) always outvalues plain holo (3x), so a species with
  // a plain shiny and a separate plain holo shows only the shiny star; a
  // single copy that's genuinely both still shows both.
  const bestFlagsById = {};
  Object.keys(instancesBySpecies).forEach(idStr => {
    const id = Number(idStr);
    const p = POKEMON.find(x => x.id === id);
    if(!p) return;
    const best = instancesBySpecies[id].reduce((a, b) =>
      effectiveCardValue(p.value, b.shiny, b.holo) > effectiveCardValue(p.value, a.shiny, a.holo) ? b : a
    );
    bestFlagsById[id] = { shiny: !!best.shiny, holo: !!best.holo };
  });
  const genDef = GENS.find(g => g.n === dexGen) || GENS[0];
  const genRange = [genDef.lo, genDef.hi];
  const genList = POKEMON.filter(p => p.id >= genRange[0] && p.id <= genRange[1]);
  const genOwned = genList.filter(p => owned[p.id]).length;

  // A search looks across every generation and ignores the tab - typing a Gen 1
  // name while sitting on the Gen 5 tab returning nothing would read as broken.
  const q = dexSearch.trim().toLowerCase();
  let list = q ? POKEMON.slice() : genList;
  if(q) list = list.filter(p => p.name.toLowerCase().includes(q) || String(p.id) === q || String(p.id).padStart(3,'0') === q);
  if(dexTypeFilter) list = list.filter(p => p.type === dexTypeFilter);
  if(dexShinyOnly)  list = list.filter(p => shinyIds.has(p.id));
  if(dexHoloOnly)   list = list.filter(p => holoIds.has(p.id));
  if(dexHideEmpty)  list = list.filter(p => owned[p.id]);
  const shownOwned = list.filter(p => owned[p.id]).length;
  const tabBtn = (g, label) => `<button data-dexgen="${g}" style="font-family:'JetBrains Mono',monospace; font-size:10.5px; padding:4px 10px; border-radius:6px; cursor:pointer; border:1px solid ${dexGen===g?'var(--foil1)':'var(--line)'}; background:${dexGen===g?'rgba(57,255,20,0.12)':'transparent'}; color:${dexGen===g?'var(--foil1)':'var(--muted)'};">${label}</button>`;

  return `
  <div class="dexhead">
    <div class="dexhead-left">
      <h2 class="disp">Collection</h2>
      <div class="dexcount mono">${Object.keys(owned).length}/${DEX_TOTAL} Cards</div>
    </div>
    <div class="rarity-key">
      <div class="key-item"><span class="key-dot" style="--dot-color:var(--common)"></span>Common</div>
      <div class="key-item"><span class="key-dot" style="--dot-color:var(--uncommon)"></span>Uncommon</div>
      <div class="key-item"><span class="key-dot" style="--dot-color:var(--rare)"></span>Rare</div>
      <div class="key-item"><span class="key-dot" style="--dot-color:var(--ultra)"></span>Ultra</div>
      <div class="key-item"><span class="key-dot" style="--dot-color:var(--secret)"></span>Secret</div>
    </div>
  </div>

  <div class="shelfentry" data-openshelf>
    <div class="shelfentry-label">Binder Shelf</div>
    <div class="shelfentry-sub">${(state.binders||[]).length} / ${BINDER_MAX_COUNT} &rsaquo;</div>
  </div>

  <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
    ${GENS.map(g => tabBtn(g.n, g.label)).join('')}
    <span class="mono" style="font-size:10px;color:var(--muted);">${genOwned}/${genList.length}</span>
  </div>

  <form id="dexSearchForm" style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
    <input type="text" id="dexSearchInput" value="${esc(dexSearch)}" placeholder="Search all gens by name or number..." autocomplete="off"
      style="flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;" />
    <button type="submit" class="sbtn keep" style="padding:7px 12px;font-size:11px;">Find</button>
  </form>

  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
    <button data-dexfilter="empty" class="dexfbtn ${dexHideEmpty?'on':''}">${dexHideEmpty?'&#10003; ':''}Hide Empty</button>
    <button data-dexfilter="shiny" class="dexfbtn ${dexShinyOnly?'on':''}">${dexShinyOnly?'&#10003; ':''}Shiny Only</button>
    <button data-dexfilter="holo" class="dexfbtn ${dexHoloOnly?'on':''}">${dexHoloOnly?'&#10003; ':''}Holo Only</button>
    <select id="dexTypeSelect" class="dexfsel">
      <option value="">All Types</option>
      ${Object.keys(TYPE_COLORS).map(t => `<option value="${t}" ${dexTypeFilter===t?'selected':''}>${titleType(t)}</option>`).join('')}
    </select>
  </div>

  ${dexFiltersActive() ? `<div class="dexfbar">
    <span class="mono" style="font-size:11px;">
      Filtered${q?` &middot; "${esc(dexSearch)}" across all gens`:''}${dexTypeFilter?` &middot; ${titleType(dexTypeFilter)}`:''}${dexShinyOnly?' &middot; shiny only':''}${dexHoloOnly?' &middot; holo only':''}${dexHideEmpty?' &middot; owned only':''}
      &mdash; showing ${list.length} slot${list.length===1?'':'s'} (${shownOwned} owned)
    </span>
    <button data-dexfilter="clear" class="sbtn sell" style="padding:5px 10px;font-size:11px;">Clear Filters</button>
  </div>` : ''}

  ${list.length === 0 ? `<div class="mono" style="color:var(--muted);font-size:12px;padding:24px 2px;">Nothing matches those filters.</div>` : ''}

  <div class="dexgrid" style="margin-bottom:24px;">
    ${list.map(p=>{
      const o = owned[p.id];
      const color = TYPE_COLORS[p.type];
      const bf = bestFlagsById[p.id];
      return `<div class="dexslot ${o?'owned':''} ${o && bf && bf.shiny ? 'shiny-card' : ''}" ${o?`data-species="${p.id}"`:''} style="--slot-color:${o?RARITY[o.rarity]?.color||color:''};${o && bf && bf.shiny ? `--shiny-hue:${shinyHue(p.id)}deg;` : ''}">
        <span class="num mono">#${String(p.id).padStart(3,'0')}</span>
        ${o && bf && bf.shiny ? `<div class="shiny-sparkle-overlay"></div>` : ''}
        ${o && bf && bf.holo ? `<div class="holo-hex-overlay"></div><div class="holo-gloss-overlay"></div><div class="holo-sparkle-overlay"></div>` : ''}
        ${o && bf ? cardBadge(bf.shiny, bf.holo, 'owned') : ''}
        ${o && fullyFiledIds.has(p.id) ? `<img class="filed-badge dexslot-filed-badge" src="${FILED_BADGE_ICON}" alt="" title="${o.count > 1 ? 'All copies filed in a binder' : 'Filed in a binder'}">` : ''}
        <div class="glyph">
          ${o?`<img src="${p.sprite}" alt="${esc(p.name)}" loading="lazy">`:``}
        </div>
        ${o?`<div class="nm">${esc(p.name)}</div><span class="cnt">x${o.count}</span>`:`<div class="nm" style="color:var(--muted)">???</div>`}
      </div>`;
    }).join('')}
  </div>

  ${backToTopBtn()}
  ${renderDexAddSheet()}
  `;
}

function spineFace(color){
  return `linear-gradient(180deg, ${color}, color-mix(in srgb, ${color} 65%, black 35%))`;
}
